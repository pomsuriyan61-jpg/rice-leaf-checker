          out.push("- " + v.thai + " (" + v.en + ") " + v.grain +
                   " | " + (v.photo ? "ไวต่อช่วงแสง ปลูกเป็นนาปี เก็บเกี่ยวประมาณวันที่ " +
                              v.harvestDate.day + " เดือน " + v.harvestDate.month + " ของทุกปี ไม่ขึ้นกับวันหว่าน"
                            : "ไม่ไวต่อช่วงแสง ปลูกเป็นนาปรัง อายุเก็บเกี่ยว " + v.harvestDays + " วันหลังหว่าน") +
                   " | ผลผลิตประมาณ " + v["yield"] + " กก./ไร่" +
                   " | ต้นสูงประมาณ " + v.height + " ซม." +
                   " | ลักษณะเด่น: " + (v.strengths || []).join(" ") +
                   (v.resistDisease && v.resistDisease.length ? " | ต้านทานโรค: " + v.resistDisease.join(", ") : "") +
                   " | ไม่ต้านทานโรค: " + (v.weakDisease || []).join(", ") +
                   " | ไม่ต้านทานแมลง: " + (v.weakPest || []).join(", ") +
                   " | พื้นที่แนะนำ: " + v.region +
                   (v.note ? " | ข้อควรระวัง: " + v.note : ""));
        });
      } else {
        out.push("[พันธุ์ที่ระบบมีข้อมูล เรียงตามกลุ่ม]");
        V.varieties.forEach(function (v) {
          out.push("- " + v.thai + " (" + v.grain + ") " +
                   (v.photo ? "นาปี เก็บเกี่ยวประมาณ " + v.harvestDate.day + "/" + v.harvestDate.month
                            : "นาปรัง อายุ " + v.harvestDays + " วัน") +
                   " ผลผลิต " + v["yield"] + " กก./ไร่ | อ่อนแอต่อ: " +
                   (v.weakDisease || []).concat(v.weakPest || []).join(", "));
        });
      }

      out.push("[กฎการตอบหมวดนี้] " +
               "1. เรื่องจังหวะใส่ปุ๋ยครั้งที่ 2 ให้ยึดหลัก 30 วันก่อนออกดอก และออกดอกคือ 30 วันก่อนเก็บเกี่ยว " +
               "พันธุ์ไวต่อช่วงแสงคำนวณจากวันเก็บเกี่ยวในปฏิทินได้เลย ส่วนพันธุ์ไม่ไวต่อช่วงแสงต้องรู้วันหว่านก่อน " +
               "ถ้าผู้ใช้ยังไม่บอกวันหว่าน ให้ถาม อย่าเดา | " +
               "2. แนะนำให้ผู้ใช้ไปตั้งชื่อพันธุ์และวันหว่านที่หน้าที่นาของฉัน แล้วระบบจะคำนวณวันจริงให้ทุกหน้า | " +
               "3. ห้ามแนะนำให้ปลูกพันธุ์เดียวติดต่อกันเกิน 4 ฤดู เพราะแมลงจะปรับตัวทำลายพันธุ์ต้านทานได้ | " +
               "4. เรื่องผลผลิตต่อไร่เป็นค่าจากแปลงทดลอง ผลผลิตจริงของเกษตรกรมักต่ำกว่า ต้องบอกด้วยทุกครั้ง]");
      return out.join("\n");
    }
  },

  // ── การปลูกและการจัดการน้ำ (เพิ่ม 2026-08) ──
  //
  // เนื้อหาจาก Rice Knowledge Bank หมวดการปลูกและการดูแลรักษา
  // เดิมระบบตอบเรื่องดิน ปุ๋ย โรค และระยะข้าวได้ แต่ตอบไม่ได้เลยว่า
  // "จะปลูกยังไง" ซึ่งเป็นคำถามแรกสุดของคนที่กำลังจะเริ่มทำนา
  //
  // วางไว้ก่อน cost เพราะ knowledgeFor() หยิบแค่ 2 หมวดแรกที่ตรง
  // คำถามเรื่องวิธีปลูกมักมีคำว่า "ไร่" หรือ "กี่กิโล" ปนมาด้วย
  // ถ้าวางหลัง cost จะโดนหมวดต้นทุนแย่งไปทั้งที่ผู้ใช้ถามเรื่องวิธีทำ
  planting: {
    words: /ปลูก|ทำนา|นาดำ|นาหว่าน|นาหยอด|นาปรัง|นาปี|หว่าน|ปักดำ|โยนกล้า|ตกกล้า|กล้า|เมล็ดพันธุ์|แช่เมล็ด|หุ้มเมล็ด|ตุ่มตา|เทือก|ไถดะ|ไถแปร|คราด|ขั้นบันได|เปียกสลับแห้ง|ให้น้ำ|ขังน้ำ|ระยะปักดำ|อัตราเมล็ด|ข้าวไร่|ดำนา|เครื่องปักดำ/i,
    build: function (q) {
      var P = window.PLANTING_GUIDE;
      if (!P) return null;

      // ── ส่งเฉพาะหัวข้อย่อยที่ตรงกับคำถาม ──
      //
      // หมวดนี้ใหญ่กว่าหมวดอื่นมาก ถ้าส่งทั้งก้อนจะยาวเกือบ 17,000 ตัวอักษร
      // เมื่อรวมกับอีกหมวดที่ knowledgeFor เลือกมาด้วย พรอมต์จะทะลุ 25,000
      // ซึ่งเปลืองโควตาและทำให้ AI ตอบคลุมเครือลงเพราะข้อมูลเยอะเกินจะโฟกัส
      //
      // จึงแยกเป็น 4 หัวข้อย่อยแล้วเลือกส่งเฉพาะที่ตรง ถ้าไม่ตรงหัวข้อไหนเลย
      // แปลว่าเป็นคำถามกว้างอย่าง "ปลูกข้าวยังไง" จึงส่งภาพรวมของทุกหัวข้อแทน
      // ซึ่งสั้นกว่าและตรงกับสิ่งที่ผู้ใช้ต้องการจริงคือคำตอบระดับภาพรวม
      var t = q || "";
      var want = {
        land:  /เตรียมดิน|ไถ|คราด|เทือก|ตากดิน|ตอซัง|ฟาง|ดินเปรี้ยว/i.test(t),
        seed:  /เมล็ดพันธุ์|แช่เมล็ด|หุ้มเมล็ด|ตุ่มตา|ความงอก|ตกกล้า|กล้า|ถาดเพาะ|แผ่นกล้า/i.test(t),
        how:   /ปลูก|ทำนา|นาดำ|นาหว่าน|นาหยอด|หว่าน|ปักดำ|โยนกล้า|ขั้นบันได|ข้าวไร่|ระยะปักดำ|เครื่องปักดำ|อัตราเมล็ด/i.test(t),
        water: /น้ำ|เปียกสลับแห้ง|ขังน้ำ|ระบายน้ำ|ให้น้ำ|ระดับน้ำ|ชลประทาน|แล้ง|ประหยัดน้ำ/i.test(t)
      };
      var any = want.land || want.seed || want.how || want.water;

      var out = ["[ฐานความรู้การปลูกข้าวและการจัดการน้ำ อ้างอิง Rice Knowledge Bank กรมการข้าว " +
                 "ห้ามแต่งอัตราเมล็ดพันธุ์ ระยะปักดำ หรือจำนวนวันที่ไม่มีในข้อมูลนี้]"];

      // คำถามกว้าง ส่งภาพรวมสั้นๆ แล้วชวนให้ถามเจาะจงต่อ
      if (!any) {
        out.push("[ภาพรวม] " + P.landPrep.intro);
        out.push("วิธีปลูกข้าวที่ระบบมีข้อมูล: " + P.methods.map(function (m) {
          return m.thai;
        }).join(" · "));
        out.push("อัตราเมล็ดพันธุ์ต่างกันมากตามวิธี — นาดำใช้ 80-90 กก./ไร่ ในแปลงกล้า " +
                 "ซึ่งได้กล้าปักดำ 15-20 ไร่ | นาหว่านน้ำตมใช้ 7-8 กก./ไร่ ถ้าเตรียมดินดี " +
                 "หรือ 15-20 กก./ไร่ ถ้าปรับพื้นที่ได้ไม่ดี | การโยนกล้าใช้เพียง 4-5 กก./ไร่");
        out.push("การจัดการน้ำมีทั้งแบบขังตลอดฤดู แบบเปียกสลับแห้งที่ประหยัดน้ำ " +
                 "แบบหมุนเวียน และการระบายน้ำกลางฤดู");
        out.push("[ถามให้เจาะจงขึ้นได้ เช่น เตรียมดินยังไง แช่เมล็ดพันธุ์กี่ชั่วโมง " +
                 "นาหว่านใช้เมล็ดกี่กิโลต่อไร่ หรือเปียกสลับแห้งทำยังไง " +
                 "ให้ชวนผู้ใช้ถามต่อในหัวข้อที่เขาสนใจ อย่าเดารายละเอียดเอง]");
        return out.join("\n");
      }

      if (want.land) {
      out.push("[การเตรียมดิน] " + P.landPrep.intro);
      P.landPrep.steps.forEach(function (x) {
        out.push("- " + x.title + ": " + x.detail);
      });
      P.landPrep.cautions.forEach(function (c) {
        out.push("  ข้อควรระวัง: " + c);
      });
      }

      var sp = P.seedPrep;
      if (want.seed) {
      out.push("[การเตรียมเมล็ดพันธุ์] " + sp.seed.quality);
      out.push("- ทดสอบความงอก: " + sp.seed.test);
      out.push("- " + sp.seed.soak);
      out.push("  ข้อควรระวัง: " + sp.seed.warn);

      out.push("[การตกกล้า]");
      out.push("- " + sp.nurseryWet.thai + ": " + sp.nurseryWet.detail +
               " | อัตราเมล็ด: " + sp.nurseryWet.rate +
               " | การหว่าน: " + sp.nurseryWet.sow +
               " | การให้น้ำ: " + sp.nurseryWet.water +
               " | ปุ๋ยแปลงกล้า: " + sp.nurseryWet.fert);
      out.push("- " + sp.nurseryDry.thai + ": " + sp.nurseryDry.when);
      sp.nurseryDry.kinds.forEach(function (k) { out.push("    " + k); });
      out.push("- " + sp.matSeedling.thai + ": " + sp.matSeedling.spec +
               " | " + sp.matSeedling.tray + " | " + sp.matSeedling.bed +
               " | ข้อควรระวัง: " + sp.matSeedling.cautions.join(" "));
      out.push("- " + sp.tossSeedling.thai + ": " + sp.tossSeedling.steps.join(" ") +
               " | ข้อควรระวัง: " + sp.tossSeedling.cautions.join(" "));
      }

      if (want.how) {
      out.push("[วิธีปลูกข้าว]");
      P.methods.forEach(function (m) {
        var line = "- " + m.thai + ": " + m.what;
        ["spacing", "depth", "age", "water", "dry", "wet", "prep", "level", "rate", "care", "kinds", "cautions"]
          .forEach(function (k) { if (m[k]) line += " | " + m[k]; });
        if (m.steps) line += " | ขั้นตอน: " + m.steps.join(" ");
        out.push(line);
      });
      }

      if (want.water) {
      out.push("[การจัดการน้ำ] " + P.water.intro);
      out.push("แบบเต็มรูปแบบ:");
      P.water.full.forEach(function (w) { out.push("- " + w.title + ": " + w.detail); });
      out.push("แบบประหยัดน้ำ — " + P.water.awd.thai + " (" + P.water.awd.note + ")");
      P.water.awd.steps.forEach(function (x, i) { out.push("    " + (i + 1) + ". " + x); });
      out.push("    ข้อจำกัดของ AWD: " + P.water.awd.limits.join(" | "));
      P.water.saving.forEach(function (w) { out.push("- " + w.title + ": " + w.detail); });
      }

      out.push("[กฎการตอบหมวดนี้] " +
               "1. ต้องถามหรือระบุก่อนเสมอว่าผู้ใช้ทำนาแบบไหน เพราะอัตราเมล็ดพันธุ์ต่างกันหลายเท่า " +
               "นาดำใช้ 80-90 กก./ไร่ ในแปลงกล้าซึ่งได้กล้าปักดำ 15-20 ไร่ ส่วนนาหว่านน้ำตมใช้ 7-20 กก./ไร่ " +
               "และการโยนกล้าใช้เพียง 4-5 กก./ไร่ ถ้าตอบตัวเลขโดยไม่ระบุวิธี ผู้ใช้จะซื้อเมล็ดผิดจำนวนมาก | " +
               "2. ระยะปักดำและอายุกล้าต่างกันตามพันธุ์ไวหรือไม่ไวต่อช่วงแสง ต้องระบุให้ชัดทุกครั้ง | " +
               "3. เรื่องสารกำจัดวัชพืช ห้ามระบุชื่อสารหรืออัตราใช้ ให้แนะนำปรึกษาเกษตรอำเภอ]");
      return out.join("\n");
    }
  },

  cost: {
    words: /ต้นทุน|กำไร|ขาดทุน|ราคา|บาท|ขาย|รายได้|คุ้มทุน|ลงทุน|ค่าใช้จ่าย|แพง|ถูก|ประหยัด|ผลผลิต|กี่ไร่|ต่อไร่/i,
    build: function () {
      var C = window.COST_GUIDE;
      if (!C) return null;
      var out = ["[ข้อมูลต้นทุนและราคาข้าว อ้างอิงสำนักงานเศรษฐกิจการเกษตร " + C.asOf + "]"];
      out.push("ค่ากลางประเทศ: ต้นทุน " + C.baseline.costPerRai + " บาท/ไร่ | ผลผลิต " +
               C.baseline.yieldPerRai + " กก./ไร่ | ราคาเฉลี่ย " + C.baseline.avgPrice + " บาท/กก.");
      out.push("รายการต้นทุนต่อไร่: " + C.costItems.map(function (i) {
        return i.name + " " + i.perRai + " บาท";
      }).join(", "));
      out.push("ราคาข้าวเปลือกแยกชนิด: " + C.varieties.map(function (v) {
        return v.thai + " " + v.price + " บาท/กก. (ผลผลิต " + v.yieldPerRai + " กก./ไร่)";
      }).join(" | "));
      if (C.fertPrices) {
        out.push("ราคาปุ๋ยเคมี " + C.fertPrices.unit + " (" + C.fertPrices.asOf + "): " +
          C.fertPrices.items.map(function (x) {
            return x.formula + " " + x.low + "-" + x.high + " บาท";
          }).join(", "));
      }
      out.push("[ราคาข้าวเปลี่ยนทุกสัปดาห์ ต้องเตือนเสมอว่าให้ตรวจสอบราคารับซื้อปัจจุบันกับโรงสีก่อนตัดสินใจ " +
               "และแนะนำให้ใช้หน้าต้นทุนและกำไรซึ่งคำนวณให้ครบและปรับตัวเลขเองได้]");
      return out.join("\n");
    }
  },

  weather: {
    words: /อากาศ|ฝน|แดด|ความชื้น|อุณหภูมิ|ร้อน|หนาว|แล้ง|น้ำท่วม|พยากรณ์|ลม|ฤดู/i,
    build: function () {
      if (typeof RISK_RULES === "undefined") return null;
      var out = ["[ความสัมพันธ์ระหว่างสภาพอากาศกับความเสี่ยงโรค]"];
      RISK_RULES.forEach(function (r) {
        out.push("- " + r.thai + ": " + r.why);
      });
      out.push("[ระบบมีหน้าอากาศและความเสี่ยงที่คำนวณดัชนีให้อัตโนมัติจากพิกัดแปลง แนะนำให้ผู้ใช้ไปดู]");
      return out.join("\n");
    }
  }
};

// สารบัญย่อ ส่งเมื่อคำถามไม่ตรงหมวดไหนเลย

    "- วิธีปลูกข้าว 6 แบบ การเตรียมเมล็ดพันธุ์ การตกกล้า และการจัดการน้ำรวมถึงเปียกสลับแห้ง (ถามในช่องนี้ได้เลย)\n" +
    "- พันธุ์ข้าวรับรอง 8 พันธุ์ พร้อมอายุ ผลผลิต และความต้านทานโรคแมลง (ตั้งพันธุ์ได้ที่หน้าที่นาของฉัน)\n" +
    "- ผลวิเคราะห์ดินและการแปลผลธาตุอาหาร (หน้าข้อมูลดิน)\n" +
    "- ปุ๋ยอินทรีย์ 3 ชนิดและปุ๋ยเคมีพร้อมอัตราใช้ (หน้าปุ๋ยและการบำรุง)\n" +
    "- คำแนะนำการดูแลแยกตามระยะข้าว 4 ระยะ (หน้าคำแนะนำการดูแล)\n" +

    "- ความเสี่ยงโรคจากสภาพอากาศตามพิกัดแปลง (หน้าอากาศและความเสี่ยง)";
}

function knowledgeFor(text) {
  var q = text || "";
  var hits = [];
  Object.keys(TOPICS).forEach(function (k) {
    if (TOPICS[k].words.test(q)) hits.push(k);
  });

  // จำกัด 2 หมวดต่อคำถาม เรียงตามลำดับความสำคัญที่นิยามไว้ใน TOPICS
  // ถ้าส่งทุกหมวดพรอมต์จะยาวเกิน 25,000 ตัวอักษร เปลืองโควตาและ AI ตอบคลุมเครือลง
  var blocks = [];
  // ส่งคำถามเข้าไปด้วย เพื่อให้หมวดที่มีข้อมูลเยอะเลือกส่งเฉพาะส่วนที่ตรงได้
  // หมวดเดิมที่ไม่ได้รับพารามิเตอร์จะไม่สนใจค่านี้เอง จึงไม่ต้องแก้ทุกหมวด
  hits.slice(0, 2).forEach(function (k) {
    var b = TOPICS[k].build(q);
    if (b) blocks.push(b);
  });

  if (!blocks.length) blocks.push(knowledgeIndex());
  return "\n\n" + blocks.join("\n\n");
}
