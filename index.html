      var del = el("button", "act act-line act-sm", "ลบ");
      del.style.flex = "none";
      del.onclick = function () { myList.splice(i, 1); saveMy(); paintMy(); };
      row.appendChild(del);
      myHost.appendChild(row);
    });
  }

  var addRow = el("div");
  addRow.style.cssText = "display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap;margin-top:15px";

  function mkField(label, ph, wide) {
    var f = el("div", "inp");
    f.style.cssText = "flex:" + (wide ? "2" : "1") + ";min-width:120px";
    f.appendChild(el("label", "", label));
    var i = el("input");
    i.placeholder = ph || "";
    f.appendChild(i);
    return { box: f, input: i };
  }

  var nameF = mkField("ชื่อของ", "เช่น เมล็ดปอเทือง", true);
  var priceF = mkField("ราคา", "0");
  priceF.input.className = "num-in";
  priceF.input.inputMode = "decimal";
  var unitF = mkField("หน่วย", "บาท/กก.");
  var shopF = mkField("ร้าน", "ไม่ใส่ก็ได้");

  addRow.appendChild(nameF.box);
  addRow.appendChild(priceF.box);
  addRow.appendChild(unitF.box);
  addRow.appendChild(shopF.box);
  myCard.appendChild(addRow);

  var addMsg = el("div");
  myCard.appendChild(addMsg);

  var addBtn = el("button", "act act-go act-wide", "เพิ่มลงรายการ");
  addBtn.style.marginTop = "13px";
  addBtn.onclick = function () {
    addMsg.innerHTML = "";
    var nm = nameF.input.value.trim();
    var pr = parseFloat(priceF.input.value);

    if (!nm) {
      addMsg.appendChild(el("div", "flash flash-warn", "ใส่ชื่อของก่อน"));
      return;
    }
    if (!isFinite(pr) || pr <= 0) {
      addMsg.appendChild(el("div", "flash flash-warn", "ใส่ราคาเป็นตัวเลขมากกว่า 0"));
      return;
    }

    // เดาชนิดไอคอนจากชื่อ เดาผิดก็ไม่เสียหายเพราะเป็นแค่ของประกอบ ไม่ใช่ข้อมูล
    var kind = "seed";
    if (/ปุ๋ย|ยูเรีย|\d+-\d+-\d+/.test(nm)) kind = "bag";
    else if (/ปูน|โดโลไมท|ยิปซัม|มาร์ล/.test(nm)) kind = "lime";
    else if (/ข้าว|เปลือก/.test(nm)) kind = "grain";
    else if (/รถ|จ้าง|ค่าแรง|เครื่อง|ไถ|สูบ/.test(nm)) kind = "tool";

    myList.unshift({
      name: nm, price: pr,
      unit: unitF.input.value.trim() || "บาท",
      shop: shopF.input.value.trim(),
      date: todayStamp(), kind: kind
    });
    saveMy();
    paintMy();

    nameF.input.value = "";
    priceF.input.value = "";
    shopF.input.value = "";
  };
  myCard.appendChild(addBtn);

  paintMy();
  root.appendChild(myCard);
}


// ─── แท็บต้นทุน ─────────────────────────
//
// ลำดับหน้า: ราคา → กรอก → สรุป
//
// ตัวเลขทุกช่องแก้ได้โดยตั้งใจ เพราะราคาข้าวเปลือกเจ้าลดลง 33% ภายในปีเดียวในปี 2568
// ค่าตั้งต้นที่ฝังไว้จึงล้าสมัยเร็วมาก สิ่งที่ระบบทำได้ดีกว่าคนคือเลขคณิตที่ไม่ผิด
// ไม่ใช่การรู้ราคาปัจจุบัน
// ═══════════════════════════════════════════════════
// ระยะเก็บเกี่ยว
// ═══════════════════════════════════════════════════
//
// ── ทำไมแยกออกมาจากตารางต้นทุน ──
//
// ค่าเก็บเกี่ยวเคยเป็นแค่บรรทัดหนึ่งในตารางต้นทุน 9 รายการ ซึ่งซ่อนของสำคัญไว้
// จริงๆ แล้วมันคือการตัดสินใจที่ต่างกันหลายร้อยบาทต่อไร่ และตัดสินใจครั้งเดียวจบ
// คือจะจ้างรถเกี่ยว หรือจ้างคนเกี่ยว ซึ่งไม่ใช่แค่เรื่องราคา แต่มีเงื่อนไขคนละแบบ
//
// ยกขึ้นมาเป็นส่วนแรกของแท็บ พร้อมบอกข้อดีข้อเสียของแต่ละทาง
// แล้วค่าที่เลือกไหลลงตารางต้นทุนด้านล่างเอง ผู้ใช้ไม่ต้องกรอกซ้ำสองที่

var HARVEST_WAYS = [
  {
    key: "combine", thai: "รถเกี่ยวนวด", perRai: 1000,
    good: "เร็ว เกี่ยวได้ 10-15 ไร่ต่อวัน และนวดเสร็จในคันเดียว",
    bad:  "ต้องรอคิว และเข้าแปลงที่ยังแฉะไม่ได้ ต้องระบายน้ำก่อน 7-10 วัน"
  },
  {
    key: "labour", thai: "จ้างแรงงานคน", perRai: 1200,
    good: "เข้าแปลงเล็ก แปลงที่รถลงไม่ได้ หรือแปลงที่ยังแฉะได้",
    bad:  "ช้ากว่ามาก และยังต้องจ่ายค่านวดแยกอีก หาคนยากขึ้นทุกปี"
  }
];

// ตัวต่อระหว่างส่วนเก็บเกี่ยวกับส่วนกำไร
//
// สองส่วนนี้อยู่คนละกล่องบนหน้าเดียวกัน และวาดพร้อมกันแบบขนาน
// จึงต้องมีทางให้ส่วนบนสั่งส่วนล่างคำนวณใหม่เมื่อผู้ใช้เปลี่ยนค่า
// ใช้ตัวแปรตัวเดียวแทนระบบ event เพราะมีผู้ฟังแค่รายเดียวและอยู่หน้าเดียวกันเสมอ
var costRepaint = null;

// วิธีเก็บเกี่ยวที่เลือกไว้ของสถานะชุดนี้ ถ้าไม่เคยเลือกให้เป็นรถเกี่ยวซึ่งใช้กันมากที่สุด
function harvestWayOf(st) {
  var k = st && st.harvestWay;
  return HARVEST_WAYS.filter(function (w) { return w.key === k; })[0] || HARVEST_WAYS[0];
}

// ค่าเก็บเกี่ยวต่อไร่ที่ใช้จริง — ค่าที่ผู้ใช้พิมพ์เองมาก่อน ถ้าไม่มีใช้ค่าตั้งต้นของวิธีที่เลือก
function harvestPerRai(st) {
  var v = (st && st.items) ? st.items.harvest : undefined;
  if (typeof v === "number" && !isNaN(v)) return v;
  return harvestWayOf(st).perRai;
}

views.harvest = function (root) {
  var C = window.COST_GUIDE;
  if (!C) return;

  var KEY = plotKey("cost");
  function read() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; }
  }
  function write(patch) {
    var st = read();
    Object.keys(patch).forEach(function (k) { st[k] = patch[k]; });
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* พื้นที่เต็ม */ }
  }

  root.appendChild(bund("วิธีเก็บเกี่ยว"));
  var card = plot(null);
  var st = read();

  // ค่าเริ่มต้นเป็นรถเกี่ยว เพราะเป็นวิธีที่ใช้กันมากที่สุดในนาข้าวไทยตอนนี้
  var pickKey = HARVEST_WAYS.some(function (w) { return w.key === st.harvestWay; })
    ? st.harvestWay : "combine";

  var rowHost = el("div");
  card.appendChild(rowHost);

  function costOf(w) {
    // เฉพาะวิธีที่เลือกอยู่เท่านั้นที่ใช้ค่าที่ผู้ใช้พิมพ์เอง
    // อีกวิธีต้องโชว์ค่าตั้งต้นของมันเสมอ เพื่อให้เทียบราคาสองทางได้ตรงๆ
    return (w.key === pickKey) ? harvestPerRai(st) : w.perRai;
  }

  function paint() {
    rowHost.innerHTML = "";
    st = read();

    HARVEST_WAYS.forEach(function (w) {
      var on = (w.key === pickKey);
      var box = el("div", "hway" + (on ? " on" : ""));

      var head = el("button", "hway-head");
      head.setAttribute("aria-pressed", on ? "true" : "false");
      head.appendChild(el("span", "hway-name", w.thai));
      head.appendChild(el("span", "hway-price", money0(costOf(w)) + " บาท/ไร่"));
      head.onclick = function () {
        pickKey = w.key;
        // เปลี่ยนวิธีแล้วค่าที่เคยแก้ไว้ของวิธีเดิมต้องไม่ติดมาด้วย
        // ไม่งั้นคนที่แก้ค่าจ้างรถเกี่ยวเป็น 1,300 แล้วสลับไปแรงงานคน
        // จะเห็น 1,300 ค้างอยู่ทั้งที่เป็นคนละเรื่องกัน
        var items = st.items || {};
        delete items["harvest"];
        write({ harvestWay: pickKey, items: items });
        paint();
        if (costRepaint) costRepaint();
      };
      box.appendChild(head);

      if (on) {
        var body = el("div", "hway-body");

        var f = el("div", "inp");
        f.appendChild(el("label", "", "ค่าจ้างจริงที่จ่าย (บาท/ไร่)"));
        var inp = el("input");
        inp.className = "num-in";
        inp.inputMode = "decimal";
        inp.value = String(costOf(w));
        inp.oninput = function () {
          var v = parseFloat(inp.value);
          var items = read().items || {};
          if (isNaN(v)) delete items["harvest"]; else items["harvest"] = v;
          write({ items: items });
          head.querySelector(".hway-price").textContent =
            money0(isNaN(v) ? w.perRai : v) + " บาท/ไร่";
          if (costRepaint) costRepaint();
        };
        f.appendChild(inp);
        body.appendChild(f);

        var pros = el("div", "hway-pros");
        pros.appendChild(el("div", "hway-good", w.good));
        pros.appendChild(el("div", "hway-bad", w.bad));
        body.appendChild(pros);

        box.appendChild(body);
      }
      rowHost.appendChild(box);
    });
  }
  paint();
  root.appendChild(card);

  // ── เตือนเรื่องจังหวะระบายน้ำ ──
  // เป็นข้อผิดพลาดที่ทำให้ต้องเลื่อนคิวรถเกี่ยว ซึ่งค่าเสียหายมากกว่าค่าจ้างเสียอีก
  var cal = fieldCalendar();
  if (cal && cal.harvest) {
    var daysLeft = Math.round((cal.harvest - Date.now()) / 86400000);
    if (daysLeft >= 0 && daysLeft <= 20 && pickKey === "combine") {
      var when = daysLeft <= 10
        ? "ควรระบายน้ำออกแล้วตอนนี้"
        : "อีก " + (daysLeft - 10) + " วันถึงวันที่ควรระบายน้ำออก";
      card.appendChild(el("div", "flash flash-warn",
        when + " · รถเกี่ยวลงแปลงแฉะไม่ได้ ต้องระบายก่อนเกี่ยว 7-10 วัน"));
    }
  }
};

// จำนวนเงินแบบไม่มีทศนิยม ใช้ร่วมกันหลายที่
function money0(n) { return Math.round(n).toLocaleString("th-TH"); }

views.cost = async function (root) {
  root.appendChild(pageHead("cost"));
  var C = window.COST_GUIDE;
  if (!C) {
    root.appendChild(stateBlock("!", "ไม่พบไฟล์ฐานข้อมูลราคา", "ลองรีเฟรชหน้าอีกที"));
    return;
  }

  // ══════════════════════════════════════════════
  // ส่วนที่ 1 · ฐานข้อมูลราคา ดูได้ทันทีไม่ต้องกรอกอะไรก่อน
  // ══════════════════════════════════════════════
  await renderReferencePrices(root);

  // ══════════════════════════════════════════════
  // ส่วนที่ 2 · ช่องกรอก
  // ══════════════════════════════════════════════
  var KEY = plotKey("cost");
  var st = { rai: 10, soil: "clay", variety: "avg", items: {}, yieldPerRai: null, price: null };
  try {
    var old = JSON.parse(localStorage.getItem(KEY) || "{}");
    Object.keys(old).forEach(function (k) { st[k] = old[k]; });
  } catch (e) { /* อ่านไม่ได้ก็ใช้ค่าเริ่มต้น */ }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* พื้นที่เต็ม */ }
  }

  function varOf() {
    return C.varieties.filter(function (v) { return v.key === st.variety; })[0] || C.varieties[0];
  }
  function itemCost(it) {
    // ค่าเก็บเกี่ยวมีที่คิดของตัวเองเพราะค่าตั้งต้นเปลี่ยนตามวิธีที่เลือกด้านบน
    if (it.key === "harvest") return harvestPerRai(st);
    var v = st.items[it.key];
    return typeof v === "number" && !isNaN(v) ? v : it.perRai;
  }
  function money(n) { return Math.round(n).toLocaleString("th-TH"); }

  root.appendChild(bund("ข้อมูลแปลง"));
  var inCard = plot(null);
  var outHost = el("div");

  var grid = el("div", "inputs");

  // คิดต่อ 1 ไร่ทั้งหมด ไม่มีช่องขนาดแปลงแล้ว
  var rai = 1;

  var f2 = el("div", "inp");
  f2.appendChild(el("label", "", "ชนิดข้าวที่จะขาย"));
  var vSel = el("select");
  C.varieties.forEach(function (v) {
    var o = el("option", "", v.thai + " (" + v.price + " บาท/กก.)");
    o.value = v.key;
    if (v.key === st.variety) o.selected = true;
    vSel.appendChild(o);
  });
  f2.appendChild(vSel);
  grid.appendChild(f2);

  var f3 = el("div", "inp");
  f3.appendChild(el("label", "", "ชนิดดิน"));
  var sSel = el("select");
  Object.keys(C.soilNotes).forEach(function (k) {
    var o = el("option", "", C.soilNotes[k].thai);
    o.value = k;
    if (k === st.soil) o.selected = true;
    sSel.appendChild(o);
  });
  f3.appendChild(sSel);
  grid.appendChild(f3);

  var f4 = el("div", "inp");
  f4.appendChild(el("label", "", "ผลผลิตที่คาดว่าจะได้ (กก./ไร่)"));
  var yIn = el("input");
  yIn.className = "num-in";
  yIn.inputMode = "decimal";
  f4.appendChild(yIn);
  grid.appendChild(f4);

  var f5 = el("div", "inp");
  f5.appendChild(el("label", "", "ราคาที่คาดว่าจะขายได้ (บาท/กก.)"));
  var pIn = el("input");
  pIn.className = "num-in";
  pIn.inputMode = "decimal";
  f5.appendChild(pIn);
  grid.appendChild(f5);

  inCard.appendChild(grid);
  root.appendChild(inCard);

  // ── รายการต้นทุนต่อไร่ ──
  root.appendChild(bund("ต้นทุนต่อไร่"));
  var costCard = plot(null, "ค่าเก็บเกี่ยวอยู่ในส่วนวิธีเก็บเกี่ยวด้านบน · ไม่มีรายการไหนให้ใส่ 0");
  var totalTag = el("div", "costsum");
  C.costItems.filter(function (it) { return it.key !== "harvest"; }).forEach(function (it) {
    var row = el("div", "citem");

    var left = el("div", "citem-mid");
    var nm = el("div", "citem-name");
    nm.appendChild(document.createTextNode(it.name));
    // แยกให้ชัดว่าตัวไหนมีแหล่งอ้างอิงตรง ตัวไหนเป็นค่าประมาณ
    // ถ้าแสดงเหมือนกันหมด ผู้ใช้จะเข้าใจว่าทุกตัวเลขแม่นเท่ากัน
    nm.appendChild(el("span", it.cited ? "tag-yes" : "tag-wait", it.cited ? "มีอ้างอิง" : "ค่าประมาณ"));
    if (it.note) nm.title = it.note;
    left.appendChild(nm);
    row.appendChild(left);

    var inp = el("input");
    inp.className = "num-in citem-in";
    inp.inputMode = "decimal";
    inp.value = String(itemCost(it));
    inp.oninput = function () {
      var v = parseFloat(inp.value);
      st.items[it.key] = isNaN(v) ? it.perRai : v;
      save();
      recalc();
    };
    row.appendChild(inp);
    row.appendChild(el("span", "read-foot", "บาท"));

    costCard.appendChild(row);
  });
  costCard.appendChild(totalTag);
  root.appendChild(costCard);

  // ══════════════════════════════════════════════
  // ส่วนที่ 3 · สรุป
  // ══════════════════════════════════════════════
  root.appendChild(bund("สรุป"));
  root.appendChild(outHost);

  function syncDefaults() {
    var v = varOf();
    yIn.value = String(st.yieldPerRai == null ? v.yieldPerRai : st.yieldPerRai);
    pIn.value = String(st.price == null ? v.price : st.price);
  }

  function recalc() {
    outHost.innerHTML = "";

    var yPer = parseFloat(yIn.value);
    var price = parseFloat(pIn.value);

    var perRai = C.costItems.reduce(function (a, it) { return a + itemCost(it); }, 0);
    totalTag.textContent = "รวมต้นทุน " + money(perRai) + " บาทต่อไร่";

    if (!yPer || yPer <= 0 || !price || price <= 0) {
      outHost.appendChild(stateBlock("◇", "กรอกผลผลิตและราคาก่อน", null));
      return;
    }

    var cost = perRai * rai;
    var kg = yPer * rai;
    var revenue = kg * price;
    var profit = revenue - cost;
    // จุดคุ้มทุนคือตัวเลขที่มีประโยชน์ที่สุดของทั้งหน้า
    // เพราะเป็นราคาที่เอาไปเทียบกับที่โรงสีเสนอได้ทันทีว่าควรขายหรือรอ
    var breakEven = cost / kg;
    var good = profit >= 0;

    var sum = plot(null);
    var hero = el("div", "hero");
    hero.appendChild(el("div", "read-label", good ? "กำไรต่อไร่" : "ขาดทุนต่อไร่"));
    var big = el("div", "num hero-val", (good ? "" : "-") + money(Math.abs(profit)) + " บาท");
    big.style.color = good ? "var(--blade)" : "var(--rust)";
    hero.appendChild(big);
    hero.appendChild(el("div", "read-foot", "มีกี่ไร่คูณเอาเอง"));
    sum.appendChild(hero);

    var cells = el("div", "cellrow");
    cells.appendChild(readOut("ต้นทุน", money(cost) + " บาท/ไร่", null));
    cells.appendChild(readOut("ผลผลิต", money(kg) + " กก./ไร่", null));
    cells.appendChild(readOut("รายได้", money(revenue) + " บาท/ไร่", "ที่ราคา " + price + " บาท/กก."));
    sum.appendChild(cells);
    outHost.appendChild(sum);

    // ── จุดคุ้มทุน ──
    var be = plot(null);
    be.style.marginTop = "13px";
    be.appendChild(el("div", "rx-sect", "ราคาที่ต้องขายให้ได้อย่างน้อย"));
    var beBig = el("div", "num be-val", breakEven.toFixed(2) + " บาท/กก.");
    beBig.style.color = price >= breakEven ? "var(--blade)" : "var(--rust)";
    be.appendChild(beBig);

    var diff = price - breakEven;
    be.appendChild(el("div", "read-foot", price >= breakEven
      ? "สูงกว่าจุดคุ้มทุน " + diff.toFixed(2) + " บาท/กก."
      : "ต่ำกว่าจุดคุ้มทุน " + Math.abs(diff).toFixed(2) + " บาท/กก."));
    outHost.appendChild(be);

    // ── ทางออกเมื่อขาดทุน เรียงตามที่ทำได้จริงเร็วที่สุดก่อน ──
    if (!good) {
      var fix = el("div", "flash flash-bad");
      fix.appendChild(el("div", "verify-ask", "ขาดทุน · 3 ทางออก"));
      var ul = el("ul");
      ul.style.cssText = "margin:8px 0 0;padding-left:19px;font-size:.86rem";
      [
        "ลดค่าปุ๋ย ใช้ปุ๋ยอินทรีย์และใส่ตามผลตรวจดิน",
        "เพิ่มผลผลิต เตรียมดินให้ดีขึ้นและตรวจโรคเร็ว",
        "ชะลอการขาย · สินเชื่อชะลอการขาย ธ.ก.ส."
      ].forEach(function (x) {

  pIn.oninput = function () {

    save();
    recalc();

    // ไม่งั้นราคาข้าวเจ้าจะติดมากับหอมมะลิโดยผู้ใช้ไม่รู้ตัว
    st.yieldPerRai = null;
    st.price = null;
    save();

  sSel.onchange = function () { st.soil = sSel.value; save(); recalc(); };

  // ต้องอ่านค่าจาก localStorage ใหม่ทุกครั้ง ไม่ใช้ st ที่ค้างอยู่ในหน่วยความจำ
  // เพราะสองส่วนนี้เขียนคีย์เดียวกันคนละเวลา ถ้าใช้ของเก่าจะได้ยอดที่ไม่ตรงกับที่เห็นด้านบน
  costRepaint = function () {

  renderMyPrices(root);
};

  // แม้กระทบแค่บัญชีตัวเอง แต่เป็นช่องที่ปิดได้ง่ายจึงไม่ควรเปิดทิ้งไว้

    if (l.verify.correct) return el("span", "tag-yes", "ถูกต้อง");
    return el("span", "tag-no", "ผิด · ที่จริงคือ " + th(l.verify.actual || "ไม่ระบุ"));

  function draw(filter) {
    body.innerHTML = "";
    if (!logs.length) {
      body.appendChild(stateBlock("◇", "ยังไม่มีประวัติ", null));
      return;
    }
    var rows = logs.filter(function (l) {
      if (!filter) return true;
      return (l.date + " " + (l.owner||"") + " " + l.disease).toLowerCase().indexOf(filter.toLowerCase()) !== -1;
    });
    if (!rows.length) {
      body.appendChild(stateBlock("◇", "ไม่พบรายการที่ตรงกับคำค้น", "ลองพิมพ์คำอื่น หรือล้างช่องค้นหา"));

    var tb = el("tbody");

    rows.forEach(function (l) {
      var tr = el("tr");

      var tdImg = el("td");

        var img = el("img", "thumb");
        img.alt = "ภาพใบข้าวที่ตรวจเมื่อ " + l.date;
        img.loading = "lazy";

        Store.imageOf(l.id)
          .then(function (im) { img.src = "data:" + im.mimeType + ";base64," + im.data; })

      } else {
        tdImg.appendChild(el("div", "thumb-blank", "ไม่มี"));
      }
      tr.appendChild(tdImg);

      var wellClass = l.kind === "soil" ? "" : l.disease === "ไม่พบโรค" ? " well" : l.disease.indexOf("โรค") === 0 ? " ill" : "";
      var rest = el("td", "n", l.date);
      tr.appendChild(rest);
      var tdDx = el("td", "dx" + wellClass, l.disease);
      tr.appendChild(tdDx);
      var tdJudge = el("td");
      tdJudge.appendChild(judgeTag(l));
      tr.appendChild(tdJudge);
      tr.appendChild(el("td", "n", l.ph != null ? String(l.ph) : "—"));
      tr.appendChild(el("td", "n", scoreText(l.score)));

      var tdAct = el("td");
      var del = el("button", "act act-line act-sm", "ลบ");
      del.onclick = function () {
        if (!confirm("ลบบันทึกวันที่ " + l.date + " ออกจากประวัติ ยืนยันไหม")) return;
        del.disabled = true;
        del.textContent = "กำลังลบ";
        Store.remove(l.id)
          .then(function () {
            logs = logs.filter(function (x) { return x.id !== l.id; });
            draw(find.value);
          })
          .catch(function (err) {
            del.disabled = false;
            del.textContent = "ลบไม่ได้";
            alert(err.message);
          });
      };
      tdAct.appendChild(del);
      tr.appendChild(tdAct);

      tb.appendChild(tr);
    });

    t.appendChild(tb);
    wrap.appendChild(t);
    body.appendChild(wrap);
  }

  find.oninput = function () { draw(find.value); };
  draw(document.getElementById("seekInput").value);
  root.appendChild(card);

  // ── ล้างข้อมูลเมื่อขึ้นฤดูใหม่ ──
  //
  // ย้ายมาจากหน้าบันทึกสำรวจเดิม ซึ่งเป็นที่เดียวที่มีปุ่มนี้
  // แต่หน้านั้นถูกยุบไปแล้ว ถ้าไม่ย้ายมาชาวนาจะล้างข้อมูลฤดูเก่าไม่ได้เลย
  //
  // ทำไมต้องมี: ระบบเอาบันทึกทั้งหมดมาคำนวณรวมกันโดยไม่แยกฤดู
  // ทั้งค่าดินเฉลี่ย คะแนนสุขภาพ และข้อมูลที่ส่งให้ AI
  // ฤดูก่อนเจอโรคไหม้หนัก ฤดูใหม่ยังไม่ทันหว่านเลย หน้าแรกก็ยังขึ้นว่าต้องรีบจัดการ
  var wipe = plot("ขึ้นฤดูใหม่");
  wipe.appendChild(more("ทำไมต้องล้าง",
    "เว็บนี้เอาบันทึกทั้งหมดมารวมกันคิดค่าเฉลี่ย ทั้งค่าดิน คะแนนสุขภาพข้าว และคำแนะนำ " +
    "ถ้าไม่ล้างของฤดูเก่าออก ตัวเลขของฤดูใหม่จะเพี้ยนโดยที่คุณไม่รู้ตัว"));

  if (logs.length > 1) {
    var clearAll = el("button", "act act-line act-sm", "ล้างบันทึกทั้งหมด " + logs.length + " รายการ");
    clearAll.style.cssText = "margin-top:13px;border-color:var(--rust);color:var(--rust)";
    clearAll.onclick = async function () {
      // ถาม 2 ครั้งเพราะกดพลาดแล้วเอาคืนไม่ได้
      if (!confirm("ล้างบันทึกทั้งหมด " + logs.length + " รายการ\n\nใช้ตอนขึ้นฤดูใหม่เท่านั้น ล้างแล้วเอาคืนไม่ได้")) return;
      if (!confirm("ยืนยันอีกครั้ง ข้อมูลจะหายถาวร รวมทั้งรูปที่เคยแนบและกราฟค่าดิน")) return;

      clearAll.disabled = true;
      clearAll.textContent = "กำลังล้าง";
      var fail = 0;
      for (var i = 0; i < logs.length; i++) {
        try { await Store.remove(logs[i].id); } catch (e) { fail++; }
      }
      if (fail) {
        clearAll.disabled = false;
        clearAll.textContent = "ล้างไม่สำเร็จ " + fail + " รายการ ลองใหม่";
        return;
      }
      open(tabOf("ledger"));
    };
    wipe.appendChild(clearAll);
  } else {
    
  }
  root.appendChild(wipe);

};

// ขยายดูภาพเต็ม ปิดด้วยปุ่ม คลิกพื้นหลัง หรือกด Escape
function openLens(src, log) {
  if (!src) return;
  var lens = el("div", "lens");
  var img = el("img");
  img.src = src;
  img.alt = "ภาพใบข้าวที่ตรวจเมื่อ " + log.date;
  var shut = el("button", "lens-shut", "ปิด");
  lens.appendChild(img);
  lens.appendChild(shut);

  function close() {
    lens.remove();
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e) { if (e.key === "Escape") close(); }

  shut.onclick = close;
  lens.onclick = function (e) { if (e.target === lens) close(); };
  document.addEventListener("keydown", onKey);
  document.body.appendChild(lens);
  shut.focus();
}


views.weather = async function (root) {
  root.appendChild(pageHead("weather"));
  root.appendChild(bund("สภาพอากาศ"));

  var host = el("div");
  host.appendChild(stateBlock("◌", "กำลังหาตำแหน่ง", null));
  root.appendChild(host);

  // ใช้พิกัดที่เคยบันทึกไว้ก่อน ถ้าไม่มีค่อยขอตำแหน่งปัจจุบัน
  // เพราะพิกัดแปลงที่บันทึกไว้ตรงกับที่ต้องการดูมากกว่าตำแหน่งที่ผู้ใช้ยืนอยู่ตอนนี้
  var logs = await Store.list();
  var saved = logs.filter(function (l) { return l.gps && l.gps.indexOf(",") !== -1; })[0];

  var coords = null;

  // ลำดับความสำคัญ: ที่นาที่ปักหมุดไว้ → พิกัดจากบันทึกเก่า → ตำแหน่งปัจจุบัน
  // ที่นาที่ปักหมุดมาก่อนเสมอ เพราะเป็นจุดที่ผู้ใช้ตั้งใจกำหนดเอง
  var pinned = fieldCoords();
  var fieldRec = readField();
  if (pinned) {
    coords = { lat: pinned.lat, lon: pinned.lon };
  } else if (saved) {
    var parts = saved.gps.split(",").map(Number);
    coords = { lat: parts[0], lon: parts[1] };
  } else {
    try {
      var pos = await getFix({ timeout: 12000 });
      coords = { lat: pos.lat, lon: pos.lon };
    } catch (err) {
      host.innerHTML = "";
      host.appendChild(stateBlock("!", "ยังดูสภาพอากาศไม่ได้",
        "เปิดสิทธิ์ตำแหน่งให้เบราว์เซอร์แล้วรีเฟรช"));
      return;
    }
  }

  host.innerHTML = "";
  host.appendChild(stateBlock("◌", "กำลังดึงข้อมูลอากาศ", null));

  var w;
  try {
    w = await fetchWeather(coords.lat.toFixed(4), coords.lon.toFixed(4));
  } catch (err) {
    host.innerHTML = "";
    host.appendChild(stateBlock("!", "ดึงข้อมูลอากาศไม่สำเร็จ", "ลองรีเฟรชอีกครั้ง"));
    return;
  }

  host.innerHTML = "";

  // ── ฝนและแสงแดด วันนี้กับพรุ่งนี้ ──
  // สองค่านี้คือสิ่งที่เกษตรกรใช้ตัดสินใจจริงในแต่ละวัน
  // (จะพ่นยาไหม จะระบายน้ำไหม) จึงยกขึ้นมาไว้บนสุดแยกจากกราฟย้อนหลัง
  (function () {
    var d = w.days || [];
    var i = w.todayIndex;
    var today = d[i], tomorrow = d[i + 1];
    if (!today) return;

    var card = plot("ฝนและแสงแดด");
    var st = w.station || {};

    // บอกให้ชัดว่าค่านี้มาจากจุดพยากรณ์ใกล้แปลง ไม่ใช่เครื่องวัดที่ตั้งอยู่ในแปลง
    // ถ้าไม่บอก ผู้ใช้จะเข้าใจว่าเป็นค่าที่วัดจากนาตัวเองแล้วไปโทษระบบเมื่อคลาดเคลื่อน
    // ── บอกระยะห่างจริง ไม่ใช่แค่คำว่า "ใกล้แปลง" (แก้ไข 2026-08) ──
    //
    // ผู้ให้บริการพยากรณ์แบ่งพื้นที่เป็นตาราง แล้วคืนค่าจุดกึ่งกลางของตารางที่ครอบแปลงอยู่
    // จุดนั้นอาจห่างจากแปลงจริงหลายกิโลเมตร คำว่า "ใกล้แปลง" จึงกำกวมเกินไป
    // การบอกเป็นตัวเลขให้ผู้ใช้ตัดสินเองว่าจะเชื่อแค่ไหน ตรงไปตรงมากว่าการรับประกันแทนเขา
    if (st.lat != null) {
      // ไม่โชว์พิกัดและระยะห่างแล้ว ผู้ใช้ไม่ได้ใช้ตัวเลขนี้ตัดสินใจอะไร
      card.appendChild(el("div", "read-foot", "ค่าพยากรณ์ ไม่ใช่เครื่องวัดในแปลง"));
    }

    var grid = el("div", "fx-grid");
    function cell(when, day) {
      var c = el("div", "fx-cell");
      c.appendChild(el("div", "fx-when", when));

      var rain = day.rain == null ? null : day.rain;
      c.appendChild(el("div", "fx-big", rain == null ? "–" : rain.toFixed(1) + " มม."));
      c.appendChild(el("div", "fx-cap", rain == null ? "ไม่มีข้อมูลฝน"
        : rain < 0.5 ? "แทบไม่มีฝน"
        : rain < 10  ? "ฝนเล็กน้อย"
        : rain < 35  ? "ฝนปานกลาง"
        : rain < 90  ? "ฝนหนัก" : "ฝนหนักมาก"));

      var sun = day.sunHours;
      c.appendChild(el("div", "fx-big2", sun == null ? "–" : sun.toFixed(1) + " ชม."));
      c.appendChild(el("div", "fx-cap", sun == null ? "ไม่มีข้อมูลแสง"
        : sun < 3 ? "แดดน้อย ใบแห้งช้า"
        : sun < 6 ? "แดดปานกลาง" : "แดดจัด"));
      return c;
    }
    grid.appendChild(cell("วันนี้", today));
    if (tomorrow) grid.appendChild(cell("พรุ่งนี้", tomorrow));
    card.appendChild(grid);
    host.appendChild(card);
  })();

  // ── ค่าปัจจุบันจาก WeatherAPI (อัปเดตทุก 10-15 นาที) ──

  var liveBody = el("div");

      // ── ชื่อสถานที่นี้ไม่ใช่ที่อยู่ของผู้ใช้ (แก้ไข 2026-08) ──
      //
      // ค่านี้มาจากผู้ให้บริการอากาศ ซึ่งจับคู่พิกัดที่เราส่งไปกับ "สถานีที่ใกล้ที่สุด"
      // ในฐานข้อมูลของเขา ไม่ได้แปลงพิกัดเป็นชื่อหมู่บ้านหรือตำบลตามทะเบียนราษฎร
      // ฐานข้อมูลนั้นครอบคลุมระดับอำเภอหรือจังหวัดเป็นหลัก ชื่อที่ได้จึงมักเป็น
      // อำเภอข้างเคียงหรือตัวจังหวัด ไม่ใช่หมู่บ้านที่ผู้ใช้อยู่จริง
      //
      // ของเดิมเอาชื่อนี้มาต่อท้ายคำว่า "ค่าปัจจุบัน" เฉยๆ ผู้ใช้จึงอ่านว่าเป็นที่อยู่ตัวเอง
      // แล้วสรุปว่าระบบระบุตำแหน่งผิด ทั้งที่พิกัดถูกแต่ชื่อมาจากคนละระบบ
      // แก้โดยเรียกให้ตรงกับสิ่งที่มันเป็นจริงคือชื่อสถานีตรวจอากาศ
      var t = el("div", "plot-title", "ค่าปัจจุบัน");
      head.appendChild(t);

          "ค่าเหล่านี้รายงานจากสถานีตรวจอากาศชื่อ " + live.location +
          " ซึ่งเป็นชื่อสถานีของผู้ให้บริการ ไม่ใช่ชื่อหมู่บ้านหรือตำบลของแปลงคุณ " +
          "พิกัดแปลงที่ระบบใช้คือ " + coords.lat.toFixed(4) + ", " + coords.lon.toFixed(4) +
          " แก้ไขได้ที่แท็บแปลงนา"));
      }

      var grid = el("div", "row-3");
      [
        ["ฝนวันนี้", live.current.precipMm + " มม.", live.current.condition || ""],
        ["อุณหภูมิ", live.current.tempC + "°C", "ความชื้น " + live.current.humidity + "%"],
        ["เมฆปกคลุม", live.current.cloud + "%",
          live.current.cloud >= 80 ? "ครึ้มมาก แดดน้อย" : live.current.cloud <= 30 ? "ท้องฟ้าโปร่ง" : "มีเมฆบางส่วน"],
        ["แดดแรงแค่ไหน", String(live.current.uv), "ตัวชี้วัดความแรงของแสงแดด"]
      ].forEach(function (c) {
        var b = el("div");
        b.appendChild(readOut(c[0], c[1], c[2]));
        grid.appendChild(b);
      });
      liveBody.appendChild(grid);

      var cite = el("p", "",
        "แหล่งข้อมูล: " + live.source + " · ข้อมูลปัจจุบันอัปเดตทุก 10-15 นาที หน้านี้ดึงค่าใหม่อัตโนมัติทุก 1 ชั่วโมง");
      cite.style.cssText = "font-size:.76rem;color:var(--ink-faint);margin:12px 0 0";
      liveBody.appendChild(cite);
    } catch (err) {
      liveBody.innerHTML = "";
      liveBody.appendChild(stateBlock("!", "อ่านค่าปัจจุบันไม่ได้", null));
    }
  }
  paintLive();
  // อัปเดตค่าปัจจุบันเองทุก 1 ชั่วโมง ไม่ต้องให้ผู้ใช้กดรีเฟรช
  onPageTimer(paintLive, 60 * 60 * 1000);

  // ── สรุปย้อนหลังจาก Open-Meteo ──
  root.appendChild(bund("ย้อนหลัง 7 วัน"));
  var s = w.summary;
  var stats = el("div", "row-3");
  var cards = [
    ["ฝนสะสม 7 วัน", s.rain7 + " มม.", s.rain7 >= 40 ? "ฝนชุก เสี่ยงเชื้อรา" : s.rain7 <= 5 ? "ฝนทิ้งช่วง" : "ปริมาณปานกลาง"],
    ["แสงแดดเฉลี่ย", s.sunHours + " ชม./วัน", s.sunHours <= 4 ? "แดดน้อย เชื้อราเติบโตดี" : "แดดเพียงพอ"],
    ["ความชื้นเฉลี่ย", s.humidity + "%", s.humidity >= 85 ? "ชื้นจัด ต้องเฝ้าระวัง" : "อยู่ในเกณฑ์ปกติ"],
    ["อุณหภูมิสูงสุด", s.tempMax + "°C", "ต่ำสุด " + s.tempMin + "°C"]
  ];
  cards.forEach(function (c) {
    var p = plot();
    p.appendChild(readOut(c[0], c[1], c[2]));
    stats.appendChild(p);
  });
  root.appendChild(stats);



  // ความเสี่ยงรายโรค
  root.appendChild(bund("ความเสี่ยงโรค"));
  var riskCard = plot(null);

  var ranked = RISK_RULES.map(function (r) {
    var score = Math.min(100, r.score(s));
    return { rule: r, score: score, band: riskBand(score) };
  }).sort(function (a, b) { return b.score - a.score; });

  ranked.forEach(function (r) {
    var row = el("div");
    row.style.cssText = "padding:14px 0;border-bottom:1px solid var(--rule-soft)";

    var head = el("div");
    head.style.cssText = "display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap";
    var nm = el("div", "", r.rule.thai);
    nm.style.cssText = "font-weight:600;font-size:.95rem";
    head.appendChild(nm);
    var tag = el("span", "rx-flag " + (r.band.key === "bad" ? "hi" : r.band.key === "warn" ? "mid" : "lo"),
      "ความเสี่ยง " + r.band.word);
    head.appendChild(tag);
    row.appendChild(head);

    var track = el("div", "bar-track");
    track.style.margin = "9px 0 7px";
    var fill = el("div", "bar-fill");
    fill.style.width = r.score + "%";
    fill.style.background = r.band.key === "bad" ? "var(--rust)"
      : r.band.key === "warn" ? "var(--grain)" : "var(--blade)";
    track.appendChild(fill);
    row.appendChild(track);

    // เหตุผลว่าทำไมเสี่ยง ไม่ใช่สิ่งที่ต้องลงมือทำ เก็บไว้ใน title พอ
    row.title = r.rule.why;

    // ถ้าเสี่ยงสูงและมีแนวทางในฐานความรู้ ให้ลิงก์ความรู้มาแสดงเลย
    if (r.band.key !== "ok") {
      var g = getGuide(r.rule.label);
      if (g && g.prevention && g.prevention.length) {
        var tip = el("div", "read-foot", "ป้องกันล่วงหน้า: " + g.prevention[0]);
        tip.style.marginTop = "5px";
        tip.style.color = "var(--ink)";
        row.appendChild(tip);
      }
    }
    riskCard.appendChild(row);
  });

  riskCard.appendChild(more("คะแนนนี้บอกอะไรได้ บอกอะไรไม่ได้",
    "คะแนนนี้คิดจากฟ้าฝนอย่างเดียว ใช้เตรียมตัวล่วงหน้าได้ แต่ไม่ได้แปลว่าโรคจะระบาดแน่ " +
    "ปัจจัยอื่นที่มีผลมากแต่ยังไม่ได้นำมาคำนวณ ได้แก่ พันธุ์ข้าวที่ปลูก ความหนาแน่นของการปลูก " +
    "ปริมาณปุ๋ยตัวเร่งใบเขียว และประวัติการระบาดในพื้นที่ ควรใช้ประกอบการสำรวจแปลงด้วยตาเสมอ"));
  root.appendChild(riskCard);

  // ── ตัดกราฟฝน/แดด 14 วันออก (แก้ 2026-08) ──
  //
  // กราฟสองแกนกินพื้นที่เต็มจอบนคอมและยาวเกินหนึ่งจอบนมือถือ
  // แต่ตัวเลขที่ใช้ตัดสินใจจริงอยู่ครบแล้วในการ์ดด้านบน
  // ฝนวันนี้/พรุ่งนี้ · ฝนสะสม 7 วัน · แดดเฉลี่ย · ความชื้น · ความเสี่ยงโรค
  // กราฟจึงเป็นการแสดงข้อมูลชุดเดิมซ้ำอีกรอบด้วยพื้นที่ที่แพงที่สุดของหน้า

  // ให้ AI อ่านสภาพอากาศพร้อมบันทึกแปลง แล้วแนะนำสิ่งที่ควรทำสัปดาห์นี้
  root.appendChild(bund("คำแนะนำจาก AI"));
  var aiCard = plot();
  var aiBody = el("div");
  aiBody.appendChild(stateBlock("◌", "กำลังให้ AI ช่วยดูให้", "ใช้เวลาสักครู่"));
  aiCard.appendChild(aiBody);
  root.appendChild(aiCard);

  var forecast = w.days.slice(w.todayIndex + 1);
  var rainAhead = forecast.reduce(function (a, d) { return a + (d.rain || 0); }, 0).toFixed(1);

  Store.askGemini(
    "คุณเป็นผู้เชี่ยวชาญโรคข้าวไทย ประเมินสิ่งที่เกษตรกรควรทำในสัปดาห์นี้จากข้อมูลต่อไปนี้\n\n" +
    "สภาพอากาศแปลง (ค่าเฉลี่ย 3 วันล่าสุด):\n" +
    "- ฝนสะสม 7 วันที่ผ่านมา " + s.rain7 + " มม.\n" +
    "- ฝนพยากรณ์อีก 7 วันข้างหน้า " + rainAhead + " มม.\n" +
    "- แสงแดดเฉลี่ย " + s.sunHours + " ชั่วโมงต่อวัน\n" +
    "- ความชื้นเฉลี่ย " + s.humidity + "%\n" +
    "- อุณหภูมิ " + s.tempMin + " ถึง " + s.tempMax + " องศา\n\n" +
    "ดัชนีความเสี่ยงที่ระบบคำนวณได้: " +
    ranked.map(function (r) { return r.rule.thai + " " + r.band.word; }).join(", ") + "\n\n" +
    buildFarmContext(logs) + "\n\n" +
    "ตอบไทย 3-4 ประโยค เข้าเรื่องทันที บอกสิ่งที่ต้องลงมือทำสัปดาห์นี้ให้ชัด ไม่ต้องใส่หัวข้อ " +
    "ห้ามทักทาย ห้ามเรียกผู้อ่านว่า พี่ ป้า ลุง น้า คุณ ท่าน ห้ามลงท้ายว่า ครับ ค่ะ นะครับ นะคะ " +
    "ห้ามใช้ศัพท์วิชาการ เช่น ไนโตรเจน ธาตุอาหาร ความชื้นในอากาศ ให้ใช้คำที่ชาวนาพูดกันจริง " +
    "ห้ามแต่งชื่อสารเคมีหรือปริมาณที่ใช้ขึ้นเอง"
  ).then(function (answer) {
    aiBody.innerHTML = "";
    var p = el("p", "", answer.text);
    p.style.cssText = "margin:0;font-size:.89rem";
    aiBody.appendChild(p);
  }).catch(function (err) {
    aiBody.innerHTML = "";
    aiBody.appendChild(stateBlock("!", "ยังให้ AI ช่วยดูไม่ได้", friendlyError(err.message)));
  });

};

// ─── แท็บตรวจแปลง ────────────
//
// โครงหน้าแบ่งเป็น 2 ส่วนโดยตั้งใจ
//   1. การ์ดคำแนะนำแยกตามระยะข้าว — ตอบคำถามที่พบบ่อยที่สุดโดยไม่ต้องพิมพ์และไม่กินโควตา AI
//   2. ช่องถาม AI — สำหรับเรื่องเฉพาะของแปลงที่การ์ดสำเร็จรูปตอบไม่ได้
//
// เหตุผลที่เอาการ์ดขึ้นก่อน: คำถาม 80% ของเกษตรกรคือ "ตอนนี้ควรทำอะไร"
// ซึ่งตอบได้จากอายุข้าวอย่างเดียว ไม่ต้องใช้ AI เลย
// การให้พิมพ์ถามทุกครั้งจึงเป็นภาระเกินจำเป็นและเปลืองโควตาที่มีจำกัด
views.consult = async function (root) {
  root.appendChild(pageHead("consult"));
  var C = window.CARE_GUIDE;

  // ══ การ์ดคำแนะนำแยกตามระยะ ══
  if (C) {
    root.appendChild(bund("ระยะข้าว"));

    // จำระยะที่ดูล่าสุด เพราะข้าวอยู่ระยะเดิมนานหลายสัปดาห์
    var SKEY = plotKey("stage");
    var pick = "tiller";
    try {
      var sv = localStorage.getItem(SKEY);
      if (sv && C.stages.some(function (x) { return x.key === sv; })) pick = sv;
    } catch (e) { /* ใช้ค่าเริ่มต้น */ }

    // พันธุ์ข้าวมาจากระเบียนแปลง ไม่ใช่ตัวเลือกเฉพาะหน้านี้
    // เพื่อให้หน้าอื่นและบริบทที่ส่งให้ AI ใช้ค่าเดียวกันเสมอ
    var vKey = fieldVariety();

    var tabCard = plot(null);
    var cardHost = el("div");

    // ── แถบบนสุด: ตอบคำถามชื่อหน้าให้ได้ในบรรทัดเดียว ──
    //
    // หน้านี้ชื่อ "ตรวจแปลง" แต่ของเดิมเปิดมาเจอคำอธิบายพันธุ์ข้าว 3 ย่อหน้า
    // แล้วให้ผู้ใช้ไปกดเลือกเองว่าข้าวอยู่ระยะไหน ทั้งที่ระบบรู้วันหว่านอยู่แล้ว
    // คนทำเว็บเองยังงง เพราะมันไม่ได้ตอบคำถามที่ชื่อหน้าถามไว้
    //
    // ตอนนี้บรรทัดแรกตอบเลยว่า ข้าวอายุกี่วัน อยู่ระยะไหน และงานถัดไปคืออะไร
    // ส่วนคำอธิบายพันธุ์ยุบไปไว้ในปุ่มกดดู เพราะเป็นเรื่องที่รู้ครั้งเดียวก็พอ
    var stageInfo = null;
    var vBar = plot(null);

    function paintVarietyBar() {
      vBar.innerHTML = "";
      var v = window.careVariety(vKey);
      var cal = fieldCalendar();
      stageInfo = (cal && typeof window.stageWindows === "function")
        ? window.stageWindows(cal, fieldMethod()) : null;

      if (stageInfo && stageInfo.current) {
        var curStage = C.stages.filter(function (x) { return x.key === stageInfo.current; })[0];
        vBar.appendChild(el("div", "nowline",
          "ตอนนี้ข้าวอายุ " + stageInfo.age + " วัน อยู่" + (curStage ? curStage.thai : "")));

        // นาดำกับนาโยน กล้าโตมาก่อนแล้วจากแปลงเพาะ ต้องบอกไม่งั้นตัวเลขอายุจะดูขัดกับที่เห็นในนา
        if (stageInfo.nursery) {
          vBar.appendChild(el("div", "nowsub",
            "นับจาก" + stageInfo.startWord + " · " + stageInfo.nursery + " ระบบคิดให้แล้ว"));
        }

        // งานถัดไป — เอาหมุดที่ใกล้ที่สุดที่ยังไม่ถึงมาแสดง
        // ถ้าผ่านหมดแล้วก็บอกตรงๆ ว่าเหลือแค่รอเกี่ยว ไม่ต้องเดาเอง
        var jobs = [
          { name: "ใส่ปุ๋ยครั้งที่ 2", when: cal.fert2, text: cal.text.fert2 },
          { name: "ข้าวออกดอก",      when: cal.bloom, text: cal.text.bloom },
          { name: "เก็บเกี่ยว",       when: cal.harvest, text: cal.text.harvest }
        ];
        var next = jobs.filter(function (j) { return j.when >= stageInfo.today; })[0];
        if (next) {
          var left = Math.round((next.when - stageInfo.today) / 86400000);
          vBar.appendChild(el("div", left <= 14 ? "flash flash-warn" : "nowsub",
            left === 0 ? "วันนี้คือวัน" + next.name
                       : "งานถัดไป: " + next.name + " วันที่ " + next.text + " · อีก " + left + " วัน"));
        }
      } else if (stageInfo && stageInfo.beforeSow) {
        vBar.appendChild(el("div", "nowline", "ยังไม่ถึงวันหว่านที่กรอกไว้"));
        vBar.appendChild(el("div", "nowsub", "จะหว่านวันที่ " + thaiDateOf(cal.sow)));
      } else if (stageInfo && stageInfo.afterHarvest) {
        vBar.appendChild(el("div", "nowline", "เลยวันเก็บเกี่ยวของฤดูนี้มาแล้ว"));
        vBar.appendChild(el("div", "nowsub", "เริ่มฤดูใหม่ · แก้วันหว่านที่ แปลงนา"));
      } else {
        // ไม่มีวันหว่าน = คำนวณอะไรให้ไม่ได้เลย ต้องบอกให้ชัดว่าขาดอะไรและไปกรอกที่ไหน
        // ไม่ใช่แสดงช่วงอายุกลางๆ แล้วปล่อยให้เข้าใจผิดว่าตรงกับแปลงตัวเอง
        vBar.appendChild(el("div", "nowline", "ยังบอกไม่ได้ว่าตอนนี้ข้าวอยู่ระยะไหน"));
        vBar.appendChild(el("div", "nowsub", "กรอกวันหว่านที่ แปลงนา → ฤดูนี้"));
      }

      // คำอธิบายพันธุ์ยุบไว้ ไม่ใช่เรื่องที่ต้องอ่านทุกครั้งที่เปิดหน้า
      vBar.appendChild(more("ปฏิทินนี้คิดจากอะไร",
        "คิดจากพันธุ์ " + v.thai + " (" + v.short + ") เช่น " + v.examples + "\n\n" + v.note +
        (fieldVarietyChosen() ? "" : "\n\nคุณยังไม่ได้เลือกพันธุ์ ระบบใช้กลุ่มนี้ไปก่อน ถ้าปลูกอีกกลุ่มให้กดเปลี่ยนด้านล่าง") +
        "\n\nแก้พันธุ์และวันหว่านได้ที่แท็บแปลงนา ส่วนฤดูนี้"));

      var sw = el("button", "act act-line act-sm",
        "เปลี่ยนเป็น" + window.careVariety(vKey === "photo" ? "nonphoto" : "photo").thai);
      sw.style.marginTop = "10px";
      sw.onclick = function () {
        vKey = (vKey === "photo") ? "nonphoto" : "photo";
        setFieldVariety(vKey);
        paintVarietyBar();
        paintStage();
      };
      vBar.appendChild(sw);
    }
    root.appendChild(vBar);
    paintVarietyBar();

    // ถ้ารู้วันหว่าน ให้เปิดหน้ามาที่ระยะที่ข้าวอยู่จริงเลย ไม่ใช่ระยะที่กดค้างไว้เมื่อเดือนก่อน
    // ปฏิทินของแปลงเชื่อถือได้มากกว่าสิ่งที่ผู้ใช้เคยกด
    if (stageInfo && stageInfo.current) pick = stageInfo.current;

    function paintStage() {
      tabCard.innerHTML = "";

      // ── แถบระยะ 4 ระยะ ──
      //
      // ถ้ารู้วันหว่าน จะขึ้นเป็นวันที่จริงของแปลงนี้ เช่น "1 ก.ย. – 26 ก.ย. 2569"
      // แทนคำอธิบายกลางๆ อย่าง "ตั้งแต่ประมาณ 25 วันหลังหว่าน ไปจนถึงก่อนตั้งท้อง"
      // ซึ่งอ่านแล้วยังต้องมานั่งบวกวันเองว่าตกลงตอนนี้อยู่ระยะไหน
      var win = {};
      if (stageInfo) stageInfo.list.forEach(function (w) { win[w.key] = w; });

      var tabs = el("div", "stage-tabs");
      C.stages.forEach(function (st) {
        var w = win[st.key];
        var cls = "stage-tab" + (st.key === pick ? " on" : "");
        if (w && w.past) cls += " done";
        var b = el("button", cls);

        b.appendChild(stageArt(st.key));
        var nameRow = el("span", "stage-name", st.thai);
        b.appendChild(nameRow);

        if (w) {
          b.appendChild(el("span", "stage-when", w.text));
          b.appendChild(el("span", "stage-age", w.ageFrom + "–" + w.ageTo + " วัน"));
          if (w.now)  b.appendChild(el("span", "stage-flag now", "ตอนนี้อยู่ระยะนี้"));
          if (w.past) b.appendChild(el("span", "stage-flag past", "ผ่านไปแล้ว"));

        ? "\n\nผลตรวจภาพล่าสุดในบทสนทนานี้ (ผู้ใช้ยังพูดถึงภาพนี้อยู่):" + lastVision
        : "";

      var convo = history.length
        ? "\n\nบทสนทนาก่อนหน้า:\n" + history.join("\n") + "\n"
        : "";

      // เลือกความรู้ตามเรื่องที่ถาม ครอบคลุมทุกหมวดไม่ใช่แค่ปุ๋ยกับดิน
      // ถ้าไม่ตรงหมวดไหน จะส่งสารบัญย่อไปแทน เพื่อให้ AI ชี้ทางผู้ใช้ได้
      var soilRef = knowledgeFor(text, { hasImage: !!shot });

      // สภาพอากาศจริงของแปลงนี้ ทำให้คำแนะนำอิงจังหวะฝนได้ ไม่ใช่ตอบกลางๆ
      var wx = "";
      try {
        var w = window.LAST_WEATHER;
        if (w && w.summary && w.days && w.days[w.todayIndex]) {
          var td = w.days[w.todayIndex];
          var nx = w.days[w.todayIndex + 1];
          wx = "\n\nสภาพอากาศแปลงนี้ (ใช้ประกอบการตอบ ห้ามเล่าซ้ำให้ผู้ถามฟัง): " +
            "ฝนสะสม 7 วันที่ผ่านมา " + w.summary.rain7 + " มม. · " +
            "ความชื้นเฉลี่ย 3 วัน " + w.summary.humidity + "% · " +
            "วันนี้ฝน " + (td.rain != null ? td.rain : 0) + " มม. " +
            "อุณหภูมิ " + td.tempMin + "-" + td.tempMax + " องศา" +
            (nx ? " · พรุ่งนี้ฝน " + (nx.rain != null ? nx.rain : 0) + " มม." : "") +
            "\n[ถ้าคำถามเกี่ยวกับใส่ปุ๋ย พ่นยา หรือระบายน้ำ ต้องเอาฝนวันนี้และพรุ่งนี้มาคิดด้วย " +
            "ฝนเกิน 10 มม. ไม่ควรใส่ปุ๋ยเพราะจะไหลไปกับน้ำ " +
            "ความชื้นเกิน 80% ติดต่อกันหลายวันเป็นสภาพที่โรคไหม้ระบาดง่าย]\n";
        }
      } catch (err) {
        console.warn("[AI] แนบข้อมูลอากาศไม่สำเร็จ:", err.message);
      }

      var prompt = "คุณเป็นผู้ช่วยเกษตรกรผู้ปลูกข้าวไทย ดูแลได้ครบทั้งโรคข้าว การเตรียมดิน " +
        "การแก้ปัญหาดิน ปุ๋ยอินทรีย์และปุ๋ยเคมี การดูแลตามช่วงอายุข้าว และต้นทุนการผลิต\n\n" +
        "วิธีตอบ:\n" +
        "1. ตอบ 3-6 ประโยค เข้าเรื่องทันที บอกสิ่งที่ต้องลงมือทำเป็นประโยคแรกเลย\n" +
        "   ห้ามทักทาย ห้ามขึ้นต้นว่า สวัสดี หรือ จากข้อมูลที่ให้มา\n" +
        "   ห้ามยกข้อมูลแปลงมาเล่าซ้ำ ผู้ถามเห็นข้อมูลตัวเองอยู่แล้ว\n" +
        "   ถ้าต้องบอกหลายเรื่อง ให้ขึ้นบรรทัดใหม่เป็นข้อๆ " +
        "ห้ามใช้เครื่องหมายขีด - คั่นกลางประโยคเพื่อแยกเรื่อง ให้ขึ้นบรรทัดใหม่แทน\n" +
        "   ถ้าผู้ถามแค่ทักทาย พิมพ์คำเดียว หรือพิมพ์อะไรที่ไม่ใช่คำถาม " +
        "ให้ตอบสั้นๆ บรรทัดเดียวว่าถามอะไรได้บ้าง ห้ามอธิบายเรื่องดินหรือปุ๋ยที่เขาไม่ได้ถาม\n" +
        "1.5 ห้ามเดาชื่อโรคเด็ดขาดเมื่อผู้ถามยังไม่ได้บอกอาการที่ชัดเจน\n" +
        "   ถ้าถามลอยๆ เช่น มีปัญหาอะไร · โรคที่พบตอนนี้ · ข้าวไม่สวย · ช่วยดูให้หน่อย " +
        "ให้ถามกลับแค่ 1 คำถามเท่านั้น เช่น ใบเป็นยังไง จุดสีอะไร อยู่ตรงไหนของใบ " +
        "แล้วบอกให้ถ่ายรูปใบมาให้ดูจะแม่นกว่า\n" +
        "   ห้ามฟันธงชื่อโรค ห้ามสั่งให้ระบายน้ำ และห้ามสั่งให้งดปุ๋ย ก่อนรู้อาการจริง " +
        "เพราะถ้าเดาผิดจะทำให้ข้าวเสียหายมากกว่าเดิม\n" +
        "2. ห้ามเรียกผู้ถามด้วยคำใดๆ ทั้งสิ้น ห้ามใช้คำว่า พี่ ป้า ลุง น้า คุณ ท่าน คุณลุง คุณป้า\n" +
        "   ห้ามเรียกชื่อผู้ถาม และห้ามลงท้ายว่า ครับ ค่ะ นะครับ นะคะ\n" +
        "   ให้พูดตรงๆ เหมือนคนคุ้นเคยกันบอกงานกัน เช่น ใส่ปุ๋ยได้เลย · ยังไม่ต้องใส่ รอไปอีกอาทิตย์\n" +
        "3. ห้ามใช้ศัพท์วิชาการเด็ดขาด ห้ามใช้คำว่า ไนโตรเจน ฟอสฟอรัส โพแทสเซียม ธาตุอาหาร " +
        "อินทรียวัตถุ จุลินทรีย์ pH ไวต่อช่วงแสง วัชพืช ศัตรูพืช\n" +
        "   ให้พูดว่า ตัวเร่งใบเขียว ตัวเร่งราก ตัวทำให้ต้นแข็ง อาหารของต้นข้าว ซากพืชผุ " +
        "ตัวจิ๋วในดิน ความเปรี้ยวของดิน ข้าวออกรวงตามฤดู หญ้า แมลงที่มากินข้าว แทน\n" +
        "   ตัวเลขบนกระสอบปุ๋ยบอกตรงๆ ได้ เช่น กระสอบที่เขียนว่า 16-20-0\n" +
        "4. บอกสิ่งที่ลงมือทำได้ก่อน แล้วค่อยอธิบายสั้นๆ ว่าถ้าไม่ทำจะเกิดอะไรขึ้น\n" +
        "5. ถ้าเรื่องที่ถามมีแท็บเฉพาะในเว็บ ให้บอกชื่อแท็บนั้นด้วยเพื่อให้ไปดูต่อได้\n" +
        "6. ถ้าข้อมูลไม่พอตอบ ให้ถามกลับ 1 คำถามที่จะช่วยให้ตอบได้ตรงขึ้น " +
        "เช่น ข้าวอายุกี่วัน ดินเป็นแบบไหน หรือเคยส่งดินไปตรวจไหม อย่าตอบว่าไม่ทราบเฉยๆ\n" +
        "7. ห้ามแต่งชื่อสารเคมี ปริมาณที่ใช้ สูตรปุ๋ย หรือตัวเลขใดๆ ที่ไม่มีในข้อมูลด้านล่างเด็ดขาด\n\n" +
        focus +
        "ข้อมูลแปลงนาของผู้ถาม (จากบันทึกในระบบ):\n" + farmContext + wx + soilRef + "\n" +
        convo + carry + "\n" +
        "คำถาม: " + (text || "ช่วยดูภาพใบข้าวที่แนบมาว่าเป็นโรคอะไร และควรจัดการอย่างไร") + cvNote;

      // แนบภาพ = ให้ยึดผลจากโมเดลของระบบ ไม่ต้องค้นเว็บ
      // ไม่แนบภาพ = เป็นคำถามความรู้ทั่วไป เปิดค้นเว็บให้ข้อมูลทันสมัยขึ้น
      var answer = await Store.askGemini(prompt, payload, { search: !shot });
      reply.textContent = answer.text;
      remember("ผู้ใช้", (text || "(แนบภาพใบข้าวมาให้ดู)"));
      remember("ผู้เชี่ยวชาญ", answer.text.slice(0, 400));
      keep("ผู้ใช้", (text || "(แนบภาพใบข้าวมาให้ดู)"), !!shot);
      keep("ผู้เชี่ยวชาญ", answer.text, false);

      // แสดงแหล่งอ้างอิงเมื่อ AI ค้นเว็บมาตอบ
      // จำเป็นมากสำหรับงานนี้ เพราะคำแนะนำเรื่องสารเคมีที่ผิดทำให้เสียหายจริง
      // ผู้ใช้ต้องตามไปตรวจสอบต้นทางได้ ไม่ใช่เชื่อ AI ลอยๆ
      if (answer.searchUsed && answer.sources.length) {
        var webBox = el("div", "say say-ai src-box");
        webBox.appendChild(el("div", "src-head", "เว็บที่ AI ไปเปิดดูมาให้"));
        answer.sources.slice(0, 4).forEach(function (sx) {
          var a = el("a", "src-link");
          a.href = sx.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = sx.title;
          webBox.appendChild(a);
        });
        webBox.appendChild(el("div", "src-foot",
          "AI อาจสรุปคลาดเคลื่อนจากต้นทาง ควรตรวจสอบก่อนนำไปใช้ โดยเฉพาะชื่อสารเคมีและปริมาณที่ใช้"));
        talk.appendChild(webBox);
      }

      // ถ้าแนบรูปแต่ Worker ไม่ได้ส่งรูปไปถึง Gemini ต้องบอกตรงๆ
      // ไม่ปล่อยให้ผู้ใช้เข้าใจผิดว่า AI ดูรูปแล้ว
      if (shot && !answer.sawImage) {
        var warn = el("div", "flash flash-bad",
          "AI ยังไม่เห็นรูปที่แนบมา เพราะระบบที่ใช้อยู่ยังเป็นตัวเก่าที่รับรูปไม่ได้ " +
          "คำตอบด้านบนมาจากผลตรวจรูปและบันทึกแปลงของคุณเท่านั้น " +
          "แก้โดยนำโค้ด smartrice-worker.js เวอร์ชันล่าสุดไป Deploy ทับใน Cloudflare");
        warn.style.maxWidth = "87%";
        talk.appendChild(warn);
      }
    } catch (err) {
      reply.textContent = friendlyError(err.message);
    }
    talk.scrollTop = talk.scrollHeight;
  }

  sendBtn.onclick = ask;
  q.onkeydown = function (e) { if (e.key === "Enter") ask(); };
};

//

// เพื่อให้ทุกหน้าอ้างอิงจุดเดียวกัน ไม่ใช่ต่างคนต่างใช้พิกัดคนละที่
views.profile = function (root) {
  root.appendChild(pageHead("profile"));
  var p = Store.profile();
  root.appendChild(bund("ข้อมูลผู้ใช้"));
  var card = plot("ข้อมูลผู้ใช้", "ข้อมูลนี้เก็บไว้กับบัญชีของคุณ เปิดจากเครื่องไหนก็เห็นเหมือนกัน");
  card.style.maxWidth = "520px";

  var acc = el("div");
  acc.style.cssText = "display:flex;justify-content:space-between;padding:9px 0;margin-bottom:14px;border-bottom:1px solid var(--rule-soft);font-size:.86rem";
  acc.appendChild(el("span", "", "ชื่อบัญชี"));
  var accName = el("span", "num", p.username || "—");
  accName.style.color = "var(--ink-soft)";
  acc.appendChild(accName);
  card.appendChild(acc);

  var fields = [["ชื่อที่ใช้แสดง", "pfName", p.name], ["ชื่อแปลงนา หรือฟาร์ม", "pfFarm", p.farm], ["เบอร์ติดต่อ", "pfPhone", p.phone]];
  fields.forEach(function (f) {
    var d = el("div", "inp");
    d.style.marginBottom = "13px";
    d.appendChild(el("label", "", f[0]));
    var i = el("input");
    i.id = f[1];
    i.value = f[2] || "";
    d.appendChild(i);
    card.appendChild(d);
  });

  var save = el("button", "act act-go", "บันทึกข้อมูล");
  card.appendChild(save);
  var msg = el("div");
  card.appendChild(msg);

  save.onclick = async function () {
    save.disabled = true;
    save.textContent = "กำลังบันทึก";
    msg.innerHTML = "";
    try {
      await Store.saveProfile({
        name: document.getElementById("pfName").value.trim(),
        farm: document.getElementById("pfFarm").value.trim(),
        phone: document.getElementById("pfPhone").value.trim()
      });
      paintWho();
      msg.appendChild(el("div", "flash flash-ok", "บันทึกข้อมูลแล้ว"));
    } catch (err) {
      msg.appendChild(el("div", "flash flash-bad", "บันทึกไม่สำเร็จ: " + err.message));
    } finally {
      save.disabled = false;
      save.textContent = "บันทึกข้อมูล";
    }
  };
  root.appendChild(card);
};

views.admin = async function (root) {

  // วางไว้บนสุดเพราะเป็นคำถามแรกที่ผู้ดูแลเปิดหน้านี้มาหา
  // เวลาผู้ใช้แจ้งว่า "AI ไม่ตอบ" ต้องแยกให้ออกก่อนว่าเป็นที่คีย์ โมเดล หรือโควตา
  // ซึ่งแก้คนละทางกันหมด ถ้าไม่มีเครื่องมือแยกก็ต้องเดาแล้วลองทีละอย่าง
  //

  // ให้กดเองเมื่อต้องการ จะได้ไม่เผาโควตาทิ้งทุกครั้งที่แค่เข้ามาดูรายชื่อผู้ใช้

  var aiHost = el("div");
  aiCard.appendChild(aiHost);

  var aiBtn = el("button", "act act-go act-sm", "ตรวจสถานะตอนนี้");

        aiHost.appendChild(stateBlock("!", "ยังไม่ได้ตั้งค่าคีย์", h.verdict));

        aiHost.appendChild(el("div", h.anyOk ? "flash flash-ok" : "flash flash-bad", h.verdict));

        var meta = el("div", "read-foot",
          "คีย์ลงท้ายด้วย " + h.keyTail +
          (h.preferredModel ? " · โมเดลที่ตั้งไว้ " + h.preferredModel : " · ยังไม่ได้ตั้ง GEMINI_MODEL"));
        meta.style.marginTop = "10px";
        aiHost.appendChild(meta);

        var wrapAi = el("div");
        wrapAi.style.cssText = "overflow-x:auto;margin-top:12px";
        var tAi = el("table");
        tAi.innerHTML = "<thead><tr><th>โมเดล</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead>";
        var tbAi = el("tbody");
        (h.models || []).forEach(function (m) {
          var tr = el("tr");
          tr.appendChild(el("td", "n", m.model));
          var tdS = el("td");

  var host = el("div");

  card.appendChild(host);
  root.appendChild(card);

  var data;
  try {
    data = await api("/admin/users");
  } catch (err) {
    host.innerHTML = "";
    host.appendChild(stateBlock("!", "โหลดรายชื่อไม่สำเร็จ", err.message));
    return;
  }

  host.innerHTML = "";

    host.appendChild(stateBlock("◇", "ยังไม่มีผู้ใช้ในระบบ", "รอให้มีคนสมัครบัญชีก่อน"));
    return;
  }

  var wrap = el("div");
  wrap.style.overflowX = "auto";
  var t = el("table");
  t.innerHTML = "<thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>อีเมล</th><th>บันทึก</th><th>สถานะ</th><th>จัดการ</th></tr></thead>";
  var tb = el("tbody");

  data.users.forEach(function (u) {
    var tr = el("tr");

    var tdUser = el("td", "n");
    tdUser.textContent = u.username;
    if (u.isAdmin) {
      var badge = el("span", "tag-yes", "ผู้ดูแล");
      badge.style.marginLeft = "7px";
      tdUser.appendChild(badge);
    }
    tr.appendChild(tdUser);

    tr.appendChild(el("td", "", u.name));
    tr.appendChild(el("td", "n", u.email));
    tr.appendChild(el("td", "n", String(u.logCount)));

    // สถานะบัญชี ต้องเห็นได้ทันทีว่าใครถูกระงับอยู่
    var tdState = el("td");
    tdState.appendChild(el("span", u.blocked ? "tag-no" : "tag-yes",
      u.blocked ? "ถูกระงับ" : "ใช้งานได้"));
    tr.appendChild(tdState);

    var tdAct = el("td");
    tdAct.style.whiteSpace = "nowrap";
    var issue = el("button", "act act-line act-sm", "ออกรหัสรีเซ็ต");
    tdAct.appendChild(issue);

    // ผู้ดูแลระบบทั้งของตัวเองและคนอื่น ห้ามระงับหรือลบผ่านหน้านี้
    // ตัวกันจริงอยู่ที่ Worker ส่วนตรงนี้แค่ซ่อนปุ่มไม่ให้กดพลาด
    var isSelf = Session.user && Session.user.username === u.username;
    var blockBtn = null, delBtn = null;
    if (!u.isAdmin && !isSelf) {
      blockBtn = el("button", "act act-line act-sm", u.blocked ? "ปลดระงับ" : "ระงับการใช้งาน");
      blockBtn.style.marginLeft = "7px";
      tdAct.appendChild(blockBtn);

      delBtn = el("button", "act act-line act-sm", "ลบบัญชี");
      delBtn.style.cssText = "margin-left:7px;border-color:var(--rust);color:var(--rust)";
      tdAct.appendChild(delBtn);
    }
    tr.appendChild(tdAct);
    tb.appendChild(tr);

    // แถวผลลัพธ์ แทรกใต้แถวผู้ใช้คนนั้น จะได้รู้ชัดว่ารหัสเป็นของใคร
    var codeRow = el("tr");
    codeRow.hidden = true;
    var codeCell = el("td");
    codeCell.colSpan = 6;  // เท่ากับจำนวนคอลัมน์ในตาราง
    codeCell.style.background = "var(--canopy)";
    codeRow.appendChild(codeCell);
    tb.appendChild(codeRow);

    issue.onclick = async function () {
      issue.disabled = true;
      issue.textContent = "กำลังออกรหัส";
      codeCell.innerHTML = "";
      codeRow.hidden = false;
      try {
        var r = await api("/admin/reset", { method: "POST", body: { username: u.username } });

        var box = el("div");
        box.style.cssText = "padding:6px 2px";
        box.appendChild(el("div", "read-label", "รหัสสำหรับ " + u.name + " (" + u.username + ")"));

        var codeLine = el("div");
        codeLine.style.cssText = "display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0";
        var big = el("div", "num", r.code);
        big.style.cssText = "font-size:1.9rem;letter-spacing:.28em;font-weight:500;color:var(--deep)";
        codeLine.appendChild(big);
        var copy = el("button", "act act-line act-sm", "คัดลอกรหัส");
        copy.onclick = function () {
          navigator.clipboard.writeText(r.code).then(function () {
            copy.textContent = "คัดลอกแล้ว";
            setTimeout(function () { copy.textContent = "คัดลอกรหัส"; }, 1600);
          }).catch(function () { copy.textContent = "คัดลอกไม่ได้ ให้จดเอง"; });
        };
        codeLine.appendChild(copy);
        box.appendChild(codeLine);

        box.appendChild(el("div", "read-foot",
          "ใช้ได้ภายใน " + r.expiresInMinutes + " นาที และใช้ได้ครั้งเดียว " +
          "บอกผู้ใช้ให้ไปที่หน้าเข้าสู่ระบบ กดลืมรหัสผ่าน แล้วเลือก \"ไปกรอกรหัส\" " +
          "จากนั้นกรอกอีเมล " + r.email + " พร้อมรหัสนี้"));

        box.appendChild(el("div", "flash " + (r.mailed ? "flash-ok" : "flash-bad"),
          r.mailed
            ? "ส่งรหัสเข้าอีเมล " + r.email + " ให้อัตโนมัติแล้วด้วย"
            : "ยังไม่ได้ส่งอีเมล" + (r.mailError ? " (" + r.mailError + ")" : " เพราะยังไม่ได้ตั้งค่าบริการอีเมล") +
              " กรุณาส่งรหัสด้านบนให้ผู้ใช้ด้วยตนเอง"));

        codeCell.appendChild(box);
      } catch (err) {
        codeCell.appendChild(el("div", "flash flash-bad", "ออกรหัสไม่สำเร็จ: " + err.message));
      } finally {
        issue.disabled = false;
        issue.textContent = "ออกรหัสรีเซ็ต";
      }
    };

    // ── ระงับ / ปลดระงับ ──
    // เลือกให้ระงับเป็นการกระทำที่ย้อนกลับได้ ต่างจากการลบ
    // จึงยืนยันแค่ครั้งเดียวแบบธรรมดา ไม่ต้องพิมพ์ชื่อซ้ำ
    if (blockBtn) {
      blockBtn.onclick = async function () {
        var toBlock = !u.blocked;
        var q = toBlock
          ? "ระงับการใช้งานของ " + u.name + " (" + u.username + ")\n\n" +
            "ผู้ใช้จะเข้าระบบไม่ได้ทันที แต่ข้อมูลทั้งหมดยังอยู่ครบและปลดระงับคืนได้ทุกเมื่อ"
          : "ปลดระงับ " + u.name + " ให้กลับมาใช้งานได้ตามปกติ";
        if (!confirm(q)) return;

        blockBtn.disabled = true;
        blockBtn.textContent = "กำลังดำเนินการ";
        codeCell.innerHTML = "";
        codeRow.hidden = false;
        try {
          var r = await api("/admin/block", { method: "POST", body: { username: u.username, blocked: toBlock } });
          codeCell.appendChild(el("div", "flash flash-ok", r.message));
          u.blocked = r.blocked;
          blockBtn.textContent = u.blocked ? "ปลดระงับ" : "ระงับการใช้งาน";
          tdState.innerHTML = "";
          tdState.appendChild(el("span", u.blocked ? "tag-no" : "tag-yes", u.blocked ? "ถูกระงับ" : "ใช้งานได้"));
        } catch (err) {
          codeCell.appendChild(el("div", "flash flash-bad", "ดำเนินการไม่สำเร็จ: " + err.message));
          blockBtn.textContent = u.blocked ? "ปลดระงับ" : "ระงับการใช้งาน";
        } finally {
          blockBtn.disabled = false;
        }
      };
    }

    // ── ลบบัญชี ──
    // การลบย้อนกลับไม่ได้และไม่มีถังขยะ จึงบังคับให้พิมพ์ชื่อผู้ใช้ยืนยัน
    // การกด "ตกลง" อย่างเดียวกดพลาดได้ง่ายเกินไปสำหรับการกระทำระดับนี้
    if (delBtn) {
      delBtn.onclick = async function () {
        var typed = prompt(
          "ลบบัญชี " + u.name + " (" + u.username + ") ออกจากระบบถาวร\n\n" +
          "จะลบบันทึกทั้งหมด " + u.logCount + " รายการและภาพทั้งหมดไปด้วย กู้คืนไม่ได้\n" +
          "ถ้าแค่ต้องการห้ามเข้าใช้งานชั่วคราว ให้กดปุ่มระงับการใช้งานแทน\n\n" +
          "พิมพ์ชื่อผู้ใช้ \"" + u.username + "\" เพื่อยืนยัน");
        if (typed === null) return;
        if (typed.trim().toLowerCase() !== u.username) {
          alert("ชื่อผู้ใช้ที่พิมพ์ไม่ตรง ยกเลิกการลบแล้ว");
          return;
        }

        delBtn.disabled = true;
        delBtn.textContent = "กำลังลบ";
        codeCell.innerHTML = "";
        codeRow.hidden = false;
        try {
          var r = await api("/admin/delete", {
            method: "POST",
            body: { username: u.username, confirm: typed.trim().toLowerCase() }
          });
          // ลบแถวออกจากตารางเลย เพื่อไม่ให้เผลอกดปุ่มอื่นกับบัญชีที่ไม่มีอยู่แล้ว
          tr.remove();
          codeRow.hidden = false;
          codeCell.innerHTML = "";
          codeCell.appendChild(el("div", "flash flash-ok", r.message));
        } catch (err) {
          codeCell.appendChild(el("div", "flash flash-bad", "ลบไม่สำเร็จ: " + err.message));
          delBtn.disabled = false;
          delBtn.textContent = "ลบบัญชี";
        }
      };
    }
  });

  t.appendChild(tb);
  wrap.appendChild(t);
  host.appendChild(wrap);

  var note = el("p", "", "หน้านี้แสดงเฉพาะบัญชีที่มีสิทธิ์ผู้ดูแลระบบ ผู้ใช้ทั่วไปจะไม่เห็นเมนูนี้และเรียกใช้ไม่ได้แม้พิมพ์ที่อยู่ตรงๆ · การระงับย้อนกลับได้ทุกเมื่อและข้อมูลยังอยู่ครบ ส่วนการลบบัญชีจะลบบันทึกและภาพทั้งหมดถาวร กู้คืนไม่ได้ จึงควรใช้การระงับก่อนเสมอเมื่อยังไม่แน่ใจ · บัญชีผู้ดูแลระบบและบัญชีของตัวเองจะไม่มีปุ่มระงับและลบ");
  note.style.cssText = "font-size:.78rem;color:var(--ink-soft);margin:16px 0 0";
  host.appendChild(note);
};

// ─── ตัวสลับหน้า ────────────────────────────────
var here = "overview";

// เมนูบางหน้าแสดงเฉพาะผู้ดูแลระบบ
// นี่เป็นแค่การซ่อนเมนู ตัวกันจริงอยู่ที่ Worker ซึ่งตรวจสิทธิ์ทุกคำขอ
function visiblePages() {
  var admin = Session.user && Session.user.isAdmin;
  return PAGES.filter(function (p) {
    if (p.hidden) return false;
    return !p.adminOnly || admin;
  });
}

// เหลือ 4 ปุ่ม จึงไม่ต้องมีหัวข้อกลุ่มคั่นอีกแล้ว
// หัวข้อกลุ่มมีไว้ช่วยหาของในเมนูยาว พอเมนูสั้นมันกลายเป็นตัวหนังสือส่วนเกิน
function paintNav() {
  var nav = document.getElementById("railNav");
  nav.innerHTML = "";
  visiblePages().forEach(function (p) {
    var b = el("button", "rail-item" + (p.id === here ? " on" : ""));
    b.dataset.page = p.id;
    b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + p.icon + '"/></svg>';
    b.appendChild(document.createTextNode(p.label));
    b.onclick = function () {
      open(p.id);
      document.getElementById("rail").classList.remove("open");
    };
    nav.appendChild(b);
  });
}

// ตัวจับเวลาของหน้าปัจจุบัน ต้องล้างทุกครั้งที่เปลี่ยนหน้า
// ไม่งั้นหน้าที่ปิดไปแล้วยังยิงคำขอเบื้องหลังต่อไปเรื่อยๆ
var pageTimers = [];
function onPageTimer(fn, ms) {
  pageTimers.push(setInterval(fn, ms));
}
function clearPageTimers() {
  pageTimers.forEach(clearInterval);
  pageTimers = [];
}

// เริ่มอนิเมชันใหม่ทุกครั้ง ต้องถอดคลาสออกแล้วบังคับให้เบราว์เซอร์คำนวณ layout ก่อน
// ไม่งั้นการใส่คลาสกลับทันทีจะถูกมองว่า "ไม่มีอะไรเปลี่ยน" แล้วอนิเมชันจะไม่เล่นซ้ำ
function replay(node, cls) {
  if (!node) return;
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
}

// แถบกระโดดไปแต่ละส่วนของแท็บ
//
// ไม่ใช่แท็บย่อย เพราะเนื้อหาทุกส่วนถูกวาดไว้ครบแล้วตั้งแต่แรก แค่เลื่อนไปหา
// คนที่เลื่อนอ่านเรื่อยๆ จะไม่เจออะไรหายไป ส่วนคนที่รู้ว่าจะไปไหนก็กดข้ามได้เลย
function jumpBar(page) {
  var bar = el("div", "jump");
  page.parts.forEach(function (vid, i) {
    var b = el("button", "jump-b", page.jump[i] || vid);
    b.onclick = function () {
      var target = document.getElementById("slot-" + vid);
      if (!target) return;
      try { target.scrollIntoView({ behavior: "smooth", block: "start" }); }
      catch (e) { target.scrollIntoView(true); }
    };
    bar.appendChild(b);
  });
  return bar;
}

async function open(id) {
  here = id;
  clearPageTimers();

  // ── เลื่อนกลับขึ้นบนสุดทุกครั้งที่เปลี่ยนหน้า (แก้ 2026-08) ──
  //
  // เดิมเบราว์เซอร์คงตำแหน่ง scroll เดิมไว้ ผู้ใช้ที่เลื่อนลงไปท้ายหน้าดินแล้วกดเมนูอื่น
  // จะเปิดหน้าใหม่มาโผล่กลางเนื้อหาโดยไม่เห็นหัวเรื่อง จนคิดว่ากดผิดหน้าหรือหน้าโหลดไม่ครบ
  // ปัญหานี้หนักเป็นพิเศษบนมือถือที่หน้าจอสั้น และหน้าเนื้อหายาวมากอย่างหน้าเตรียมดิน
  try {
    window.scrollTo(0, 0);
    if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
    var scroller = document.getElementById("field");
    if (scroller && scroller.parentElement) scroller.parentElement.scrollTop = 0;
  } catch (e) { /* เบราว์เซอร์เก่าไม่รองรับก็ข้ามไป */ }

  var page = PAGES.find(function (p) { return p.id === id; });
  if (!page) { page = PAGES[0]; here = page.id; }

  var title = document.getElementById("barTitle");
  var kicker = document.getElementById("barKicker");
  title.textContent = page.label;
  kicker.textContent = page.kicker;
  replay(title, "swap");
  replay(kicker, "swap");

  var bar = document.getElementById("loadbar");
  if (bar) bar.classList.add("on");

  var root = document.getElementById("field");
  root.classList.remove("enter");
  root.innerHTML = "";
  try {
    // paintNav อยู่ใน try ด้วย ไม่ใช่ก่อนหน้านี้
    // เดิมถ้ามันพลาดขึ้นมา ข้อผิดพลาดจะหลุดออกนอก open() ทั้งก้อน
    // ได้ผลลัพธ์เป็นหน้าเปล่าเงียบๆ ทั้งเมนูและเนื้อหา โดยไม่มีอะไรบอกผู้ใช้เลย
    paintNav();

    // ── วาดทุกส่วนของแท็บต่อกันลงมาในหน้าเดียว ──
    //
    // แต่ละส่วนใส่ไว้ในกล่องของตัวเองพร้อม id เพื่อให้ปุ่มกระโดดด้านบนเลื่อนไปหาได้
    // ถ้าส่วนไหนพัง ให้พังเฉพาะส่วนนั้น ส่วนที่เหลือต้องยังใช้งานได้
    // เดิมทั้งหน้าเป็นหน้าเดียว พังที่ไหนก็ดับทั้งหน้า พอยุบ 3 หน้ามารวมกัน
    // ความเสี่ยงนั้นคูณสามทันที จึงต้องกันไว้ทีละส่วน
    var parts = page.parts || [id];

    // แท็บที่แสดงตัวเลขของแปลงต้องมีแถบสลับแปลงเสมอ
    // แท็บถาม AI ไม่ต้อง เพราะเป็นช่องคุยไม่ใช่ข้อมูลของแปลง
    if (PLOT_PAGES.indexOf(page.id) !== -1) root.appendChild(plotBar());

    var cite = tabCite(page);
    if (cite) root.appendChild(cite);
    if (parts.length > 1 && page.jump) root.appendChild(jumpBar(page));

    // ── สร้างกล่องทุกส่วนก่อน แล้วค่อยวาดพร้อมกัน ──
    //
    // ห้ามวาดทีละส่วนแบบรอให้เสร็จก่อนค่อยขึ้นอันถัดไป
    // เพราะส่วนที่ต้องรอเครือข่ายหรือรอ GPS จะบล็อกทุกส่วนที่อยู่ใต้มัน
    // ของจริงที่เจอคือหน้าอากาศรอสัญญาณดาวเทียม 12 วินาที
    // แล้วส่วนระยะข้าวที่อยู่ถัดลงไปไม่ขึ้นเลยจนกว่าจะหมดเวลา
    //
    // สร้างกล่องเรียงตามลำดับก่อน เนื้อหาจึงยังอยู่ถูกที่เสมอ
    // แล้วปล่อยให้แต่ละส่วนเติมของตัวเองเมื่อพร้อม ใครเสร็จก่อนขึ้นก่อน
    var slots = parts.map(function (vid) {
      var slot = el("section", "slot");
      slot.id = "slot-" + vid;
      root.appendChild(slot);
      return slot;
    });

    // โชว์โครงหน้าทันที ไม่ต้องรอข้อมูลครบ
    replay(root, "enter");

    await Promise.all(parts.map(function (vid, i) {
      var slot = slots[i];
      // ห่อด้วย Promise.resolve เผื่อ view บางตัวไม่ใช่ async
      return Promise.resolve()
        .then(function () { return views[vid](slot); })
        .catch(function (e) {
          slot.innerHTML = "";
          slot.appendChild(stateBlock("!", "ส่วนนี้เปิดไม่ได้", e.message));
        });
    }));
  } catch (err) {
    root.innerHTML = "";
    root.appendChild(stateBlock("!", "เปิดหน้านี้ไม่ได้", err.message + " — ลองรีเฟรชหน้าอีกครั้ง"));
    replay(root, "enter");
  } finally {
    // ปิดแถบเสมอ ไม่ว่าหน้าจะเปิดสำเร็จหรือพัง
    // ถ้าลืมปิดตอน error แถบจะวิ่งค้างตลอดไปจนผู้ใช้คิดว่าระบบแฮงก์
    if (bar) bar.classList.remove("on");
  }
}

// ─── หน้าจอเข้าสู่ระบบ ──────────────────────────
function showAuthScreen(message) {
  var existing = document.querySelector(".gate");
  if (existing) existing.remove();

  // login | register | forgot | reset
  var mode = "login";
  var resetEmail = "";   // จำอีเมลไว้ข้ามจากขั้นขอรหัสไปขั้นตั้งรหัสใหม่

  var gate = el("div", "gate");
  var card = el("div", "gate-card");

  var mark = el("div", "gate-mark");
  mark.innerHTML = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M12 21c0-6 0-9 0-11" stroke="#1B5E3A" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M12 10C12 6 9 3.5 5.5 3c-.4 3.8 2 7 6.5 7z" fill="#2E8B57"/>' +
    '<path d="M12 13c0-3.6 2.8-6 6-6.4.4 3.5-1.9 6.4-6 6.4z" fill="#6FBF73"/></svg>';
  mark.appendChild(document.createTextNode("SmartRice AI"));
  card.appendChild(mark);
  card.appendChild(el("div", "gate-sub", "Field diagnostics"));

  var title = el("h2", "gate-title");
  var note = el("div", "gate-note");
  card.appendChild(title);
  card.appendChild(note);

  var alertHost = el("div");
  card.appendChild(alertHost);
  if (message) alertHost.appendChild(el("div", "flash flash-bad", message));

  function fieldBox(label, id, type, hint, autocomplete, inputMode) {
    var d = el("div", "gate-field");
    d.appendChild(el("label", "", label));
    var i = el("input");
    i.id = id;
    i.type = type || "text";
    if (autocomplete) i.autocomplete = autocomplete;
    if (inputMode) i.inputMode = inputMode;
    d.appendChild(i);
    if (hint) d.appendChild(el("div", "gate-hint", hint));
    return d;
  }

  var nameBox  = fieldBox("ชื่อที่ใช้แสดง", "gaName", "text", "เช่น สมชาย ใจดี", "name");
  var idBox    = fieldBox("ชื่อผู้ใช้ หรืออีเมล", "gaId", "text", "", "username");
  var userBox  = fieldBox("ชื่อผู้ใช้", "gaUser", "text", "อังกฤษพิมพ์เล็ก ตัวเลข หรือขีดล่าง 3-20 ตัว", "username");
  var mailBox  = fieldBox("อีเมล", "gaMail", "email", "ใช้สำหรับกู้คืนรหัสผ่าน ต้องเป็นอีเมลที่เปิดอ่านได้จริง", "email");
  var passBox  = fieldBox("รหัสผ่าน", "gaPass", "password", "อย่างน้อย 8 ตัวอักษร", "current-password");
  var codeBox  = fieldBox("รหัส 6 หลักจากอีเมล", "gaCode", "text", "ตรวจโฟลเดอร์สแปมด้วยถ้าไม่เห็นในกล่องหลัก", "one-time-code", "numeric");
  var newPass  = fieldBox("รหัสผ่านใหม่", "gaNew", "password", "อย่างน้อย 8 ตัวอักษร", "new-password");

  [nameBox, idBox, userBox, mailBox, passBox, codeBox, newPass].forEach(function (b) { card.appendChild(b); });

  var go = el("button", "act act-go act-wide");
  go.style.marginTop = "6px";
  card.appendChild(go);

  var linkRow = el("div", "gate-swap");
  card.appendChild(linkRow);

  card.appendChild(el("div", "gate-foot",
    "รูปทุกใบตรวจอยู่ในเครื่องของคุณเอง ไม่ได้ถูกส่งขึ้นระบบ " +
    "ส่วนบันทึกต่างๆ เก็บไว้ในบัญชีของคุณ จะได้เปิดดูจากเครื่องอื่นได้"));

  function linkTo(label, target) {
    var b = el("button", "", label);
    b.onclick = function () { mode = target; paint(); };
    return b;
  }

  var LABELS = {
    login:    "เข้าสู่ระบบ",
    register: "สร้างบัญชี",
    forgot:   "ส่งรหัสไปที่อีเมล",
    reset:    "ตั้งรหัสผ่านใหม่"
  };

  function paint() {
    alertHost.innerHTML = "";
    linkRow.innerHTML = "";

    var show = {
      login:    { idBox: 1, passBox: 1 },
      register: { nameBox: 1, userBox: 1, mailBox: 1, passBox: 1 },
      forgot:   { mailBox: 1 },
      reset:    { mailBox: 1, codeBox: 1, newPass: 1 }
    }[mode];

    var boxes = { nameBox: nameBox, idBox: idBox, userBox: userBox,
                  mailBox: mailBox, passBox: passBox, codeBox: codeBox, newPass: newPass };
    Object.keys(boxes).forEach(function (k) { boxes[k].hidden = !show[k]; });

    if (mode === "login") {
      title.textContent = "เข้าสู่ระบบ";
      note.textContent = "กรอกชื่อผู้ใช้หรืออีเมล พร้อมรหัสผ่าน เพื่อเปิดบันทึกแปลงของคุณ";
      document.getElementById("gaPass").autocomplete = "current-password";
      linkRow.appendChild(document.createTextNode("ยังไม่มีบัญชี "));
      linkRow.appendChild(linkTo("สร้างบัญชีใหม่", "register"));
      linkRow.appendChild(el("div", "", ""));
      var fb = linkTo("ลืมรหัสผ่าน", "forgot");
      fb.style.marginTop = "6px";
      linkRow.appendChild(fb);
    } else if (mode === "register") {
      title.textContent = "สร้างบัญชีใหม่";
      note.textContent = "บัญชีนี้ใช้เก็บบันทึกแปลงของคุณโดยเฉพาะ ผู้ใช้คนอื่นจะไม่เห็นข้อมูลของคุณ";
      document.getElementById("gaPass").autocomplete = "new-password";
      linkRow.appendChild(document.createTextNode("มีบัญชีอยู่แล้ว "));
      linkRow.appendChild(linkTo("เข้าสู่ระบบ", "login"));
    } else if (mode === "forgot") {
      title.textContent = "ลืมรหัสผ่าน";
      note.textContent = "กรอกอีเมลที่ใช้สมัคร ระบบจะส่งรหัส 6 หลักไปให้เพื่อตั้งรหัสผ่านใหม่";
      linkRow.appendChild(document.createTextNode("ได้รหัสแล้ว "));
      linkRow.appendChild(linkTo("ไปกรอกรหัส", "reset"));
      linkRow.appendChild(el("div", "", ""));
      var bk = linkTo("กลับไปเข้าสู่ระบบ", "login");
      bk.style.marginTop = "6px";
      linkRow.appendChild(bk);
    } else {
      title.textContent = "ตั้งรหัสผ่านใหม่";
      note.textContent = "กรอกรหัส 6 หลักที่ได้รับทางอีเมล พร้อมรหัสผ่านใหม่ที่ต้องการ";
      if (resetEmail) document.getElementById("gaMail").value = resetEmail;
      linkRow.appendChild(document.createTextNode("ยังไม่ได้รับรหัส "));
      linkRow.appendChild(linkTo("ขอรหัสใหม่", "forgot"));
    }

    go.textContent = LABELS[mode];
    go.disabled = false;
  }

  async function callAuth(path, body) {
    var res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || "ดำเนินการไม่สำเร็จ");
    return data;
  }

  function enterApp(data) {
    Session.save(data.token, data.user);
    Store.reset();
    gate.remove();
    startApp();
  }

  async function submit() {
    var val = function (id) { return (document.getElementById(id).value || "").trim(); };
    alertHost.innerHTML = "";
    go.disabled = true;
    go.textContent = "กำลังดำเนินการ";

    try {
      if (mode === "login") {
        if (!val("gaId") || !document.getElementById("gaPass").value) {
          throw new Error("กรุณากรอกให้ครบทั้งสองช่อง");
        }
        enterApp(await callAuth("/auth/login", {
          username: val("gaId"),
          password: document.getElementById("gaPass").value
        }));

      } else if (mode === "register") {
        var newUser = val("gaUser").toLowerCase();
        if (!val("gaName") || !newUser || !val("gaMail") ||
            !document.getElementById("gaPass").value) {
          throw new Error("กรุณากรอกข้อมูลให้ครบทุกช่อง");
        }

        await callAuth("/auth/register", {
          username: newUser,
          email: val("gaMail").toLowerCase(),
          password: document.getElementById("gaPass").value,
          name: val("gaName")
        });

        // ไม่เรียก enterApp() โดยตั้งใจ — สมัครเสร็จให้กลับไปล็อกอินเอง
        // paint() ล้าง alertHost บรรทัดแรก จึงต้องแจ้งผลหลัง paint() เสมอ
        mode = "login";
        paint();
        document.getElementById("gaId").value = newUser;
        document.getElementById("gaPass").value = "";
        alertHost.appendChild(el("div", "flash flash-ok",
          "สร้างบัญชี " + newUser + " เรียบร้อยแล้ว กรุณาเข้าสู่ระบบด้วยรหัสผ่านที่เพิ่งตั้งไว้"));
        document.getElementById("gaPass").focus();
        return;

      } else if (mode === "forgot") {
        if (!val("gaMail")) throw new Error("กรุณากรอกอีเมล");
        var r = await callAuth("/auth/forgot", { email: val("gaMail").toLowerCase() });
        resetEmail = val("gaMail").toLowerCase();
        mode = "reset";
        paint();
        // แยกข้อความชัดเจนระหว่างส่งอีเมลได้กับส่งไม่ได้
        // ถ้าส่งไม่ได้ต้องบอกทางออกทันที ไม่ปล่อยให้นั่งรอรหัสที่ไม่มีวันมา
        alertHost.appendChild(el("div",
          "flash " + (r.emailSent === false ? "flash-bad" : "flash-ok"),
          r.message || "ส่งรหัสไปที่อีเมลแล้ว"));
        document.getElementById("gaCode").focus();

      } else {
        enterApp(await callAuth("/auth/reset", {
          email: val("gaMail").toLowerCase(),
          code: val("gaCode"),
          password: document.getElementById("gaNew").value
        }));
      }
    } catch (err) {
      alertHost.appendChild(el("div", "flash flash-bad", err.message));
      go.disabled = false;
      go.textContent = LABELS[mode];
    }
  }

  go.onclick = submit;
  card.querySelectorAll("input").forEach(function (i) {
    i.onkeydown = function (e) { if (e.key === "Enter") submit(); };
  });

  gate.appendChild(card);
  document.body.appendChild(gate);
  paint();
  document.getElementById("gaId").focus();
}


// ─── เริ่มระบบ ─────────────────────────────────
function paintWho() {
  var p = Store.profile();
  document.getElementById("whoName").textContent = p.name;
  document.getElementById("whoBadge").textContent = (p.name || "ผ").charAt(0);
}

document.getElementById("railToggle").onclick = function () {
  document.getElementById("rail").classList.toggle("open");
};

// ── เมนูใต้ชื่อผู้ใช้ ──
//
// ข้อมูลผู้ใช้กับผู้ดูแลระบบเป็นงานที่ทำครั้งเดียวแล้วแทบไม่กลับมาอีก
// การให้กินที่ในเมนูหลักตลอดเวลาทำให้เมนูยาวขึ้นโดยไม่ได้ใช้
// ย้ายมาซ่อนใต้ชื่อตัวเอง ซึ่งเป็นที่ที่คนคาดว่าจะเจอเรื่องบัญชีอยู่แล้ว
(function () {
  var who = document.querySelector(".who");
  if (!who) return;
  var menu = null;

  function close() {
    if (menu) { menu.remove(); menu = null; }
    document.removeEventListener("click", onOutside, true);
  }
  function onOutside(e) { if (!who.contains(e.target)) close(); }

  who.onclick = function (e) {
    e.stopPropagation();
    if (menu) { close(); return; }
    menu = el("div", "who-menu");

    PAGES.filter(function (p) {
      if (!p.hidden) return false;
      return !p.adminOnly || (Session.user && Session.user.isAdmin);
    }).forEach(function (p) {
      var b = el("button", "", p.label);
      b.onclick = function (ev) { ev.stopPropagation(); close(); open(p.id); };
      menu.appendChild(b);
    });

    var out = el("button", "out", "ออกจากระบบ");
    out.onclick = function (ev) {
      ev.stopPropagation();
      close();
      document.getElementById("signOut").click();
    };
    menu.appendChild(out);

    who.appendChild(menu);
    setTimeout(function () { document.addEventListener("click", onOutside, true); }, 0);
  };
})();
document.getElementById("seekInput").oninput = function () {
  if (here === tabOf("ledger")) open(here);
};
document.getElementById("signOut").onclick = async function () {
  if (!confirm("ออกจากระบบตอนนี้ ยืนยันหรือไม่")) return;
  try { await api("/auth/logout", { method: "POST" }); } catch (e) { /* ออกจากระบบฝั่งเครื่องได้อยู่ดี */ }
  Session.clear();
  Store.reset();
  showAuthScreen(null);
};

function startApp() {
  paintWho();
  markBrain();
  open("grow");
}

// ตรวจ token ที่เก็บไว้ก่อน ถ้ายังใช้ได้ก็เข้าแอปเลย ไม่ต้องล็อกอินซ้ำ
(async function boot() {
  if (!Session.token) { showAuthScreen(null); return; }
  try {
    var data = await api("/auth/me");
    Session.user = data.user;
    startApp();
  } catch (err) {
    // token หมดอายุหรือใช้ไม่ได้ ฟังก์ชัน api จะเรียกหน้าล็อกอินให้เองแล้ว
    // ที่เหลือคือกรณีเน็ตล่มตั้งแต่เปิดเว็บ ต้องบอกให้ชัดว่าเกิดอะไร
    if (!document.querySelector(".gate")) {
      showAuthScreen("ต่อระบบไม่ได้: " + err.message);
    }
  }
})();

})();
</script>
