views.admin = async function (root) {

  // ══ สถานะบริการ AI ══
  //
  // วางไว้บนสุดเพราะเป็นคำถามแรกที่ผู้ดูแลเปิดหน้านี้มาหา
  // เวลาผู้ใช้แจ้งว่า "AI ไม่ตอบ" ต้องแยกให้ออกก่อนว่าเป็นที่คีย์ โมเดล หรือโควตา
  // ซึ่งแก้คนละทางกันหมด ถ้าไม่มีเครื่องมือแยกก็ต้องเดาแล้วลองทีละอย่าง
  //
  // ไม่เรียกอัตโนมัติตอนเปิดหน้า เพราะการตรวจยิงจริงทุกโมเดลและกินโควตาเล็กน้อย
  // ให้กดเองเมื่อต้องการ จะได้ไม่เผาโควตาทิ้งทุกครั้งที่แค่เข้ามาดูรายชื่อผู้ใช้
  root.appendChild(bund("สถานะบริการ AI"));

  var aiCard = plot("ตรวจคีย์ Gemini ทีละโมเดล",
    "ยิงคำถามสั้นที่สุดไปยังทุกโมเดลในรายการสำรอง แล้วรายงานสถานะดิบที่ได้กลับมา");
  var aiHost = el("div");
  aiCard.appendChild(aiHost);

  var aiBtn = el("button", "act act-go act-sm", "ตรวจสถานะตอนนี้");
  aiBtn.style.marginTop = "12px";
  aiBtn.onclick = async function () {
    aiBtn.disabled = true;
    aiBtn.textContent = "กำลังตรวจ";
    aiHost.innerHTML = "";
    aiHost.appendChild(stateBlock("◌", "กำลังยิงทดสอบทีละโมเดล", "ใช้เวลาไม่กี่วินาที"));
    try {
      var h = await api("/admin/ai-health");
      aiHost.innerHTML = "";

      if (!h.configured) {
        aiHost.appendChild(stateBlock("!", "ยังไม่ได้ตั้งค่าคีย์", h.verdict));
      } else {
        aiHost.appendChild(el("div", h.anyOk ? "flash flash-ok" : "flash flash-bad", h.verdict));

        var meta = el("div", "read-foot",
          "คีย์ลงท้ายด้วย " + h.keyTail +
          (h.preferredModel ? " · โมเดลที่ตั้งไว้ " + h.preferredModel : " · ยังไม่ได้ตั้ง GEMINI_MODEL"));
        meta.style.marginTop = "10px";
        aiHost.appendChild(meta);

        var wrapAi = el("div");
        wrapAi.style.cssText = "overflow-x:auto;margin-top:12px";
        var tAi = el("table");
        tAi.innerHTML = "<thead><tr><th>โมเดล</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead>";
        var tbAi = el("tbody");
        (h.models || []).forEach(function (m) {
          var tr = el("tr");
          tr.appendChild(el("td", "n", m.model));
          var tdS = el("td");
          tdS.appendChild(el("span", m.ok ? "tag-yes" : "tag-no",
            m.ok ? "ใช้ได้" : (m.status || "ผิดพลาด")));
          tr.appendChild(tdS);
          tr.appendChild(el("td", "", m.note));
          tbAi.appendChild(tr);
        });
        tAi.appendChild(tbAi);
        wrapAi.appendChild(tAi);
        aiHost.appendChild(wrapAi);
      }
    } catch (err) {
      aiHost.innerHTML = "";
      aiHost.appendChild(stateBlock("!", "ตรวจไม่สำเร็จ", friendlyError(err.message)));
    }
    aiBtn.disabled = false;
    aiBtn.textContent = "ตรวจอีกครั้ง";
  };
  aiCard.appendChild(aiBtn);
  root.appendChild(aiCard);

  root.appendChild(bund("จัดการผู้ใช้"));

  var card = plot("ผู้ใช้ทั้งหมดในระบบ",
    "กดออกรหัสรีเซ็ตให้ผู้ใช้ที่ลืมรหัสผ่าน แล้วส่งรหัสให้เขาทางโทรศัพท์หรือ LINE ได้ทันที");
  var host = el("div");
  host.appendChild(stateBlock("◌", "กำลังโหลดรายชื่อผู้ใช้", null));
  card.appendChild(host);
  root.appendChild(card);

  var data;
  try {
    data = await api("/admin/users");
  } catch (err) {
    host.innerHTML = "";
    host.appendChild(stateBlock("!", "โหลดรายชื่อไม่สำเร็จ", err.message));
    return;
  }

  host.innerHTML = "";
  if (!data.users.length) {
    host.appendChild(stateBlock("◇", "ยังไม่มีผู้ใช้ในระบบ", "รอให้มีคนสมัครบัญชีก่อน"));
    return;
  }

  var wrap = el("div");
  wrap.style.overflowX = "auto";
  var t = el("table");
  t.innerHTML = "<thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>อีเมล</th><th>บันทึก</th><th>สถานะ</th><th>จัดการ</th></tr></thead>";
  var tb = el("tbody");

  data.users.forEach(function (u) {
    var tr = el("tr");

    var tdUser = el("td", "n");
    tdUser.textContent = u.username;
    if (u.isAdmin) {
      var badge = el("span", "tag-yes", "ผู้ดูแล");
      badge.style.marginLeft = "7px";
      tdUser.appendChild(badge);
    }
    tr.appendChild(tdUser);

    tr.appendChild(el("td", "", u.name));
    tr.appendChild(el("td", "n", u.email));
    tr.appendChild(el("td", "n", String(u.logCount)));

    // สถานะบัญชี ต้องเห็นได้ทันทีว่าใครถูกระงับอยู่
    var tdState = el("td");
    tdState.appendChild(el("span", u.blocked ? "tag-no" : "tag-yes",
      u.blocked ? "ถูกระงับ" : "ใช้งานได้"));
    tr.appendChild(tdState);

    var tdAct = el("td");
    tdAct.style.whiteSpace = "nowrap";
    var issue = el("button", "act act-line act-sm", "ออกรหัสรีเซ็ต");
    tdAct.appendChild(issue);

    // ผู้ดูแลระบบทั้งของตัวเองและคนอื่น ห้ามระงับหรือลบผ่านหน้านี้
    // ตัวกันจริงอยู่ที่ Worker ส่วนตรงนี้แค่ซ่อนปุ่มไม่ให้กดพลาด
    var isSelf = Session.user && Session.user.username === u.username;
    var blockBtn = null, delBtn = null;
    if (!u.isAdmin && !isSelf) {
      blockBtn = el("button", "act act-line act-sm", u.blocked ? "ปลดระงับ" : "ระงับการใช้งาน");
      blockBtn.style.marginLeft = "7px";
      tdAct.appendChild(blockBtn);

      delBtn = el("button", "act act-line act-sm", "ลบบัญชี");
      delBtn.style.cssText = "margin-left:7px;border-color:var(--rust);color:var(--rust)";
      tdAct.appendChild(delBtn);
    }
    tr.appendChild(tdAct);
    tb.appendChild(tr);

    // แถวผลลัพธ์ แทรกใต้แถวผู้ใช้คนนั้น จะได้รู้ชัดว่ารหัสเป็นของใคร
    var codeRow = el("tr");
    codeRow.hidden = true;
    var codeCell = el("td");
    codeCell.colSpan = 6;  // เท่ากับจำนวนคอลัมน์ในตาราง
    codeCell.style.background = "var(--canopy)";
    codeRow.appendChild(codeCell);
    tb.appendChild(codeRow);

    issue.onclick = async function () {
      issue.disabled = true;
      issue.textContent = "กำลังออกรหัส";
      codeCell.innerHTML = "";
      codeRow.hidden = false;
      try {
        var r = await api("/admin/reset", { method: "POST", body: { username: u.username } });

        var box = el("div");
        box.style.cssText = "padding:6px 2px";
        box.appendChild(el("div", "read-label", "รหัสสำหรับ " + u.name + " (" + u.username + ")"));

        var codeLine = el("div");
        codeLine.style.cssText = "display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0";
        var big = el("div", "num", r.code);
        big.style.cssText = "font-size:1.9rem;letter-spacing:.28em;font-weight:500;color:var(--deep)";
        codeLine.appendChild(big);
        var copy = el("button", "act act-line act-sm", "คัดลอกรหัส");
        copy.onclick = function () {
          navigator.clipboard.writeText(r.code).then(function () {
            copy.textContent = "คัดลอกแล้ว";
            setTimeout(function () { copy.textContent = "คัดลอกรหัส"; }, 1600);
          }).catch(function () { copy.textContent = "คัดลอกไม่ได้ ให้จดเอง"; });
        };
        codeLine.appendChild(copy);
        box.appendChild(codeLine);

        box.appendChild(el("div", "read-foot",
          "ใช้ได้ภายใน " + r.expiresInMinutes + " นาที และใช้ได้ครั้งเดียว " +
          "บอกผู้ใช้ให้ไปที่หน้าเข้าสู่ระบบ กดลืมรหัสผ่าน แล้วเลือก \"ไปกรอกรหัส\" " +
          "จากนั้นกรอกอีเมล " + r.email + " พร้อมรหัสนี้"));

        box.appendChild(el("div", "flash " + (r.mailed ? "flash-ok" : "flash-bad"),
          r.mailed
            ? "ส่งรหัสเข้าอีเมล " + r.email + " ให้อัตโนมัติแล้วด้วย"
            : "ยังไม่ได้ส่งอีเมล" + (r.mailError ? " (" + r.mailError + ")" : " เพราะยังไม่ได้ตั้งค่าบริการอีเมล") +
              " กรุณาส่งรหัสด้านบนให้ผู้ใช้ด้วยตนเอง"));

        codeCell.appendChild(box);
      } catch (err) {
        codeCell.appendChild(el("div", "flash flash-bad", "ออกรหัสไม่สำเร็จ: " + err.message));
      } finally {
        issue.disabled = false;
        issue.textContent = "ออกรหัสรีเซ็ต";
      }
    };

    // ── ระงับ / ปลดระงับ ──
    // เลือกให้ระงับเป็นการกระทำที่ย้อนกลับได้ ต่างจากการลบ
    // จึงยืนยันแค่ครั้งเดียวแบบธรรมดา ไม่ต้องพิมพ์ชื่อซ้ำ
    if (blockBtn) {
      blockBtn.onclick = async function () {
        var toBlock = !u.blocked;
        var q = toBlock
          ? "ระงับการใช้งานของ " + u.name + " (" + u.username + ")\n\n" +
            "ผู้ใช้จะเข้าระบบไม่ได้ทันที แต่ข้อมูลทั้งหมดยังอยู่ครบและปลดระงับคืนได้ทุกเมื่อ"
          : "ปลดระงับ " + u.name + " ให้กลับมาใช้งานได้ตามปกติ";
        if (!confirm(q)) return;

        blockBtn.disabled = true;
        blockBtn.textContent = "กำลังดำเนินการ";
        codeCell.innerHTML = "";
        codeRow.hidden = false;
        try {
          var r = await api("/admin/block", { method: "POST", body: { username: u.username, blocked: toBlock } });
          codeCell.appendChild(el("div", "flash flash-ok", r.message));
          u.blocked = r.blocked;
          blockBtn.textContent = u.blocked ? "ปลดระงับ" : "ระงับการใช้งาน";
          tdState.innerHTML = "";
          tdState.appendChild(el("span", u.blocked ? "tag-no" : "tag-yes", u.blocked ? "ถูกระงับ" : "ใช้งานได้"));
        } catch (err) {
          codeCell.appendChild(el("div", "flash flash-bad", "ดำเนินการไม่สำเร็จ: " + err.message));
          blockBtn.textContent = u.blocked ? "ปลดระงับ" : "ระงับการใช้งาน";
        } finally {
          blockBtn.disabled = false;
        }
      };
    }

    // ── ลบบัญชี ──
    // การลบย้อนกลับไม่ได้และไม่มีถังขยะ จึงบังคับให้พิมพ์ชื่อผู้ใช้ยืนยัน
    // การกด "ตกลง" อย่างเดียวกดพลาดได้ง่ายเกินไปสำหรับการกระทำระดับนี้
    if (delBtn) {
      delBtn.onclick = async function () {
        var typed = prompt(
          "ลบบัญชี " + u.name + " (" + u.username + ") ออกจากระบบถาวร\n\n" +
          "จะลบบันทึกทั้งหมด " + u.logCount + " รายการและภาพทั้งหมดไปด้วย กู้คืนไม่ได้\n" +
          "ถ้าแค่ต้องการห้ามเข้าใช้งานชั่วคราว ให้กดปุ่มระงับการใช้งานแทน\n\n" +
          "พิมพ์ชื่อผู้ใช้ \"" + u.username + "\" เพื่อยืนยัน");
        if (typed === null) return;
        if (typed.trim().toLowerCase() !== u.username) {
          alert("ชื่อผู้ใช้ที่พิมพ์ไม่ตรง ยกเลิกการลบแล้ว");
          return;
        }

        delBtn.disabled = true;
        delBtn.textContent = "กำลังลบ";
        codeCell.innerHTML = "";
        codeRow.hidden = false;
        try {
          var r = await api("/admin/delete", {
            method: "POST",
            body: { username: u.username, confirm: typed.trim().toLowerCase() }
          });
          // ลบแถวออกจากตารางเลย เพื่อไม่ให้เผลอกดปุ่มอื่นกับบัญชีที่ไม่มีอยู่แล้ว
          tr.remove();
          codeRow.hidden = false;
          codeCell.innerHTML = "";
          codeCell.appendChild(el("div", "flash flash-ok", r.message));
        } catch (err) {
          codeCell.appendChild(el("div", "flash flash-bad", "ลบไม่สำเร็จ: " + err.message));
          delBtn.disabled = false;
          delBtn.textContent = "ลบบัญชี";
        }
      };
    }
  });

  t.appendChild(tb);
  wrap.appendChild(t);
  host.appendChild(wrap);

  var note = el("p", "", "หน้านี้แสดงเฉพาะบัญชีที่มีสิทธิ์ผู้ดูแลระบบ ผู้ใช้ทั่วไปจะไม่เห็นเมนูนี้และเรียกใช้ไม่ได้แม้พิมพ์ที่อยู่ตรงๆ · การระงับย้อนกลับได้ทุกเมื่อและข้อมูลยังอยู่ครบ ส่วนการลบบัญชีจะลบบันทึกและภาพทั้งหมดถาวร กู้คืนไม่ได้ จึงควรใช้การระงับก่อนเสมอเมื่อยังไม่แน่ใจ · บัญชีผู้ดูแลระบบและบัญชีของตัวเองจะไม่มีปุ่มระงับและลบ");
  note.style.cssText = "font-size:.78rem;color:var(--ink-soft);margin:16px 0 0";
  host.appendChild(note);
};

// ─── ตัวสลับหน้า ────────────────────────────────
var here = "overview";

// เมนูบางหน้าแสดงเฉพาะผู้ดูแลระบบ
// นี่เป็นแค่การซ่อนเมนู ตัวกันจริงอยู่ที่ Worker ซึ่งตรวจสิทธิ์ทุกคำขอ
function visiblePages() {
  var admin = Session.user && Session.user.isAdmin;
  return PAGES.filter(function (p) { return !p.adminOnly || admin; });
}

function paintNav() {
  var nav = document.getElementById("railNav");
  nav.innerHTML = "";
  var lastGroup = null;
  visiblePages().forEach(function (p) {
    // ขึ้นหัวข้อกลุ่มใหม่เมื่อเปลี่ยนช่วง ทำให้เห็นลำดับงานโดยไม่ต้องอ่านคำอธิบาย
    if (p.group && p.group !== lastGroup) {
      nav.appendChild(el("div", "rail-group", p.group));
      lastGroup = p.group;
    }
    var b = el("button", "rail-item" + (p.id === here ? " on" : ""));
    b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + p.icon + '"/></svg>';
    b.appendChild(document.createTextNode(p.label));
    b.onclick = function () {
      open(p.id);
      document.getElementById("rail").classList.remove("open");
    };
    nav.appendChild(b);
  });
}

// ตัวจับเวลาของหน้าปัจจุบัน ต้องล้างทุกครั้งที่เปลี่ยนหน้า
// ไม่งั้นหน้าที่ปิดไปแล้วยังยิงคำขอเบื้องหลังต่อไปเรื่อยๆ
var pageTimers = [];
function onPageTimer(fn, ms) {
  pageTimers.push(setInterval(fn, ms));
}
function clearPageTimers() {
  pageTimers.forEach(clearInterval);
  pageTimers = [];
}

// เริ่มอนิเมชันใหม่ทุกครั้ง ต้องถอดคลาสออกแล้วบังคับให้เบราว์เซอร์คำนวณ layout ก่อน
// ไม่งั้นการใส่คลาสกลับทันทีจะถูกมองว่า "ไม่มีอะไรเปลี่ยน" แล้วอนิเมชันจะไม่เล่นซ้ำ
function replay(node, cls) {
  if (!node) return;
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
}

async function open(id) {
  here = id;
  clearPageTimers();
  var page = PAGES.find(function (p) { return p.id === id; });

  var title = document.getElementById("barTitle");
  var kicker = document.getElementById("barKicker");
  title.textContent = page.label;
  kicker.textContent = page.kicker;
  replay(title, "swap");
  replay(kicker, "swap");
  paintNav();

  var bar = document.getElementById("loadbar");
  if (bar) bar.classList.add("on");

  var root = document.getElementById("field");
  root.classList.remove("enter");
  root.innerHTML = "";
  try {
    await views[id](root);
    replay(root, "enter");
  } catch (err) {
    root.innerHTML = "";
    root.appendChild(stateBlock("!", "เปิดหน้านี้ไม่ได้", err.message + " — ลองรีเฟรชหน้าอีกครั้ง"));
    replay(root, "enter");
  } finally {
    // ปิดแถบเสมอ ไม่ว่าหน้าจะเปิดสำเร็จหรือพัง
    // ถ้าลืมปิดตอน error แถบจะวิ่งค้างตลอดไปจนผู้ใช้คิดว่าระบบแฮงก์
    if (bar) bar.classList.remove("on");
  }
}

// ─── หน้าจอเข้าสู่ระบบ ──────────────────────────
function showAuthScreen(message) {
  var existing = document.querySelector(".gate");
  if (existing) existing.remove();

  // login | register | forgot | reset
  var mode = "login";
  var resetEmail = "";   // จำอีเมลไว้ข้ามจากขั้นขอรหัสไปขั้นตั้งรหัสใหม่

  var gate = el("div", "gate");
  var card = el("div", "gate-card");

  var mark = el("div", "gate-mark");
  mark.innerHTML = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M12 21c0-6 0-9 0-11" stroke="#1B5E3A" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M12 10C12 6 9 3.5 5.5 3c-.4 3.8 2 7 6.5 7z" fill="#2E8B57"/>' +
    '<path d="M12 13c0-3.6 2.8-6 6-6.4.4 3.5-1.9 6.4-6 6.4z" fill="#6FBF73"/></svg>';
  mark.appendChild(document.createTextNode("SmartRice AI"));
  card.appendChild(mark);
  card.appendChild(el("div", "gate-sub", "Field diagnostics"));

  var title = el("h2", "gate-title");
  var note = el("div", "gate-note");
  card.appendChild(title);
  card.appendChild(note);

  var alertHost = el("div");
  card.appendChild(alertHost);
  if (message) alertHost.appendChild(el("div", "flash flash-bad", message));

  function fieldBox(label, id, type, hint, autocomplete, inputMode) {
    var d = el("div", "gate-field");
    d.appendChild(el("label", "", label));
    var i = el("input");
    i.id = id;
    i.type = type || "text";
    if (autocomplete) i.autocomplete = autocomplete;
    if (inputMode) i.inputMode = inputMode;
    d.appendChild(i);
    if (hint) d.appendChild(el("div", "gate-hint", hint));
    return d;
  }

  var nameBox  = fieldBox("ชื่อที่ใช้แสดง", "gaName", "text", "เช่น สมชาย ใจดี", "name");
  var idBox    = fieldBox("ชื่อผู้ใช้ หรืออีเมล", "gaId", "text", "", "username");
  var userBox  = fieldBox("ชื่อผู้ใช้", "gaUser", "text", "อังกฤษพิมพ์เล็ก ตัวเลข หรือขีดล่าง 3-20 ตัว", "username");
  var mailBox  = fieldBox("อีเมล", "gaMail", "email", "ใช้สำหรับกู้คืนรหัสผ่าน ต้องเป็นอีเมลที่เปิดอ่านได้จริง", "email");
  var passBox  = fieldBox("รหัสผ่าน", "gaPass", "password", "อย่างน้อย 8 ตัวอักษร", "current-password");
  var codeBox  = fieldBox("รหัส 6 หลักจากอีเมล", "gaCode", "text", "ตรวจโฟลเดอร์สแปมด้วยถ้าไม่เห็นในกล่องหลัก", "one-time-code", "numeric");
  var newPass  = fieldBox("รหัสผ่านใหม่", "gaNew", "password", "อย่างน้อย 8 ตัวอักษร", "new-password");

  [nameBox, idBox, userBox, mailBox, passBox, codeBox, newPass].forEach(function (b) { card.appendChild(b); });

  var go = el("button", "act act-go act-wide");
  go.style.marginTop = "6px";
  card.appendChild(go);

  var linkRow = el("div", "gate-swap");
  card.appendChild(linkRow);

  card.appendChild(el("div", "gate-foot",
    "ภาพถ่ายทั้งหมดประมวลผลในเบราว์เซอร์ของคุณเอง ไม่ถูกส่งขึ้นเซิร์ฟเวอร์ " +
    "ส่วนบันทึกสำรวจจะเก็บไว้ในบัญชีของคุณเพื่อให้เปิดดูข้ามเครื่องได้"));

  function linkTo(label, target) {
    var b = el("button", "", label);
    b.onclick = function () { mode = target; paint(); };
    return b;
  }

  var LABELS = {
    login:    "เข้าสู่ระบบ",
    register: "สร้างบัญชี",
    forgot:   "ส่งรหัสไปที่อีเมล",
    reset:    "ตั้งรหัสผ่านใหม่"
  };

  function paint() {
    alertHost.innerHTML = "";
    linkRow.innerHTML = "";

    var show = {
      login:    { idBox: 1, passBox: 1 },
      register: { nameBox: 1, userBox: 1, mailBox: 1, passBox: 1 },
      forgot:   { mailBox: 1 },
      reset:    { mailBox: 1, codeBox: 1, newPass: 1 }
    }[mode];

    var boxes = { nameBox: nameBox, idBox: idBox, userBox: userBox,
                  mailBox: mailBox, passBox: passBox, codeBox: codeBox, newPass: newPass };
    Object.keys(boxes).forEach(function (k) { boxes[k].hidden = !show[k]; });

    if (mode === "login") {
      title.textContent = "เข้าสู่ระบบ";
      note.textContent = "กรอกชื่อผู้ใช้หรืออีเมล พร้อมรหัสผ่าน เพื่อเปิดบันทึกแปลงของคุณ";
      document.getElementById("gaPass").autocomplete = "current-password";
      linkRow.appendChild(document.createTextNode("ยังไม่มีบัญชี "));
      linkRow.appendChild(linkTo("สร้างบัญชีใหม่", "register"));
      linkRow.appendChild(el("div", "", ""));
      var fb = linkTo("ลืมรหัสผ่าน", "forgot");
      fb.style.marginTop = "6px";
      linkRow.appendChild(fb);
    } else if (mode === "register") {
      title.textContent = "สร้างบัญชีใหม่";
      note.textContent = "บัญชีนี้ใช้เก็บบันทึกแปลงของคุณโดยเฉพาะ ผู้ใช้คนอื่นจะไม่เห็นข้อมูลของคุณ";
      document.getElementById("gaPass").autocomplete = "new-password";
      linkRow.appendChild(document.createTextNode("มีบัญชีอยู่แล้ว "));
      linkRow.appendChild(linkTo("เข้าสู่ระบบ", "login"));
    } else if (mode === "forgot") {
      title.textContent = "ลืมรหัสผ่าน";
      note.textContent = "กรอกอีเมลที่ใช้สมัคร ระบบจะส่งรหัส 6 หลักไปให้เพื่อตั้งรหัสผ่านใหม่";
      linkRow.appendChild(document.createTextNode("ได้รหัสแล้ว "));
      linkRow.appendChild(linkTo("ไปกรอกรหัส", "reset"));
      linkRow.appendChild(el("div", "", ""));
      var bk = linkTo("กลับไปเข้าสู่ระบบ", "login");
      bk.style.marginTop = "6px";
      linkRow.appendChild(bk);
    } else {
      title.textContent = "ตั้งรหัสผ่านใหม่";
      note.textContent = "กรอกรหัส 6 หลักที่ได้รับทางอีเมล พร้อมรหัสผ่านใหม่ที่ต้องการ";
      if (resetEmail) document.getElementById("gaMail").value = resetEmail;
      linkRow.appendChild(document.createTextNode("ยังไม่ได้รับรหัส "));
      linkRow.appendChild(linkTo("ขอรหัสใหม่", "forgot"));
    }

    go.textContent = LABELS[mode];
    go.disabled = false;
  }

  async function callAuth(path, body) {
    var res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || "ดำเนินการไม่สำเร็จ");
    return data;
  }

  function enterApp(data) {
    Session.save(data.token, data.user);
    Store.reset();
    gate.remove();
    startApp();
  }

  async function submit() {
    var val = function (id) { return (document.getElementById(id).value || "").trim(); };
    alertHost.innerHTML = "";
    go.disabled = true;
    go.textContent = "กำลังดำเนินการ";

    try {
      if (mode === "login") {
        if (!val("gaId") || !document.getElementById("gaPass").value) {
          throw new Error("กรุณากรอกให้ครบทั้งสองช่อง");
        }
        enterApp(await callAuth("/auth/login", {
          username: val("gaId"),
          password: document.getElementById("gaPass").value
        }));

      } else if (mode === "register") {
        var newUser = val("gaUser").toLowerCase();
        if (!val("gaName") || !newUser || !val("gaMail") ||
            !document.getElementById("gaPass").value) {
          throw new Error("กรุณากรอกข้อมูลให้ครบทุกช่อง");
        }

        await callAuth("/auth/register", {
          username: newUser,
          email: val("gaMail").toLowerCase(),
          password: document.getElementById("gaPass").value,
          name: val("gaName")
        });

        // ไม่เรียก enterApp() โดยตั้งใจ — สมัครเสร็จให้กลับไปล็อกอินเอง
        // paint() ล้าง alertHost บรรทัดแรก จึงต้องแจ้งผลหลัง paint() เสมอ
        mode = "login";
        paint();
        document.getElementById("gaId").value = newUser;
        document.getElementById("gaPass").value = "";
        alertHost.appendChild(el("div", "flash flash-ok",
          "สร้างบัญชี " + newUser + " เรียบร้อยแล้ว กรุณาเข้าสู่ระบบด้วยรหัสผ่านที่เพิ่งตั้งไว้"));
        document.getElementById("gaPass").focus();
        return;

      } else if (mode === "forgot") {
        if (!val("gaMail")) throw new Error("กรุณากรอกอีเมล");
        var r = await callAuth("/auth/forgot", { email: val("gaMail").toLowerCase() });
        resetEmail = val("gaMail").toLowerCase();
        mode = "reset";
        paint();
        // แยกข้อความชัดเจนระหว่างส่งอีเมลได้กับส่งไม่ได้
        // ถ้าส่งไม่ได้ต้องบอกทางออกทันที ไม่ปล่อยให้นั่งรอรหัสที่ไม่มีวันมา
        alertHost.appendChild(el("div",
          "flash " + (r.emailSent === false ? "flash-bad" : "flash-ok"),
          r.message || "ส่งรหัสไปที่อีเมลแล้ว"));
        document.getElementById("gaCode").focus();

      } else {
        enterApp(await callAuth("/auth/reset", {
          email: val("gaMail").toLowerCase(),
          code: val("gaCode"),
          password: document.getElementById("gaNew").value
        }));
      }
    } catch (err) {
      alertHost.appendChild(el("div", "flash flash-bad", err.message));
      go.disabled = false;
      go.textContent = LABELS[mode];
    }
  }

  go.onclick = submit;
  card.querySelectorAll("input").forEach(function (i) {
    i.onkeydown = function (e) { if (e.key === "Enter") submit(); };
  });

  gate.appendChild(card);
  document.body.appendChild(gate);
  paint();
  document.getElementById("gaId").focus();
}


// ─── เริ่มระบบ ─────────────────────────────────
function paintWho() {
  var p = Store.profile();
  document.getElementById("whoName").textContent = p.name;
  document.getElementById("whoBadge").textContent = (p.name || "ผ").charAt(0);
}

document.getElementById("railToggle").onclick = function () {
  document.getElementById("rail").classList.toggle("open");
};
document.getElementById("seekInput").oninput = function () {
  if (here === "ledger") open("ledger");
};
document.getElementById("signOut").onclick = async function () {
  if (!confirm("ออกจากระบบตอนนี้ ยืนยันหรือไม่")) return;
  try { await api("/auth/logout", { method: "POST" }); } catch (e) { /* ออกจากระบบฝั่งเครื่องได้อยู่ดี */ }
  Session.clear();
  Store.reset();
  showAuthScreen(null);
};

function startApp() {
  paintWho();
  markBrain();
  open("overview");
}

// ตรวจ token ที่เก็บไว้ก่อน ถ้ายังใช้ได้ก็เข้าแอปเลย ไม่ต้องล็อกอินซ้ำ
(async function boot() {
  if (!Session.token) { showAuthScreen(null); return; }
  try {
    var data = await api("/auth/me");
    Session.user = data.user;
    startApp();
  } catch (err) {
    // token หมดอายุหรือใช้ไม่ได้ ฟังก์ชัน api จะเรียกหน้าล็อกอินให้เองแล้ว
    // ที่เหลือคือกรณีเน็ตล่มตั้งแต่เปิดเว็บ ต้องบอกให้ชัดว่าเกิดอะไร
    if (!document.querySelector(".gate")) {
      showAuthScreen("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: " + err.message);
    }
  }
})();

})();
