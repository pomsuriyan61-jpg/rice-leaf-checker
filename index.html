// ─── สิทธิ์การเข้าใช้ ───────────────────────────
// เก็บ token ไว้ใน localStorage เพื่อไม่ต้องล็อกอินซ้ำทุกครั้งที่เปิดเว็บ
// ข้อจำกัดที่ต้องรู้: ถ้าเว็บถูกเจาะด้วย XSS token ก็หลุดได้
// เหมาะกับการใช้งานในวงจำกัด ถ้าขยายเป็นสาธารณะควรย้ายไปใช้ auth provider เต็มรูปแบบ
var Session = {
  token: localStorage.getItem("smartrice-token") || null,
  user: null,

  save: function (token, user) {
    this.token = token;
    this.user = user;
    localStorage.setItem("smartrice-token", token);
  },

  clear: function () {
    this.token = null;
    this.user = null;
    localStorage.removeItem("smartrice-token");
  },

  headers: function (extra) {
    var h = extra || {};
    if (this.token) h["Authorization"] = "Bearer " + this.token;
    return h;
  }
};

// เรียก API พร้อมแนบ token ให้อัตโนมัติ
// ถ้าเซิร์ฟเวอร์ตอบว่า token ใช้ไม่ได้ จะเด้งกลับหน้าล็อกอินทันที
// ไม่ปล่อยให้ผู้ใช้เจอหน้าเปล่าโดยไม่รู้สาเหตุ
async function api(path, options) {
  options = options || {};
  var init = {
    method: options.method || "GET",
    headers: Session.headers(options.body ? { "Content-Type": "application/json" } : {})
  };
  if (options.body) init.body = JSON.stringify(options.body);

  // ตัดสายเมื่อรอเกิน 20 วินาที
  //
  // ถ้าไม่มีตัวนี้ เน็ตที่ค้างครึ่งๆ กลางๆ (สัญญาณอ่อนกลางนา หรือเซิร์ฟเวอร์ไม่ตอบ)
  // จะทำให้ await รอไปไม่มีที่สิ้นสุด ตอนเปิดเว็บครั้งแรก boot() จะค้างที่ /auth/me
  // ผู้ใช้เห็นหน้าเปล่าที่มีแต่โครง ไม่ขึ้น error ไม่เด้งหน้าล็อกอิน ทำอะไรต่อไม่ได้เลย
  // 20 วินาทีเผื่อไว้สำหรับคำขอที่ต้องรอ AI ตอบ ซึ่งนานกว่าคำขอทั่วไปมาก
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 20000);
  init.signal = ctrl.signal;

  var res;
  try {
    res = await fetch(API_BASE + path, init);
  } catch (err) {
    // แยกสองกรณีให้ชัด เพราะผู้ใช้ต้องทำคนละอย่าง
    // หมดเวลา = เซิร์ฟเวอร์รับสายแต่ไม่ตอบ รอสักครู่แล้วลองใหม่
    // ต่อไม่ได้ = ยิงไปไม่ถึงเลย ให้ไปดูสัญญาณเน็ตก่อน
    if (err.name === "AbortError") {
      throw new Error("เซิร์ฟเวอร์ไม่ตอบสนอง (รอเกิน 20 วินาที) ลองใหม่อีกครั้ง");
    }
    throw new Error("ต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบสัญญาณอินเทอร์เน็ตแล้วลองใหม่");
  } finally {
    clearTimeout(timer);
  }

  var data = null;
  try { data = await res.json(); } catch (e) { data = {}; }

  if (res.status === 401 && data.needLogin) {
    Session.clear();
    showAuthScreen("หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่");
    throw new Error("หมดเวลาใช้งาน");
  }
  if (!res.ok) throw new Error(data.error || "คำขอไม่สำเร็จ (HTTP " + res.status + ")");
  return data;
}

// แปลงข้อความผิดพลาดให้ผู้ใช้อ่านรู้เรื่อง
//
// ทำไมต้องมีทั้งที่ Worker ส่งข้อความไทยมาให้แล้ว: หน้าเว็บกับ Worker
// อัปเดตคนละเวลา ถ้าผู้ใช้เปิดเว็บใหม่แต่ Worker ยังเป็นเวอร์ชันเก่า
// จะได้ JSON ดิบจาก Google โผล่เต็มหน้าจอเหมือนเดิม ตัวนี้เป็นตาข่ายรองรับชั้นสุดท้าย
//
// หลักการ: ถ้าเจอร่องรอยของข้อความดิบจากระบบ ให้แทนที่ด้วยคำอธิบายที่ทำอะไรต่อได้
// ไม่ใช่แค่ตัดให้สั้นลง เพราะข้อความสั้นที่อ่านไม่รู้เรื่องก็ยังไร้ประโยชน์เท่าเดิม
function friendlyError(msg) {
  var raw = String(msg || "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ");

  // limit: 0 คือบัญชีไม่ได้รับโควตาตั้งแต่ต้น คนละเรื่องกับใช้จนหมด
  if (/limit:\s*0\b/.test(raw)) {
    return "บัญชี AI ที่ตั้งค่าไว้ยังไม่ได้รับโควตาใช้งาน กรุณาแจ้งผู้ดูแลระบบให้ตรวจสอบคีย์ " +
           "ระหว่างนี้การตรวจโรคจากภาพยังใช้ได้ตามปกติ เพราะทำงานในเครื่องของคุณเอง";
  }
  // 503 = ฝั่ง Google คนใช้พร้อมกันเยอะจนคิวเต็ม ไม่ใช่ความผิดของระบบเราหรือคีย์
  // ต้องดักก่อนเงื่อนไข JSON ด้านล่าง ไม่งั้นจะตกไปเป็นข้อความ "เชื่อมต่อไม่ได้"
  // ซึ่งทำให้ผู้ดูแลระบบไล่หาสาเหตุผิดทางไปหลายชั่วโมง
  if (/\b50[0-3]\b|overload|UNAVAILABLE|INTERNAL/i.test(raw)) {
    return "ตอนนี้ระบบ AI ของ Google มีคนใช้พร้อมกันจำนวนมาก ลองกดถามอีกครั้งในอีกสักครู่ " +
           "ส่วนการตรวจโรคจากภาพยังใช้ได้ตามปกติ เพราะทำงานในเครื่องของคุณเอง";
  }
  if (/429|RESOURCE_EXHAUSTED|quota/i.test(raw)) {
    var m = /retry in ([\d.]+)s/i.exec(raw);
    return "ตอนนี้มีผู้ใช้ AI พร้อมกันจำนวนมาก" +
           (m ? " กรุณาลองใหม่ในอีกประมาณ " + Math.ceil(parseFloat(m[1])) + " วินาที" : " กรุณาลองใหม่ในอีกสักครู่") +
           " ส่วนการตรวจโรคจากภาพยังใช้ได้ตามปกติ";
  }
  // JSON ดิบหรือข้อความยาวผิดปกติ = ข้อความสำหรับนักพัฒนา ไม่ใช่สำหรับผู้ใช้
  if (raw.indexOf("{") !== -1 || raw.length > 180) {
    console.warn("[AI] ข้อความผิดพลาดดิบ:", raw);
    return "ตอนนี้เชื่อมต่อบริการ AI ไม่ได้ กรุณาลองใหม่อีกครั้ง ถ้ายังไม่ได้ให้แจ้งผู้ดูแลระบบ";
  }
  return raw;
}

// ─── ชั้นข้อมูล ────────────────────────────────
// รวมการอ่าน/เขียนไว้ที่เดียว หน้าอื่นเรียกผ่าน Store เท่านั้น
// ย้ายไป backend อื่นภายหลังแก้แค่ในนี้ ไม่ต้องแตะโค้ดหน้าเว็บ
var Store = {
  _cache: null,
  _offline: false,

  async list() {
    if (this._cache) return this._cache;
    try {
      this._cache = await api("/field-logs");
      this._offline = false;
    } catch (err) {
      if (/หมดเวลา/.test(err.message)) throw err;
      // เน็ตหลุดหรือเซิร์ฟเวอร์ล่ม ยังใช้งานต่อได้ด้วยสำเนาในเครื่อง
      // แยกสำเนาตามชื่อผู้ใช้ ไม่ให้ข้อมูลคนละบัญชีปนกันบนเครื่องเดียว
      this._offline = true;
      this._cache = JSON.parse(localStorage.getItem(this._localKey()) || "[]");
    }
    markLink();
    return this._cache;
  },

  _localKey() {
    return "smartrice-logs:" + (Session.user ? Session.user.username : "guest");
  },

  async add(entry) {
    // ติดรหัสแปลงที่นี่ที่เดียว ทุกหน้าที่บันทึกจึงไม่ต้องจำใส่เอง
    // ถ้าปล่อยให้แต่ละหน้าใส่เอง วันหนึ่งจะมีหน้าที่ลืม แล้วบันทึกนั้นจะไปโผล่ผิดแปลง
    if (entry && !entry.plot) entry.plot = Plots.activeId();
    try {
      var saved = await api("/field-logs", { method: "POST", body: entry });
      this._cache = this._cache ? [saved].concat(this._cache) : [saved];
      this._offline = false;
      markLink();
      return saved;
    } catch (err) {
      if (/หมดเวลา/.test(err.message)) throw err;
      this._offline = true;
      delete entry.image;   // ไม่เก็บภาพลง localStorage จะเต็มโควตาเบราว์เซอร์เร็วมาก
      entry.id = Date.now().toString(36);
      entry.created_at = new Date().toISOString();
      entry.hasImage = false;
      entry.verify = null;
      var local = JSON.parse(localStorage.getItem(this._localKey()) || "[]");
      local.unshift(entry);
      try {
        localStorage.setItem(this._localKey(), JSON.stringify(local.slice(0, 200)));
      } catch (e) { /* พื้นที่เต็ม ข้ามการเก็บสำเนา ผลตรวจยังแสดงบนหน้าจอได้ */ }
      this._cache = this._cache ? [entry].concat(this._cache) : [entry];
      markLink();
      return entry;
    }
  },

  isOffline() { return this._offline; },

  // บันทึกผลยืนยันว่า AI ทายถูกหรือผิด ต้องออนไลน์เพราะแก้ข้อมูลที่เซิร์ฟเวอร์
  async verify(id, correct, actual) {
    var updated = await api("/field-logs/" + id, {
      method: "PATCH",
      body: { correct: correct, actual: actual || null }
    });
    if (this._cache) {
      var i = this._cache.findIndex(function (l) { return l.id === id; });
      if (i !== -1) this._cache[i] = updated;
    }
    return updated;
  },

  async remove(id) {
    await api("/field-logs/" + id, { method: "DELETE" });
    if (this._cache) {
      this._cache = this._cache.filter(function (l) { return l.id !== id; });
    }
  },

  async imageOf(id) {
    return await api("/images/" + id);
  },

  // opts.search = true เพื่อให้ AI ค้นข้อมูลจากเว็บประกอบการตอบ
  // ไม่เปิดตลอดเพราะตอนวิเคราะห์ภาพเราต้องการให้ยึดผลจากโมเดลกับฐานความรู้ในระบบ
  // ถ้าเปิดค้นเว็บด้วย AI มักไปหยิบบทความทั่วไปที่อาจมีชื่อสารเคมีไม่ตรงกับกรมการข้าว
  async askGemini(prompt, image, opts) {
    var body = { prompt: prompt };
    if (image) body.image = image;
    if (opts && opts.search) body.search = true;

    // Gemini ตอบ 503 "The model is overloaded" เป็นระยะเมื่อมีคนใช้พร้อมกันเยอะ
    // เป็นอาการชั่วคราวล้วนๆ ยิงซ้ำอีกครั้งมักผ่าน จึงลองเองก่อนสูงสุด 3 ครั้ง
    // แทนที่จะโยนข้อความผิดพลาดใส่หน้าผู้ใช้ตั้งแต่ครั้งแรก
    //
    // เว้นระยะถ่างขึ้นเรื่อยๆ (1.2 วิ แล้ว 3 วิ) ไม่ยิงรัวติดกัน
    // เพราะตอนเซิร์ฟเวอร์ปลายทางล้น การยิงถี่ยิ่งทำให้ถูกปฏิเสธซ้ำ
    //
    // ลองซ้ำเฉพาะ error ชั่วคราวเท่านั้น ห้ามลองซ้ำกรณีคีย์ผิดหรือโควตาหมด
    // เพราะยิงกี่รอบก็ไม่ผ่าน มีแต่ทำให้ผู้ใช้รอนานขึ้นเปล่าๆ
    var data = null;
    var waits = [1200, 3000];
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        data = await api("/gemini", { method: "POST", body: body });
        break;
      } catch (err) {
        var temporary = /\b50[0-3]\b|overload|UNAVAILABLE|INTERNAL|ไม่ตอบสนอง/i.test(err.message);
        if (!temporary || attempt === 2) throw err;
        await new Promise(function (resolve) { setTimeout(resolve, waits[attempt]); });
      }
    }

    // Worker เวอร์ชันเก่าไม่ส่ง imageReceived กลับมา ถือว่าภาพไม่ถึง Gemini
    return {
      text: data.text,
      sawImage: data.imageReceived === true,
      searchUsed: data.searchUsed === true,
      sources: data.sources || []
    };
  },

  // โปรไฟล์มาจากบัญชีที่ล็อกอิน ไม่ใช่ localStorage แล้ว
  // ข้อมูลจึงตามผู้ใช้ไปทุกเครื่อง
  profile() {
    return Session.user || { name: "ผู้ใช้", farm: "", phone: "" };
  },

  async saveProfile(p) {
    var data = await api("/auth/me", { method: "PATCH", body: p });
    Session.user = data.user;
    return data.user;
  },

  reset() {
    this._cache = null;
    this._offline = false;
  }
};


function markLink() {
  var dot = document.getElementById("linkDot"), txt = document.getElementById("linkText");
  if (!dot) return;
  var off = Store.isOffline();
  dot.className = "dot " + (off ? "down" : "live");
  txt.textContent = off ? "ออฟไลน์ เก็บในเครื่อง" : "ต่อระบบได้แล้ว";
}

// ─── โมเดล AI (คุยผ่าน iframe แยก) ──────────────
var models = {
  rice:    { frame: document.getElementById("riceFrame"),    ready: false, props: null },
  disease: { frame: document.getElementById("diseaseFrame"), ready: false, props: null }
};
var waiting = {};
var seq = 0;

window.addEventListener("message", function (e) {
  var msg = e.data;
  if (!msg || !msg.type) return;
  var which = e.source === models.rice.frame.contentWindow ? "rice"
            : e.source === models.disease.frame.contentWindow ? "disease" : null;
  if (!which) return;

  if (msg.type === "ready") {
    models[which].ready = true;
    models[which].props = msg.properties;
    models[which].project = msg.project;
    // เช็คตั้งแต่ตอนโหลดว่าทุกคลาสของโมเดลมีข้อมูลแนวทางแก้ไขครบไหม
    // ถ้าขาดจะเตือนใน console ทันที ดีกว่าไปรู้ตอนสาธิตแล้วการ์ดไม่ขึ้น
    if (which === "disease" && typeof window.auditDiseaseLabels === "function") {
      console.info("[โมเดลโรค] คลาสที่โมเดลส่งได้:", (msg.properties && msg.properties.labels) || []);
      window.auditDiseaseLabels((msg.properties && msg.properties.labels) || []);
    }
    markBrain();
  } else if (msg.type === "init-error") {
    models[which].error = msg.message;
    markBrain();
  } else if (msg.type === "result" && waiting[msg.requestId]) {
    waiting[msg.requestId].resolve(msg.result);
    delete waiting[msg.requestId];
  } else if (msg.type === "error" && waiting[msg.requestId]) {
    waiting[msg.requestId].reject(new Error(msg.message));
    delete waiting[msg.requestId];
  }
});

function classify(which, features) {
  return new Promise(function (resolve, reject) {
    var id = ++seq;
    waiting[id] = { resolve: resolve, reject: reject };
    models[which].frame.contentWindow.postMessage({ type: "classify", requestId: id, features: features }, "*");
    setTimeout(function () {
      if (waiting[id]) { delete waiting[id]; reject(new Error("ตรวจนานผิดปกติ ลองกดใหม่อีกครั้ง")); }
    }, 30000);
  });
}

function brainReady() { return models.rice.ready && models.disease.ready; }

// ไฟล์โมเดลมีขนาดหลายสิบเมกะไบต์ ครั้งแรกที่เปิดเว็บบนเน็ตมือถือจึงอาจใช้เวลานาน
// ถ้าไม่บอกอะไรเลยผู้ใช้จะคิดว่าเว็บค้างแล้วปิดทิ้ง ทั้งที่กำลังโหลดอยู่
// ตัวจับเวลานี้จึงเปลี่ยนข้อความหลังผ่านไประยะหนึ่ง เพื่ออธิบายว่าเกิดอะไรขึ้น
var brainStart = Date.now();
function loadPhase() {
  var sec = (Date.now() - brainStart) / 1000;
  if (sec < 12) return "กำลังเตรียมตัวตรวจรูป";
  if (sec < 45) return "กำลังโหลดตัวตรวจรูป ครั้งแรกช้าหน่อย รอสักครู่";
  return "เน็ตช้า ยังโหลดตัวตรวจรูปไม่เสร็จ ครั้งหน้าจะเร็วขึ้นเพราะเครื่องเก็บไว้ให้แล้ว";
}

function markBrain() {
  var dot = document.getElementById("brainDot"), txt = document.getElementById("brainText");
  if (dot) {
    if (models.rice.error || models.disease.error) {
      dot.className = "dot down"; txt.textContent = "โหลดตัวตรวจรูปไม่สำเร็จ";
    } else if (brainReady()) {
      dot.className = "dot live"; txt.textContent = "ตัวตรวจรูปพร้อมใช้แล้ว";
    } else {
      dot.className = "dot"; txt.textContent = loadPhase();
    }
  }
  document.querySelectorAll("[data-needs-brain]").forEach(function (btn) {
    if (models.rice.error || models.disease.error) {
      btn.textContent = "โหลดตัวตรวจรูปไม่สำเร็จ"; btn.disabled = true;
    } else if (brainReady()) {
      btn.textContent = btn.dataset.readyLabel || "วิเคราะห์ภาพ";
      btn.disabled = !btn.dataset.armed;
    } else {
      btn.textContent = "กำลังเตรียมตัวตรวจรูป"; btn.disabled = true;
    }
  });

  // ระหว่างที่ยังโหลดไม่เสร็จ ให้อัปเดตข้อความเองทุก 5 วินาที
  // เพราะไม่มีอีเวนต์อะไรมากระตุ้น markBrain ในช่วงนี้
  if (!brainReady() && !models.rice.error && !models.disease.error) {
    clearTimeout(markBrain._t);
    markBrain._t = setTimeout(markBrain, 5000);
  } else {
    clearTimeout(markBrain._t);
  }
}

function inputSize(props) {
  return {
    w: (props && props.image_input_width) || 96,
    h: (props && props.image_input_height) || 96
  };
}

function extractFeatures(img, w, h) {
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  var ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  var d = ctx.getImageData(0, 0, w, h).data;
  var f = new Array(w * h);
  for (var i = 0, p = 0; i < d.length; i += 4, p++) f[p] = (d[i] << 16) + (d[i+1] << 8) + d[i+2];
  return f;
}

// ย่อรูปก่อนส่งให้ Gemini — รูปจากมือถือมักหลาย MB ส่งดิบจะช้าและเปลือง token
function imageToBase64(img, maxSide) {
  maxSide = maxSide || 800;
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  var scale = Math.min(1, maxSide / Math.max(w, h));
  var c = document.createElement("canvas");
  c.width = Math.round(w * scale);
  c.height = Math.round(h * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { data: c.toDataURL("image/jpeg", 0.85).split(",")[1], mimeType: "image/jpeg" };
}

// ─── ด่านกรองสี/พื้นผิวก่อนเข้าโมเดล ────────────
// โมเดลถูกฝึกให้ต้องเลือกคำตอบเสมอ ภาพที่ไม่ใช่พืชจึงได้คำตอบมั่วแต่มั่นใจสูง
// ด่านนี้ตัดภาพแบบนั้นทิ้งก่อนถึงโมเดล
function preCheck(img) {
  var SIZE = 64;
  var c = document.createElement("canvas");
  c.width = SIZE; c.height = SIZE;
  var ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, SIZE, SIZE);
  var d = ctx.getImageData(0, 0, SIZE, SIZE).data;

  var gray = new Float32Array(SIZE * SIZE);
  for (var p = 0; p < SIZE * SIZE; p++) {
    var i = p * 4;
    gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }

  var mid = (SIZE - 1) / 2, maxDist = Math.sqrt(2) * mid, EDGE_NORM = 900;
  var colorW = 0, edgeW = 0, wSum = 0, green = 0, yellow = 0, other = 0, total = 0;

  for (var y = 1; y < SIZE - 1; y++) {
    for (var x = 1; x < SIZE - 1; x++) {
      var k = (y * SIZE + x) * 4;
      var hsl = rgbToHsl(d[k], d[k+1], d[k+2]);
      var isGreen = hsl.h >= 60 && hsl.h <= 170;
      var isYB = hsl.h >= 20 && hsl.h < 60;
      var vivid = hsl.s > 0.12 && hsl.l > 0.08 && hsl.l < 0.9;
      total++;
      if (isGreen && vivid) green++;
      else if (isYB && vivid) yellow++;
      else other++;

      var gx = -gray[(y-1)*SIZE+(x-1)] + gray[(y-1)*SIZE+(x+1)]
             - 2*gray[y*SIZE+(x-1)] + 2*gray[y*SIZE+(x+1)]
             - gray[(y+1)*SIZE+(x-1)] + gray[(y+1)*SIZE+(x+1)];
      var gy = -gray[(y-1)*SIZE+(x-1)] - 2*gray[(y-1)*SIZE+x] - gray[(y-1)*SIZE+(x+1)]
             + gray[(y+1)*SIZE+(x-1)] + 2*gray[(y+1)*SIZE+x] + gray[(y+1)*SIZE+(x+1)];
      var edge = Math.min(Math.sqrt(gx*gx + gy*gy) / EDGE_NORM, 1);

      var dist = Math.sqrt((x-mid)*(x-mid) + (y-mid)*(y-mid)) / maxDist;
      var w = 1 - 0.6 * dist;   // กลางภาพมีน้ำหนักกว่าขอบ เพราะวัตถุหลักมักอยู่กลางเฟรม
      colorW += ((isGreen || isYB) && vivid ? 1 : 0) * w;
      edgeW += edge * w;
      wSum += w;
    }
  }

  var colorScore = colorW / wSum, edgeScore = edgeW / wSum;
  var texture = 0.5 + 0.5 * Math.min(edgeScore / 0.08, 1);
  var plant = colorScore * texture;
  if (edgeScore < 0.015) plant = Math.min(plant, 0.3);  // ผิวเรียบสนิทไม่ใช่ใบไม้จริง

  var greenPct = green / total * 100;
  var GREEN_MIN = 15;   // ใบข้าวจริงต้องมีเขียวเหลืออยู่บ้าง แม้ป่วยหนัก

  return {
    skip: greenPct < GREEN_MIN || plant < 0.18,
    why: greenPct < GREEN_MIN
      ? "ภาพนี้มีสีเขียวเพียง " + Math.round(greenPct) + "% ซึ่งน้อยกว่าใบข้าวทั่วไปมาก เลยยังไม่ส่งไปตรวจต่อ"
      : "รูปนี้ผิวไม่เหมือนใบไม้ เลยยังไม่ส่งไปตรวจต่อ",
    green: Math.round(greenPct),
    yellow: Math.round(yellow / total * 100),
    other: Math.round(other / total * 100)
  };
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2, h = 0, s = 0, dd = max-min;
  if (dd !== 0) {
    s = dd / (1 - Math.abs(2*l - 1));
    if (max === r) h = 60 * (((g-b)/dd) % 6);
    else if (max === g) h = 60 * ((b-r)/dd + 2);
    else h = 60 * ((r-g)/dd + 4);
  }
  if (h < 0) h += 360;
  return { h: h, s: s, l: l };
}

// ตรวจครบ 2 ขั้น: เป็นข้าวไหม → ถ้าใช่ ตรวจโรคต่อ
async function runFullAnalysis(img) {
  var pre = preCheck(img);
  var out = { pre: pre, rice: null, disease: null, topDisease: null, isRice: false, gated: false };

  if (pre.skip) {
    var labels = (models.rice.props && models.rice.props.labels) || ["Rice", "not Rice"];
    var neg = labels.find(function (l) { return /not|non|other|ไม่ใช่/i.test(l); }) || labels[labels.length-1];
    out.rice = { results: labels.map(function (l) { return { label: l, value: l === neg ? 1 : 0 }; }) };
    out.gated = true;
    return out;
  }

  var rs = inputSize(models.rice.props);
  out.rice = await classify("rice", extractFeatures(img, rs.w, rs.h));

  var ranked = out.rice.results.slice().sort(function (a,b) { return b.value - a.value; });
  out.isRice = ranked[0] && !/not|non|other|ไม่ใช่/i.test(ranked[0].label);

  if (out.isRice && models.disease.ready) {
    var ds = inputSize(models.disease.props);
    out.disease = await classify("disease", extractFeatures(img, ds.w, ds.h));
    out.topDisease = out.disease.results.slice().sort(function (a,b) { return b.value - a.value; })[0];
  }
  return out;
}

// คะแนนสุขภาพ: ใบปกติได้เกือบเต็ม ใบป่วยหักตามความมั่นใจของโมเดล
//
// ── แก้ไข 2026-08: ภาพที่ไม่ใช่ใบข้าวต้องไม่มีคะแนน ไม่ใช่ได้ 99 ──
//
// ของเดิมคืน 99 ให้ภาพที่ไม่ใช่ใบข้าว ซึ่งเป็นคะแนนสูงสุดในทั้งระบบ
// สูงกว่าใบข้าวที่แข็งแรงจริง (95) ด้วยซ้ำ ถ่ายอะไรก็ได้ที่ไม่ใช่ข้าวเข้าไป
// ระบบจะบอกว่าแปลงสมบูรณ์ที่สุด ซึ่งตรงข้ามกับความจริงโดยสิ้นเชิง
//
// และความเสียหายไม่ได้จบที่ตัวเลขบนหน้าจอ คะแนนนี้ถูกเก็บลงทะเบียน
// แล้ว buildFarmContext() เอาไปหาค่าเฉลี่ยส่งให้ AI ทุกคำถาม
// ภาพหลุดเข้าไปไม่กี่ภาพก็ดันค่าเฉลี่ยขึ้นจนคำแนะนำที่ AI ให้เกษตรกรเพี้ยนตาม
// เท่ากับข้อมูลขยะไหลจากหน้าจอไปถึงชั้นที่ให้คำแนะนำจริงในแปลง
//
// คืน null แทน แปลว่า "ประเมินไม่ได้" ซึ่งต่างจาก "ประเมินแล้วได้คะแนนต่ำ"
// buildGauge รองรับ null อยู่แล้วโดยแสดงขีดกลางแทนตัวเลข
// และตัวรวมสถิติกรองเฉพาะค่าที่เป็นตัวเลขอยู่แล้ว จึงไม่ปนเข้าค่าเฉลี่ย
function healthScore(r) {
  if (!r.isRice) return null;
  if (!r.topDisease) return 90;
  if (/healthy/i.test(r.topDisease.label)) return 95;
  return Math.max(40, Math.round(100 - r.topDisease.value * 45));
}

// แสดงคะแนนในตาราง ค่าที่ประเมินไม่ได้ต้องเป็นขีดกลาง ไม่ใช่คำว่า null
function scoreText(v) {
  return typeof v === "number" ? String(v) : "—";
}
function diagnosisName(r) {
  if (!r.isRice) return "ภาพไม่ชัดเจน";
  if (!r.topDisease) return "ไม่ระบุ";
  return th(r.topDisease.label);
}

// ─── ฐานความรู้แนวทางแก้ไข ─────────────────────
// ใช้ findDiseaseGuide จาก disease-guide.js ซึ่งเทียบชื่อแบบ normalize
// ("Brown spot" = "brownspot" = "BROWNSPOT") เพื่อไม่ให้การ์ดแนวทางแก้ไข
// หายไปเงียบๆ ทุกครั้งที่เทรนโมเดลใหม่แล้วชื่อ label เปลี่ยน
// ส่วน fallback ด้านล่างไว้กันกรณีใช้ disease-guide.js เวอร์ชันเก่าที่ยังไม่มีฟังก์ชันนี้
function getGuide(label) {
  if (!label) return null;
  if (typeof window.findDiseaseGuide === "function") return window.findDiseaseGuide(label);
  return (window.DISEASE_GUIDE && window.DISEASE_GUIDE[label]) || null;
}

function buildRx(label) {
  var g = getGuide(label);
  if (!g) return null;

  var urgent = g.urgency || "";
  var tone = urgent.indexOf("สูง") === 0 ? "bad" : urgent === "ปานกลาง" ? "warn" : "";
  var box = el("div", "rx " + tone);

  var top = el("div", "rx-top");
  top.appendChild(el("div", "rx-name", "แนวทางจัดการ: " + g.thai));
  if (urgent && urgent !== "-") {
    var flagTone = urgent.indexOf("สูง") === 0 ? "hi" : urgent === "ปานกลาง" ? "mid" : "lo";
    top.appendChild(el("span", "rx-flag " + flagTone, "ความเร่งด่วน " + urgent));
  }
  box.appendChild(top);
  // รูปตัวอย่างของโรคนี้ ให้ผู้ใช้เทียบกับใบจริงในมือก่อนตัดสินใจ
  // ใช้คีย์จากชื่อในฐานความรู้ ซึ่งเป็นชื่อเดียวกับที่โมเดลคืนมา
  mediaInto(box, "disease-" + String(label).replace(/\s+/g, ""));

  function part(head, body) {
    if (!body || (Array.isArray(body) && !body.length)) return;
    box.appendChild(el("div", "rx-sect", head));
    if (Array.isArray(body)) {
      var ul = el("ul");
      body.forEach(function (line) { ul.appendChild(el("li", "", line)); });
      box.appendChild(ul);
    } else {
      box.appendChild(el("p", "", body));
    }
  }
  part("สาเหตุ", g.cause);
  part("ลักษณะอาการ", g.symptoms);
  part("วิธีจัดการ", g.treatment);
  part("การป้องกันรอบหน้า", g.prevention);

  // ที่มาของข้อมูลไปรวมไว้ในกล่อง "ข้อมูลหน้านี้มาจากไหน" ท้ายหน้าแล้ว
  return box;
}

// ส่งฐานความรู้ให้ Gemini อ้างอิง ถ้าไม่มีข้อมูลบอกตรงๆ ไม่ปล่อยให้เดา
function guideForPrompt(label) {
  var g = getGuide(label);
  if (!g) return "\n\n[ไม่มีข้อมูลแนวทางแก้ไขของโรคนี้ในฐานข้อมูลอ้างอิง — แจ้งผู้ใช้ให้ปรึกษาเจ้าหน้าที่เกษตรในพื้นที่ ห้ามแต่งชื่อสารเคมีหรืออัตราใช้ขึ้นเอง]";
  return "\n\n[ข้อมูลอ้างอิงทางการ ให้ยึดเป็นหลัก ห้ามเพิ่มชื่อสารเคมีหรืออัตราใช้เอง]\n" +
    "โรค: " + g.thai + "\nสาเหตุ: " + g.cause + "\nอาการ: " + g.symptoms +
    "\nวิธีจัดการ: " + (g.treatment || []).join(" / ") +
    "\nการป้องกัน: " + (g.prevention || []).join(" / ");
}

function pestTriage() {
  var P = window.PEST_GUIDE;
  if (!P || !P.triage) return null;
  return "[วิธีแยกว่าอาการที่เห็นเกิดจากโรคหรือแมลง ใช้ก่อนเสมอเมื่อยังไม่รู้สาเหตุ]\n" +
    P.triage.map(function (x) { return "- " + x; }).join("\n") +
    "\n[ห้ามสรุปว่าเป็นโรคหรือปัญหาดินโดยไม่ตัดความเป็นไปได้เรื่องแมลงออกก่อน " +
    "ให้ถามกลับว่าเคยแหวกกอดูโคนต้นเหนือผิวน้ำหรือยัง เห็นตัวแมลงหรือคราบขาวจากการลอกคราบไหม " +
    "และอาการเป็นหย่อมกลมๆ หรือกระจายทั่วแปลง เพราะเป็นหย่อมมักเกิดจากแมลง " +
    "ส่วนกระจายทั่วแปลงตามพื้นที่ลุ่มมักเกิดจากดินหรือน้ำ]";
}

// opts.hasImage = true เมื่อผู้ใช้แนบภาพมาด้วย
function knowledgeFor(text, opts) {
  var q = text || "";
  opts = opts || {};

  var hits = [];
  Object.keys(TOPICS).forEach(function (k) {
    if (TOPICS[k].words.test(q)) hits.push(k);
  });

  var blocks = [];
  hits.slice(0, 3).forEach(function (k) {
    var b = TOPICS[k].build(q);
    if (b) blocks.push(b);
  });

  // ── เพิ่ม 2026-08 แก้ปัญหาที่คำถามอาการกว้างไม่เคยได้ข้อมูลแมลงเลย ──
  //
  // คนที่ถ่ายรูปมาถามว่า "เกิดจากอะไร" คือคนที่ยังไม่รู้สาเหตุ
  // จึงเป็นไปไม่ได้ที่เขาจะพิมพ์คำว่าเพลี้ยหรือแมลงมาให้ระบบจับ
  // ของเดิมจึงให้ความรู้เรื่องแมลงเฉพาะกับคนที่รู้อยู่แล้วว่าเป็นแมลง
  // ซึ่งกลับหัวกลับหางกับสิ่งที่ควรเป็น
  //
  // อาการเหลือง แห้ง ตาย เกิดได้จากทั้งโรค แมลง ดิน และน้ำ
  // ถ้าไม่ส่งตัวแยกไปด้วย AI จะเดาจากข้อมูลแปลงที่มีอยู่ เช่นค่า pH
  // แล้วฟันธงว่าเป็นเรื่องดินทั้งที่ยังไม่ได้ตัดความเป็นไปได้อื่นออกเลย
  var vague = /เกิดจากอะไร|สาเหตุ|ทำไม|เป็นอะไร|เป็นโรคอะไร|ช่วยดู|วิเคราะห์|ประเมิน|แก้ยังไง|ทำไงดี|เหลือง|แห้ง|ตาย|เฉา|เหี่ยว|ไหม้|หย่อม|แคระ|ไม่โต|ผิดปกติ/i;

  if ((opts.hasImage || vague.test(q)) && hits.indexOf("pest") === -1) {
    var tri = pestTriage();
    if (tri) blocks.push(tri);
  }

  // ── ส่งสารบัญไปเสมอ ไม่ใช่เฉพาะตอนจับหมวดไม่ได้ (แก้ 2026-08) ──
  //
  // เดิมส่งสารบัญเฉพาะตอนไม่มีบล็อกไหนตรงเลย ผลคือถ้าคำถามตรงกับหมวดหนึ่ง
  // AI จะไม่รู้เลยว่าระบบมีข้อมูลหมวดอื่นอยู่ด้วย จึงตอบจากความรู้ทั่วไปของตัวเอง
  // แทนที่จะชวนผู้ใช้ถามต่อเพื่อดึงข้อมูลจริงที่มีอยู่แล้วในเว็บออกมาใช้
  //
  // สารบัญสั้นมากเมื่อเทียบกับบล็อกเนื้อหา ต้นทุนที่เพิ่มจึงน้อยกว่าประโยชน์มาก
  if (!blocks.length) blocks.push(knowledgeIndex());
  else blocks.push(knowledgeIndex());
  return "\n\n" + blocks.join("\n\n");
}

}

// ── ข้อมูลแปลงที่ผู้ใช้ตั้งค่าไว้ตามหน้าต่างๆ (เพิ่ม 2026-08) ──
//
// เดิม AI เห็นแค่บันทึกการสำรวจกับพันธุ์ข้าว ไม่เห็นสิ่งที่ผู้ใช้กรอกไว้หน้าอื่น
// ทั้งขนาดแปลง ชนิดดิน และวิธีทำนา ทั้งที่สามอย่างนี้เปลี่ยนคำตอบเรื่องปุ๋ยและน้ำทั้งหมด
// ผลคือผู้ใช้กรอกข้อมูลไปหลายหน้า แล้วยังได้คำตอบกลางๆ เหมือนไม่เคยกรอกอะไรเลย
function fieldSetupContext() {
  var out = [];

  out.push("[เว็บนี้คิดทุกอย่างเป็นอัตราต่อ 1 ไร่ ให้ตอบเป็นต่อไร่เสมอ " +
           "ห้ามถามขนาดแปลงเพื่อคิดยอดรวมให้ ถ้าผู้ใช้อยากได้ยอดรวมค่อยบอกให้เขาคูณจำนวนไร่เอง]");

  try {
    var sKey = plotKey("soil");
    var sv = JSON.parse(localStorage.getItem(sKey) || "{}");
    var SW = { clay: "ดินเหนียว", loam: "ดินร่วน", sand: "ดินทราย" };
    var MW = { wet: "นาดำ (ปักดำ)", dry: "นาหว่านแห้ง", broadcast: "นาหว่านน้ำตม" };
    if (sv.soil) out.push("ชนิดดินที่ผู้ใช้เลือก: " + (SW[sv.soil] || sv.soil));
    else out.push("ชนิดดิน: ยังไม่ได้เลือก");
    if (sv.method) out.push("วิธีทำนาที่ผู้ใช้เลือก: " + (MW[sv.method] || sv.method));
  } catch (e) { /* อ่านไม่ได้ก็ข้าม ไม่ต้องทำให้ทั้ง prompt พัง */ }

  // สภาพอากาศแปลงนี้ ถ้าผู้ใช้เคยเปิดหน้าอากาศแล้ว
  try {
    var w = window.LAST_WEATHER;
    if (w && w.summary) {
      out.push("อากาศแปลงนี้: ฝนสะสม 7 วัน " + w.summary.rain7 + " มม. · " +
               "ความชื้นเฉลี่ย 3 วัน " + w.summary.humidity + "%");
    }
  } catch (e) { /* ข้าม */ }

  return out.length ? out.join("\n") : "";
}

function buildFarmContext(logs) {
  var prof = Store.profile();
  if (!logs.length) {
    var setupEmpty = fieldSetupContext();
    return "ข้อมูลผู้ใช้: " + prof.name + (prof.farm ? " แปลง " + prof.farm : "") +
           "\n" + varietyContext() +
           (setupEmpty ? "\n" + setupEmpty : "") +
           "\nยังไม่มีบันทึกการสำรวจในระบบ";
  }

  var scores = logs.map(function (l) { return l.score; }).filter(function (v) { return typeof v === "number"; });
  var phs = logs.map(function (l) { return l.ph; }).filter(function (v) { return typeof v === "number"; });
  var avg = function (arr) { return arr.reduce(function (a,b) { return a+b; }, 0) / arr.length; };

  var tally = {};
  logs.forEach(function (l) { tally[l.disease] = (tally[l.disease] || 0) + 1; });
  var ranked = Object.keys(tally).sort(function (a,b) { return tally[b] - tally[a]; });

  var lines = [];
  lines.push("ข้อมูลผู้ใช้: " + prof.name + (prof.farm ? " แปลง " + prof.farm : ""));
  lines.push("จำนวนการสำรวจสะสม: " + logs.length + " ครั้ง");
  lines.push(varietyContext());
  var setup = fieldSetupContext();
  if (setup) lines.push(setup);
  if (scores.length) {
    lines.push("คะแนนสุขภาพเฉลี่ย: " + Math.round(avg(scores)) + " (" + statusWord(statusOf(Math.round(avg(scores)))) + ")");
  }
  if (phs.length) {
    lines.push("ความเปรี้ยวของดินเฉลี่ย: " + avg(phs).toFixed(2) + " จากการวัด " + phs.length + " ครั้ง");
  } else {
    lines.push("ความเปรี้ยวของดิน: ยังไม่เคยวัด");
  }
  lines.push("โรคที่พบบ่อยที่สุด: " + ranked.slice(0, 3).map(function (k) {
    return k + " " + tally[k] + " ครั้ง";
  }).join(", "));



  // ผลตรวจดินคือข้อมูลที่ทำให้ AI แนะนำปุ๋ยเฉพาะแปลงได้จริง
  // ต่างจากค่า pH อย่างเดียวซึ่งบอกไม่ได้ว่าดินขาดธาตุอะไร
  var soil = logs.filter(function (l) { return l.kind === "soil"; })[0];
  if (soil && window.readNutrient) {
    var parts = [];
    ["om", "p", "k", "n"].forEach(function (k) {
      if (soil[k] == null) return;
      var r = window.readNutrient(k, soil[k]);
      if (r) parts.push(r.nutrient.thai + " " + soil[k] + " " + r.nutrient.unit + " (ระดับ" + r.band.word + ")");
    });
    if (parts.length) {
      lines.push("ผลตรวจดินล่าสุด เมื่อ " + soil.date + ": " + parts.join(", "));
      lines.push("[มีผลตรวจดินแล้ว ให้แนะนำสูตรปุ๋ยโดยพิจารณาจากค่าเหล่านี้ " +
                 "ธาตุที่อยู่ในระดับสูงไม่ต้องใส่เพิ่ม ธาตุที่ต่ำให้เสริม " +
                 "และบอกด้วยว่าประหยัดค่าปุ๋ยได้อย่างไรเมื่อเทียบกับการใส่สูตรรวมแบบเหมา]");
    }
  }

  lines.push("บันทึก 5 ครั้งล่าสุด:");
  logs.slice(0, 5).forEach(function (l) {
    lines.push("  " + l.date + " พบ " + l.disease + " คะแนน " + l.score +
               (l.ph != null ? " ค่าดิน " + l.ph : ""));
  });

  return lines.join("\n");
}

// ส่งออกเป็น CSV ให้เปิดใน Excel ได้
// ใส่ BOM นำหน้าเพราะ Excel บน Windows อ่านภาษาไทยเป็นตัวต่างดาวถ้าไม่มี
function exportCsv(logs) {
  var head = ["วันที่", "ผู้บันทึก", "ผลตรวจจาก AI", "ผู้ใช้ยืนยัน", "โรคที่ถูกต้อง", "ค่าดิน", "คะแนนสุขภาพ", "ที่ตั้งแปลง", "มีรูป"];
  var cell = function (v) {
    var s = (v === null || v === undefined) ? "" : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
  };
  var rows = logs.map(function (l) {
    var judged = l.verify ? (l.verify.correct ? "ถูกต้อง" : "ไม่ถูกต้อง") : "ยังไม่ยืนยัน";
    return [l.date, l.owner || "", l.disease, judged,
            l.verify && l.verify.actual ? l.verify.actual : "",
            l.ph != null ? l.ph : "", l.score, l.gps || "",
            l.hasImage ? "มี" : "ไม่มี"].map(cell).join(",");
  });

  var csv = "\uFEFF" + head.map(cell).join(",") + "\n" + rows.join("\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "smartrice-บันทึกแปลง-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

//
// WeatherAPI  — ค่าปัจจุบัน อัปเดตทุก 10-15 นาที เป็นแหล่งอ้างอิงหลักของค่าปัจจุบัน

//
// ถ้าจะเปลี่ยนไปใช้ API กรมอุตุนิยมวิทยา แก้เฉพาะ 2 ฟังก์ชันนี้
// (ข้อมูลกรมอุตุฯ มีลิขสิทธิ์ หากเผยแพร่ต้องระบุแหล่งที่มากำกับทุกครั้ง
//  และตรวจวัดทุก 3 ชั่วโมง ไม่ได้ละเอียดรายชั่วโมง)
async function fetchLiveWeather(lat, lon) {
  return await api("/weather?lat=" + lat + "&lon=" + lon);
}

async function fetchWeather(lat, lon) {
  var url = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + lat + "&longitude=" + lon +
    "&daily=precipitation_sum,sunshine_duration,temperature_2m_max,temperature_2m_min" +
    "&hourly=relative_humidity_2m" +
    "&past_days=7&forecast_days=7&timezone=Asia%2FBangkok";

  var res = await fetch(url);
  if (!res.ok) throw new Error("ดึงข้อมูลอากาศไม่สำเร็จ (HTTP " + res.status + ")");
  var d = await res.json();

  var days = d.daily.time.map(function (date, i) {
    return {
      date: date,
      rain: d.daily.precipitation_sum[i],
      // Open-Meteo คืนค่าแสงแดดเป็นวินาที แปลงเป็นชั่วโมงให้อ่านง่าย
      sunHours: d.daily.sunshine_duration[i] != null
        ? +(d.daily.sunshine_duration[i] / 3600).toFixed(1) : null,
      tempMax: d.daily.temperature_2m_max[i],
      tempMin: d.daily.temperature_2m_min[i]
    };
  });

  // เฉลี่ยความชื้นรายชั่วโมงให้เป็นรายวัน เพราะ Open-Meteo ไม่ได้ให้ค่ารายวันมาตรง
  if (d.hourly && d.hourly.relative_humidity_2m) {
    var byDate = {};
    d.hourly.time.forEach(function (t, i) {
      var day = t.slice(0, 10);
      if (!byDate[day]) byDate[day] = [];
      var v = d.hourly.relative_humidity_2m[i];
      if (v != null) byDate[day].push(v);
    });
    days.forEach(function (day) {
      var arr = byDate[day.date];
      day.humidity = arr && arr.length
        ? Math.round(arr.reduce(function (a, b) { return a + b; }, 0) / arr.length) : null;
    });
  }

  var todayIndex = days.findIndex(function (day) {
    return day.date === new Date().toISOString().slice(0, 10);
  });
  if (todayIndex === -1) todayIndex = 7;

  var past = days.slice(0, todayIndex + 1);
  var rain7 = past.reduce(function (a, day) { return a + (day.rain || 0); }, 0);
  var recent = past.slice(-3);
  var avg = function (key) {
    var vals = recent.map(function (r) { return r[key]; }).filter(function (v) { return v != null; });
    return vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : 0;
  };

  var result = {
    days: days,
    todayIndex: todayIndex,
    // พิกัดจุดตรวจอากาศที่ผู้ให้บริการเลือกให้ ซึ่งมักไม่ตรงกับพิกัดแปลงเป๊ะๆ
    // เก็บไว้เพื่อแสดงให้ผู้ใช้เห็นว่าค่าที่อ่านอยู่มาจากจุดไหน ไม่ใช่วัดที่แปลงโดยตรง
    station: {
      lat: d.latitude,
      lon: d.longitude,
      elevation: d.elevation,
      timezone: d.timezone_abbreviation || d.timezone || "Asia/Bangkok"
    },
    summary: {
      rain7: +rain7.toFixed(1),
      humidity: Math.round(avg("humidity")),
      sunHours: +avg("sunHours").toFixed(1),
      tempMax: +avg("tempMax").toFixed(1),
      tempMin: +avg("tempMin").toFixed(1)
    }
  };

  // เก็บไว้ให้ผู้ช่วยตอบคำถามใช้ประกอบการตอบ
  // ไม่งั้น AI จะแนะนำใส่ปุ๋ยทั้งที่พรุ่งนี้ฝนจะตกชะล้างหมด
  window.LAST_WEATHER = result;
  return result;
}

// ═══ การหาพิกัด ═══
//
// ── ทำไมต้องมีตัวกลาง แทนที่จะเรียก getCurrentPosition ตรงๆ (แก้ไข 2026-08) ──
//
// เดิมทุกหน้าเรียก navigator.geolocation.getCurrentPosition() เองโดยไม่ส่งตัวเลือกใดๆ
// ซึ่งแปลว่าใช้ค่าเริ่มต้นของเบราว์เซอร์คือ enableHighAccuracy: false
// บนมือถือ ค่านี้ทำให้ระบบหาตำแหน่งจากเสาสัญญาณและ WiFi แทนดาวเทียม GPS
// ความคลาดเคลื่อนจึงอยู่ที่หลักร้อยเมตรถึงหลายกิโลเมตร
//
// นี่คือสาเหตุที่ชื่อหมู่บ้านหรือตำบลที่ระบบแสดงมักไม่ตรงกับที่ผู้ใช้อยู่จริง
// ไม่ใช่เพราะฐานข้อมูลชื่อสถานที่ผิด แต่เพราะพิกัดที่ส่งไปถามมันผิดตั้งแต่ต้น
// ในชนบทที่เสาสัญญาณห่างกันมาก ความคลาดเคลื่อนยิ่งสูงกว่าในเมืองอีก
//
// ตัวกลางนี้บังคับสามอย่าง
//   enableHighAccuracy: true  ให้ใช้ดาวเทียม GPS จริง แลกกับใช้เวลานานขึ้นและกินแบตกว่า
//   maximumAge: 0             ห้ามใช้ค่าเก่าที่เบราว์เซอร์ไฟล์เก่าที่ค้างไว้ ต้องวัดใหม่ทุกครั้ง
//   timeout                   ไม่ปล่อยให้ผู้ใช้รอไม่มีกำหนดเมื่อหาดาวเทียมไม่เจอ
//
// และคืนค่า accuracy กับ timestamp กลับมาด้วย เพื่อให้ทุกหน้าบอกผู้ใช้ได้ว่า
// พิกัดที่ได้แม่นแค่ไหนและวัดเมื่อไหร่ ซึ่งเป็นข้อมูลที่ผู้ใช้ต้องรู้เพื่อตัดสินใจว่าจะเชื่อไหม
function getFix(opts) {
  opts = opts || {};
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) {
      return reject(new Error("อุปกรณ์นี้ไม่รองรับการหาตำแหน่ง"));
    }
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        resolve({
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy: pos.coords.accuracy,   // รัศมีความคลาดเคลื่อนเป็นเมตร
          at: pos.timestamp                // เวลาที่วัดได้จริง ไม่ใช่เวลาที่เรียกฟังก์ชัน
        });
      },
      function (e) {
        // แยกสาเหตุให้ชัด เพราะทางแก้ต่างกันคนละเรื่อง
        // ผู้ใช้ที่ยังไม่ได้กดอนุญาต กับผู้ใช้ที่อยู่ในตึกจนจับดาวเทียมไม่ได้
        // ถ้าบอกเหมือนกันว่า "หาตำแหน่งไม่ได้" ทั้งคู่จะไม่รู้ว่าต้องทำอะไรต่อ
        if (e && e.code === 1) return reject(new Error("ยังไม่ได้อนุญาตให้เว็บเข้าถึงตำแหน่ง"));
        if (e && e.code === 3) return reject(new Error("หาสัญญาณดาวเทียมไม่ทัน ลองออกไปที่โล่งแล้วกดใหม่"));
        return reject(new Error("หาตำแหน่งไม่สำเร็จ"));
      },
      {
        enableHighAccuracy: opts.high !== false,
        timeout: opts.timeout || 15000,
        maximumAge: 0
      }
    );
  });
}

// แปลงค่าความคลาดเคลื่อนเป็นข้อความที่ผู้ใช้ตัดสินใจได้
//
// เกณฑ์มาจากขนาดแปลงนาจริง แปลงหนึ่งไร่กว้างประมาณ 40 เมตร
// ถ้าคลาดเคลื่อนเกิน 50 เมตร ก็อาจชี้ไปแปลงข้างเคียงแล้ว
// และถ้าเกิน 200 เมตร มีโอกาสข้ามหมู่บ้านซึ่งทำให้ชื่อสถานที่ผิดไปเลย
function accuracyNote(m) {
  if (m == null) return { ok: true, text: "" };
  var r = Math.round(m);
  if (m <= 20)  return { ok: true,  text: "คลาดเคลื่อนได้ ±" + r + " เมตร ใช้ระบุแปลงได้ดี" };
  if (m <= 50)  return { ok: true,  text: "คลาดเคลื่อนได้ ±" + r + " เมตร พอใช้ระบุแปลงได้" };
  if (m <= 200) return { ok: false, text: "คลาดเคลื่อนได้ ±" + r + " เมตร ซึ่งกว้างกว่าแปลงนาทั่วไป อาจชี้ไปแปลงข้างเคียง ลองออกที่โล่งแล้วกดใหม่" };
  return { ok: false, text: "คลาดเคลื่อนได้ ±" + r + " เมตร ซึ่งหยาบมาก น่าจะจับจากเสาสัญญาณไม่ใช่ดาวเทียม ชื่อสถานที่ที่ได้อาจผิดหมู่บ้าน ให้ออกไปที่โล่งแล้วกดใหม่" };
}

// ระยะทางระหว่างสองพิกัดเป็นเมตร (สูตร haversine)
// ใช้บอกว่าจุดพยากรณ์อากาศอยู่ห่างจากแปลงเท่าไหร่
function metersBetween(lat1, lon1, lat2, lon2) {
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return Math.round(2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

// อายุของพิกัดที่บันทึกไว้ บอกเป็นภาษาคน
// พิกัดแปลงไม่ค่อยเปลี่ยน แต่ผู้ใช้ควรรู้ว่ากำลังดูของเก่าแค่ไหน
// โดยเฉพาะคนที่ทำหลายแปลงแล้วอาจลืมว่าปักหมุดไว้ที่แปลงไหน
function ageWords(ms) {
  if (!ms) return "";
  var d = Math.floor((Date.now() - ms) / 86400000);
  if (d <= 0) return "วันนี้";
  if (d === 1) return "เมื่อวาน";
  if (d < 30) return d + " วันก่อน";
  if (d < 365) return Math.floor(d / 30) + " เดือนก่อน";
  return Math.floor(d / 365) + " ปีก่อน";
}

// ═══ แปลงนาหลายแปลง ═══════════════════════════
//
// ชาวนาคนหนึ่งมักมีที่นามากกว่าหนึ่งผืน และแต่ละผืนไม่เหมือนกันเลย
// ดินคนละชนิด ค่า pH คนละค่า หว่านคนละวัน ต้นทุนคนละก้อน
// เดิมเว็บเก็บทุกอย่างเป็นชุดเดียว คนที่มีสองแปลงจึงต้องเลือกว่าจะกรอกของแปลงไหน
// แล้วอีกแปลงก็ไม่มีข้อมูลเลย หรือแย่กว่านั้นคือเอาค่าของอีกแปลงไปคิดปุ๋ยผิดแปลง
//
// วิธีแก้: ทุกคีย์ที่เป็น "ข้อมูลของแปลง" ต้องมีรหัสแปลงต่อท้าย
// ส่วนคีย์ที่เป็น "ความชอบของผู้ใช้" เช่นราคาวัสดุที่จดไว้ ยังใช้ร่วมกันทุกแปลง
// เพราะราคาปูนที่ร้านเดียวกันไม่ได้เปลี่ยนตามว่ากำลังดูแปลงไหนอยู่
var Plots = {
  _uid: function () { return Session.user ? Session.user.username : "guest"; },
  _listKey: function () { return "smartrice-plots:" + this._uid(); },
  _activeKey: function () { return "smartrice-plot:" + this._uid(); },

  // อย่างน้อยต้องมีหนึ่งแปลงเสมอ ไม่มีสถานะ "ไม่มีแปลงเลย"
  // ไม่งั้นทุกหน้าต้องเขียนกรณีพิเศษว่าจะแสดงอะไรตอนยังไม่มีแปลง
  list: function () {
    var arr = null;
    try { arr = JSON.parse(localStorage.getItem(this._listKey()) || "null"); } catch (e) { arr = null; }
    if (!Array.isArray(arr) || !arr.length) arr = [{ id: "p1", name: "ไร่ที่ 1" }];
    return arr;
  },

  _save: function (arr) {
    try { localStorage.setItem(this._listKey(), JSON.stringify(arr)); } catch (e) { /* พื้นที่เต็ม */ }
  },

  activeId: function () {
    var arr = this.list();
    var id = null;
    try { id = localStorage.getItem(this._activeKey()); } catch (e) { id = null; }
    // แปลงที่เคยเลือกไว้อาจถูกลบไปแล้ว ต้องเด้งกลับแปลงแรกเสมอ
    // ไม่งั้นทุกหน้าจะอ่านคีย์ของแปลงที่ไม่มีอยู่แล้วขึ้นหน้าว่างโดยไม่บอกสาเหตุ
    if (!arr.some(function (p) { return p.id === id; })) id = arr[0].id;
    return id;
  },

  active: function () {
    var id = this.activeId();
    return this.list().filter(function (p) { return p.id === id; })[0];
  },

  setActive: function (id) {
    try { localStorage.setItem(this._activeKey(), id); } catch (e) { /* พื้นที่เต็ม */ }
  },

  add: function (name) {
    var arr = this.list();
    // รหัสต้องไม่ซ้ำกับที่เคยใช้ ถึงจะลบแปลงกลางไปแล้วก็ตาม
    // ถ้าใช้ความยาวรายการมานับ รหัสจะชนกันแล้วแปลงใหม่จะเห็นข้อมูลของแปลงที่ลบไป
    var n = 1;
    while (arr.some(function (p) { return p.id === "p" + n; })) n++;
    var p = { id: "p" + n, name: name || ("ไร่ที่ " + (arr.length + 1)) };
    arr.push(p);
    this._save(arr);
    return p;
  },

  rename: function (id, name) {
    var arr = this.list();
    arr.forEach(function (p) { if (p.id === id) p.name = name; });
    this._save(arr);
  },

  // ลบแปลงพร้อมข้อมูลของแปลงนั้นในเครื่อง
  // บันทึกที่อยู่บนเซิร์ฟเวอร์ไม่ลบ เพราะเป็นประวัติที่ผู้ใช้อาจอยากดูย้อนหลัง
  remove: function (id) {
    var arr = this.list().filter(function (p) { return p.id !== id; });
    if (!arr.length) return false;
    this._save(arr);
    var tail = ":" + this._uid() + ":" + id;
    var drop = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf("smartrice-") === 0 && k.slice(-tail.length) === tail) drop.push(k);
    }
    drop.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    if (this.activeId() === id) this.setActive(arr[0].id);
    return true;
  }
};

// คีย์ของข้อมูลที่ "เป็นของแปลง" ต้องผ่านฟังก์ชันนี้ที่เดียว
// ห้ามประกอบสตริงคีย์เองในแต่ละหน้า ไม่งั้นวันหนึ่งจะมีหน้าที่ลืมใส่รหัสแปลง
// แล้วข้อมูลของสองแปลงจะทับกันโดยไม่มีอะไรเตือน
function plotKey(base) {
  return "smartrice-" + base + ":" + Plots._uid() + ":" + Plots.activeId();
}

// กรองบันทึกให้เหลือเฉพาะของแปลงที่กำลังดูอยู่
// บันทึกเก่าที่ทำไว้ก่อนมีระบบหลายแปลงจะไม่มีฟิลด์ plot ให้ถือว่าเป็นของแปลงแรก
// ไม่ใช่ทิ้งไป เพราะเป็นข้อมูลจริงที่ผู้ใช้อุตส่าห์บันทึกไว้
function plotLogs(logs) {
  var id = Plots.activeId();
  var first = Plots.list()[0].id;
  return (logs || []).filter(function (l) {
    return l.plot ? l.plot === id : (id === first);
  });
}

// แถบสลับแปลง วางบนสุดของแท็บที่แสดงข้อมูลรายแปลง
// เป็นแถวปุ่มแบบเดียวกับที่ใช้เลือกชนิดดิน คนที่เคยใช้เว็บอะไรก็ตามกดเป็นทันที
function plotBar() {
  var box = el("div", "plotbar");
  var row = el("div", "plotbar-row");

  Plots.list().forEach(function (p) {
    var on = (p.id === Plots.activeId());
    var b = el("button", "plotchip" + (on ? " on" : ""), p.name);
    b.onclick = function () {
      if (on) { plotEdit(p); return; }   // กดแปลงที่เปิดอยู่ซ้ำ = แก้ชื่อหรือลบ
      Plots.setActive(p.id);
      open(here);
    };
    row.appendChild(b);
  });

  var add = el("button", "plotchip plotchip-add", "+ เพิ่มแปลง");
  add.onclick = function () {
    var p = Plots.add();
    Plots.setActive(p.id);
    open(here);
  };
  row.appendChild(add);

  box.appendChild(row);
  return box;
}

// แก้ชื่อหรือลบแปลง เปิดจากการกดชิปของแปลงที่เปิดอยู่
function plotEdit(p) {
  var back = el("div", "sheet-back");
  var card = el("div", "sheet");
  card.appendChild(el("div", "sheet-title", "แปลงนี้"));

  var inp = el("input");
  inp.value = p.name;
  inp.setAttribute("aria-label", "ชื่อแปลง");
  inp.style.cssText = "width:100%;padding:11px 13px;border:1px solid var(--rule);border-radius:var(--r-sm);font-size:1rem";
  card.appendChild(inp);

  var row = el("div", "sheet-row");
  var save = el("button", "act act-go act-sm", "บันทึกชื่อ");
  save.onclick = function () {
    var v = inp.value.trim();
    if (v) Plots.rename(p.id, v);
    back.remove();
    open(here);
  };
  row.appendChild(save);

  // ลบได้เฉพาะตอนมีมากกว่าหนึ่งแปลง เพราะระบบต้องมีอย่างน้อยหนึ่งแปลงเสมอ
  if (Plots.list().length > 1) {
    var del = el("button", "act act-line act-sm", "ลบแปลงนี้");
    del.style.color = "var(--rust)";
    del.onclick = function () {
      del.textContent = "กดอีกครั้งเพื่อลบ";
      del.onclick = function () {
        Plots.remove(p.id);
        back.remove();
        open(here);
      };
    };
    row.appendChild(del);
  }

  var cancel = el("button", "act act-line act-sm", "ปิด");
  cancel.onclick = function () { back.remove(); };
  row.appendChild(cancel);

  card.appendChild(row);
  back.appendChild(card);
  back.onclick = function (e) { if (e.target === back) back.remove(); };
  document.body.appendChild(back);
  inp.focus();
}


// ═══ ข้อมูลแปลงนาที่ใช้ร่วมกันทุกหน้า ═══
//
// เดิมแต่ละหน้าหาพิกัดเอง แท็บตรวจแปลงใช้พิกัดจากบันทึกเก่า หน้าแผนที่ใช้อีกจุด
// ผลคือดูอากาศของที่หนึ่งแต่แผนที่ชี้อีกที่ โดยผู้ใช้ไม่รู้ตัว
// ตอนนี้ทุกหน้าดึงจากที่เดียวกันผ่าน fieldCoords()
function fieldKey() {
  return plotKey("field");
}
function readField() {
  try { return JSON.parse(localStorage.getItem(fieldKey()) || "null"); }
  catch (e) { return null; }
}
function writeField(f) {
  try { localStorage.setItem(fieldKey(), JSON.stringify(f)); } catch (e) { /* พื้นที่เต็ม */ }
}

// คืนพิกัดแปลงพร้อมบอกว่าได้มาจากไหน เพื่อให้หน้าปลายทางแสดงที่มาให้ผู้ใช้เห็นได้
function fieldCoords() {
  var f = readField();
  if (f && f.lat != null && f.lon != null) {
    return { lat: f.lat, lon: f.lon, from: "ที่นาที่คุณปักหมุดไว้", field: f };
  }
  return null;
}

// ── พันธุ์ข้าวของแปลง ────────────────────────────
//
// เก็บไว้ในระเบียนแปลงเดียวกับพิกัด เพราะเป็นคุณสมบัติของแปลงในฤดูนั้น
// ไม่ใช่การตั้งค่าการแสดงผล ทุกหน้าที่ให้คำแนะนำเรื่องจังหวะปุ๋ยต้องอ่านค่านี้
//
// ทำไมสำคัญ: ข้าวออกรวงตามฤดูออกดอกตามความยาวกลางวัน ไม่ใช่ตามอายุ
// ปฏิทินปุ๋ยครั้งที่ 2 ของสองกลุ่มนี้จึงห่างกันได้เป็นเดือน
// ถ้าไม่รู้พันธุ์ ระบบจะแนะนำจังหวะผิดโดยที่ผู้ใช้ไม่มีทางรู้ตัว
//
// ค่าเริ่มต้นเป็น photo (ออกรวงตามฤดู) เพราะเป็นข้าวส่วนใหญ่ของประเทศ
// และการเดาผิดไปทางนี้ปลอดภัยกว่า เพราะคำแนะนำจะบอกให้นับจากวันออกดอก
// ซึ่งใช้ได้กับทั้งสองกลุ่ม ต่างจากการเดาเป็นนาปรังที่ให้ตัวเลขอายุตายตัว
function fieldVariety() {
  var f = readField();
  var v = f && f.variety;
  var list = (window.CARE_GUIDE && window.CARE_GUIDE.varieties) || [];
  for (var i = 0; i < list.length; i++) if (list[i].key === v) return v;
  return (window.CARE_GUIDE && window.CARE_GUIDE.defaultVariety) || "photo";
}

function setFieldVariety(v) {
  var f = readField() || {};
  f.variety = v;
  writeField(f);
}

// ── ชื่อพันธุ์และวันหว่าน (เพิ่ม 2026-08) ──
//
// เดิมเก็บแค่กลุ่มพันธุ์ (photo/nonphoto) ซึ่งพอให้คำแนะนำถูกหลักการ
// แต่ผู้ใช้ยังต้องไปหาเองว่าพันธุ์ที่ปลูกออกดอกวันไหน
// พอเก็บชื่อพันธุ์กับวันหว่านเพิ่ม ระบบคำนวณวันจริงให้ได้เลย
//
// เก็บทั้งสองค่าแยกจาก field.variety โดยตั้งใจ ไม่รวมเป็นค่าเดียว
// เพราะผู้ใช้ที่ยังไม่รู้ชื่อพันธุ์ต้องยังใช้ระบบได้ด้วยการเลือกแค่กลุ่ม
// ถ้าบังคับให้เลือกชื่อพันธุ์ก่อน คนที่ซื้อเมล็ดมาโดยไม่รู้ชื่อจะใช้ไม่ได้เลย
function fieldVarietyKey() {
  var f = readField();
  return (f && f.varietyKey) || null;
}

function setFieldVarietyKey(k) {
  var f = readField() || {};
  f.varietyKey = k || null;
  // ตั้งกลุ่มให้ตรงกับพันธุ์อัตโนมัติ ป้องกันสองค่าขัดกันเอง
  // ซึ่งจะทำให้หน้าหนึ่งบอกนาปีอีกหน้าบอกนาปรังโดยผู้ใช้ไม่รู้ตัว
  if (k && typeof window.findVariety === "function") {
    var v = window.findVariety(k);
    if (v) f.variety = v.photo ? "photo" : "nonphoto";
  }
  writeField(f);
}

function fieldSowDate() {
  var f = readField();
  if (!f || !f.sowDate) return null;
  var d = new Date(f.sowDate);
  return isNaN(d.getTime()) ? null : d;
}

function setFieldSowDate(iso) {
  var f = readField() || {};
  f.sowDate = iso || null;
  writeField(f);
}

function clampRadius(r) {
  if (!r || isNaN(r) || r < 5) return 5;
  return r > 5000 ? 5000 : r;
}

// 1 ไร่ = 1,600 ตารางเมตร แสดงเป็นไร่-งาน-วา ด้วย
// เพราะเกษตรกรใช้หน่วยนี้ในการซื้อขายและทำเอกสารสิทธิ์
function raiFromSqm(sqm) {
  var rai = sqm / 1600;
  var whole = Math.floor(rai);
  var ngan = Math.floor((rai - whole) * 4);
  var wa = Math.round((((rai - whole) * 4) - ngan) * 100);
  return { rai: rai, text: whole + " ไร่ " + ngan + " งาน " + wa + " ตารางวา" };
}

// พื้นที่รูปหลายเหลี่ยมจากพิกัดละติจูด-ลองจิจูด
//
// แปลงเป็นเมตรด้วยการฉายภาพแบบ equirectangular รอบจุดศูนย์กลางแปลงก่อน
// แล้วใช้สูตร shoelace ตามปกติ
// วิธีนี้แม่นพอสำหรับแปลงนาที่กว้างไม่กี่ร้อยเมตร ความคลาดเคลื่อนต่ำกว่า 0.1%
// ถ้าเป็นพื้นที่ระดับหลายกิโลเมตรต้องใช้สูตรทรงกลมซึ่งซับซ้อนกว่าโดยไม่จำเป็นที่นี่
function polygonArea(points) {
  if (!points || points.length < 3) return 0;
  var R = 6371000;
  var lat0 = points.reduce(function (a, p) { return a + p[0]; }, 0) / points.length;
  var cosLat = Math.cos(lat0 * Math.PI / 180);
  var xy = points.map(function (p) {
    return [
      R * (p[1] * Math.PI / 180) * cosLat,
      R * (p[0] * Math.PI / 180)
    ];
  });
  var sum = 0;
  for (var i = 0; i < xy.length; i++) {
    var j = (i + 1) % xy.length;
    sum += xy[i][0] * xy[j][1] - xy[j][0] * xy[i][1];
  }
  return Math.abs(sum) / 2;
}

function centroid(points) {
  var lat = points.reduce(function (a, p) { return a + p[0]; }, 0) / points.length;
  var lon = points.reduce(function (a, p) { return a + p[1]; }, 0) / points.length;
  return [lat, lon];
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bund(label) {
  var b = el("div", "bund");
  b.appendChild(el("div", "bund-label", label));
  b.appendChild(el("div", "bund-line"));
  return b;
}

function plot(title, note) {
  var p = el("div", "plot");
  if (title) {
    var h = el("div", "plot-head");
    h.appendChild(el("div", "plot-title", title));
    if (note) h.appendChild(el("div", "plot-note", note));
    p.appendChild(h);
  }
  return p;
}

// รายการพับได้ ใช้ทุกหน้าที่มีขั้นตอนยาว
//
// เปิดอันแรกไว้เสมอ เพื่อให้ผู้ใช้เห็นทันทีว่าข้างในหน้าตาเป็นอย่างไร
// ถ้าพับหมดทุกอันผู้ใช้จะไม่รู้ว่าควรกดหรือไม่ และอาจคิดว่าหน้ายังโหลดไม่เสร็จ
// แตกข้อความที่คั่นด้วยบรรทัดว่างออกเป็นย่อหน้าจริง
// ฐานความรู้บางหัวข้อยาวหลายย่อหน้าแล้ว การยัดลง <p> เดียวทำให้อ่านไม่ไหว
function paras(host, text) {
  String(text == null ? "" : text).split(/\n\s*\n/).forEach(function (chunk) {
    var t = chunk.trim();
    if (t) host.appendChild(el("p", "", t));
  });
  return host;
}

function fold(num, title, sub, fill, open) {
  var box = el("div", "fold" + (open ? " on" : ""));

  var head = el("button", "fold-head");
  head.setAttribute("aria-expanded", open ? "true" : "false");
  if (num != null) head.appendChild(el("div", "fold-num", String(num)));
  var txt = el("div", "fold-text");
  txt.appendChild(el("div", "fold-title", title));
  if (sub) txt.appendChild(el("div", "fold-sub", sub));
  head.appendChild(txt);
  head.appendChild(el("div", "fold-arrow"));
  box.appendChild(head);

  var body = el("div", "fold-body");
  body.hidden = !open;
  fill(body);
  box.appendChild(body);

  head.onclick = function () {
    var nowOpen = body.hidden;
    body.hidden = !nowOpen;
    box.classList.toggle("on", nowOpen);
    head.setAttribute("aria-expanded", nowOpen ? "true" : "false");
  };
  return box;
}

// ข้อความประกอบที่ยาวแต่ไม่ใช่ใจความหลัก ยุบไว้ก่อน
// เช่น ที่มาของข้อมูล ข้อจำกัด คำอธิบายเชิงเทคนิค
// ข้อมูลพวกนี้จำเป็นต้องมีเพื่อความโปร่งใส แต่ไม่ควรแย่งที่กับสิ่งที่ต้องลงมือทำ
function more(label, text) {
  var wrap = el("div", "more");
  var btn = el("button", "more-btn", label);
  var body = el("div", "more-body", text);
  body.hidden = true;
  btn.onclick = function () {
    body.hidden = !body.hidden;
    btn.textContent = body.hidden ? label : "ย่อกลับ";
  };
  wrap.appendChild(btn);
  wrap.appendChild(body);
  return wrap;
}

// รวมแหล่งอ้างอิงของทุกส่วนในแท็บ ตัดตัวซ้ำออก แล้ววาดแถบเดียว
function tabCite(page) {
  var seen = {}, cites = [];
  (page.parts || []).forEach(function (vid) {
    (PAGE_CITE[vid] || []).forEach(function (c) {
      if (seen[c]) return;
      seen[c] = 1;
      cites.push(c);
    });
  });
  if (!cites.length) return null;
  var box = el("div", "phead");
  box.appendChild(el("span", "phead-tag", "อ้างอิง"));
  cites.forEach(function (c) { box.appendChild(el("span", "phead-chip", c)); });
  return box;
}

function todayStamp() {
  var d = new Date();
  return String(d.getDate()).padStart(2,"0") + "/" +
         String(d.getMonth()+1).padStart(2,"0") + "/" +
         String(d.getFullYear()+543).slice(-2);
}

// SIGNATURE: คะแนนสุขภาพเป็นภาพตัดขวางแปลงนา ระดับน้ำ = คะแนน สี = สถานะ
function buildGauge(score, caption) {
  var wrap = el("div", "gauge-wrap");
  var s = statusOf(score);
  var g = el("div", "gauge " + (s === "none" ? "" : s));
  var water = el("div", "gauge-water");
  var read = el("div", "gauge-read");
  var hasScore = typeof score === "number";
  var fig = el("div", "gauge-figure" + (hasScore ? "" : " dim"), hasScore ? String(score) : "—");
  var unit = el("div", "gauge-unit" + (hasScore ? "" : " dim"), "คะแนนสุขภาพ");
  read.appendChild(fig); read.appendChild(unit);
  g.appendChild(water); g.appendChild(read);
  wrap.appendChild(g);

  var side = el("div", "gauge-side");
  side.appendChild(el("div", "verdict-label", "แปลงตอนนี้เป็นยังไง"));
  var name = el("div", "verdict-name " + (s === "none" ? "" : s), statusWord(s));
  side.appendChild(name);
  if (caption) side.appendChild(el("div", "read-foot", caption));
  wrap.appendChild(side);

  // ให้ระดับน้ำไหลขึ้นหลัง paint แรก เพื่อให้เห็น transition
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { water.style.height = (hasScore ? score : 0) + "%"; });
  });
  return wrap;
}

function readOut(label, value, foot, small) {
  var b = el("div");
  b.appendChild(el("div", "read-label", label));
  b.appendChild(el("div", "read-value num" + (small ? " sm" : ""), value));
  if (foot) b.appendChild(el("div", "read-foot", foot));
  return b;
}

// แสดงผลเป็น "ชื่อโรค" ไม่ใช่ตัวเลขเปอร์เซ็นต์
//
// เหตุผลที่เอาเปอร์เซ็นต์ออก: ค่าความมั่นใจของโมเดลจำแนกภาพไม่ใช่ความน่าจะเป็นจริง
// โมเดลถูกบังคับให้เลือกคำตอบเสมอและให้คะแนนรวมกันได้ 100% ทุกครั้ง
// การโชว์ "88%" จึงทำให้เกษตรกรเข้าใจผิดว่าแม่นยำ 88% ทั้งที่โมเดลให้ค่าสูงพอกัน
// กับภาพที่ไม่ใช่ใบข้าวด้วยซ้ำ ตัวเลขนี้เลยหลอกมากกว่าช่วย
//
// สิ่งที่แทนที่: บอกชื่อโรคตรงๆ และถ้าความมั่นใจต่ำกว่าเกณฑ์ให้บอกว่า
// "ระบุไม่ชัดเจน" แทนที่จะเอ่ยชื่อโรค — ความไม่แน่นอนยังสื่อถึงผู้ใช้อยู่
// เพียงแต่สื่อเป็นคำพูดที่ตีความถูก แทนตัวเลขที่ตีความผิด
function renderVerdict(host, results, opts) {
  opts = opts || {};
  host.innerHTML = "";

  var sorted = results.slice().sort(function (a, b) { return b.value - a.value; });
  var top = sorted[0];
  if (!top) return;

  var unsure = opts.threshold != null && top.value < opts.threshold;

  var card = el("div", "verdict" + (unsure ? " verdict-unsure" : ""));
  card.appendChild(el("div", "verdict-kicker", opts.kicker || "ผลที่ตรวจได้"));
  card.appendChild(el("div", "verdict-main", unsure ? "ระบุไม่ชัดเจน" : th(top.label)));

  // ชื่อคลาสภาษาอังกฤษไว้ให้ตรวจสอบย้อนกลับได้ว่าโมเดลตอบอะไรจริงๆ
  if (!unsure && th(top.label) !== top.label) {
    card.appendChild(el("div", "verdict-sub", top.label));
  }

  host.appendChild(card);

  if (unsure) {
    host.appendChild(el("div", "verdict-alt",
      "ภาพยังไม่ชัดพอ ลองถ่ายใหม่ให้ใบเต็มจอ แสงสม่ำเสมอ อย่าถ่ายย้อนแสง"));
  } else if (sorted.length > 1 && sorted[1].value > 0.05) {
    // บอกตัวเลือกรองเป็น "ชื่อ" อย่างเดียว ไม่มีตัวเลข
    // มีประโยชน์เวลาผู้ใช้เห็นอาการแล้วรู้สึกว่าน่าจะเป็นอีกโรค จะได้รู้ว่าโมเดลก็ลังเลระหว่างสองตัวนี้
    var alts = sorted.slice(1, 3)
      .filter(function (r) { return r.value > 0.05; })
      .map(function (r) { return th(r.label); });
    if (alts.length) {
      host.appendChild(el("div", "verdict-alt", "โรคที่มีลักษณะใกล้เคียง: " + alts.join(", ")));
    }
  }

  host.appendChild(el("div", "verdict-src", opts.gated
    ? "ดูจากสีและผิวของรูปก่อน ยังไม่ได้ส่งให้ตัวตรวจรูป"
    : "ผลจากตัวตรวจรูปที่สอนไว้แล้ว"));
}

function renderMix(host, pre) {
  host.innerHTML = "";
  host.appendChild(el("div", "read-label", "สัดส่วนโทนสีในภาพ"));
  var bar = el("div", "mix");
  [["var(--blade)", pre.green], ["var(--grain)", pre.yellow], ["var(--ink-faint)", pre.other]].forEach(function (x) {
    var seg = el("div");
    seg.style.background = x[0];
    seg.style.width = x[1] + "%";
    bar.appendChild(seg);
  });
  host.appendChild(bar);
  var key = el("div", "mix-key");
  [["var(--blade)", "เขียว", pre.green], ["var(--grain)", "เหลือง/น้ำตาล", pre.yellow], ["var(--ink-faint)", "สีอื่น", pre.other]]
    .forEach(function (x) {
      var s = el("span");
      var sw = el("i", "swatch");
      sw.style.background = x[0];
      s.appendChild(sw);
      s.appendChild(document.createTextNode(x[1] + " "));
      s.appendChild(el("b", "", x[2] + "%"));
      key.appendChild(s);
    });
  host.appendChild(key);
}

// ตัวรับภาพ ใช้ร่วมกันทุกหน้าที่ต้องอัปโหลดรูป
//
// ── เพิ่มการถ่ายภาพในเว็บ (2026-08) ──
//
// เดิมมีแค่การเลือกไฟล์ ซึ่งบนมือถือต้องผ่านหน้าเลือกแอปแล้วค่อยเปิดกล้อง
// และที่สำคัญกว่านั้นคือผู้ใช้ไม่รู้ว่าต้องจัดองค์ประกอบภาพอย่างไร
// จึงมักถ่ายทั้งกอมา ทำให้ใบเล็กจนโมเดลมองไม่เห็นแผลแล้วตอบว่าระบุไม่ชัดเจน
//
// กล้องในเว็บแก้ตรงจุดนั้น เพราะมีกรอบเล็งบอกตั้งแต่ตอนเล็งว่าต้องให้ใบเต็มกรอบ
// และระบบครอปเฉพาะในกรอบก่อนส่งเข้าโมเดล พื้นหลังที่ไม่เกี่ยวจึงถูกตัดทิ้งไปเลย
//
// ยังเก็บปุ่มเลือกจากคลังภาพไว้ เพราะผู้ใช้ที่ถ่ายรูปเก็บไว้แล้วต้องใช้งานได้
// และบนคอมพิวเตอร์ที่ไม่มีกล้อง ปุ่มถ่ายจะซ่อนตัวเองอัตโนมัติ
function makeIntake(opts) {
  opts = opts || {};

  // ── สไตล์ของกล้อง ──
  // ฝังไว้ในฟังก์ชันและใส่ครั้งเดียว เพื่อให้ไฟล์นี้เป็นหน่วยเดียวจบ
  // ย้ายหรือแก้ทีหลังไม่ต้องตามไปแก้ CSS อีกที่
  if (!document.getElementById("camStyles")) {
    var st = document.createElement("style");
    st.id = "camStyles";
    st.textContent =
      ".intake-acts{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}" +
      ".intake-acts .act{flex:1;min-width:140px}" +
      ".cam{position:fixed;inset:0;z-index:95;background:#0B1A12;display:flex;" +
        "flex-direction:column;align-items:center;justify-content:center}" +
      ".cam-stage{width:100%;flex:1;min-height:0;" +
        "display:flex;align-items:center;justify-content:center;overflow:hidden}" +
      /* กรอบนี้หุ้มวิดีโอพอดีตัว กรอบเล็งจึงทับพื้นที่ภาพจริงเท่านั้น
         ไม่ใช่ทับพื้นที่ว่างสีดำข้างวิดีโอตอนอัตราส่วนจอไม่ตรงกับกล้อง */
      ".cam-frame{position:relative;display:inline-flex;max-width:100%;max-height:100%}" +
      ".cam-frame video{max-width:100%;max-height:100%;display:block}" +
      /* กรอบเล็งวางทับวิดีโอ ต้อง pointer-events:none ไม่งั้นบังปุ่มที่อยู่ข้างใต้ */
      ".cam-guide{position:absolute;inset:0;pointer-events:none;" +
        "display:flex;align-items:center;justify-content:center}" +
      /* ขนาดกำหนดจาก JS ตามขนาดวิดีโอที่แสดงจริง เพื่อให้ตรงกับพื้นที่ที่ครอป */
      ".cam-box{position:relative;box-shadow:0 0 0 3000px rgba(11,26,18,.55)}" +
      ".cam-corner{position:absolute;width:26px;height:26px;border:3px solid #6FBF73}" +
      ".cam-corner.tl{top:0;left:0;border-right:none;border-bottom:none}" +
      ".cam-corner.tr{top:0;right:0;border-left:none;border-bottom:none}" +
      ".cam-corner.bl{bottom:0;left:0;border-right:none;border-top:none}" +
      ".cam-corner.br{bottom:0;right:0;border-left:none;border-top:none}" +
      ".cam-hint{position:absolute;left:0;right:0;bottom:-46px;text-align:center;" +
        "color:#F2EBDD;font-size:.85rem;line-height:1.5;padding:0 18px}" +
      ".cam-bar{display:flex;align-items:center;justify-content:space-between;" +
        "gap:18px;width:100%;padding:18px 22px 26px;flex:none}" +
      ".cam-ghost{background:none;border:1px solid rgba(255,255,255,.35);" +
        "color:#F2EBDD;border-radius:10px;padding:9px 16px;font-size:.85rem}" +
      ".cam-shutter{width:72px;height:72px;border-radius:50%;flex:none;" +
        "background:#FFFFFF;border:4px solid rgba(255,255,255,.35)}" +
      ".cam-shutter:disabled{opacity:.4}" +
      ".cam-msg{color:#F2EBDD;text-align:center;padding:28px 24px;max-width:340px;line-height:1.7}";
    document.head.appendChild(st);
  }

  var wrap = el("div");

  var zone = el("div", "intake");
  zone.tabIndex = 0;
  zone.setAttribute("role", "button");
  zone.appendChild(el("div", "intake-lead", opts.lead || "เลือกรูป หรือลากมาวาง"));
  if (opts.hint !== null) zone.appendChild(el("div", "intake-hint", opts.hint || "ถ่ายใกล้ให้เห็นแผลชัด"));

  var file = el("input", "hidden-file");
  file.type = "file";
  file.accept = "image/*";

  var acts = el("div", "intake-acts");
  var camBtn = el("button", "act act-go", "ถ่ายรูปด้วยกล้อง");
  var pickBtn = el("button", "act act-line", "เลือกจากคลังภาพ");
  acts.appendChild(camBtn);
  acts.appendChild(pickBtn);

  // ไม่มี getUserMedia แปลว่าเบราว์เซอร์เก่าหรือเปิดผ่าน http ที่ไม่ใช่ localhost
  // ซ่อนปุ่มดีกว่าปล่อยให้กดแล้ว error เพราะผู้ใช้จะคิดว่าระบบพัง
  var canCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if (!canCam) camBtn.hidden = true;

  var shot = el("div", "shot");
  shot.hidden = true;
  var img = el("img");
  img.alt = "ภาพใบข้าวที่เลือก";
  var sweep = el("div", "sweep");
  sweep.hidden = true;
  sweep.appendChild(el("div", "sweep-line"));
  shot.appendChild(img);
  shot.appendChild(sweep);

  wrap.appendChild(zone);
  wrap.appendChild(acts);
  wrap.appendChild(file);
  wrap.appendChild(shot);

  var current = null;

  // รับภาพเข้าระบบ ใช้ร่วมกันทั้งจากไฟล์และจากกล้อง
  function useSource(src) {
    var im = new Image();
    im.onload = function () {
      current = im;
      img.src = src;
      shot.hidden = false;
      opts.onReady && opts.onReady(im);
    };
    im.onerror = function () {
      opts.onFail && opts.onFail("เปิดภาพนี้ไม่ได้ ลองใหม่อีกครั้ง");
    };
    im.src = src;
  }

  function take(f) {
    if (!f || f.type.indexOf("image/") !== 0) return;
    useSource(URL.createObjectURL(f));
  }

  // ══ กล้องในเว็บ ══
  function openCamera() {
    var facing = "environment";   // กล้องหลังก่อนเสมอ เพราะถ่ายใบข้าวไม่ใช่เซลฟี่
    var stream = null;

    var cam = el("div", "cam");

    var stage = el("div", "cam-stage");
    var frame = el("div", "cam-frame");
    var video = document.createElement("video");
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;              // จำเป็นบน iOS ไม่งั้นวิดีโอจะเด้งเต็มจอเอง
    video.setAttribute("playsinline", "");
    frame.appendChild(video);

    var guide = el("div", "cam-guide");
    var box = el("div", "cam-box");
    ["tl", "tr", "bl", "br"].forEach(function (c) {
      box.appendChild(el("div", "cam-corner " + c));
    });
    box.appendChild(el("div", "cam-hint",
      "จัดใบข้าวให้เต็มกรอบ ให้เห็นแผลชัด · ระบบจะตัดเฉพาะในกรอบไปตรวจ"));
    guide.appendChild(box);
    frame.appendChild(guide);
    stage.appendChild(frame);
    guide.hidden = true;                   // ซ่อนไว้จนกว่าภาพจะมาจริง

    // ── ขนาดกรอบเล็งต้องตรงกับพื้นที่ที่ครอปเป๊ะ ──
    //
    // ถ้ากำหนดกรอบเป็น 78vw แต่ครอป 78% ของภาพจากกล้อง สองค่านี้จะไม่ตรงกัน
    // ทุกครั้งที่อัตราส่วนจอไม่เท่าอัตราส่วนกล้อง ผู้ใช้จะจัดใบให้พอดีกรอบ
    // แล้วได้ภาพที่ตัดขอบใบทิ้ง ซึ่งแย่กว่าไม่มีกรอบเสียอีกเพราะเขาเชื่อกรอบ
    //
    // จึงวัดขนาดวิดีโอที่แสดงจริงแล้วคำนวณกรอบจากค่านั้น ด้วยสัดส่วนเดียวกับตอนครอป
    var CROP_RATIO = 0.78;
    function sizeGuide() {
      var r = video.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var s = Math.round(Math.min(r.width, r.height) * CROP_RATIO);
      box.style.width = s + "px";
      box.style.height = s + "px";
    }
    window.addEventListener("resize", sizeGuide);
    window.addEventListener("orientationchange", sizeGuide);

    cam.appendChild(stage);

    var bar = el("div", "cam-bar");
    var closeBtn = el("button", "cam-ghost", "ปิด");
    var shutter = el("button", "cam-shutter");
    shutter.setAttribute("aria-label", "ถ่ายภาพ");
    shutter.disabled = true;
    var flipBtn = el("button", "cam-ghost", "สลับกล้อง");
    bar.appendChild(closeBtn);
    bar.appendChild(shutter);
    bar.appendChild(flipBtn);
    cam.appendChild(bar);

    function stopStream() {
      if (!stream) return;
      // ต้องหยุดทุก track ไม่งั้นไฟกล้องยังติดและกินแบตต่อแม้ปิดหน้าต่างไปแล้ว
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }

    function close() {
      stopStream();
      cam.remove();
      document.removeEventListener("keydown", onKey);
      window.removeEventListener("resize", sizeGuide);
      window.removeEventListener("orientationchange", sizeGuide);
    }
    function onKey(e) { if (e.key === "Escape") close(); }

    function fail(text) {
      frame.hidden = true;
      stage.appendChild(el("div", "cam-msg", text));
      shutter.disabled = true;
      flipBtn.hidden = true;
    }

    async function start() {
      stopStream();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facing },
            // ขอความละเอียดสูงไว้ก่อน เพราะเราจะครอปเหลือแค่ในกรอบ
            // ถ้าต้นทางเล็ก ภาพที่ครอปแล้วจะเล็กจนโมเดลมองไม่เห็นรายละเอียดแผล
            width: { ideal: 1920 },
            height: { ideal: 1920 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        guide.hidden = false;
        sizeGuide();
        shutter.disabled = false;
      } catch (err) {
        // แยกสาเหตุให้ชัด เพราะทางแก้ต่างกันคนละเรื่อง
        var name = err && err.name;
        if (name === "NotAllowedError" || name === "SecurityError") {
          fail("ยังไม่ได้อนุญาตให้เว็บใช้กล้อง\n\n" +
               "กดไอคอนรูปกุญแจข้างที่อยู่เว็บ แล้วเปิดสิทธิ์กล้อง " +
               "จากนั้นกดถ่ายรูปใหม่อีกครั้ง");
        } else if (name === "NotFoundError" || name === "OverconstrainedError") {
          fail("ไม่พบกล้องบนอุปกรณ์นี้\n\nใช้ปุ่มเลือกจากคลังภาพแทนได้");
        } else if (name === "NotReadableError") {
          fail("กล้องถูกแอปอื่นใช้อยู่\n\nปิดแอปกล้องหรือแอปวิดีโอคอลก่อน แล้วลองใหม่");
        } else {
          fail("เปิดกล้องไม่สำเร็จ\n\n" + (err && err.message ? err.message : "ลองใหม่อีกครั้ง"));
        }
      }
    }

    // ── ครอปเฉพาะพื้นที่ในกรอบเล็ง ──
    //
    // นี่คือหัวใจของการเพิ่มกล้อง ไม่ใช่แค่ความสะดวก
    //
    // โมเดลถูกเทรนจากภาพใบเดี่ยวเต็มเฟรม พอผู้ใช้ถ่ายทั้งกอแล้วระบบย่อทั้งภาพ
    // เหลือ 224 พิกเซล รอยโรคจะเล็กจนแทบหายไป โมเดลจึงตอบว่าระบุไม่ชัดเจน
    //
    // การครอปตามกรอบทำให้สิ่งที่ส่งเข้าโมเดลใกล้เคียงกับภาพที่มันเคยเห็นตอนเทรน
    // และผู้ใช้เห็นกรอบตั้งแต่ตอนเล็ง จึงจัดองค์ประกอบได้ถูกตั้งแต่แรก
    // ไม่ต้องมาเดาทีหลังว่าทำไมระบบตอบไม่ชัดเจน
    function capture() {
      var vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;

      // ใช้ CROP_RATIO ตัวเดียวกับที่คำนวณขนาดกรอบบนหน้าจอ
      // ถ้าแยกเป็นสองค่า วันหนึ่งจะแก้ที่เดียวแล้วลืมอีกที่ ทำให้กรอบกับภาพไม่ตรงกัน
      var side = Math.round(Math.min(vw, vh) * CROP_RATIO);
      var sx = Math.round((vw - side) / 2);
      var sy = Math.round((vh - side) / 2);

      // จำกัดที่ 1400 พอเหลือเฟือสำหรับโมเดล 224-320 และเก็บลงทะเบียน
      // ใหญ่กว่านี้เปลืองหน่วยความจำและเวลาอัปโหลดโดยไม่ได้ความแม่นเพิ่ม
      var out = Math.min(side, 1400);

      var c = document.createElement("canvas");
      c.width = out;
      c.height = out;
      c.getContext("2d").drawImage(video, sx, sy, side, side, 0, 0, out, out);

      var data = c.toDataURL("image/jpeg", 0.92);
      close();
      useSource(data);
    }

    shutter.onclick = capture;
    closeBtn.onclick = close;
    flipBtn.onclick = function () {
      facing = (facing === "environment") ? "user" : "environment";
      guide.hidden = true;
      shutter.disabled = true;
      start();
    };

    document.addEventListener("keydown", onKey);
    document.body.appendChild(cam);
    start();
  }

  camBtn.onclick = function (e) { e.preventDefault(); openCamera(); };
  pickBtn.onclick = function (e) { e.preventDefault(); file.click(); };

  zone.onclick = function () { file.click(); };
  zone.onkeydown = function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); }
  };
  zone.ondragover = function (e) { e.preventDefault(); zone.classList.add("over"); };
  zone.ondragleave = function () { zone.classList.remove("over"); };
  zone.ondrop = function (e) {
    e.preventDefault();
    zone.classList.remove("over");
    take(e.dataTransfer.files[0]);
  };
  file.onchange = function (e) { take(e.target.files[0]); };

  return {
    node: wrap,
    image: function () { return current; },
    sweeping: function (on) { sweep.hidden = !on; },
    clear: function () { current = null; shot.hidden = true; file.value = ""; }
  };
}

// แผงให้ผู้ใช้ยืนยันว่าโมเดลทายถูกหรือไม่
// ถ้าผิด ให้เลือกโรคที่ถูกต้องจากคลาสที่โมเดลรู้จัก เพื่อให้ข้อมูลนำไปเทรนต่อได้ทันที
function buildVerifyPanel(saved, res) {
  var box = el("div", "verify");
  box.appendChild(el("div", "verify-ask", "ผลนี้ตรงกับที่คุณเห็นในแปลงจริงหรือไม่"));
  box.appendChild(el("div", "verify-note",
    "คำตอบของคุณช่วยให้เรารู้ว่าระบบแม่นแค่ไหนในการใช้งานจริง"));

  var actions = el("div", "verify-acts");
  var yes = el("button", "act act-go act-sm", "ตรงกัน");
  var no = el("button", "act act-line act-sm", "ไม่ตรง แจ้งโรคที่ถูกต้อง");
  actions.appendChild(yes);
  actions.appendChild(no);
  box.appendChild(actions);

  var picker = el("div", "verify-pick");
  picker.hidden = true;
  var labels = (res.disease && res.disease.results.map(function (r) { return r.label; })) ||
               (models.disease.props && models.disease.props.labels) || [];
  var select = el("select");
  select.style.cssText = "padding:8px 11px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF;flex:1;min-width:150px";
  labels.forEach(function (l) {
    var o = el("option", "", th(l));
    o.value = l;
    select.appendChild(o);
  });
  var confirm = el("button", "act act-go act-sm", "ส่งคำตอบ");
  picker.appendChild(select);
  picker.appendChild(confirm);
  box.appendChild(picker);

  function settle(msg) {
    box.innerHTML = "";
    box.className = "verify done";
    box.appendChild(el("div", "verify-ask", msg));
  }

  function send(correct, actual) {
    [yes, no, confirm].forEach(function (b) { b.disabled = true; });
    Store.verify(saved.id, correct, actual)
      .then(function () {
        settle(correct
          ? "ขอบคุณครับ บันทึกว่าผลตรวจถูกต้องแล้ว"
          : "ขอบคุณครับ บันทึกว่าที่ถูกต้องคือ " + th(actual) + " แล้ว");
      })
      .catch(function (err) {
        box.appendChild(el("div", "flash flash-bad", err.message));
        [yes, no, confirm].forEach(function (b) { b.disabled = false; });
      });
  }

  yes.onclick = function () { send(true, null); };
  no.onclick = function () { picker.hidden = false; no.disabled = true; };
  confirm.onclick = function () { send(false, select.value); };

  return box;
}

  gaugeCard.appendChild(buildGauge(
    newest ? newest.score : null,
    newest ? "บันทึกเมื่อ " + newest.date + " · " + newest.disease : "ยังไม่มีบันทึก"
  ));
  top.appendChild(gaugeCard);

  var meters = plot();
  var mrow = el("div");
  mrow.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:16px";
  mrow.appendChild(readOut("โรคที่พบล่าสุด", newest ? newest.disease : "—", null, true));
  mrow.appendChild(readOut("pH เฉลี่ย", avgPh || "—", avgPh ? "จาก " + phValues.length + " ครั้ง" : null));
  mrow.appendChild(readOut("บันทึกทั้งหมด", String(logs.length), "รายการ"));
  var wx = readOut("อุณหภูมิ", "—", "กำลังอ่านค่า");
  wx.querySelector(".read-value").id = "wxRead";
  wx.querySelector(".read-foot").id = "wxFoot";
  mrow.appendChild(wx);
  meters.appendChild(mrow);
  top.appendChild(meters);
  root.appendChild(top);

  root.appendChild(bund("แนวโน้ม pH"));
  var phCard = plot(null);
  var cv = el("canvas");
  cv.height = 210;
  if (phValues.length < 2) {
    phCard.appendChild(stateBlock("〜", "ต้องวัด pH อย่างน้อย 2 ครั้ง", null));
  } else {
    phCard.appendChild(cv);
  }
  root.appendChild(phCard);

  if (phValues.length >= 2) {
    var series = logs.filter(function (l) { return typeof l.ph === "number"; }).slice(0, 8).reverse();
    // สีเส้นและกริดปรับตามธีมมืด ส่วนตรรกะกราฟเหมือนเดิมทุกอย่าง
    new Chart(cv, {
      type: "line",
      data: {
        labels: series.map(function (l) { return l.date; }),
        datasets: [{
          label: "ความเปรี้ยวของดิน", data: series.map(function (l) { return l.ph; }),
          borderColor: "#2E8B57", backgroundColor: "rgba(46,139,87,.10)",
          fill: true, tension: .32, pointRadius: 3, pointBackgroundColor: "#2E8B57", borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: false,
               grid: { color: "#E6F1E7" },
               ticks: { color: "#7C9385", font: { family: "IBM Plex Mono" } } },
          x: { grid: { display: false },
               ticks: { color: "#7C9385", font: { family: "IBM Plex Mono", size: 10 } } }
        }
      }
    });
  }

  // อากาศจาก open-meteo (ฟรี ไม่ต้องใช้ key) — ถ้าผู้ใช้ไม่ให้สิทธิ์ตำแหน่ง ต้องบอกให้ชัด
  // ใช้พิกัดแปลงที่ปักหมุดไว้ก่อนเสมอ ค่อยขอตำแหน่งปัจจุบันเมื่อไม่มี
  // เพราะการ์ดนี้บอกอากาศ "ที่แปลง" ไม่ใช่ "ที่ผู้ใช้ยืนอยู่"
  // ซึ่งต่างกันมากสำหรับคนที่กลับมาดูจากบ้านหรือจากในเมือง
  (async function () {
    var c = fieldCoords();
    if (!c) {
      try {
        var fix = await getFix({ timeout: 10000 });
        c = { lat: fix.lat, lon: fix.lon };
      } catch (err) {
        setWxFail(err.message);
        return;
      }
    }
    try {
      var r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + c.lat +
                          "&longitude=" + c.lon + "&current=temperature_2m,relative_humidity_2m");
      var d = await r.json();
      var v = document.getElementById("wxRead"), f = document.getElementById("wxFoot");
      if (v && d.current) {
        v.textContent = d.current.temperature_2m + "°C";
        if (f) f.textContent = "ความชื้น " + d.current.relative_humidity_2m + "%";
      }
    } catch (e) {
      setWxFail("อ่านค่าอากาศไม่ได้");
    }
  })();
  function setWxFail(msg) {
    var f = document.getElementById("wxFoot");
    if (f) f.textContent = msg;
  }

};
