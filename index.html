// ถึงจะเลือกเมนูถูก แต่คนที่ตอบคำถามนั้นได้ก็แทบไม่ต้องใช้เว็บนี้แล้ว
// คนที่ต้องใช้จริงคือคนที่ยังไม่รู้ว่ามันคืออะไร ซึ่งเดิมจะเลือกเมนูผิดตั้งแต่ก้าวแรก
views.diagnose = function (root) {
  root.appendChild(pageHead("diagnose"));

  // ── ตารางแยกโรคกับแมลงอยู่บนสุด (แก้ 2026-08) ──
  //
  // คำถามแรกที่คนยืนอยู่ในนาต้องตอบให้ได้คือ "นี่โรคหรือแมลง"
  // ถ้าเป็นแมลงแล้วไปถ่ายรูปตรวจ จะได้ชื่อโรคที่ไม่เกี่ยวกันเลย เพราะตัวตรวจรูป
  // เรียนมาจากใบข้าวเป็นโรคเท่านั้น ตารางนี้จึงต้องมาก่อนกล้อง
  //
  // แต่รายชื่อแมลงสิบชนิดไม่ต้องมาด้วย เพราะยาวเกินไปและยังไม่จำเป็นตอนนี้
  // ตารางกินพื้นที่ไม่มากและกวาดตาหาแถวที่ตรงกับที่เจอได้ใน 5 วินาที
  renderPestSection(root, "triage");

  // ── ย้ายรายชื่อแมลงไปท้ายหน้า (แก้ 2026-08) ──
  //
  // เดิมวางแมลงไว้บนสุดเพราะคนต้องรู้ก่อนว่าเป็นแมลงหรือโรค
  // แต่ของจริงคือการ์ดแมลง 8 ใบกินพื้นที่เกือบสองจอเต็ม ผู้ใช้ที่เข้ามาเพื่อ
  // ถ่ายรูปตรวจโรคต้องเลื่อนผ่านทั้งหมดก่อนจะเจอปุ่มที่เขาตั้งใจมาใช้
  // ซึ่งบนมือถือกลางนาที่สัญญาณช้าคือการทำให้คนเลิกใช้ไปเลย
  //
  // ตอนนี้เอาสิ่งที่คนตั้งใจมาทำขึ้นก่อน แล้วให้ตัวตรวจโรคเป็นตัวชี้ไปหาแมลงเอง
  // เมื่อผลตรวจไม่ชัดหรือไม่ใช่ใบข้าว ซึ่งตรงกับลำดับการตัดสินใจจริงมากกว่า
  root.appendChild(bund("ตรวจโรคจากรูป"));

  var wrap = el("div", "row-2");

  var left = plot("รูปใบข้าว");
  var intake = makeIntake({
    onReady: function () { runBtn.dataset.armed = "1"; markBrain(); },
    onFail: function (m) { showFlash(m, "bad"); }
  });
  left.appendChild(intake.node);

  var runBtn = el("button", "act act-go act-wide");
  runBtn.style.marginTop = "14px";
  runBtn.setAttribute("data-needs-brain", "");
  runBtn.dataset.readyLabel = "ตรวจภาพนี้";
  runBtn.disabled = true;
  left.appendChild(runBtn);

  var flashHost = el("div");
  left.appendChild(flashHost);
  wrap.appendChild(left);

  var right = plot("ผลตรวจ");
  var resultHost = el("div");
  resultHost.appendChild(stateBlock("◇", "ยังไม่มีผล", null));
  right.appendChild(resultHost);
  wrap.appendChild(right);

  root.appendChild(wrap);

  function showFlash(msg, kind) {
    flashHost.innerHTML = "";
    flashHost.appendChild(el("div", "flash flash-" + kind, msg));
  }

  runBtn.onclick = async function () {
    flashHost.innerHTML = "";
    runBtn.disabled = true;
    runBtn.textContent = "กำลังตรวจ";
    intake.sweeping(true);
    resultHost.innerHTML = "";
    resultHost.appendChild(stateBlock("◌", "กำลังตรวจภาพ", "ตรวจในเครื่องคุณเอง"));
    await new Promise(function (r) { setTimeout(r, 60); });

    try {
      var res = await runFullAnalysis(intake.image());
      resultHost.innerHTML = "";

      var score = healthScore(res);
      resultHost.appendChild(buildGauge(score, diagnosisName(res)));

      resultHost.appendChild(bund("ขั้นที่ 1 · เป็นใบข้าวหรือไม่"));
      var r1 = el("div");
      resultHost.appendChild(r1);
      renderVerdict(r1, res.rice.results, { kicker: "ภาพนี้คือ", gated: res.gated });

      if (res.disease) {
        resultHost.appendChild(bund("ขั้นที่ 2 · ชนิดของโรค"));
        var r2 = el("div");
        resultHost.appendChild(r2);

        // ใช้เกณฑ์ที่โมเดลกำหนดมาเอง (classification_threshold จาก Edge Impulse)
        // ต่ำกว่านี้จะไม่เอ่ยชื่อโรคเลย เพราะการเอ่ยชื่อผิดแล้วเกษตรกรไปพ่นยาตาม
        // เสียหายมากกว่าการบอกว่า "ยังระบุไม่ได้ ถ่ายใหม่"
        var thr = (models.disease.props && models.disease.props.classification_threshold) || 0.6;
        renderVerdict(r2, res.disease.results, { kicker: "โรคที่พบ", threshold: thr });

        if (res.topDisease && res.topDisease.value >= thr) {
          var rx = buildRx(res.topDisease.label);
          if (rx) resultHost.appendChild(rx);
          else resultHost.appendChild(el("div", "flash flash-bad",
            "ยังไม่มีแนวทางจัดการของโรคนี้ในฐานข้อมูล กรุณาปรึกษาเจ้าหน้าที่เกษตรในพื้นที่"));
        }
      } else {
        // ระบบแยกไม่ออกระหว่าง "ไม่ใช่ใบข้าวจริงๆ" กับ "ใช่ใบข้าวแต่ถ่ายมาไม่ดี"
        // ทั้งสองกรณีมาถึงตรงนี้เหมือนกัน จึงต้องเขียนข้อความให้ครอบคลุมทั้งคู่
        // ถ้าฟันธงว่า "ไม่ใช่ใบข้าว" อย่างเดียว เกษตรกรที่ถ่ายใบข้าวจริงมาจะงงและเลิกใช้
        // ทั้งที่แค่ถ่ายใหม่ให้ชัดขึ้นก็ผ่านแล้ว
        var miss = el("div", "flash flash-bad");
        miss.appendChild(el("div", "verify-ask",
          "นี่อาจไม่ใช่รูปใบข้าว กรุณาใช้รูปใบข้าว"));
        miss.appendChild(el("div", "verify-note",
          "ถ้าเป็นใบข้าวจริง ลองถ่ายใหม่ให้ใบเต็มจอ เห็นแผลชัด และอย่าถ่ายย้อนแสง"));
        resultHost.appendChild(miss);

        // เหตุผลทางเทคนิคยังต้องบอก แต่แยกออกมาเป็นบรรทัดรองที่ไม่แย่งความสนใจ
        // เพราะคนที่อยากรู้ว่าทำไมระบบตัดสินแบบนี้ควรตรวจสอบย้อนกลับได้
        var why = res.gated ? res.pre.why : "ตัวตรวจรูปบอกว่านี่ไม่ใช่ใบข้าว";
        resultHost.appendChild(el("div", "verdict-src", "เหตุผลของระบบ: " + why));

        // ตัวตรวจรูปเรียนมาจากใบข้าวเป็นโรคเท่านั้น มันดูแมลงไม่เป็น
        // คนที่ถ่ายรูปแมลงหรือใบที่ถูกแมลงกัดมาจะมาถึงตรงนี้ ต้องชี้ทางต่อให้
        // ไม่งั้นเขาจะคิดว่าเว็บใช้ไม่ได้ ทั้งที่ข้อมูลที่เขาต้องการอยู่ท้ายหน้าเดียวกันนี้
        var toPest = el("button", "act act-line act-sm", "อาจเป็นแมลง ดูรูปแมลงท้ายหน้า");
        toPest.style.marginTop = "10px";
        toPest.onclick = function () {
          var host = document.getElementById("pestSection");
          if (host) {
            try { host.scrollIntoView({ behavior: "smooth", block: "start" }); }
            catch (e) { host.scrollIntoView(true); }
          }
        };
        resultHost.appendChild(toPest);
      }

      // คำเตือนถาวร — ขึ้นทุกครั้งที่มีผล ไม่ว่าผลจะออกมาแบบไหน
      // วางไว้หลังแนวทางแก้ไข เพื่อให้เป็นสิ่งสุดท้ายที่ผู้ใช้อ่านก่อนลงมือทำ
      resultHost.appendChild(el("div", "flash flash-warn",
        "ให้เกษตรอำเภอยืนยันก่อนซื้อยา"));

      resultHost.appendChild(bund("หลักฐานเชิงสี"));
      var mixHost = el("div");
      resultHost.appendChild(mixHost);
      renderMix(mixHost, res.pre);

      // ── ภาพที่ไม่ใช่ใบข้าวต้องไม่เข้าทะเบียน (แก้ไข 2026-08) ──
      //
      // ทะเบียนไม่ใช่แค่ที่เก็บประวัติ แต่เป็นแหล่งข้อมูลที่ระบบเอาไปคิดต่อทั้งหมด
      // ทั้งคะแนนเฉลี่ยของแปลง กราฟแนวโน้ม และบริบทที่ส่งให้ AI ทุกคำถาม
      // ถ้าปล่อยภาพที่ระบบเองบอกว่า "ไม่ใช่ใบข้าว" เข้าไป เท่ากับยอมให้ข้อมูล
      // ที่รู้อยู่แล้วว่าไม่มีความหมายไปปนกับข้อมูลจริงอย่างถาวร แยกออกทีหลังไม่ได้
      //
      // ทางเลือกคือบันทึกแต่ใส่ธงกำกับ ซึ่งซับซ้อนกว่าและต้องไปแก้ทุกที่ที่อ่านทะเบียน
      // การไม่บันทึกตั้งแต่ต้นตรงไปตรงมากว่า และผู้ใช้แค่ถ่ายใหม่ก็จบ
      // แต่ต้องบอกให้ชัดว่าไม่ได้บันทึก ไม่ใช่เงียบไป ไม่งั้นผู้ใช้จะคิดว่าบันทึกแล้ว
      if (!res.isRice) {
        resultHost.appendChild(el("div", "flash flash-warn",
          "ยังไม่ได้เก็บผลนี้ไว้ในประวัติ เพราะระบบดูแล้วว่านี่ไม่ใช่ใบข้าว " +
          "ถ้าเป็นใบข้าวจริง ให้ถ่ายใหม่ให้ใบเต็มจอและเห็นแผลชัด แล้วตรวจอีกครั้ง"));
        showFlash("ยังไม่ได้เก็บไว้ในประวัติ เพราะไม่ใช่รูปใบข้าว", "warn");
      } else {
        // เก็บภาพย่อไว้กับบันทึกด้วย ใช้ 640px พอสำหรับย้อนดูภายหลัง
        // เล็กกว่าที่ส่งให้ Gemini (800px) เพื่อประหยัดพื้นที่เก็บ
        var saved = await Store.add({
          date: todayStamp(),
          owner: Store.profile().name,
          gps: "",
          ph: null,
          disease: diagnosisName(res),
          score: score,
          image: imageToBase64(intake.image(), 640)
        });

        showFlash(Store.isOffline()
          ? "เก็บไว้ในเครื่องแล้ว จะส่งขึ้นระบบให้เองเมื่อต่อเน็ตได้"
          : "เก็บผลไว้ในประวัติแล้ว", "ok");

        // ให้ผู้ใช้ยืนยันว่า AI ทายถูกไหม ข้อมูลนี้ใช้วัดความแม่นยำจริง
        // และชี้เป้าว่าควรเพิ่มภาพคลาสไหนตอนเทรนรอบหน้า
        if (!Store.isOffline() && saved.id) {
          resultHost.appendChild(buildVerifyPanel(saved, res));
        }
      }
    } catch (err) {
      resultHost.innerHTML = "";
      resultHost.appendChild(stateBlock("!", "ตรวจภาพไม่สำเร็จ", err.message));
      showFlash("ตรวจไม่สำเร็จ: " + err.message, "bad");
    } finally {
      intake.sweeping(false);
      runBtn.disabled = false;
      runBtn.textContent = "ตรวจภาพนี้";
    }
  };

  markBrain();

  // รายชื่อแมลงอยู่ท้ายสุด สำหรับคนที่ตรวจแล้วสงสัยว่าอาจไม่ใช่โรค
  var pestHost = el("div");
  pestHost.id = "pestSection";
  root.appendChild(pestHost);
  renderPestSection(pestHost, "list");
};

// แยกเป็นฟังก์ชันธรรมดา ไม่ใช่ views.* แล้ว เพราะไม่ได้เป็นหน้าของตัวเองอีกต่อไป
function renderPestSection(root, part) {
  if (typeof window.buildPestPage !== "function") {
    root.appendChild(stateBlock("!", "ยังเปิดส่วนแมลงไม่ได้",
      "ยังโหลดข้อมูลเรื่องแมลงขึ้นมาไม่ได้ ลองรีเฟรชหน้าดูอีกที"));
    return;
  }
  window.buildPestPage(root, {
    part: part,
    el: el, plot: plot, bund: bund, fold: fold,
    more: more, stateBlock: stateBlock, readOut: readOut,
    picLeafCompare: picLeafCompare, mediaInto: mediaInto, media: media
  });
}

// เก็บไว้เป็นฟังก์ชันช่วย ไม่ใช่หน้าแล้ว — ตารางบันทึกย้ายไปแท็บต้นทุน
// ส่วนช่องวัดค่าดินย้ายไปแท็บแปลงนา ส่วนดินซึ่งมีช่องเดียวกันอยู่ก่อนแล้ว
// ─── แท็บแปลงนา ส่วนดิน ─────────────────────────────
//
// เป็นคู่มืออ่าน ไม่ใช่เครื่องคำนวณ โดยตั้งใจ
// เหตุผล: อัตราปูนขาวที่ถูกต้องต้องมาจากปริมาณปูนที่ดินต้องการที่ได้จากการตรวจดิน
// ไม่ใช่คำนวณจาก pH อย่างเดียว การใส่ปูนเกินทำให้ดินเป็นด่างถาวรซึ่งแก้ยากกว่าเดิมมาก
// ระบบจึงบอกได้แค่ว่าดินอยู่ในสภาพไหนและควรไปปรึกษาใคร
//
// สิ่งที่ระบบทำได้จริงคือ "ปรับคู่มือให้ตรงกับบริบทของแปลงนี้"
// เพราะขั้นตอนของนาหว่านน้ำตมกับนาหว่านข้าวแห้งต่างกันคนละทิศ
// การให้อ่านคู่มือกลางที่รวมทุกแบบไว้ด้วยกันจะทำให้ทำผิดขั้นตอนได้ง่ายกว่า
// ═══════════════════════════════════════════════════
// รูปถ่ายจริงและวิดีโอ
// ═══════════════════════════════════════════════════
//
// ของทั้งหมดมาจาก media.js ที่เดียว หน้าเว็บแค่ขอด้วยคีย์
// ถ้าคีย์นั้นยังไม่มีไฟล์ ฟังก์ชันคืน null แล้วหน้าเว็บข้ามไป
// ห้ามขึ้นกรอบว่างหรือไอคอนรูปแตกเด็ดขาด เพราะทำให้ดูเหมือนเว็บพัง
// ทั้งที่ความจริงคือยังไม่ได้ใส่รูปตรงนั้น
//
// คลิป YouTube ไม่ฝัง iframe ตั้งแต่แรก
// แต่วางรูปปกกับปุ่มเล่นไว้ก่อน แล้วค่อยสร้าง iframe ตอนกด
// เหตุผล: iframe ของ YouTube ดึงสคริปต์หลายร้อยกิโลไบต์ต่อคลิปหนึ่งอัน
// หน้าที่มีคลิป 4 อันจะโหลดของพวกนั้นทั้งหมดทันทีที่เปิดหน้า
// ทั้งที่ผู้ใช้ส่วนใหญ่ไม่ได้กดดูสักอัน ซึ่งกลางนาที่สัญญาณอ่อนคือหน้าค้าง

function mediaGet(key) {
  var m = window.MEDIA && window.MEDIA[key];
  if (!m) return null;
  var has = m.img || m.yt || m.mp4 || (m.more && m.more.length);
  return has ? m : null;
}

// รูปเดี่ยว กดแล้วขยายเต็มจอ
function mediaImg(src, cap) {
  var fig = el("figure", "mv-shot");
  var im = el("img");
  im.src = src;
  im.alt = cap || "";
  im.loading = "lazy";
  im.decoding = "async";
  // รูปที่โหลดไม่ขึ้น ต้องหายไปทั้งกล่อง ไม่ใช่เหลือไอคอนรูปแตกค้างไว้
  im.onerror = function () { fig.remove(); };
  im.onclick = function () { mediaZoom(src, cap); };
  fig.appendChild(im);
  if (cap) fig.appendChild(el("figcaption", "mv-cap", cap));
  return fig;
}

// ดูรูปเต็มจอ ปิดด้วยการแตะที่ไหนก็ได้
function mediaZoom(src, cap) {
  var back = el("div", "mv-zoom");
  var im = el("img", "mv-zoom-img");
  im.src = src;
  im.alt = cap || "";
  back.appendChild(im);
  if (cap) back.appendChild(el("div", "mv-zoom-cap", cap));
  back.onclick = function () { back.remove(); };
  document.body.appendChild(back);
}

// คลิป — รองรับทั้ง YouTube และไฟล์ในเว็บเอง
function mediaClip(m) {
  var box = el("div", "mv-clip");

  if (m.yt) {
    // รูปปกดึงจาก YouTube เอง ไม่ต้องเตรียมไฟล์แยก
    var thumb = el("img", "mv-thumb");
    thumb.src = "https://i.ytimg.com/vi/" + m.yt + "/hqdefault.jpg";
    thumb.alt = m.cap || "คลิปวิดีโอ";
    thumb.loading = "lazy";
    box.appendChild(thumb);

    var play = el("button", "mv-play");
    play.setAttribute("aria-label", "เล่นคลิป " + (m.cap || ""));
    play.innerHTML = '<svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">' +
      '<path d="M8 5.5 19 12 8 18.5 z" fill="currentColor"/></svg>';
    play.onclick = function () {
      var f = el("iframe", "mv-frame");
      f.src = "https://www.youtube-nocookie.com/embed/" + m.yt + "?autoplay=1&rel=0&modestbranding=1";
      f.title = m.cap || "คลิปวิดีโอ";
      f.allow = "accelerometer; autoplay; encrypted-media; picture-in-picture";
      f.allowFullscreen = true;
      f.setAttribute("frameborder", "0");
      box.innerHTML = "";
      box.appendChild(f);
    };
    box.appendChild(play);

  } else if (m.mp4) {
    var v = el("video", "mv-video");
    v.controls = true;
    v.playsInline = true;
    // ห้ามโหลดล่วงหน้า คลิปหลายสิบเมกจะกินเน็ตของคนที่ไม่ได้ตั้งใจดู
    v.preload = "none";
    if (m.poster) v.poster = m.poster;
    var src = el("source");
    src.src = m.mp4;
    src.type = "video/mp4";
    v.appendChild(src);
    v.onerror = function () { box.remove(); };
    box.appendChild(v);
  }

  var wrap = el("figure", "mv-shot mv-clip-fig");
  wrap.appendChild(box);
  if (m.cap) wrap.appendChild(el("figcaption", "mv-cap", m.cap));
  return wrap;
}

// ตัวหลักที่หน้าเว็บเรียก — คืน null ถ้ายังไม่มีสื่อสำหรับคีย์นี้
function media(key) {
  var m = mediaGet(key);
  if (!m) return null;

  // มีคลิป ให้คลิปมาก่อนรูปนิ่งเสมอ
  if (m.yt || m.mp4) return mediaClip(m);

  var shots = [];
  if (m.img) shots.push(m.img);
  (m.more || []).forEach(function (x) { if (x) shots.push(x); });
  if (!shots.length) return null;

  if (shots.length === 1) return mediaImg(shots[0], m.cap);

  // หลายรูป เรียงเป็นแถวเลื่อนแนวนอน แบบเดียวกับแกลเลอรีที่ทุกคนเคยใช้
  var strip = el("div", "mv-row");
  shots.forEach(function (src, i) {
    strip.appendChild(mediaImg(src, i === 0 ? m.cap : null));
  });
  return strip;
}

// ใส่สื่อลงในกล่องถ้ามี คืนค่าว่าใส่ไปหรือเปล่า
// ใช้ตัวนี้แทนการเขียน if ซ้ำๆ ทุกจุดที่มีช่องใส่รูป
function mediaInto(host, key) {
  var node = media(key);
  if (!node || !host) return false;
  host.appendChild(node);
  return true;
}


// ═══════════════════════════════════════════════════
// รูปอธิบาย — วาดด้วย SVG ในหน้าเว็บเอง
// ═══════════════════════════════════════════════════
//
// ทำไมต้องเป็น SVG ไม่ใช่ไฟล์รูป
//   1. ไม่ต้องโหลดไฟล์เพิ่ม เปิดได้ตอนสัญญาณอ่อนกลางนา ซึ่งเป็นที่ที่คนใช้จริง
//   2. ใช้สีจากธีมเดียวกับทั้งเว็บ เปลี่ยนธีมแล้วรูปเปลี่ยนตาม ไม่ใช่รูปขาวโพลนบนพื้นมืด
//   3. ขยายเท่าไหร่ก็คม บนจอมือถือความละเอียดสูงไม่แตก
//
// ใช้แทนย่อหน้าอธิบายที่อ่านยาก ไม่ใช่ใส่เพิ่มจากของเดิม
// ทุกครั้งที่เพิ่มรูปตรงไหน ต้องลบข้อความที่รูปนั้นแทนออกด้วยเสมอ

function svgWrap(viewBox, inner, cls) {
  var d = el("div", "pic" + (cls ? " " + cls : ""));
  d.innerHTML = '<svg viewBox="' + viewBox + '" xmlns="http://www.w3.org/2000/svg" ' +
    'role="img" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';
  return d;
}

// ── กระสอบปุ๋ยพร้อมคำอธิบายตัวเลขสามตัว ──
//
// แทนย่อหน้าที่เคยอธิบายว่าเลขบนกระสอบสามตัวคืออะไร
// ชาวนาที่ยืนอยู่หน้าร้านปุ๋ยต้องดูรูปนี้แล้วหยิบกระสอบถูกใบได้ทันที
function picFertBag(formula) {
  var f = String(formula || "16-20-0").split("-");
  var n = f[0] || "16", p = f[1] || "20", k = f[2] || "0";

  var inner =
    // ตัวกระสอบ
    '<path d="M58 40 h84 a10 10 0 0 1 10 10 v112 a10 10 0 0 1 -10 10 h-84 a10 10 0 0 1 -10 -10 v-112 a10 10 0 0 1 10 -10 z" ' +
      'fill="var(--canopy)" stroke="var(--blade)" stroke-width="2.5"/>' +
    // ปากกระสอบเย็บ
    '<path d="M58 40 q42 -14 84 0" fill="none" stroke="var(--blade)" stroke-width="2.5"/>' +
    '<path d="M66 34 v10 M82 30 v11 M100 29 v12 M118 30 v11 M134 34 v10" stroke="var(--blade)" stroke-width="1.6" opacity=".55"/>' +
    // ตัวเลขสูตรบนกระสอบ
    '<text x="100" y="88"  text-anchor="middle" font-size="30" font-weight="700" fill="var(--blade)">' + n + '</text>' +
    '<text x="100" y="122" text-anchor="middle" font-size="30" font-weight="700" fill="var(--grain)">' + p + '</text>' +
    '<text x="100" y="156" text-anchor="middle" font-size="30" font-weight="700" fill="var(--water)">' + k + '</text>' +
    // เส้นชี้ออกไปหาคำอธิบาย
    '<path d="M152 80 h34"  stroke="var(--blade)" stroke-width="2"/>' +
    '<path d="M152 114 h34" stroke="var(--grain)" stroke-width="2"/>' +
    '<path d="M152 148 h34" stroke="var(--water)" stroke-width="2"/>' +

    '<path d="M196 82 q14 -16 28 -4 q-14 14 -28 4 z" fill="var(--blade)"/>' +
    '<text x="232" y="86"  font-size="15" fill="var(--ink)">ใบเขียว</text>' +

    '<text x="232" y="120" font-size="15" fill="var(--ink)">ราก</text>' +

    '<path d="M206 138 v22" stroke="var(--water)" stroke-width="4.5" stroke-linecap="round"/>' +

  return box;

// ── แถบวัดความเป็นกรดด่าง ──
//
// แทนคำอธิบายว่าเลขมากน้อยแปลว่าอะไร ตาเห็นตำแหน่งเข็มแล้วเข้าใจทันที
// ไม่ต้องอ่านว่า "ต่ำกว่า 5.5 คือเปรี้ยว สูงกว่า 6.5 คือด่าง"
function picPhScale(value) {
  var lo = 3, hi = 10;
  function x(v) { return 22 + ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * 286; }

  var inner =
    '<defs><linearGradient id="phg" x1="0" x2="1">' +
      '<stop offset="0"   stop-color="#C0492F"/>' +
      '<stop offset=".33" stop-color="#D9A22B"/>' +
      '<stop offset=".5"  stop-color="#2E8B57"/>' +
      '<stop offset=".62" stop-color="#2E8B57"/>' +
      '<stop offset=".8"  stop-color="#2E7D95"/>' +
      '<stop offset="1"   stop-color="#3B4E9B"/>' +
    '</linearGradient></defs>' +
    '<rect x="22" y="34" width="286" height="20" rx="10" fill="url(#phg)"/>' +
    // ช่วงที่ข้าวชอบ
    '<rect x="' + x(5.5) + '" y="29" width="' + (x(6.5) - x(5.5)) + '" height="30" rx="6" ' +
      'fill="none" stroke="var(--ink)" stroke-width="2.5"/>' +
    '<text x="' + ((x(5.5) + x(6.5)) / 2) + '" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">ข้าวชอบ</text>' +
    // ปลายสองข้าง
    '<text x="22"  y="76" font-size="14" fill="var(--ink-faint)">เปรี้ยว 3</text>' +
    '<text x="308" y="76" text-anchor="end" font-size="14" fill="var(--ink-faint)">10 ด่าง</text>';

  if (typeof value === "number" && !isNaN(value)) {
    var px = x(value);
    inner +=
      '<path d="M' + px + ' 62 l-8 12 h16 z" fill="var(--ink)"/>' +
      '<text x="' + px + '" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ink)">' +
        value.toFixed(1) + '</text>';
  }

  var box = svgWrap("0 0 330 100", inner, "pic-ph");
  box.querySelector("svg").setAttribute("aria-label",
    "แถบค่ากรดด่างจาก 3 ถึง 10 ข้าวชอบช่วง 5.5 ถึง 6.5" +
    (typeof value === "number" ? " ค่าของแปลงคุณคือ " + value.toFixed(1) : ""));
  return box;
}

// ── ทดสอบชนิดดินด้วยมือ ──
//
// แทนสามบรรทัดที่อธิบายว่ากำแล้วเป็นยังไง
// เรื่องสัมผัสอธิบายด้วยตัวหนังสือได้ยากมาก แต่วาดให้ดูแล้วเข้าใจทันที
function picSoilHand(kind) {
  var art, label;

  if (kind === "sand") {
    // กำแล้วไม่อยู่ — เม็ดดินร่วงกระจาย ไม่เกาะกันเป็นก้อนเลย
    art =

  } else if (kind === "loam") {
    // กำเป็นก้อนได้ แต่เขี่ยแล้วแยกเป็นสองซีก วาดเป็นก้อนที่ปริออกจากกัน
    art =
      '<path d="M46 34 a24 24 0 0 0 0 48 z" fill="var(--canopy)" stroke="var(--blade)" stroke-width="2.4"/>' +
      '<path d="M56 34 a24 24 0 0 1 0 48 z" fill="var(--canopy)" stroke="var(--blade)" stroke-width="2.4"/>' +
      '<path d="M51 26 l-6 8 l6 6 l-6 8" fill="none" stroke="var(--rust)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
    label = "เป็นก้อน แล้วปริ";

  } else {
    // คลึงเป็นเส้นยาวได้ไม่ขาด วาดเป็นเส้นดินโค้งยาวเส้นเดียว
    art =
      '<path d="M20 74 q10 -34 30 -30 q20 4 12 -16 q-6 -14 20 -14" ' +
        'fill="none" stroke="var(--blade)" stroke-width="11" stroke-linecap="round"/>' +
      '<path d="M20 74 q10 -34 30 -30 q20 4 12 -16 q-6 -14 20 -14" ' +
        'fill="none" stroke="var(--canopy)" stroke-width="4" stroke-linecap="round"/>';
    label = "เป็นเส้นยาว";
  }

  var box = svgWrap("0 0 100 96", art, "pic-hand");
  box.querySelector("svg").setAttribute("aria-label", label);
  // ป้ายชื่อวางนอก SVG ไม่ใช่ text ในรูป เพราะข้อความในรูปยาวแล้วโดนตัดขอบ
  // และใช้ฟอนต์เดียวกับทั้งเว็บด้วย ไม่ใช่ฟอนต์เริ่มต้นของเบราว์เซอร์

// เดาชนิดไอคอนจากชื่อวัตถุดิบ ไม่ต้องไปแก้ไฟล์ฐานความรู้
function matIconFor(name) {
  var t = String(name || "");
  if (/ซอง|พด\.|สารเร่ง/.test(t)) return "sachet";
  if (/มูล|ขี้/.test(t)) return "manure";
  // เช็กปุ๋ยซื้อก่อนเสมอ ไม่งั้น "ปุ๋ยตัวเร่งใบเขียว" จะไปเข้ากฎใบไม้แล้วได้ไอคอนผิด
  if (/ปุ๋ย|ยูเรีย|สูตร|\d-\d/.test(t)) return "bag";
  if (/เศษพืช|ฟาง|ใบ|หญ้า|ซากพืช/.test(t)) return "leaf";
  return "bag";
}

// ── ใบข้าว: โรค กับ แมลง ต่างกันยังไง ──
//
// แทนประโยคที่ว่า "โรคพืชไม่ทำให้เนื้อใบหายไป ทำได้แค่เปลี่ยนสี"
// ซึ่งเป็นกฎที่ต้องใช้ก่อนทุกครั้ง แต่อ่านเป็นตัวหนังสือแล้วนึกภาพไม่ออก
var LEAF_UID = 0;

// ── ใบข้าวเดี่ยว วาดรอยแมลงกัดหรือแผลโรค ──
//
// รอยกัดใช้วิธีตัดวงกลมสีพื้นการ์ดเข้าไปในรูปใบโดย clip ให้อยู่ในขอบใบเท่านั้น
// จึงได้รอยเว้าที่มีเส้นขอบตามจริง ไม่ใช่วงกลมลอยทับใบซึ่งดูเหมือนจุดไม่ใช่รอยแหว่ง
function picLeaf(kind) {
  var uid = "leafclip" + (++LEAF_UID);
  var LEAF = "M30 6 Q-16 48 30 96 Q76 48 30 6 Z";

  var inner =
    '<defs><clipPath id="' + uid + '"><path d="' + LEAF + '"/></clipPath></defs>' +
    '<path d="' + LEAF + '" fill="var(--canopy)" stroke="var(--blade)" stroke-width="2.2"/>' +
    '<path d="M30 8 V94" stroke="var(--blade)" stroke-width="1.3" opacity=".55"/>';

  if (kind === "pest") {
    // เนื้อใบหายไปจริง รอยเว้าอยู่ที่ขอบใบ ไม่ใช่กลางใบ
    inner +=
      '<g clip-path="url(#' + uid + ')">' +
        '<circle cx="53" cy="42" r="11" fill="var(--paper)" stroke="var(--blade)" stroke-width="2.2"/>' +
        '<circle cx="7"  cy="64" r="9"  fill="var(--paper)" stroke="var(--blade)" stroke-width="2.2"/>' +
        '<circle cx="47" cy="74" r="7"  fill="var(--paper)" stroke="var(--blade)" stroke-width="2.2"/>' +
      '</g>';
  } else {
    // เนื้อใบครบทุกจุด เปลี่ยนแค่สี
    inner +=
      '<ellipse cx="40" cy="38" rx="5.5" ry="9" transform="rotate(-28 40 38)" fill="var(--rust)" opacity=".8"/>' +
      '<ellipse cx="19" cy="60" rx="4.6" ry="7.5" transform="rotate(-28 19 60)" fill="var(--rust)" opacity=".8"/>' +
      '<ellipse cx="38" cy="74" rx="3.6" ry="6" transform="rotate(-28 38 74)" fill="var(--rust)" opacity=".8"/>';
  }

  var box = svgWrap("0 0 60 102", inner, "pic-leaf");
  box.querySelector("svg").setAttribute("aria-label",
    kind === "pest" ? "ใบข้าวถูกแมลงกัดจนขอบใบแหว่ง เนื้อใบหายไป"
                    : "ใบข้าวเป็นโรค มีแผลสีน้ำตาลแต่เนื้อใบยังครบ");
  return box;
}

// ── เทียบใบสองแบบ แทนกฎที่ต้องท่องว่า "โรคไม่ทำให้เนื้อใบหายไป" ──

  var row = el("div", "leafrow");
  [["pest", "แมลง", "ใบแหว่ง เนื้อใบหาย"],

// ── วงจรหมุนเวียนทรัพยากรในนาข้าว ──
//
// ของที่ชาวนาเคยเผาทิ้งหรือขายถูกๆ กลับมาเป็นต้นทุนที่ประหยัดได้ในรอบถัดไป
// เรื่องนี้อธิบายเป็นย่อหน้าแล้วไม่มีใครอ่าน แต่พอวาดเป็นวงกลมที่มีลูกศรวนกลับ
// คนดูออกทันทีว่าปลายทางของทุกอย่างคือกลับลงดินแปลงเดิม
var CYCLE_UID = 0;
function picCycle() {
  var uid = "cyc" + (++CYCLE_UID);
  var C = 150, R = 95;
  function pt(deg) {
    var a = deg * Math.PI / 180;
    return [(C + R * Math.cos(a)).toFixed(1), (C + R * Math.sin(a)).toFixed(1)];
  }
  function arc(d1, d2) {
    var a = pt(d1), b = pt(d2);
    return '<path d="M' + a[0] + ' ' + a[1] + ' A' + R + ' ' + R + ' 0 0 1 ' + b[0] + ' ' + b[1] + '" ' +
           'fill="none" stroke="var(--blade)" stroke-width="2.6" marker-end="url(#' + uid + ')"/>';
  }
  function node(cx, cy, text, tone) {
    var w = 88, h = 34;
    return '<rect x="' + (cx - w / 2) + '" y="' + (cy - h / 2) + '" width="' + w + '" height="' + h + '" rx="9" ' +
             'fill="' + (tone || "var(--canopy)") + '" stroke="var(--blade)" stroke-width="2"/>' +
           '<text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle" font-size="14" ' +
             'font-weight="600" fill="var(--deep)">' + text + '</text>';
  }

  var inner =
    '<defs><marker id="' + uid + '" viewBox="0 0 10 10" refX="8" refY="5" ' +
      'markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">' +
      '<path d="M0 0 L10 5 L0 10 z" fill="var(--blade)"/></marker></defs>' +
    '<circle cx="' + C + '" cy="' + C + '" r="' + R + '" fill="none" ' +
      'stroke="var(--rule)" stroke-width="1.6" stroke-dasharray="5 6"/>' +
    arc(294, 336) + arc(24, 66) + arc(114, 156) + arc(204, 246) +
    node(C, 23, "ปลูกข้าว") +
    node(248, C, "เก็บเกี่ยว") +
    node(C, 277, "ของเหลือ", "var(--tint-warn)") +
    node(52, C, "บำรุงดิน") +
    '<text x="' + C + '" y="' + (C - 4) + '" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)">ไม่มีอะไร</text>' +
    '<text x="' + C + '" y="' + (C + 16) + '" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)">ต้องเผาทิ้ง</text>';

  var box = svgWrap("0 0 300 300", inner, "pic-cycle");
  box.querySelector("svg").setAttribute("aria-label",
    "วงจรหมุนเวียน ปลูกข้าว เก็บเกี่ยว ของเหลือ บำรุงดิน แล้ววนกลับไปปลูกข้าวรอบใหม่");
  return box;
}

// ── ส่วนวงจรหมุนเวียน วางท้ายแท็บแปลงนา ──
//
// วางไว้ท้ายสุดโดยตั้งใจ เพราะเป็นเรื่องของ "รอบหน้า" ไม่ใช่สิ่งที่ต้องทำวันนี้
// คนที่เปิดแท็บนี้มาหาว่าต้องใส่ปุ๋ยอะไรจะได้คำตอบไปแล้วตั้งแต่ด้านบน
// ตารางส่วนผสมปุ๋ย ใช้ตัวเลขจาก calc.inputs ก่อนเสมอเพราะเป็นข้อมูลที่แยกช่องไว้แล้ว
// ถ้าชนิดปุ๋ยนั้นไม่มี calc ค่อยถอยไปแยกตัวเลขจากข้อความในรายการส่วนผสม
function recipeTable(t) {
  var tab = el("div", "mtab");
  var head = el("div", "mtab-head");
  head.appendChild(el("div", "", "วัตถุดิบ"));
  head.appendChild(el("div", "", "ปริมาณ"));
  tab.appendChild(head);

  function row(name, amount) {
    var r = el("div", "mtab-row");
    var k = el("div", "mtab-k");
    k.appendChild(matIcon(matIconFor(name)));
    k.appendChild(document.createTextNode(name));
    r.appendChild(k);
    r.appendChild(el("div", "mtab-v num", amount));
    tab.appendChild(r);
  }

  if (t.calc && t.calc.inputs && t.calc.inputs.length) {
    t.calc.inputs.forEach(function (x) {
      row(x.name, x.per.toLocaleString("th-TH") + " " + x.unit);
    });
  } else {
    (t.recipe.items || []).forEach(function (line) {
      // แยกตัวเลขกับหน่วยออกจากท้ายข้อความ เช่น "มูลสัตว์ 200 กิโลกรัม"
      var m = /^(.*?)\s*(?:จำนวน\s*)?([\d,]+)\s*(\S+)\s*$/.exec(line);
      if (m) row(m[1].trim(), m[2] + " " + m[3]);
      else row(line, "");
    });
  }
  return tab;
}

    burn.appendChild(more("เรื่องที่ไม่ใช่เงิน",

views.season = function (root) {
  if (!window.VARIETY_GUIDE) return;

  root.appendChild(bund("ฤดูนี้"));
  var card = plot(null);

  var row = el("div");
  row.style.cssText = "display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap";

  // ── พันธุ์ข้าว ──
  var kBox = el("div");
  kBox.appendChild(el("div", "read-foot", "พันธุ์ข้าว"));
  var kSel = el("select");
  kSel.style.cssText = "padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);min-width:210px";

  // ขึ้นพันธุ์ที่ปลูกกันมากก่อน ที่เหลือกดดูได้ ไม่ต้องเลื่อนผ่าน 8 ตัวเลือกทุกครั้ง
  var showAll = false;
  function fillMenu() {
    kSel.innerHTML = "";
    var oNone = el("option", null, "ยังไม่ระบุพันธุ์");
    oNone.value = "";
    kSel.appendChild(oNone);
    [["photo", "ข้าวนาปี"], ["nonphoto", "ข้าวนาปรัง"]].forEach(function (g) {
      var grp = document.createElement("optgroup");
      grp.label = g[1];
      window.VARIETY_GUIDE.varieties
        .filter(function (v) { return (g[0] === "photo") === !!v.photo; })
        .filter(function (v) { return showAll || v.common; })
        .forEach(function (v) {
          var o = el("option", null, farmerName(v));
          o.value = v.key;
          grp.appendChild(o);
        });
      if (grp.children.length) kSel.appendChild(grp);
    });
    kSel.value = fieldVarietyKey() || "";
  }
  fillMenu();
  // พันธุ์ที่บันทึกไว้อาจไม่อยู่ในกลุ่มที่ปลูกกันมาก ต้องกางรายการเต็มให้เอง
  // ไม่งั้นเมนูจะเด้งกลับเป็น "ยังไม่ระบุพันธุ์" ทั้งที่ผู้ใช้เคยเลือกไว้แล้ว
  if (fieldVarietyKey() && kSel.value !== fieldVarietyKey()) { showAll = true; fillMenu(); }
  kBox.appendChild(kSel);
  row.appendChild(kBox);

  // ── วันหว่าน ──
  var dBox = el("div");
  dBox.appendChild(el("div", "read-foot", "วันหว่าน"));
  var dIn = el("input");
  dIn.type = "date";
  dIn.style.cssText = "padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm)";
  var sd = fieldSowDate();
  if (sd) dIn.value = sd.toISOString().slice(0, 10);
  dBox.appendChild(dIn);
  row.appendChild(dBox);

  var save = el("button", "act act-go act-sm", "บันทึก");
  row.appendChild(save);
  card.appendChild(row);

  var moreVar = el("button", "act act-line act-sm", "ไม่เจอพันธุ์ที่ปลูก");
  moreVar.style.marginTop = "9px";
  moreVar.onclick = function () {
    showAll = !showAll;
    fillMenu();
    moreVar.textContent = showAll ? "ย่อรายการ" : "ไม่เจอพันธุ์ที่ปลูก";
  };
  card.appendChild(moreVar);

  var out = el("div");
  out.style.marginTop = "14px";
  card.appendChild(out);

  function paintCal() {
    out.innerHTML = "";
    var k = kSel.value;
    if (!k || !dIn.value) return;
    var v = window.findVariety(k);
    var cal = window.varietyCalendar(k, new Date(dIn.value));
    if (!cal) return;

    var g = el("div", "row-3");
    [["ใส่ปุ๋ยครั้งที่ 2", cal.text.fert2],
     ["ข้าวออกดอก",      cal.text.bloom],
     ["เก็บเกี่ยว",       cal.text.harvest]
    ].forEach(function (c) {
      var b = el("div");
      b.appendChild(readOut(c[0], c[1], null));
      g.appendChild(b);
    });
    out.appendChild(g);

    // จุดอ่อนของพันธุ์มีผลกับการเชื่อผลตรวจโรค จึงต้องเห็น ไม่ใช่ซ่อน
    if (v && v.weakDisease && v.weakDisease.length) {
      out.appendChild(el("div", "flash flash-warn", "พันธุ์นี้ไม่ทนโรค: " + v.weakDisease.join(", ")));
    }
  }

  save.onclick = function () {
    setFieldVarietyKey(kSel.value || null);
    setFieldSowDate(dIn.value || null);
    paintCal();
    save.textContent = "บันทึกแล้ว";
    setTimeout(function () { save.textContent = "บันทึก"; }, 1500);
  };
  kSel.onchange = paintCal;
  dIn.onchange = paintCal;
  paintCal();

  root.appendChild(card);
};


views.soil = async function (root) {
  root.appendChild(pageHead("soil"));

  if (!G) {
    root.appendChild(stateBlock("!", "ไม่พบไฟล์ฐานความรู้",

    return;
  }

  var logs = plotLogs(await Store.list());
  var phs = logs.filter(function (l) { return typeof l.ph === "number"; });

  // วิธีทำนากับชนิดดินของแปลงหนึ่งไม่เปลี่ยนบ่อย จำไว้ในเครื่องจะได้ไม่ต้องเลือกใหม่ทุกครั้ง
  var KEY = plotKey("soil");
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { saved = {}; }
  var pick = {
    method: G.methods[saved.method] ? saved.method : "wet",
    soil:   G.soils[saved.soil]     ? saved.soil   : "clay"
  };
  function remember() {
    try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) { /* พื้นที่เต็ม */ }
  }

  // ══════════════════════════════════════════════
  // ส่วนที่ 1 · ช่องกรอกทั้งหมดรวมอยู่บนสุดการ์ดเดียว
  // ══════════════════════════════════════════════
  //
  // วิธีทำนา ชนิดดิน และค่า pH คือสามอย่างที่ผู้ใช้ต้อง "ป้อนเข้าไป"
  // เดิมกระจายอยู่คนละที่ ต้องเลื่อนขึ้นลงสลับกับผลลัพธ์
  // ตอนนี้อยู่ด้วยกันหมด ส่วนที่เหลือของหน้าเป็นผลลัพธ์ล้วน ไม่มีอะไรให้กดอีก
  root.appendChild(bund("ข้อมูลแปลง"));
  var form = plot(null);

  function pickerBox(label, dict, getKey, onPick) {
    var box = el("div");
    box.style.marginBottom = "15px";
    box.appendChild(el("div", "read-label", label));
    var row = el("div");
    row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-top:6px";
    function paint() {
      row.innerHTML = "";
      Object.keys(dict).forEach(function (k) {
        var b = el("button", "act act-sm " + (k === getKey() ? "act-go" : "act-line"), dict[k].thai);
        b.onclick = function () { onPick(k); paint(); };
        row.appendChild(b);
      });
    }
    paint();
    box.appendChild(row);
    return box;
  }

  form.appendChild(pickerBox("วิธีทำนา", G.methods,
    function () { return pick.method; },
    function (k) { pick.method = k; remember(); paintResults(); }));

  var soilBox = pickerBox("ชนิดดินในแปลง", G.soils,
    function () { return pick.soil; },
    function (k) { pick.soil = k; remember(); paintResults(); });

  // วิธีดูชนิดดินด้วยมือ แสดงตรงนี้เลย ไม่ซ่อนไว้ในปุ่มกด
  // เพราะคนที่กำลังจะเลือกคือคนที่ยังไม่แน่ใจว่าแปลงตัวเองเป็นดินอะไร
  // วิธีดูชนิดดินด้วยมือ วาดเป็นรูป ไม่ใช่บรรยายเป็นตัวหนังสือ
  // เรื่องสัมผัสอย่าง "กำแล้วร่วน" กับ "กำแล้วเป็นก้อน" อธิบายด้วยคำได้ยากมาก
  var handTest = el("div", "handrow");
  // เรียงให้ตรงกับลำดับปุ่มเลือกชนิดดินด้านบนเป๊ะๆ
  // ถ้าสลับลำดับ ผู้ใช้จะจับคู่รูปกับปุ่มผิดโดยไม่ทันสังเกต
  Object.keys(G.soils).forEach(function (k) {
    // รูปถ่ายจริงชนะรูปวาดเสมอถ้ามี เพราะเรื่องเนื้อดินต้องเห็นของจริงถึงเทียบกับในมือได้
    var real = media("soil-" + k);
    handTest.appendChild(real || picSoilHand(k));
  });
  soilBox.appendChild(handTest);
  form.appendChild(soilBox);

  // ── ค่า pH ──
  //
  // จิ้ม 3 ครั้งต่อจุดแล้วเฉลี่ย เพราะเครื่องวัดถูกๆ อ่านเพี้ยนได้ 0.3-0.5 หน่วยต่อครั้ง
  // ถ้าเชื่อค่าจากการจิ้มครั้งเดียวแล้วเอาไปคิดว่าจะใส่ปูนกี่ตัน ความเพี้ยนจะกลายเป็นเงินจริง
  var READS = 3;
  var START_POINTS = 5;
  var phPoints = [];

  var phHead = el("div");
  phHead.style.marginBottom = "6px";
  phHead.appendChild(el("div", "read-label", "ค่า pH"));
  form.appendChild(phHead);
  // แถบสีบอกช่วงที่ข้าวชอบ แทนประโยคที่ต้องอ่านแล้วนึกภาพเอง
  var phScaleHost = el("div");
  phScaleHost.appendChild(picPhScale(null));
  form.appendChild(phScaleHost);

  var phGrid = el("div", "phgrid");
  var gHead = el("div", "phgrid-head");
  ["จุดวัด", "ครั้งที่ 1", "ครั้งที่ 2", "ครั้งที่ 3", "ค่าเฉลี่ยของจุด"].forEach(function (t) {
    gHead.appendChild(el("div", "", t));
  });
  phGrid.appendChild(gHead);
  var phBody = el("div");
  phGrid.appendChild(phBody);
  form.appendChild(phGrid);

  function addPoint() {
    var idx = phPoints.length;
    var row = el("div", "phrow");
    var name = el("div", "phrow-name", "จุดที่ " + (idx + 1));
    row.appendChild(name);

    var fields = [];
    for (var r = 0; r < READS; r++) {
      var inp = el("input");
      inp.inputMode = "decimal";
      inp.placeholder = "0.0";
      inp.oninput = phRecalc;
      row.appendChild(inp);
      fields.push(inp);
    }

    var end = el("div", "phrow-end");
    var avgTag = el("div", "phpt-avg", "—");
    end.appendChild(avgTag);

    // จุดที่เพิ่มเองเอาออกได้ ส่วน 5 จุดแรกเอาออกไม่ได้
    // เพราะกดพลาดแล้วต้องกรอกใหม่หมด ซึ่งน่าหงุดหงิดกว่าประโยชน์ที่ได้
    if (idx >= START_POINTS) {
      var drop = el("button", "phpt-drop", "เอาออก");
      drop.onclick = function () {
        row.remove();
        phPoints = phPoints.filter(function (p) { return p.row !== row; });
        renumber();
        phRecalc();
      };
      end.appendChild(drop);
    }
    row.appendChild(end);

    phPoints.push({ row: row, fields: fields, avgTag: avgTag, name: name });
    phBody.appendChild(row);
    relabel();
  }

  // เลขจุดต้องเรียง 1,2,3 เสมอ ถ้าเอาจุดกลางออกแล้วไม่เรียงใหม่
  // จะเหลือ "จุดที่ 1, จุดที่ 3, จุดที่ 4" ซึ่งคนกรอกจะงงว่าจุดที่ 2 หายไปไหน
  function renumber() {
    phPoints.forEach(function (p, i) { p.name.textContent = "จุดที่ " + (i + 1); });
    relabel();
  }

  // หัวตารางถูกซ่อนบนมือถือ ช่องกรอกจึงต้องมีชื่อของตัวเองให้โปรแกรมอ่านหน้าจอบอกได้
  function relabel() {
    phPoints.forEach(function (p, i) {
      p.fields.forEach(function (f, r) {
        f.setAttribute("aria-label", "จุดที่ " + (i + 1) + " ครั้งที่ " + (r + 1));
      });
    });
  }

  for (var pn = 0; pn < START_POINTS; pn++) addPoint();

  var addBtn = el("button", "act act-line act-wide", "+ เพิ่มอีก 1 จุด");
  addBtn.style.marginTop = "4px";
  addBtn.onclick = function () { addPoint(); phRecalc(); };
  form.appendChild(addBtn);

  var phOut = el("div", "phsum");
  form.appendChild(phOut);

  // เฉลี่ยเฉพาะครั้งที่กรอกจริง ไม่นับช่องว่างเป็นศูนย์
  // ถ้านับเป็นศูนย์ คนที่จิ้มได้ 2 ครั้งคือ 6.0 กับ 6.2 จะได้ค่าเฉลี่ย 4.07 ซึ่งผิดไปคนละเรื่อง
  function pointAvg(p) {
    var v = p.fields
      .map(function (f) { return parseFloat(f.value); })
      .filter(function (x) { return !isNaN(x) && x > 0; });
    if (!v.length) return null;
    return { avg: v.reduce(function (a, b) { return a + b; }, 0) / v.length,
             n: v.length,
             spread: Math.max.apply(null, v) - Math.min.apply(null, v) };
  }

  // ค่าของทั้งแปลง = เฉลี่ยของค่าเฉลี่ยรายจุด ไม่ใช่เฉลี่ยจากทุกช่องรวมกัน
  // ไม่งั้นจุดที่กรอกครบ 3 ครั้งจะมีน้ำหนักมากกว่าจุดที่กรอกครั้งเดียวโดยไม่มีเหตุผล
  function phValues() {
    return phPoints.map(pointAvg).filter(Boolean).map(function (p) { return p.avg; });
  }
  function phAverage(vals) {
    return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
  }

  var phMsg = el("div");

  function phRecalc() {
    phPoints.forEach(function (p) {
      var r = pointAvg(p);
      if (!r) {
        p.avgTag.textContent = "—";
        p.avgTag.className = "phpt-avg";
        return;
      }
      if (r.avg < 3 || r.avg > 10) {
        p.avgTag.textContent = "เลขผิดปกติ";
        p.avgTag.className = "phpt-avg bad";
        return;
      }
      // 3 ครั้งที่จิ้มจุดเดียวกันไม่ควรต่างกันเกิน 0.5 ถ้าเกินแปลว่าหัววัดแนบดินไม่ดี
      if (r.n >= 2 && r.spread > 0.5) {
        p.avgTag.textContent = r.avg.toFixed(2) + " · ควรจิ้มใหม่";
        p.avgTag.className = "phpt-avg warn";
        return;
      }
      p.avgTag.textContent = r.avg.toFixed(2) + (r.n < READS ? " (" + r.n + " ครั้ง)" : "");
      p.avgTag.className = "phpt-avg ok";
    });

    var vals = phValues();
    phOut.innerHTML = "";

    if (!vals.length) {
      phScaleHost.innerHTML = "";
      phScaleHost.appendChild(picPhScale(null));
      paintResults();
      return;
    }

    if (vals.filter(function (v) { return v < 3 || v > 10; }).length) {
      phOut.appendChild(el("div", "flash flash-warn", "ค่าควรอยู่ 3–10"));
      paintResults();
      return;
    }

    var avg = phAverage(vals);
    // เข็มบนแถบสีต้องขยับตามที่พิมพ์ทันที ไม่ต้องรอกดบันทึก
    phScaleHost.innerHTML = "";
    phScaleHost.appendChild(picPhScale(avg));
    phOut.appendChild(el("div", "phsum-label", "ค่าเฉลี่ยของทั้งแปลง"));
    phOut.appendChild(el("div", "phsum-val", avg.toFixed(2)));
    phOut.appendChild(el("div", "phsum-foot", "เฉลี่ยจาก " + vals.length + " จุดที่กรอกแล้ว"));

    // ดินที่ต่างกันเกิน 1 หน่วยระหว่างจุด ค่าเฉลี่ยเดียวอธิบายไม่ได้ ต้องแยกโซนจัดการ
    var spread = Math.max.apply(null, vals) - Math.min.apply(null, vals);
    if (vals.length >= 2 && spread >= 1.0) {
      phOut.appendChild(el("div", "phsum-foot",
        "ต่างกัน " + spread.toFixed(1) + " หน่วย · ควรแยกดูแลเป็นโซน"));
    }

    paintResults();
  }

  var phSave = el("button", "act act-go act-wide", "บันทึกค่าที่วัดได้");
  phSave.style.marginTop = "15px";
  form.appendChild(phSave);
  form.appendChild(phMsg);

  phSave.onclick = async function () {
    var vals = phValues();
    phMsg.innerHTML = "";

    if (!vals.length) {
      phMsg.appendChild(el("div", "flash flash-warn", "กรอกค่าที่วัดได้อย่างน้อย 1 จุดก่อนกดบันทึก"));
      return;
    }
    if (vals.filter(function (v) { return v < 3 || v > 10; }).length) {
      phMsg.appendChild(el("div", "flash flash-warn", "มีค่าที่เกินช่วง 3 ถึง 10 แก้ก่อนแล้วค่อยบันทึก"));
      return;
    }

    phSave.disabled = true;
    phSave.textContent = "กำลังบันทึก";

    try {
      // ใช้ Store.add ตัวเดียวกับบันทึกสำรวจ ค่า pH จึงไปอยู่ในทะเบียนเดียวกัน
      await Store.add({
        date: todayStamp(),
        owner: Store.profile().name || "ไม่ระบุ",
        gps: "",
        ph: Math.round(phAverage(vals) * 100) / 100,
        disease: "วัดความเปรี้ยวของดิน (ก่อนปลูก)",
        score: null
      });

      phMsg.appendChild(el("div", "flash flash-ok", Store.isOffline()
        ? "เก็บไว้ในเครื่องแล้ว จะส่งขึ้นระบบให้เองเมื่อต่อเน็ตได้"
        : "บันทึกแล้ว"));
      setTimeout(function () { open(tabOf("soil")); }, 900);
    } catch (err) {
      phMsg.appendChild(el("div", "flash flash-warn",
        (err && err.message) || "บันทึกไม่ได้ ลองกดใหม่อีกครั้ง"));
    }

    phSave.disabled = false;
    phSave.textContent = "บันทึกค่าที่วัดได้";
  };

  root.appendChild(form);

  // ══════════════════════════════════════════════
  // ส่วนที่ 2 · ผลลัพธ์ทั้งหมด แสดงตายตัว ไม่มีแท็บให้กด
  // ══════════════════════════════════════════════
  var resultHost = el("div");
  root.appendChild(resultHost);

  // ค่าที่ใช้แปลผล เอาค่าที่กำลังพิมพ์ก่อน ถ้ายังไม่พิมพ์ค่อยใช้ค่าที่บันทึกไว้ล่าสุด
  // เพราะคนที่เพิ่งกรอกอยากเห็นผลทันทีโดยไม่ต้องกดบันทึกก่อน
  function activePh() {
    var vals = phValues().filter(function (v) { return v >= 3 && v <= 10; });
    if (vals.length) {
      return { ph: Math.round(phAverage(vals) * 100) / 100, live: true, n: vals.length };
    }
    if (phs.length) {
      return { ph: phs[0].ph, live: false, date: phs[0].date, created_at: phs[0].created_at };
    }
    return null;
  }

  function paintResults() {
    resultHost.innerHTML = "";
    var cur = activePh();
    var m = G.methods[pick.method], sl = G.soils[pick.soil];

    // ── สภาพดินจากค่า pH ──
    resultHost.appendChild(bund("ผลตรวจดิน"));
    var phCard = plot(null);
    if (!cur) {
      phCard.appendChild(stateBlock("◇", "ยังไม่มีค่า pH", "กรอก pH ด้านบน"));
    } else {
      var band = window.readSoilPh(cur.ph);
      var color = band.key === "bad" ? "var(--rust)" : band.key === "warn" ? "var(--grain)" : "var(--blade)";

      var head = el("div");
      head.style.cssText = "display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px";
      var big = el("div", "num", cur.ph.toFixed(2));
      big.style.cssText = "font-size:2.4rem;font-weight:500;line-height:1;color:" + color;
      head.appendChild(big);
      var side = el("div");
      var nm = el("div", "", band.title);
      nm.style.cssText = "font-weight:600;font-size:1.05rem;color:" + color;
      side.appendChild(nm);
      side.appendChild(el("div", "read-foot", cur.live
        ? "จากค่าที่กำลังกรอก " + cur.n + " จุด · ยังไม่ได้บันทึก"
        : "วัดเมื่อ " + cur.date));
      head.appendChild(side);
      phCard.appendChild(head);

      // เหลือเฉพาะสิ่งที่ต้องลงมือทำ ส่วนคำอธิบายว่าเลขนี้แปลว่าอะไรอยู่หลังปุ่ม
      phCard.appendChild(el("p", "", band.todo));
      phCard.appendChild(more("ทำไม", band.say));

      // เทียบกับค่าที่บันทึกไว้ล่าสุด ดูว่าเข้าใกล้หรือออกห่างช่วง 5.5-6.5
      // ไม่ดูทิศทางตัวเลขอย่างเดียว เพราะ pH ขึ้นจาก 5.0 เป็น 6.0 คือดีขึ้น แต่ 7.0 เป็น 8.0 คือแย่ลง
      if (cur.live && phs.length) {
        var prev = phs[0].ph;
        var diff = cur.ph - prev;
        function offIdeal(p) { return p < 5.5 ? 5.5 - p : (p > 6.5 ? p - 6.5 : 0); }
        var verdict = Math.abs(diff) < 0.3
          ? "ใกล้เคียงค่าเดิม อาจเป็นความคลาดเคลื่อนของเครื่องวัด"
          : (offIdeal(cur.ph) < offIdeal(prev)
              ? "ขยับเข้าใกล้ช่วงที่ข้าวชอบมากขึ้น"
              : (offIdeal(cur.ph) > offIdeal(prev)
                  ? "ห่างจากช่วงที่ข้าวชอบมากขึ้น"
                  : "ยังอยู่ในช่วงที่ข้าวชอบทั้งสองครั้ง"));
        phCard.appendChild(el("div", "read-foot",
          "ครั้งก่อนวัดได้ " + prev.toFixed(1) + " · " + verdict));
      }

      // ค่าเก่าเกิน 4 เดือนอาจไม่ตรงกับสภาพวันนี้แล้ว
      if (!cur.live) {
        var age = (Date.now() - new Date(cur.created_at || Date.now()).getTime()) / 86400000;
        if (age > 120) {
          phCard.appendChild(el("div", "flash flash-warn",
            "ค่าเกิน 4 เดือน ควรวัดใหม่"));
        }
      }
    }
    resultHost.appendChild(phCard);

    // ── ดินเปรี้ยวและดินด่าง แสดงเฉพาะอันที่ตรงกับค่าที่วัดได้ ──
    //
    // เดิมแสดงทั้งสองอันเสมอ ซึ่งทำให้ผู้ใช้ที่ดินเปรี้ยวเห็นวิธีแก้ดินด่างด้วย
    // แล้วอาจเผลอทำตามจนดินเสียหนักกว่าเดิม เพราะสองปัญหานี้แก้กันคนละทาง
    // ถ้าดินอยู่ในช่วงที่ดีอยู่แล้ว ไม่ต้องแสดงการ์ดปัญหาเลย แค่บอกว่ายังไม่มีปัญหา
    //
    // ใช้ readSoilPh เป็นตัวตัดสินที่เดียว ห้ามเขียนเกณฑ์ตัวเลขซ้ำที่นี่
    // ไม่งั้นวันหนึ่งแก้เกณฑ์ที่ soil-guide.js แล้วหน้านี้จะไม่ตรงกัน
    if (G.problems) {
      var matched = cur ? (window.readSoilPh(cur.ph) || {}).problem : null;

      if (!cur) {
        // ยังไม่ได้วัด pH ไม่ต้องแสดงวิธีแก้ปัญหาที่ยังไม่รู้ว่ามีไหม
      } else if (matched && G.problems[matched]) {
        resultHost.appendChild(bund(G.problems[matched].thai + " แก้ยังไง"));
        renderPhProblems([matched], matched);
      } else {
        // pH อยู่ในช่วงที่ดี ไม่ต้องแสดงวิธีแก้ปัญหาที่ยังไม่มี
        resultHost.appendChild(el("div", "flash flash-ok",
          "pH " + cur.ph.toFixed(1) + " ปกติ ไม่ต้องแก้"));
      }
    }

    function renderPhProblems(phKeys, matched) {
      phKeys.forEach(function (k) {
        var pr = G.problems[k];
        var isMine = (k === matched);
        var card = plot(null);
        card.style.marginBottom = "13px";
        if (isMine) card.style.borderColor = "var(--blade)";

        var ttl = el("div");
        ttl.style.cssText = "display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px";
        var tname = el("div", "", pr.thai);
        tname.style.cssText = "font-weight:600;font-size:1.02rem";
        ttl.appendChild(tname);
        if (isMine) ttl.appendChild(el("span", "tag-yes", "ตรงกับค่าที่วัดได้"));
        card.appendChild(ttl);

        card.appendChild(more("อาการที่เห็น", pr.sign + "\n\n" + pr.why));

        // ── แยกความรุนแรง ไม่เหมารวมว่ากรดคือกรดจัด ──
        // วิธีหว่านปูน 1-4 ตันต่อไร่ เป็นของดินเปรี้ยวจัดที่ pH ต่ำกว่า 4.5
        // ถ้าดินแค่เป็นกรดแล้วใส่ปูนขนาดนั้น จะดันขึ้นไปเป็นด่างซึ่งแก้ยากกว่า
        var latestPh = cur ? cur.ph : null;
        var isSevereAcid = (k === "acid" && latestPh !== null && latestPh < 4.5);
        if (k === "acid" && latestPh !== null && !isSevereAcid) {
          card.appendChild(el("div", "flash flash-warn",
            "pH " + latestPh.toFixed(1) + " ยังไม่ต้องใส่ปูนมาก เริ่มจากวิธีที่ไม่ใช้ปูน"));
        }

        card.appendChild(el("div", "rx-sect", "วิธีแก้ เรียงจากต้นทุนต่ำไปสูง"));
        pr.fixes.forEach(function (fx, i) {
          var usesLime = /ปูน/.test(fx.title + " " + fx.detail) &&
                         /ตันต่อไร่|กิโลกรัมต่อไร่/.test(fx.detail);
          var costLabel = fx.cost;
          var costNote = null;
          if (costLabel && costLabel.length > 40) { costNote = costLabel; costLabel = null; }
          if (k === "acid" && usesLime && !isSevereAcid) {
            costLabel = "เฉพาะ pH ต่ำกว่า 4.5";
          }

      body.appendChild(el("p", "", sl.trait));
    }, false));
    resultHost.appendChild(sc);

  }

  paintResults();
};

        // ── ปุ๋ยเคมี ──
        //
        // ใช้พันธุ์ข้าวของแปลงที่บันทึกไว้ ไม่ให้เลือกซ้ำในหน้านี้
        // เพราะพันธุ์เป็นคุณสมบัติของแปลง ไม่ใช่ตัวเลือกของการคำนวณ
        // และผู้ใช้จำนวนมากไม่รู้ว่าข้าวตัวเองออกรวงตามฤดูหรือไม่
        // การให้เลือกเองที่นี่เสี่ยงเลือกผิดจนปุ๋ยครั้งที่ 2 คลาดไปเท่าตัว
        if (t.calc.mode === "chem") {
          var isPhoto = fieldVariety() !== "nonphoto";
          var vKey = isPhoto ? "sensitive" : "nonsensitive";
          var first = t.calc.first[vKey];
          var second = t.calc.second[vKey];
          var bagKg = t.calc.bagKg || 50;
          var formula = formulaIn.value;

          function bags(kg) { return Math.ceil(kg / bagKg); }

          grid.appendChild(readOut("ครั้งที่ 1 · " + formula,
            fmt(rai * first.min) + "-" + fmt(rai * first.max) + " กก.",
            first.min + "-" + first.max + " กก./ไร่ · " + bags(rai * first.min) + "-" + bags(rai * first.max) + " กระสอบ"));

          // เสริมตัวทำให้ต้นแข็งต้องเข้าเงื่อนไขครบสองข้อ ไม่ใช่ดูชนิดดินอย่างเดียว
          // ตัวเลขตัวท้ายของสูตรคือตัวทำให้ต้นแข็ง ถ้าไม่เป็นศูนย์แปลว่ามีมาให้แล้ว
          // การเสริม 0-0-60 ซ้ำจะได้เกินความต้องการเกินเท่าตัวโดยไม่ได้ผลผลิตเพิ่ม
          var kInFormula = parseFloat(String(formula).split("-")[2]);
          var hasK = !(kInFormula === 0);
          var sandy = soilIn.value === "sand";

          if (hasK) {
            grid.appendChild(readOut("เสริมตัวทำให้ต้นแข็ง", "ไม่ต้องเสริม",
              "สูตร " + formula + " มีตัวทำให้ต้นแข็งอยู่แล้ว เสริมซ้ำจะเกินเท่าตัว"));
          } else if (!sandy) {
            grid.appendChild(readOut("เสริมตัวทำให้ต้นแข็ง", "ไม่ต้องเสริม",
              "ดินเหนียวและดินร่วนมักมีตัวทำให้ต้นแข็งเพียงพออยู่แล้ว"));
          } else {
            grid.appendChild(readOut("เสริม 0-0-60",
              fmt(rai * t.calc.potash.min) + "-" + fmt(rai * t.calc.potash.max) + " กก.",
              t.calc.potash.min + "-" + t.calc.potash.max + " กก./ไร่ · ใส่พร้อมครั้งที่ 1"));
          }

          grid.appendChild(readOut("ครั้งที่ 2 · ยูเรีย 46-0-0",
            fmt(rai * second.urea) + " กก.",
            second.urea + " กก./ไร่ · " + bags(rai * second.urea) + " กระสอบ"));

          outHost.appendChild(grid);

          // ── ค่าใช้จ่ายรวม ──
          //
          // ดึงราคาจาก COST_GUIDE.fertPrices ซึ่งเป็นชุดเดียวกับแท็บต้นทุน
          // ถ้าเก็บราคาไว้สองที่ ตัวเลขจะเพี้ยนกันทันทีที่แก้ที่เดียว
          //
          // แสดงเป็นช่วงต่ำ-สูงตามที่ฐานข้อมูลให้มา ไม่ยุบเป็นค่ากลางค่าเดียว
          // เพราะราคาปุ๋ยต่างกันมากตามร้าน ยี่ห้อ และช่วงเวลา
          // การให้ตัวเลขเดียวทำให้ดูแม่นกว่าความจริง แล้วผู้ใช้ไปวางแผนเงินผิด
          var CG = window.COST_GUIDE;
          if (CG && CG.fertPrices && CG.fertPrices.items) {
            function baht(n) { return Math.round(n).toLocaleString("th-TH"); }
            function priceOf(code) {
              return CG.fertPrices.items.filter(function (x) { return x.formula === code; })[0] || null;
            }

            var lines = [], sumLow = 0, sumHigh = 0, missing = [];

            // คิดจากจำนวนกระสอบที่ต้องซื้อจริง ไม่ใช่จากน้ำหนักที่ใช้
            // เพราะร้านไม่ขายเศษกระสอบ ผู้ใช้ต้องจ่ายเต็มกระสอบอยู่ดี
            // ใช้ปลายสูงของช่วงอัตราเป็นฐาน เพื่อไม่ให้ประเมินงบต่ำกว่าที่จ่ายจริง
            function addLine(label, code, bagCount) {
              var p = priceOf(code);
              if (!p) { missing.push(code); return; }
              sumLow += p.low * bagCount;
              sumHigh += p.high * bagCount;
              lines.push({ label: label, bags: bagCount, low: p.low * bagCount, high: p.high * bagCount });
            }

            addLine("ครั้งที่ 1 · " + formula, formula, bags(rai * first.max));
            if (!hasK && sandy) {
              addLine("เสริม 0-0-60", "0-0-60", Math.ceil(rai * t.calc.potash.max / bagKg));
            }
            addLine("ครั้งที่ 2 · ยูเรีย", "46-0-0", bags(rai * second.urea));

            if (lines.length) {
              var costBox = el("div");
              costBox.style.marginTop = "16px";
              costBox.appendChild(el("div", "rx-sect", "ค่าปุ๋ยโดยประมาณ"));

              lines.forEach(function (ln) {
                var row = el("div");
                row.style.cssText = "display:flex;justify-content:space-between;gap:12px;padding:8px 0;" +
                  "border-bottom:1px solid var(--rule-soft);font-size:.87rem";
                var lf = el("div");
                lf.appendChild(el("span", "", ln.label));
                var qty = el("span", "", "  " + ln.bags + " กระสอบ");
                qty.style.color = "var(--ink-soft)";
                lf.appendChild(qty);
                row.appendChild(lf);
                row.appendChild(el("span", "num",
                  ln.low === ln.high ? baht(ln.low) : baht(ln.low) + "-" + baht(ln.high)));
                costBox.appendChild(row);
              });

              var totalRow = el("div");
              totalRow.style.cssText = "display:flex;justify-content:space-between;gap:12px;padding:12px 0 4px;font-weight:500";
              totalRow.appendChild(el("span", "", "รวมทั้งฤดู"));
              totalRow.appendChild(el("span", "num",
                (sumLow === sumHigh ? baht(sumLow) : baht(sumLow) + "-" + baht(sumHigh)) + " บาท"));
              costBox.appendChild(totalRow);

              costBox.appendChild(el("div", "read-foot", "เฉลี่ย " +
                (sumLow === sumHigh ? baht(sumLow / rai) : baht(sumLow / rai) + "-" + baht(sumHigh / rai)) +
                " บาทต่อไร่"));

              if (missing.length) {
                costBox.appendChild(el("div", "read-foot",
                  "ยังไม่มีราคาของ " + missing.join(", ") + " ในระบบ จึงยังไม่ได้รวมในยอดนี้"));
              }

              costBox.appendChild(el("div", "flash flash-warn",
                "ราคาอ้างอิง " + (CG.fertPrices.asOf || CG.asOf) + " " + (CG.fertPrices.unit || "") +
                " · ราคาปุ๋ยขึ้นลงตามฤดูและแต่ละร้านไม่เท่ากัน ถามราคาจริงจากร้านแถวบ้านก่อนวางแผนเงิน " +
                "ดูราคาล่าสุดได้ที่แท็บต้นทุน"));

              outHost.appendChild(costBox);
            }
          }


          var chemNote = el("div");
          chemNote.style.marginTop = "16px";
          chemNote.appendChild(el("div", "rx-sect", "จังหวะที่ต้องใส่"));
          chemNote.appendChild(el("p", "", "ครั้งที่ 1 — " + t.calc.first.timing));
          chemNote.appendChild(el("p", "", "ครั้งที่ 2 — " + second.timing));
          chemNote.appendChild(el("div", "read-foot", t.calc.second.check));
          outHost.appendChild(chemNote);

          outHost.appendChild(el("div", "flash flash-warn",
            "คำนวณจากพันธุ์ที่บันทึกไว้ในแปลง คือ" +
            (isPhoto ? "ข้าวนาปี เช่น หอมมะลิ ข้าวเหนียว" : "ข้าวนาปรัง") +
            " ถ้าไม่ตรงให้แก้ที่แท็บแปลงนาก่อน เพราะปุ๋ยครั้งที่ 2 ของสองกลุ่มต่างกันเท่าตัว"));

        } else if (t.calc.perRai != null) {
          var total = rai * t.calc.perRai;
          grid.appendChild(readOut("ปุ๋ยหมักที่ต้องใช้", fmt(total) + " " + t.calc.unit, t.calc.perRaiText));
          var piles = Math.ceil(total);
          grid.appendChild(readOut("จำนวนกองที่ต้องทำ", String(piles) + " กอง", "กองละ 1 ตัน"));
          outHost.appendChild(grid);

          var mat = el("div");
          mat.style.marginTop = "16px";
          mat.appendChild(el("div", "rx-sect", "วัตถุดิบที่ต้องเตรียม"));
          // ── วัตถุดิบพร้อมช่องกรอกราคา ──
          //
          // ไม่ใส่ราคาตั้งต้นให้ เพราะวัตถุดิบปุ๋ยหมักส่วนใหญ่เป็นของที่มีอยู่แล้วในแปลง
          // เศษพืชแห้งกับมูลสัตว์มักได้ฟรีจากนาและคอกตัวเอง ส่วนสารเร่ง พด.1 ขอฟรีได้
          // ถ้าใส่ราคากลางให้ ระบบจะบอกว่าต้นทุนหลายพันทั้งที่หลายคนจ่ายศูนย์บาท
          // ซึ่งทำให้ปุ๋ยหมักดูแพงกว่าความจริงจนคนเลิกสนใจ ทั้งที่เป็นทางที่ถูกที่สุด
          //
          // เว้นว่างไว้แปลว่าไม่มีต้นทุน ใครต้องซื้อจริงก็กรอกเฉพาะรายการนั้น
          var priceKey = "smartrice-fertcost:" + (Session.user ? Session.user.username : "guest");
          var savedPrices = {};
          try { savedPrices = JSON.parse(localStorage.getItem(priceKey) || "{}"); } catch (e) { savedPrices = {}; }

          var priceIns = [];
          t.calc.inputs.forEach(function (x, xi) {
            var line = el("div");
            line.style.cssText = "display:flex;justify-content:space-between;gap:12px;align-items:center;" +
              "padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:.88rem;flex-wrap:wrap";

            var left = el("div");
            left.style.cssText = "flex:1;min-width:140px;display:flex;align-items:center";
            left.appendChild(matIcon(matIconFor(x.name)));
            var txt = el("div");
            txt.appendChild(el("div", "", x.name));
            txt.appendChild(el("div", "read-foot", fmt(x.per * total) + " " + x.unit));
            left.appendChild(txt);
            line.appendChild(left);

            var pIn = el("input");
            pIn.className = "num-in";
            pIn.inputMode = "decimal";
            pIn.placeholder = "บาท/" + x.unit;
            pIn.style.cssText = "max-width:120px";
            if (savedPrices[x.name] != null) pIn.value = savedPrices[x.name];
            line.appendChild(pIn);

            priceIns.push({ name: x.name, qty: x.per * total, unit: x.unit, input: pIn });
            mat.appendChild(line);
          });

          var sumRow = el("div");
          sumRow.style.cssText = "display:flex;justify-content:space-between;gap:12px;padding:12px 0 4px;font-weight:500";
          sumRow.appendChild(el("span", "", "ค่าวัตถุดิบรวม"));
          var sumVal = el("span", "num", "0 บาท");
          sumRow.appendChild(sumVal);
          mat.appendChild(sumRow);

          var sumFoot = el("div", "read-foot",
            "พด.1 ขอฟรีที่สถานีพัฒนาที่ดิน");
          mat.appendChild(sumFoot);

          function sumMaterials() {
            var totalCost = 0, filled = 0, store = {};
            priceIns.forEach(function (it) {
              var v = parseFloat(it.input.value);
              if (isFinite(v) && v > 0) {
                totalCost += v * it.qty;
                filled++;
                store[it.name] = v;
              }
            });
            try { localStorage.setItem(priceKey, JSON.stringify(store)); } catch (e) { /* พื้นที่เต็ม */ }

            sumVal.textContent = Math.round(totalCost).toLocaleString("th-TH") + " บาท";
            if (!filled) {
              sumVal.textContent = "ยังไม่ได้ใส่ราคา";
            } else if (rai > 0) {
              sumVal.textContent = Math.round(totalCost).toLocaleString("th-TH") + " บาท · " +
                Math.round(totalCost / rai).toLocaleString("th-TH") + " บาท/ไร่";
            }
          }

          priceIns.forEach(function (it) { it.input.oninput = sumMaterials; });
          sumMaterials();

          outHost.appendChild(mat);

        } else {
          // อัตราบางชนิดเป็นค่าเดียว ไม่ใช่ช่วง เช่นเมล็ดปอเทืองสำหรับหว่านคือ 5 กก./ไร่
          // ถ้าแสดงเป็น "50-50 กก." จะดูเหมือนระบบคำนวณพลาด จึงยุบเหลือค่าเดียว
          var lo = rai * t.calc.perRaiMin, hi = rai * t.calc.perRaiMax;
          var seedText = (t.calc.perRaiMin === t.calc.perRaiMax)
            ? fmt(hi) + " " + t.calc.unit
            : fmt(lo) + "-" + fmt(hi) + " " + t.calc.unit;
          grid.appendChild(readOut("เมล็ดที่ต้องซื้อ", seedText, t.calc.perRaiText));
          outHost.appendChild(grid);

          // ── ค่าเมล็ดพันธุ์ ──
          //
          // ไม่ใส่ราคาตั้งต้นเพราะราคาเมล็ดปอเทืองต่างกันมากตามแหล่งที่ซื้อ
          // และบางปีกรมพัฒนาที่ดินแจกฟรีในโครงการส่งเสริม ซึ่งทำให้ต้นทุนเป็นศูนย์
          // การใส่ราคากลางให้จะทำให้คนที่ขอฟรีได้เข้าใจผิดว่าต้องจ่าย
          var seedKey = "smartrice-seedcost:" + (Session.user ? Session.user.username : "guest");
          var seedBox = el("div");
          seedBox.style.marginTop = "16px";
          seedBox.appendChild(el("div", "rx-sect", "ค่าเมล็ดพันธุ์"));

          var seedRow = el("div");
          seedRow.style.cssText = "display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap";
          var seedF = el("div", "inp");
          seedF.style.cssText = "flex:1;min-width:150px";
          seedF.appendChild(el("label", "", "ราคาเมล็ด (บาท/" + t.calc.unit + ")"));
          var seedIn = el("input");
          seedIn.className = "num-in";
          seedIn.inputMode = "decimal";
          seedIn.placeholder = "ถ้าได้ฟรีไม่ต้องใส่";
          try {
            var sv = localStorage.getItem(seedKey);
            if (sv) seedIn.value = sv;
          } catch (e) { /* อ่านไม่ได้ก็ปล่อยว่าง */ }
          seedF.appendChild(seedIn);
          seedRow.appendChild(seedF);
          seedBox.appendChild(seedRow);

          var seedOut = el("div");
          seedOut.style.marginTop = "10px";
          seedBox.appendChild(seedOut);
          seedBox.appendChild(el("div", "read-foot",
            "บางปีกรมพัฒนาที่ดินแจกเมล็ดปอเทืองฟรี ลองถามหมอดินอาสาในตำบลก่อนไปซื้อ"));

          function sumSeed() {
            seedOut.innerHTML = "";
            var pr = parseFloat(seedIn.value);
            try {
              if (isFinite(pr) && pr > 0) localStorage.setItem(seedKey, String(pr));
              else localStorage.removeItem(seedKey);
            } catch (e) { /* พื้นที่เต็ม */ }

            if (!isFinite(pr) || pr <= 0) {
              seedOut.appendChild(el("div", "read-foot", "ใส่ราคาเมล็ดเพื่อดูว่าต้องใช้เงินเท่าไหร่"));
              return;
            }
            var costLo = lo * pr, costHi = hi * pr;
            var txt = (t.calc.perRaiMin === t.calc.perRaiMax)
              ? Math.round(costHi).toLocaleString("th-TH")
              : Math.round(costLo).toLocaleString("th-TH") + "-" + Math.round(costHi).toLocaleString("th-TH");
            var perRai = (t.calc.perRaiMin === t.calc.perRaiMax)
              ? Math.round(costHi / rai).toLocaleString("th-TH")
              : Math.round(costLo / rai).toLocaleString("th-TH") + "-" + Math.round(costHi / rai).toLocaleString("th-TH");
            seedOut.appendChild(readOut("ค่าเมล็ดรวม", txt + " บาท", perRai + " บาท/ไร่"));
          }

          seedIn.oninput = sumSeed;
          sumSeed();
          outHost.appendChild(seedBox);
        }

        // ── ปฏิทินนับถอยหลัง ──
        if (t.calc.timeline && dateIn && dateIn.value) {
          var plantDay = new Date(dateIn.value + "T00:00:00");
          var tl = t.calc.timeline;
          var plowDay = new Date(plantDay); plowDay.setDate(plowDay.getDate() - tl.wait);
          var sowDay  = new Date(plowDay);  sowDay.setDate(sowDay.getDate() - tl.grow);

          function thDate(d) {
            return d.toLocaleDateString("th-TH", { day: "numeric", month: "long", year: "numeric" });
          }

          var cal = el("div");
          cal.style.marginTop = "18px";
          cal.appendChild(el("div", "rx-sect", "ปฏิทินนับถอยหลัง"));
          [["หว่านเมล็ดปอเทือง", sowDay, "เริ่มต้นที่นี่"],
           ["ไถกลบตอนออกดอก", plowDay, "หลังหว่าน " + tl.grow + " วัน"],
           ["เริ่มปลูกข้าวได้", plantDay, "หลังไถกลบ " + tl.wait + " วัน"]].forEach(function (x, i) {
            var line = el("div");
            line.style.cssText = "display:flex;gap:12px;align-items:baseline;padding:9px 0;" +
              "border-bottom:1px solid var(--rule-soft)";
            var n = el("span", "num", String(i + 1));
            n.style.cssText = "flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;" +
              "align-items:center;justify-content:center;background:var(--tint-ok);color:var(--deep);font-size:.75rem";
            line.appendChild(n);
            var mid = el("div");
            mid.style.flex = "1";
            mid.appendChild(el("div", "", x[0]));
            mid.appendChild(el("div", "read-foot", x[2]));
            line.appendChild(mid);
            var dt = el("span", "num", thDate(x[1]));
            dt.style.cssText = "font-size:.85rem;color:var(--deep);font-weight:500;text-align:right";
            line.appendChild(dt);
            cal.appendChild(line);
          });

          // เตือนถ้าวันหว่านผ่านไปแล้ว — เป็นข้อผิดพลาดที่พบบ่อยที่สุดของปุ๋ยพืชสด
          // เพราะต้องเริ่มก่อนปลูกข้าวถึง 70 วัน ซึ่งคนมักนึกไม่ถึง
          var daysLeft = Math.ceil((sowDay - new Date()) / 86400000);
          if (daysLeft < 0) {
            cal.appendChild(el("div", "flash flash-bad",
              "วันที่ควรหว่านปอเทืองผ่านมาแล้ว " + Math.abs(daysLeft) + " วัน " +
              "ถ้ายังยืนยันจะปลูกข้าวตามวันที่กำหนด อาจไม่ทันรอบนี้ ควรเลื่อนวันปลูกข้าวออกไป " +
              "หรือเปลี่ยนไปใช้ปุ๋ยหมักกับปุ๋ยคอกซึ่งเตรียมได้เร็วกว่า"));
          } else if (daysLeft <= 7) {
            cal.appendChild(el("div", "flash flash-warn",
              "เหลืออีก " + daysLeft + " วันก่อนถึงวันที่ควรหว่าน ควรเตรียมเมล็ดพันธุ์ไว้ให้พร้อม"));
          } else {
            cal.appendChild(el("div", "flash flash-ok",

var MOC_RICE_CODES = [
  { id: "R11055", name: "ข้าวเปลือกหอมมะลิ" },

function mocYmd(d) {
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

// ย้อนหลัง 14 วัน เพราะบางสินค้าไม่ได้สำรวจทุกวัน
// ถ้าขอแค่วันนี้แล้วไม่มีข้อมูล จะดูเหมือนระบบพังทั้งที่แค่ยังไม่ถึงรอบสำรวจ
//
// เบราว์เซอร์อาจบล็อก cross-origin ไป moc.go.th จึงลองผ่าน Worker ของแอปก่อน
async function fetchMocPrice(code) {
  var to = new Date();
  var from = new Date();
  from.setDate(from.getDate() - 14);
  var qs = "product_id=" + code.id + "&from_date=" + mocYmd(from) + "&to_date=" + mocYmd(to);

  try {
    var viaWorker = await fetch(API_BASE + "/moc-price?" + qs);
    if (viaWorker.ok) return await viaWorker.json();
  } catch (e) { /* ไม่มี endpoint กันชน ลองยิงตรงต่อ */ }

  var direct = await fetch("https://dataapi.moc.go.th/gis-product-price?" + qs);
  if (!direct.ok) throw new Error("HTTP " + direct.status);
  return await direct.json();
}

function renderMyPrices(root) {
  root.appendChild(bund("ราคาที่จดเอง"));

  var myKey = "smartrice-shop:" + (Session.user ? Session.user.username : "guest");
  var myList = [];
  try { myList = JSON.parse(localStorage.getItem(myKey) || "[]"); } catch (e) { myList = []; }

  var myHost = el("div");

  function saveMy() {
    try { localStorage.setItem(myKey, JSON.stringify(myList)); } catch (e) { /* พื้นที่เต็ม */ }
  }

  function paintMy() {
    myHost.innerHTML = "";
    if (!myList.length) {
      myHost.appendChild(el("div", "read-foot",
        "ยังไม่มีรายการ"));
      return;
    }
    myList.forEach(function (item, i) {
      var row = PriceUI.row(item.kind || "seed", item.name,
        [item.shop ? "ร้าน " + item.shop : "", item.date || ""].filter(Boolean).join(" · "),
