<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartRice AI — ระบบตรวจโรคข้าวและจัดการแปลงนา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #14261A;
    --text: #3C4A41;
    --muted: #7A8B80;
    --green: #1B7A45;
    --green-dark: #155C34;
    --green-deep: #0F4A2B;
    --green-light: #E9F6EE;
    --green-border: #C9E7D5;
    --surface: #FFFFFF;
    --bg: #F4FAF6;
    --border: #E1EDE5;
    --danger: #C0392B;
    --danger-bg: #FDEEEC;
    --warn: #B8860B;
    --warn-bg: #FDF6E3;
    --sidebar: #0F4A2B;
    --sidebar-hover: #166A3D;
    --font: 'IBM Plex Sans Thai', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font); color: var(--text);
    background: var(--bg); line-height: 1.6;
  }
  h1,h2,h3 { margin: 0; color: var(--ink); }
  button { font-family: var(--font); cursor: pointer; }
  input, select, textarea { font-family: var(--font); }
  :focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Layout ---------- */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 230px; flex-shrink: 0; background: var(--sidebar);
    display: flex; flex-direction: column; position: sticky; top: 0;
    height: 100vh; overflow-y: auto;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 18px; color: #fff; font-weight: 700; font-size: 1.1rem;
  }
  .nav { flex: 1; padding: 0 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 11px 14px; margin-bottom: 3px; border: none; background: transparent;
    color: #C9E3D4; font-size: .92rem; text-align: left; border-radius: 9px;
    transition: background .15s, color .15s;
  }
  .nav-item:hover { background: rgba(255,255,255,.09); color: #fff; }
  .nav-item.active { background: #1B7A45; color: #fff; font-weight: 600; }
  .nav-item svg { flex-shrink: 0; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px clamp(16px,3vw,32px); background: var(--surface);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30;
  }
  .page-title { font-size: 1.4rem; font-weight: 700; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .search-box {
    display: flex; align-items: center; gap: 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 15px;
  }
  .search-box input { border: none; background: transparent; outline: none; font-size: .88rem; width: 150px; }
  .avatar {
    display: flex; align-items: center; gap: 8px; background: var(--green-light);
    border: 1px solid var(--green-border); border-radius: 999px; padding: 5px 14px 5px 5px;
    font-size: .86rem; font-weight: 600; color: var(--green-deep);
  }
  .avatar-circle {
    width: 26px; height: 26px; border-radius: 50%; background: var(--green);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: .8rem; font-weight: 700;
  }

  .breadcrumb { padding: 12px clamp(16px,3vw,32px); font-size: .84rem; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
  .breadcrumb b { color: var(--ink); font-weight: 600; }

  .content { padding: clamp(16px,3vw,26px) clamp(16px,3vw,32px) 60px; }

  /* ---------- Cards ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px,1fr)); gap: 14px; margin-bottom: 18px; }
  .stat-label { font-size: .82rem; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .stat-value { font-size: 1.75rem; font-weight: 700; color: var(--green); line-height: 1.2; }
  .stat-value.danger { color: var(--danger); font-size: 1.3rem; }
  .stat-value.plain { color: var(--ink); font-size: 1.5rem; }

  .grid-2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

  .tag {
    display: inline-block; font-size: .72rem; font-weight: 600; padding: 3px 10px;
    border-radius: 999px; background: var(--green-light); color: var(--green-deep);
    border: 1px solid var(--green-border); margin-bottom: 10px;
  }

  /* ---------- Table ---------- */
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th {
    text-align: left; padding: 10px 8px; border-bottom: 2px solid var(--border);
    font-weight: 600; color: var(--ink); white-space: nowrap;
  }
  td { padding: 11px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .disease-cell { color: var(--danger); font-weight: 500; }
  .disease-cell.ok { color: var(--green); }

  /* ---------- Forms ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 620px) { .form-grid { grid-template-columns: 1fr; } }
  .field label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 9px; font-size: .9rem; background: var(--surface); color: var(--text);
  }
  .field input:focus { border-color: var(--green); outline: none; }
  .field input[readonly] { background: var(--bg); color: var(--muted); }

  .btn {
    border: none; border-radius: 999px; padding: 11px 24px;
    font-size: .92rem; font-weight: 600; transition: background .15s, opacity .15s;
  }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--green-deep); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-blue { background: #2563EB; color: #fff; }
  .btn-blue:hover { background: #1D4ED8; }
  .btn-full { width: 100%; display: block; text-align: center; }

  .dropzone {
    border: 1.5px dashed var(--border); border-radius: 11px; padding: 26px 16px;
    text-align: center; cursor: pointer; background: var(--bg); transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--green); background: var(--green-light); }
  .dropzone-text { font-weight: 600; font-size: .93rem; color: var(--ink); }
  .file-input { display: none; }

  .preview-wrap { margin-top: 14px; position: relative; border-radius: 11px; overflow: hidden; border: 1px solid var(--border); }
  .preview-wrap img { display: block; width: 100%; max-height: 280px; object-fit: contain; background: var(--bg); }
  .scan { position: absolute; inset: 0; background: rgba(27,122,69,.06); pointer-events: none; }
  .scan-beam { position: absolute; left: 0; right: 0; height: 24%; top: -24%; background: linear-gradient(180deg, rgba(27,122,69,0), rgba(27,122,69,.4), rgba(27,122,69,0)); }
  @media (prefers-reduced-motion: no-preference) {
    .scan-beam { animation: scan 1.5s ease-in-out infinite; }
    @keyframes scan { 0% { top:-24%; } 100% { top:100%; } }
  }

  /* ---------- Results ---------- */
  .res-section-title { font-size: .88rem; font-weight: 700; color: var(--green); margin: 16px 0 4px; }
  .res-note { font-size: .78rem; color: var(--muted); margin-bottom: 10px; }
  .res-row { display: grid; grid-template-columns: minmax(96px,auto) 1fr 46px; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; margin-bottom: 3px; }
  .res-row.top { background: var(--green-light); border: 1px solid var(--green-border); }
  .res-label { font-weight: 600; font-size: .88rem; }
  .res-row.top .res-label { color: var(--green-deep); }
  .res-track { background: var(--border); border-radius: 999px; height: 8px; overflow: hidden; }
  .res-fill { height: 100%; background: var(--muted); border-radius: 999px; }
  .res-row.top .res-fill { background: var(--green); }
  .res-pct { text-align: right; font-size: .85rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .res-row.top .res-pct { color: var(--green-deep); font-weight: 700; }

  .color-bar { display: flex; height: 9px; border-radius: 999px; overflow: hidden; background: var(--border); margin-top: 4px; }
  .color-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: .78rem; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  /* ---------- Chat ---------- */
  .chat-log { min-height: 260px; max-height: 420px; overflow-y: auto; padding: 4px; }
  .msg { padding: 12px 15px; border-radius: 11px; margin-bottom: 10px; font-size: .9rem; max-width: 88%; }
  .msg.ai { background: var(--green-light); border-left: 3px solid var(--green); color: var(--text); }
  .msg.me { background: var(--bg); border: 1px solid var(--border); margin-left: auto; }
  .chat-input-row { display: flex; gap: 9px; margin-top: 12px; }
  .chat-input-row input { flex: 1; padding: 11px 15px; border: 1px solid var(--border); border-radius: 999px; font-size: .9rem; outline: none; }
  .chat-input-row input:focus { border-color: var(--green); }

  /* ---------- Misc ---------- */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: .9rem; }
  .status-line { font-size: .78rem; color: var(--muted); margin-top: 10px; }
  .alert { padding: 11px 15px; border-radius: 9px; font-size: .86rem; margin-top: 12px; }
  .alert.err { background: var(--danger-bg); color: var(--danger); border: 1px solid #F0C8C2; }
  .alert.ok { background: var(--green-light); color: var(--green-deep); border: 1px solid var(--green-border); }
  .list-item { display: flex; gap: 12px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--border); }
  .list-item:last-child { border-bottom: none; }
  .list-main { flex: 1; min-width: 0; }
  .list-title { font-weight: 600; font-size: .92rem; color: var(--ink); }
  .list-sub { font-size: .82rem; color: var(--muted); }
  #map { height: 380px; border-radius: 11px; border: 1px solid var(--border); }
  canvas { max-width: 100%; }

  .mobile-nav-toggle { display: none; background: none; border: none; padding: 6px; }
  @media (max-width: 820px) {
    .sidebar { position: fixed; left: 0; top: 0; z-index: 60; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .mobile-nav-toggle { display: block; }
    .search-box { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <path d="M15 27C15 27 7 21.5 7 13.5C7 8.5 10.5 4 15 3C19.5 4 23 8.5 23 13.5C23 21.5 15 27 15 27Z" fill="#4ADE80"/>
        <path d="M15 27V13.5C15 9.5 13 5.5 10.5 3.5" stroke="#0F4A2B" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      SmartRice AI
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mobile-nav-toggle" id="navToggle" aria-label="เปิดเมนู">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="#14261A" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#7A8B80" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="#7A8B80" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="globalSearch" placeholder="ค้นหาใน Field Log...">
        </div>
        <div class="avatar"><span class="avatar-circle" id="avatarLetter">ก</span><span id="avatarName">เกษตรกร</span></div>
      </div>
    </header>

    <div class="breadcrumb">หน้าแรก / <b id="crumb">Dashboard</b></div>

    <main class="content" id="content"></main>
  </div>
</div>

<iframe id="riceFrame" src="rice-model/frame.html" style="display:none" title="rice classifier" aria-hidden="true"></iframe>
<iframe id="diseaseFrame" src="disease-model/frame.html" style="display:none" title="disease classifier" aria-hidden="true"></iframe>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function () {
"use strict";

// ============ ตั้งค่า ============
// URL ของ Cloudflare Worker ที่สร้างไว้ — ทำหน้าที่เก็บ Field Log และเรียก Gemini
// แทนหน้าเว็บ (API key ของ Gemini ถูกเก็บไว้ฝั่ง Worker ไม่หลุดออกมาที่หน้าเว็บ)
var API_BASE = "https://divine-frost-abbb.pomsuriyan61.workers.dev";

// แปลชื่อคลาสจากโมเดลเป็นภาษาไทย ใช้แค่ตอนแสดงผล การเทียบ label ในโค้ด
// ยังใช้ชื่ออังกฤษเดิมจากโมเดลเสมอ เพื่อให้เปลี่ยนโมเดลแล้วไม่พัง
var LABEL_TH = {
  "Rice": "ข้าว", "not Rice": "ไม่ใช่ข้าว", "other": "อื่นๆ",
  "Blast": "โรคไหม้", "Brown spot": "โรคใบจุดสีน้ำตาล",
  "Sheath blight": "โรคกาบใบแห้ง", "Rice Tungro": "โรคทุงโร",
  "Healthy": "ปกติ ไม่พบโรค", "Leaf smut": "โรคใบเขม่าดำ",
  "narrow_brown_spot": "โรคใบขีดสีน้ำตาล", "Narrow brown spot": "โรคใบขีดสีน้ำตาล"
};
function th(label) { return LABEL_TH[label] || label; }

var PAGES = [
  { id: "dashboard", label: "Dashboard", icon: "M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" },
  { id: "fields", label: "My Rice Fields", icon: "M12 3a9 9 0 100 18 9 9 0 000-18zm0 5v8m-4-4h8" },
  { id: "survey", label: "Field Survey", icon: "M8 3h8a2 2 0 012 2v14a2 2 0 01-2 2H8a2 2 0 01-2-2V5a2 2 0 012-2zm2 5h4m-4 4h4m-4 4h2" },
  { id: "detect", label: "Disease Detection", icon: "M4 7h3l2-2h6l2 2h3v12H4zm8 3a4 4 0 100 8 4 4 0 000-8z" },
  { id: "log", label: "Field Log", icon: "M6 3h9l4 4v14H6zm9 0v5h5M9 12h7M9 16h7" },
  { id: "analytics", label: "Analytics", icon: "M5 20V10m7 10V4m7 16v-7" },
  { id: "reports", label: "AI Reports", icon: "M7 8h10M7 12h6m5 8H6a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2v13a2 2 0 01-2 2z" },
  { id: "map", label: "Field Map", icon: "M12 21s7-6.5 7-11a7 7 0 10-14 0c0 4.5 7 11 7 11zm0-8a3 3 0 100-6 3 3 0 000 6z" },
  { id: "profile", label: "Profile", icon: "M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5z" },
  { id: "settings", label: "Settings", icon: "M12 15a3 3 0 100-6 3 3 0 000 6zm8-3a8 8 0 01-.2 1.7l2 1.6-2 3.4-2.4-1a8 8 0 01-2.9 1.7l-.4 2.6h-4l-.4-2.6a8 8 0 01-2.9-1.7l-2.4 1-2-3.4 2-1.6A8 8 0 014 12" }
];

// ============ ชั้นข้อมูล ============
// รวมการอ่าน/เขียนข้อมูลไว้ที่เดียว หน้าอื่นเรียกผ่าน Store เท่านั้น
// ถ้าเปลี่ยนไปใช้ backend อื่นในอนาคต แก้แค่ในนี้ ไม่ต้องแตะโค้ดหน้าเว็บ
var Store = {
  _cache: null,
  _offline: false,

  async list() {
    if (this._cache) return this._cache;
    try {
      var res = await fetch(API_BASE + "/field-logs");
      if (!res.ok) throw new Error("HTTP " + res.status);
      this._cache = await res.json();
      this._offline = false;
    } catch (err) {
      // ถ้า API ล่มหรือเน็ตหลุด ยังใช้งานต่อได้ด้วยข้อมูลในเครื่อง
      this._offline = true;
      this._cache = JSON.parse(localStorage.getItem("smartrice-logs") || "[]");
    }
    return this._cache;
  },

  async add(entry) {
    try {
      var res = await fetch(API_BASE + "/field-logs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var saved = await res.json();
      if (this._cache) this._cache.unshift(saved); else this._cache = [saved];
      this._offline = false;
      return saved;
    } catch (err) {
      this._offline = true;
      entry.id = Date.now().toString(36);
      entry.created_at = new Date().toISOString();
      var local = JSON.parse(localStorage.getItem("smartrice-logs") || "[]");
      local.unshift(entry);
      localStorage.setItem("smartrice-logs", JSON.stringify(local.slice(0, 500)));
      if (this._cache) this._cache.unshift(entry); else this._cache = [entry];
      return entry;
    }
  },

  isOffline() { return this._offline; },

  async askGemini(prompt) {
    var res = await fetch(API_BASE + "/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: prompt })
    });
    var data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "เรียก AI ไม่สำเร็จ");
    return data.text;
  },

  profile() {
    return JSON.parse(localStorage.getItem("smartrice-profile") || '{"name":"เกษตรกร","farm":"","phone":""}');
  },
  saveProfile(p) { localStorage.setItem("smartrice-profile", JSON.stringify(p)); }
};

// ============ โมเดล AI (คุยผ่าน iframe) ============
var models = {
  rice: { frame: document.getElementById("riceFrame"), ready: false, props: null },
  disease: { frame: document.getElementById("diseaseFrame"), ready: false, props: null }
};
var pending = {};
var reqId = 0;

window.addEventListener("message", function (e) {
  var msg = e.data;
  if (!msg || !msg.type) return;
  var which = e.source === models.rice.frame.contentWindow ? "rice"
            : e.source === models.disease.frame.contentWindow ? "disease" : null;
  if (!which) return;

  if (msg.type === "ready") {
    models[which].ready = true;
    models[which].props = msg.properties;
    models[which].project = msg.project;
    updateModelStatus();
  } else if (msg.type === "init-error") {
    models[which].error = msg.message;
    updateModelStatus();
  } else if (msg.type === "result" && pending[msg.requestId]) {
    pending[msg.requestId].resolve(msg.result);
    delete pending[msg.requestId];
  } else if (msg.type === "error" && pending[msg.requestId]) {
    pending[msg.requestId].reject(new Error(msg.message));
    delete pending[msg.requestId];
  }
});

function classify(which, features) {
  return new Promise(function (resolve, reject) {
    var id = ++reqId;
    pending[id] = { resolve: resolve, reject: reject };
    models[which].frame.contentWindow.postMessage({ type: "classify", requestId: id, features: features }, "*");
    setTimeout(function () {
      if (pending[id]) { delete pending[id]; reject(new Error("โมเดลใช้เวลานานเกินไป")); }
    }, 30000);
  });
}

function updateModelStatus() {
  var els = document.querySelectorAll("[data-model-status]");
  var ready = models.rice.ready && models.disease.ready;
  els.forEach(function (el) {
    if (models.rice.error || models.disease.error) {
      el.textContent = "โหลดโมเดลไม่สำเร็จ";
      el.disabled = true;
    } else if (ready) {
      el.textContent = el.dataset.readyText || "วิเคราะห์ภาพ";
      el.disabled = !el.dataset.hasImage;
    } else {
      el.textContent = "กำลังโหลดโมเดล AI...";
      el.disabled = true;
    }
  });
}

function extractFeatures(img, w, h) {
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  var ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  var d = ctx.getImageData(0, 0, w, h).data;
  var f = new Array(w * h);
  for (var i = 0, p = 0; i < d.length; i += 4, p++) f[p] = (d[i] << 16) + (d[i+1] << 8) + d[i+2];
  return f;
}

function dims(props) {
  return { w: (props && props.image_input_width) || 96, h: (props && props.image_input_height) || 96 };
}

// ============ ด่านกรองสี/พื้นผิวก่อนเข้าโมเดล ============
// รันก่อนโมเดลทุกครั้ง: โมเดลถูกฝึกให้ต้องเลือกคำตอบเสมอ ภาพที่ไม่ใช่พืชเลย
// จึงได้คำตอบมั่วแต่มั่นใจสูง ด่านนี้ตัดภาพแบบนั้นทิ้งก่อนถึงโมเดล
function preCheck(img) {
  var SIZE = 64;
  var c = document.createElement("canvas");
  c.width = SIZE; c.height = SIZE;
  var ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, SIZE, SIZE);
  var d = ctx.getImageData(0, 0, SIZE, SIZE).data;

  var gray = new Float32Array(SIZE * SIZE);
  for (var p = 0; p < SIZE * SIZE; p++) {
    var i = p * 4;
    gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }

  var center = (SIZE - 1) / 2, maxDist = Math.sqrt(2) * center, NORM = 900;
  var colorW = 0, edgeW = 0, wSum = 0, green = 0, yellow = 0, other = 0, total = 0;

  for (var y = 1; y < SIZE - 1; y++) {
    for (var x = 1; x < SIZE - 1; x++) {
      var idx = (y * SIZE + x) * 4;
      var hsl = rgbToHsl(d[idx], d[idx+1], d[idx+2]);
      var isGreen = hsl.h >= 60 && hsl.h <= 170;
      var isYB = hsl.h >= 20 && hsl.h < 60;
      var colorful = hsl.s > 0.12 && hsl.l > 0.08 && hsl.l < 0.9;
      total++;
      if (isGreen && colorful) green++;
      else if (isYB && colorful) yellow++;
      else other++;

      var gx = -gray[(y-1)*SIZE+(x-1)] + gray[(y-1)*SIZE+(x+1)]
             - 2*gray[y*SIZE+(x-1)] + 2*gray[y*SIZE+(x+1)]
             - gray[(y+1)*SIZE+(x-1)] + gray[(y+1)*SIZE+(x+1)];
      var gy = -gray[(y-1)*SIZE+(x-1)] - 2*gray[(y-1)*SIZE+x] - gray[(y-1)*SIZE+(x+1)]
             + gray[(y+1)*SIZE+(x-1)] + 2*gray[(y+1)*SIZE+x] + gray[(y+1)*SIZE+(x+1)];
      var edge = Math.min(Math.sqrt(gx*gx + gy*gy) / NORM, 1);

      var dist = Math.sqrt((x-center)*(x-center) + (y-center)*(y-center)) / maxDist;
      var w = 1 - 0.6 * dist;
      colorW += ((isGreen || isYB) && colorful ? 1 : 0) * w;
      edgeW += edge * w;
      wSum += w;
    }
  }

  var colorScore = colorW / wSum, edgeScore = edgeW / wSum;
  var texFactor = 0.5 + 0.5 * Math.min(edgeScore / 0.08, 1);
  var plant = colorScore * texFactor;
  if (edgeScore < 0.015) plant = Math.min(plant, 0.3);

  var greenPct = green / total * 100;
  var GREEN_MIN = 15;

  return {
    skip: greenPct < GREEN_MIN || plant < 0.18,
    reason: greenPct < GREEN_MIN
      ? "ภาพนี้มีสีเขียวเพียง " + Math.round(greenPct) + "% ต่ำกว่ามาตรฐานภาพใบข้าว จึงไม่ส่งให้โมเดลตรวจ"
      : "ภาพนี้ไม่มีลักษณะของใบพืช จึงไม่ส่งให้โมเดลตรวจ",
    green: Math.round(greenPct),
    yellow: Math.round(yellow / total * 100),
    other: Math.round(other / total * 100)
  };
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2, h = 0, s = 0, dd = max-min;
  if (dd !== 0) {
    s = dd / (1 - Math.abs(2*l - 1));
    if (max === r) h = 60 * (((g-b)/dd) % 6);
    else if (max === g) h = 60 * ((b-r)/dd + 2);
    else h = 60 * ((r-g)/dd + 4);
  }
  if (h < 0) h += 360;
  return { h: h, s: s, l: l };
}

// รันครบทั้ง 2 ขั้น: เช็คว่าเป็นข้าวก่อน ถ้าใช่ค่อยตรวจโรคต่อ
async function runFullAnalysis(img) {
  var pre = preCheck(img);
  var out = { pre: pre, rice: null, disease: null, topDisease: null, isRice: false };

  if (pre.skip) {
    var labels = (models.rice.props && models.rice.props.labels) || ["Rice", "not Rice"];
    var neg = labels.find(function (l) { return /not|non|other|ไม่ใช่/i.test(l); }) || labels[labels.length-1];
    out.rice = { results: labels.map(function (l) { return { label: l, value: l === neg ? 1 : 0 }; }) };
    out.forcedByPreCheck = true;
    return out;
  }

  var rd = dims(models.rice.props);
  out.rice = await classify("rice", extractFeatures(img, rd.w, rd.h));

  var sorted = out.rice.results.slice().sort(function (a,b) { return b.value - a.value; });
  out.isRice = sorted[0] && !/not|non|other|ไม่ใช่/i.test(sorted[0].label);

  if (out.isRice && models.disease.ready) {
    var dd2 = dims(models.disease.props);
    out.disease = await classify("disease", extractFeatures(img, dd2.w, dd2.h));
    var ds = out.disease.results.slice().sort(function (a,b) { return b.value - a.value; });
    out.topDisease = ds[0];
  }
  return out;
}

// คะแนนสุขภาพ: ใบปกติได้เต็ม ใบที่พบโรคหักตามความมั่นใจของโมเดล
function healthScore(result) {
  if (!result.isRice) return 99;
  if (!result.topDisease) return 90;
  if (/healthy/i.test(result.topDisease.label)) return 95;
  return Math.max(40, Math.round(100 - result.topDisease.value * 45));
}

function diseaseName(result) {
  if (!result.isRice) return "ภาพไม่ชัดเจน";
  if (!result.topDisease) return "ไม่ระบุ";
  return th(result.topDisease.label);
}

// ============ ตัวช่วย UI ============
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderBars(container, results, forced) {
  container.innerHTML = "";
  if (forced) {
    var note = el("div", "res-note", "ผลนี้มาจากด่านตรวจสี/พื้นผิว ไม่ได้ส่งภาพให้โมเดล AI");
    container.appendChild(note);
  }
  results.slice().sort(function (a,b) { return b.value - a.value; }).forEach(function (r, i) {
    var pct = Math.round(r.value * 100);
    var row = el("div", "res-row" + (i === 0 ? " top" : ""));
    row.appendChild(el("div", "res-label", th(r.label)));
    var track = el("div", "res-track");
    var fill = el("div", "res-fill");
    fill.style.width = pct + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", "res-pct", pct + "%"));
    container.appendChild(row);
  });
}

function todayStr() {
  var d = new Date();
  return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getFullYear()+543).slice(-2);
}

function makeUploader(opts) {
  var wrap = el("div");
  var dz = el("div", "dropzone");
  dz.tabIndex = 0;
  dz.setAttribute("role", "button");
  dz.innerHTML = '<div class="dropzone-text">📷 ' + (opts.label || "Upload Rice Leaf") + '</div>';
  var input = el("input", "file-input");
  input.type = "file";
  input.accept = "image/*";
  var pv = el("div", "preview-wrap");
  pv.hidden = true;
  var img = el("img");
  var scan = el("div", "scan");
  scan.hidden = true;
  scan.innerHTML = '<div class="scan-beam"></div>';
  pv.appendChild(img); pv.appendChild(scan);

  wrap.appendChild(dz); wrap.appendChild(input); wrap.appendChild(pv);

  var loaded = null;
  function load(file) {
    if (!file || file.type.indexOf("image/") !== 0) return;
    var url = URL.createObjectURL(file);
    var im = new Image();
    im.onload = function () {
      loaded = im;
      img.src = url;
      pv.hidden = false;
      opts.onLoad && opts.onLoad(im);
    };
    im.src = url;
  }

  dz.onclick = function () { input.click(); };
  dz.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } };
  dz.ondragover = function (e) { e.preventDefault(); dz.classList.add("drag"); };
  dz.ondragleave = function () { dz.classList.remove("drag"); };
  dz.ondrop = function (e) { e.preventDefault(); dz.classList.remove("drag"); load(e.dataTransfer.files[0]); };
  input.onchange = function (e) { load(e.target.files[0]); };

  return {
    element: wrap,
    getImage: function () { return loaded; },
    setScanning: function (on) { scan.hidden = !on; },
    reset: function () { loaded = null; pv.hidden = true; input.value = ""; }
  };
}

  var out = el("div");
  card.appendChild(out);

  btn.onclick = async function () {
    out.innerHTML = "";
    btn.disabled = true;
    btn.textContent = "กำลังวิเคราะห์...";
    up.setScanning(true);
    await new Promise(function (r) { setTimeout(r, 60); });
    try {
      var res = await runFullAnalysis(up.getImage());

      out.appendChild(el("div", "res-section-title", "ขั้นที่ 1 — เป็นข้าวหรือไม่"));
      var b1 = el("div");
      out.appendChild(b1);
      renderBars(b1, res.rice.results, res.forcedByPreCheck);

      if (res.disease) {
        out.appendChild(el("div", "res-section-title", "ขั้นที่ 2 — ชนิดของโรค"));
        var b2 = el("div");
        out.appendChild(b2);
        renderBars(b2, res.disease.results);
      } else if (!res.isRice) {
        out.appendChild(el("div", "res-note", res.pre.skip ? res.pre.reason : "ภาพนี้ไม่ใช่ใบข้าว จึงไม่ตรวจโรคต่อ"));
      }

      // สัดส่วนสีในภาพ ช่วยให้เห็นว่าทำไมระบบตัดสินแบบนั้น
      var cb = el("div");
      cb.style.marginTop = "16px";
      cb.style.paddingTop = "14px";
      cb.style.borderTop = "1px solid var(--border)";
      cb.appendChild(el("div", "res-note", "สัดส่วนโทนสีในภาพ"));
      var bar = el("div", "color-bar");
      [["#1B7A45", res.pre.green], ["#D9A441", res.pre.yellow], ["#B7C2BB", res.pre.other]].forEach(function (x) {
        var seg = el("div");
        seg.style.background = x[0];
        seg.style.width = x[1] + "%";
        bar.appendChild(seg);
      });
      cb.appendChild(bar);
      var leg = el("div", "color-legend");
      leg.innerHTML = '<span><i class="dot" style="background:#1B7A45"></i>เขียว <b>' + res.pre.green +
        '%</b></span><span><i class="dot" style="background:#D9A441"></i>เหลือง/น้ำตาล <b>' + res.pre.yellow +
        '%</b></span><span><i class="dot" style="background:#B7C2BB"></i>สีอื่น <b>' + res.pre.other + '%</b></span>';
      cb.appendChild(leg);
      out.appendChild(cb);

      // บันทึกลง Field Log ให้อัตโนมัติ
      await Store.add({
        date: todayStr(),
        owner: Store.profile().name,
        gps: "",
        ph: null,
        disease: diseaseName(res),
        score: healthScore(res)
      });
      out.appendChild(el("div", "alert ok", "บันทึกผลลง Field Log แล้ว" + (Store.isOffline() ? " (เก็บในเครื่องชั่วคราว)" : "")));
    } catch (err) {
      out.appendChild(el("div", "alert err", "วิเคราะห์ไม่สำเร็จ: " + err.message));
    } finally {
      up.setScanning(false);
      btn.disabled = false;
      btn.textContent = "วิเคราะห์ภาพ";
    }
  };

  root.appendChild(card);
  updateModelStatus();
};

pageBuilders.log = async function (root) {
  var logs = await Store.list();
  var card = el("div", "card");
  card.appendChild(el("div", "card-title", "📗 Field Log ทั้งหมด"));

  var searchRow = el("div");
  searchRow.style.textAlign = "right";
  searchRow.style.marginBottom = "10px";
  var si = el("input");
  si.placeholder = "ค้นหา...";
  si.style.padding = "7px 13px";
  si.style.border = "1px solid var(--border)";
  si.style.borderRadius = "8px";
  searchRow.appendChild(si);
  card.appendChild(searchRow);

  var table = el("table");
  table.innerHTML = "<thead><tr><th>วันที่</th><th>Owner</th><th>โรค</th><th>pH</th><th>Score</th><th>GPS</th></tr></thead>";
  var tb = el("tbody");
  table.appendChild(tb);
  card.appendChild(table);

  function draw(filter) {
    tb.innerHTML = "";
    var rows = logs.filter(function (l) {
      if (!filter) return true;
      return (l.date + l.owner + l.disease).toLowerCase().indexOf(filter.toLowerCase()) !== -1;
    });
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#7A8B80;padding:28px">ยังไม่มีรายการ</td></tr>';
      return;
    }
    rows.forEach(function (l) {
      var tr = el("tr");
      tr.innerHTML = "<td>" + l.date + "</td><td>" + (l.owner || "-") + "</td>" +
        "<td class='disease-cell" + (l.disease === "ปกติ ไม่พบโรค" ? " ok" : "") + "'>" + l.disease + "</td>" +
        "<td>" + (l.ph || "-") + "</td><td>" + l.score + "</td><td>" + (l.gps || "-") + "</td>";
      tb.appendChild(tr);
    });
  }
  si.oninput = function () { draw(si.value); };
  draw(document.getElementById("globalSearch").value);
  root.appendChild(card);
};

pageBuilders.analytics = async function (root) {
  var logs = await Store.list();
  var scores = logs.map(function (l) { return l.score; }).filter(function (v) { return typeof v === "number"; });
  var phs = logs.map(function (l) { return l.ph; }).filter(function (v) { return typeof v === "number"; });

  var stats = el("div", "stat-grid");
  [
    ["จำนวนแบบสำรวจ", logs.length],
    ["Health Score เฉลี่ย", scores.length ? Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length) : "-"],
    ["pH เฉลี่ย", phs.length ? (phs.reduce(function(a,b){return a+b;},0)/phs.length).toFixed(2) : "-"]
  ].forEach(function (s) {
    var c = el("div", "card");
    c.appendChild(el("div", "stat-label", s[0]));
    c.appendChild(el("div", "stat-value", s[1]));
    stats.appendChild(c);
  });
  root.appendChild(stats);

  var c1 = el("div", "card");
  c1.appendChild(el("div", "card-title", "📈 Health Score ตามช่วงเวลา"));
  var cv1 = el("canvas");
  cv1.height = 200;
  c1.appendChild(cv1);
  root.appendChild(c1);

  var series = logs.slice(0, 12).reverse();
  new Chart(cv1, {
    type: "line",
    data: {
      labels: series.length ? series.map(function (l) { return l.date; }) : ["ยังไม่มีข้อมูล"],
      datasets: [{ label: "Health Score", data: series.map(function (l) { return l.score; }),
        borderColor: "#D9A441", backgroundColor: "rgba(217,164,65,.12)", fill: true, tension: .35 }]
    },
    options: { responsive: true, scales: { y: { min: 0, max: 100 } } }
  });

  // สรุปว่าพบโรคไหนบ่อยสุด
  var counts = {};
  logs.forEach(function (l) { counts[l.disease] = (counts[l.disease] || 0) + 1; });
  var keys = Object.keys(counts);
  if (keys.length) {
    var c2 = el("div", "card");
    c2.style.marginTop = "16px";
    c2.appendChild(el("div", "card-title", "🦠 โรคที่พบบ่อย"));
    var cv2 = el("canvas");
    cv2.height = 180;
    c2.appendChild(cv2);
    root.appendChild(c2);
    new Chart(cv2, {
      type: "bar",
      data: { labels: keys, datasets: [{ label: "จำนวนครั้ง", data: keys.map(function (k) { return counts[k]; }), backgroundColor: "#1B7A45" }] },
      options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
  }
};

pageBuilders.reports = async function (root) {
  var card = el("div", "card");
  card.appendChild(el("div", "card-title", "💬 ปรึกษาหมอข้าว AI"));

  var log = el("div", "chat-log");
  var greet = el("div", "msg ai");
  greet.textContent = "สวัสดีครับ ผมคือ AI ผู้เชี่ยวชาญด้านข้าวไทย ผมนำผลจากโมเดล Computer Vision ค่า pH ดิน ตำแหน่ง GPS และข้อมูลแปลงนาของคุณมาใช้ประกอบการตอบด้วยครับ สอบถามเรื่องโรคข้าว วิธีแก้ หรือยี่ห้อปุ๋ยที่ควรใช้ได้เลยครับ";
  log.appendChild(greet);
  card.appendChild(log);

  var row = el("div", "chat-input-row");
  var input = el("input");
  input.placeholder = "พิมพ์ถาม เช่น ใบข้าวมีจุดสีน้ำตาลใช้ปุ๋ยยี่ห้อไหนดี...";
  var send = el("button", "btn btn-primary", "ส่ง");
  row.appendChild(input);
  row.appendChild(send);
  card.appendChild(row);
  root.appendChild(card);

  var logs = await Store.list();
  var context = logs.slice(0, 5).map(function (l) {
    return "- " + l.date + ": พบ " + l.disease + " คะแนนสุขภาพ " + l.score + (l.ph ? " pH " + l.ph : "");
  }).join("\n");

  async function ask() {
    var q = input.value.trim();
    if (!q) return;
    var me = el("div", "msg me", q);
    log.appendChild(me);
    input.value = "";
    log.scrollTop = log.scrollHeight;

    var thinking = el("div", "msg ai", "กำลังคิด...");
    log.appendChild(thinking);
    log.scrollTop = log.scrollHeight;

    try {
      var prompt = "คุณเป็นผู้เชี่ยวชาญโรคข้าวและการเกษตรไทย ตอบเป็นภาษาไทยแบบเข้าใจง่าย กระชับ\n\n" +
        (context ? "ข้อมูลแปลงนาล่าสุดของผู้ถาม:\n" + context + "\n\n" : "") +
        "คำถาม: " + q;
      var ans = await Store.askGemini(prompt);
      thinking.textContent = ans;
    } catch (err) {
      thinking.textContent = "เชื่อมต่อ AI ไม่ได้: " + err.message;
    }
    log.scrollTop = log.scrollHeight;
  }
  send.onclick = ask;
  input.onkeydown = function (e) { if (e.key === "Enter") ask(); };
};

pageBuilders.map = async function (root) {
  var logs = await Store.list();
  var card = el("div", "card");
  card.appendChild(el("div", "card-title", "🗺️ Field Map"));

  var pts = logs.filter(function (l) { return l.gps && l.gps.indexOf(",") !== -1; });
  var note = el("p");
  note.style.fontSize = ".85rem";
  note.style.color = "#7A8B80";
  note.textContent = pts.length
    ? "แสดงพิกัดแปลงนาที่บันทึกไว้ " + pts.length + " จุด"
    : "ยังไม่มีข้อมูล GPS จริงในบัญชีของคุณ — แสดงพิกัดตัวอย่างไว้ก่อน (กด GPS Auto ในหน้า Field Survey เพื่อบันทึกพิกัดจริง)";
  card.appendChild(note);

  var btn = el("button", "btn btn-primary btn-full", "📍 ตำแหน่งปัจจุบันของฉัน");
  btn.style.marginBottom = "10px";
  card.appendChild(btn);

  var mapDiv = el("div");
  mapDiv.id = "map";
  card.appendChild(mapDiv);
  root.appendChild(card);

  var center = pts.length ? pts[0].gps.split(",").map(Number) : [16.4419, 102.8360];
  var map = L.map("map").setView(center, pts.length ? 12 : 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);

  if (pts.length) {
    pts.forEach(function (p) {
      var c = p.gps.split(",").map(Number);
      L.marker(c).addTo(map).bindPopup(p.date + "<br>" + p.disease + "<br>Score " + p.score);
    });
  } else {
    L.marker(center).addTo(map).bindPopup("พิกัดตัวอย่าง (ยังไม่มีข้อมูลจริง)").openPopup();
  }

  btn.onclick = function () {
    btn.textContent = "กำลังหาตำแหน่ง...";
    navigator.geolocation.getCurrentPosition(function (p) {
      var c = [p.coords.latitude, p.coords.longitude];
      map.setView(c, 14);
      L.marker(c).addTo(map).bindPopup("ตำแหน่งปัจจุบันของคุณ").openPopup();
      btn.textContent = "📍 ตำแหน่งปัจจุบันของฉัน";
    }, function () {
      btn.textContent = "หาตำแหน่งไม่ได้ — เปิดสิทธิ์ตำแหน่งในเบราว์เซอร์ก่อน";
    });
  };
};

// ============ Router ============
var current = "dashboard";

function buildNav() {
  var nav = document.getElementById("nav");
  nav.innerHTML = "";
  PAGES.forEach(function (p) {
    var b = el("button", "nav-item" + (p.id === current ? " active" : ""));
    b.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + p.icon + '"/></svg>';
    b.appendChild(document.createTextNode(p.label));
    b.onclick = function () { go(p.id); document.getElementById("sidebar").classList.remove("open"); };
    nav.appendChild(b);
  });
}

async function go(id) {
  current = id;
  var page = PAGES.find(function (p) { return p.id === id; });
  document.getElementById("pageTitle").textContent = page.label;
  document.getElementById("crumb").textContent = page.label;
  buildNav();
  var root = document.getElementById("content");
  root.innerHTML = '<div class="empty">กำลังโหลด...</div>';
  try {
    root.innerHTML = "";
    await pageBuilders[id](root);
  } catch (err) {
    root.innerHTML = "";
    root.appendChild(el("div", "alert err", "เปิดหน้านี้ไม่ได้: " + err.message));
  }
}

function applyProfile() {
  var p = Store.profile();
  document.getElementById("avatarName").textContent = p.name;
  document.getElementById("avatarLetter").textContent = (p.name || "ก").charAt(0);
}

document.getElementById("navToggle").onclick = function () {
  document.getElementById("sidebar").classList.toggle("open");
};
document.getElementById("globalSearch").oninput = function () {
  if (current === "log") go("log");
};

applyProfile();
go("dashboard");

})();
</script>
