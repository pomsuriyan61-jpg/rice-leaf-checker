<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartRice AI — ระบบวินิจฉัยโรคข้าวและติดตามแปลงนา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    /* จานสีดึงจากนาข้าวจริง ไม่ใช่เขียว UI ทั่วไป */
    --flood:    #14352C;  /* น้ำขังในนายามเย็น */
    --flood-up: #1E4A3C;  /* ผิวน้ำสะท้อนแสง */
    --blade:    #4F7A3A;  /* ใบข้าวเขียวสมบูรณ์ */
    --sprout:   #8FB05C;  /* ต้นกล้าอ่อน */
    --grain:    #C79A2E;  /* รวงข้าวสุก */
    --rust:     #A4462E;  /* สีแผลโรคบนใบข้าว */
    --husk:     #F2EBDD;  /* เปลือกข้าว พื้นหลังหน้า */
    --paper:    #FBF8F1;  /* ข้าวสาร พื้นการ์ด */
    --ink:      #21281F;
    --ink-soft: #5E6B58;
    --ink-faint:#8A9484;
    --rule:     #DCD3C0;  /* เส้นคันนา */
    --rule-soft:#E8E1D2;

    --tint-ok:   #EDF2E2;
    --tint-warn: #FAF0D9;
    --tint-bad:  #F7E7E1;

    --f-display: 'Trirong', serif;
    --f-body: 'IBM Plex Sans Thai', sans-serif;
    --f-data: 'IBM Plex Mono', monospace;

    --r: 3px;          /* มุมคม ให้ความรู้สึกเครื่องมือวัด */
    --rail-w: 216px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--f-body);
    font-size: 15px;
    color: var(--ink);
    background: var(--husk);
    line-height: 1.65;
  }
  h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }
  a { color: var(--blade); }
  :focus-visible { outline: 2px solid var(--blade); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .num { font-family: var(--f-data); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ─── โครงหน้า ─────────────────────────────── */
  .shell { display: flex; min-height: 100vh; }

  .rail {
    width: var(--rail-w); flex-shrink: 0; background: var(--flood);
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .mark { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.09); }
  .mark-name {
    font-family: var(--f-display); font-weight: 600; font-size: 1.12rem;
    color: #F2EBDD; letter-spacing: -.015em; display: flex; align-items: center; gap: 9px;
  }
  .mark-sub {
    font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
    color: #7E9587; margin-top: 5px; padding-left: 30px;
  }

  .rail-nav { padding: 12px 10px; flex: 1; }
  .rail-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 12px 9px 13px; margin-bottom: 1px; background: none;
    border: none; border-left: 2px solid transparent;
    color: #A8BBAD; font-size: .875rem; text-align: left;
    transition: color .14s, background .14s;
  }
  .rail-item:hover { color: #F2EBDD; background: rgba(255,255,255,.05); }
  .rail-item.on {
    color: #FBF8F1; background: rgba(143,176,92,.14);
    border-left-color: var(--sprout); font-weight: 500;
  }
  .rail-item svg { flex-shrink: 0; opacity: .85; }
  .rail-item.on svg { opacity: 1; }

  .rail-foot {
    padding: 14px 20px 18px; border-top: 1px solid rgba(255,255,255,.09);
    font-size: .7rem; color: #6E8375; line-height: 1.5;
  }
  .rail-foot .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; background: #6E8375; }
  .rail-foot .dot.live { background: var(--sprout); }
  .rail-foot .dot.down { background: var(--rust); }

  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .bar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
    padding: 20px clamp(18px,3vw,36px) 16px;
    border-bottom: 1px solid var(--rule);
    background: var(--husk);
  }
  .bar-title { font-size: 1.5rem; line-height: 1.25; }
  .bar-kicker {
    font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 3px;
  }
  .bar-tools { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .seek {
    display: flex; align-items: center; gap: 7px;
    background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r);
    padding: 6px 12px;
  }
  .seek input { border: none; background: none; outline: none; font-size: .84rem; width: 148px; color: var(--ink); }
  .seek input::placeholder { color: var(--ink-faint); }

  .who { display: flex; align-items: center; gap: 8px; font-size: .84rem; font-weight: 500; color: var(--ink); }
  .who-badge {
    width: 27px; height: 27px; border-radius: 50%; background: var(--flood); color: #F2EBDD;
    display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 600;
  }

  .field { padding: clamp(18px,3vw,30px) clamp(18px,3vw,36px) 72px; }

  /* ─── คันนา: เส้นแบ่งหมวด ───────────────────── */
  .bund { display: flex; align-items: center; gap: 13px; margin: 30px 0 16px; }
  .bund:first-child { margin-top: 0; }
  .bund-label {
    font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
    color: var(--ink-faint); white-space: nowrap; flex-shrink: 0;
  }
  .bund-line {
    flex: 1; height: 3px;
    background: repeating-linear-gradient(90deg, var(--rule) 0 9px, transparent 9px 15px);
  }

  /* ─── การ์ด ───────────────────────────────── */
  .plot {
    background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r);
    padding: 19px;
  }
  .plot-head { margin-bottom: 15px; }
  .plot-title { font-size: 1rem; font-weight: 600; font-family: var(--f-display); }
  .plot-note { font-size: .8rem; color: var(--ink-soft); margin-top: 2px; }

  .row-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 15px; align-items: start; }
  .row-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 15px; }
  @media (max-width: 940px) { .row-2 { grid-template-columns: 1fr; } }

  /* ─── SIGNATURE: แปลงนามาตรวัด ──────────────── */
  .gauge-wrap { display: flex; gap: 20px; align-items: stretch; }
  .gauge {
    position: relative; width: 128px; flex-shrink: 0; min-height: 152px;
    border: 1px solid var(--rule); border-radius: var(--r);
    background: linear-gradient(180deg, #F7F2E7 0%, #EFE7D6 100%);
    overflow: hidden;
  }
  .gauge-water {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: var(--blade);
    transition: height .9s cubic-bezier(.22,.85,.3,1), background-color .3s;
  }
  .gauge-water::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: rgba(255,255,255,.55);
  }
  .gauge.warn .gauge-water { background: var(--grain); }
  .gauge.bad  .gauge-water { background: var(--rust); }
  @media (prefers-reduced-motion: reduce) { .gauge-water { transition: none; } }

  .gauge-read {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 2;
  }
  .gauge-figure { font-family: var(--f-data); font-size: 2.7rem; font-weight: 500; line-height: 1; color: var(--paper); text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .gauge-figure.dim { color: var(--ink); text-shadow: none; }
  .gauge-unit { font-size: .68rem; letter-spacing: .13em; text-transform: uppercase; color: var(--paper); opacity: .85; margin-top: 4px; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .gauge-unit.dim { color: var(--ink-faint); text-shadow: none; opacity: 1; }

  .gauge-side { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 13px; }
  .verdict-label { font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-faint); }
  .verdict-name { font-family: var(--f-display); font-size: 1.4rem; font-weight: 600; line-height: 1.25; margin-top: 3px; }
  .verdict-name.ok  { color: var(--blade); }
  .verdict-name.warn{ color: #8A6A12; }
  .verdict-name.bad { color: var(--rust); }

  /* ─── ตัวเลขวัดค่า ─────────────────────────── */
  .read-label { font-size: .7rem; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; }
  .read-value { font-family: var(--f-data); font-size: 1.65rem; font-weight: 500; line-height: 1.15; }
  .read-value.sm { font-size: 1.15rem; }
  .read-foot { font-size: .76rem; color: var(--ink-soft); margin-top: 3px; }

  /* ─── ปุ่ม ────────────────────────────────── */
  .act {
    border: 1px solid transparent; border-radius: var(--r);
    padding: 10px 20px; font-size: .88rem; font-weight: 500;
    transition: background .14s, border-color .14s, color .14s;
  }
  .act-go { background: var(--flood); color: var(--husk); }
  .act-go:hover:not(:disabled) { background: var(--flood-up); }
  .act-go:disabled { background: var(--rule); color: var(--ink-faint); cursor: not-allowed; }
  .act-line { background: none; border-color: var(--rule); color: var(--ink); }
  .act-line:hover { border-color: var(--ink-faint); background: var(--husk); }
  .act-wide { width: 100%; }
  .act-sm { padding: 6px 13px; font-size: .78rem; }

  /* ─── ฟอร์ม ──────────────────────────────── */
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  @media (max-width: 600px) { .inputs { grid-template-columns: 1fr; } }
  .inp label { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; }
  .inp input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--rule); border-radius: var(--r);
    background: var(--paper); color: var(--ink);
  }
  .inp input:focus { border-color: var(--blade); outline: none; }
  .inp input[readonly] { background: var(--husk); color: var(--ink-soft); }
  .inp .num-in { font-family: var(--f-data); }

  /* ─── รับภาพ ─────────────────────────────── */
  .intake {
    border: 1px dashed var(--rule); border-radius: var(--r);
    padding: 30px 18px; text-align: center; cursor: pointer;
    background: var(--husk); transition: border-color .14s, background .14s;
  }
  .intake:hover, .intake.over { border-color: var(--blade); background: var(--tint-ok); }
  .intake-lead { font-weight: 500; font-size: .93rem; }
  .intake-hint { font-size: .8rem; color: var(--ink-soft); margin-top: 3px; }
  .hidden-file { display: none; }

  .shot { margin-top: 14px; position: relative; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
  .shot img { display: block; width: 100%; max-height: 290px; object-fit: contain; background: var(--husk); }
  .sweep { position: absolute; inset: 0; pointer-events: none; background: rgba(20,53,44,.07); }
  .sweep-line { position: absolute; left: 0; right: 0; height: 2px; top: 0; background: var(--sprout); box-shadow: 0 0 14px 3px rgba(143,176,92,.55); }
  @media (prefers-reduced-motion: no-preference) {
    .sweep-line { animation: sweep 1.5s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes sweep { 0% { top: 0; } 100% { top: 100%; } }
  }

  /* ─── แถบผลจำแนก ─────────────────────────── */
  .verdict-src { font-size: .76rem; color: var(--ink-soft); margin-bottom: 11px; padding-bottom: 9px; border-bottom: 1px solid var(--rule-soft); }
  .bar-row { display: grid; grid-template-columns: minmax(104px,auto) 1fr 50px; align-items: center; gap: 11px; padding: 7px 0; }
  .bar-row + .bar-row { border-top: 1px solid var(--rule-soft); }
  .bar-name { font-size: .87rem; color: var(--ink-soft); }
  .bar-row.lead .bar-name { color: var(--ink); font-weight: 600; }
  .bar-track { height: 6px; background: var(--rule-soft); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--ink-faint); border-radius: 99px; }
  .bar-row.lead .bar-fill { background: var(--blade); }
  .bar-pct { font-family: var(--f-data); font-size: .84rem; text-align: right; color: var(--ink-faint); }
  .bar-row.lead .bar-pct { color: var(--ink); font-weight: 500; }

  /* ─── สัดส่วนสี ──────────────────────────── */
  .mix { display: flex; height: 7px; border-radius: 99px; overflow: hidden; background: var(--rule-soft); }
  .mix-key { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 9px; font-size: .77rem; color: var(--ink-soft); }
  .mix-key b { font-family: var(--f-data); font-weight: 500; color: var(--ink); }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  /* ─── ใบสั่งการรักษา ─────────────────────── */
  .rx { margin-top: 18px; border: 1px solid var(--rule); border-left: 3px solid var(--blade); border-radius: 0; background: var(--tint-ok); padding: 17px 19px; }
  .rx.warn { border-left-color: var(--grain); background: var(--tint-warn); }
  .rx.bad  { border-left-color: var(--rust);  background: var(--tint-bad); }
  .rx-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .rx-name { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; }
  .rx-flag { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
  .rx-flag.hi { background: var(--rust); color: var(--paper); }
  .rx-flag.mid{ background: var(--grain); color: #3A2C05; }
  .rx-flag.lo { background: var(--sprout); color: #22300F; }
  .rx-sect { font-size: .7rem; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); margin: 13px 0 4px; }
  .rx-sect:first-of-type { margin-top: 0; }
  .rx p { margin: 0; font-size: .87rem; }
  .rx ul { margin: 0; padding-left: 18px; font-size: .87rem; }
  .rx li { margin-bottom: 3px; }
  .rx-src { font-size: .73rem; color: var(--ink-faint); margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule); }

  /* ─── สนทนา ─────────────────────────────── */
  .talk { min-height: 250px; max-height: 430px; overflow-y: auto; padding-right: 4px; }
  .say { padding: 12px 15px; border-radius: var(--r); margin-bottom: 10px; font-size: .89rem; max-width: 87%; }
  .say-ai { background: var(--tint-ok); border-left: 2px solid var(--blade); }
  .say-me { background: var(--husk); border: 1px solid var(--rule); margin-left: auto; }
  .say img { max-width: 168px; border-radius: var(--r); display: block; margin-bottom: 7px; }
  .talk-bar { display: flex; gap: 8px; margin-top: 13px; }
  .talk-bar input { flex: 1; padding: 10px 14px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); outline: none; }
  .talk-bar input:focus { border-color: var(--blade); }
  .clip { display: flex; align-items: center; gap: 11px; margin-top: 11px; padding: 8px 11px; background: var(--tint-ok); border: 1px solid var(--rule); border-radius: var(--r); }
  .clip img { width: 42px; height: 42px; object-fit: cover; border-radius: 2px; }
  .clip span { flex: 1; font-size: .8rem; color: var(--ink-soft); }

  /* ─── ตาราง ─────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  thead th {
    text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--rule);
    font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 500; white-space: nowrap;
  }
  tbody td { padding: 10px 9px; border-bottom: 1px solid var(--rule-soft); }
  tbody tr:last-child td { border-bottom: none; }
  td.dx { font-weight: 500; }
  td.dx.ill { color: var(--rust); }
  td.dx.well { color: var(--blade); }
  td.n { font-family: var(--f-data); }

  /* ─── สถานะว่าง/โหลด/ผิดพลาด ──────────────── */
  .state { text-align: center; padding: 44px 22px; }
  .state-mark { font-size: 1.6rem; margin-bottom: 8px; opacity: .5; }
  .state-lead { font-weight: 500; font-size: .93rem; margin-bottom: 4px; }
  .state-note { font-size: .83rem; color: var(--ink-soft); max-width: 300px; margin: 0 auto; }
  .flash { padding: 11px 15px; border-radius: var(--r); font-size: .85rem; margin-top: 12px; }
  .flash-bad { background: var(--tint-bad); border: 1px solid #E0BDB2; color: var(--rust); }
  .flash-ok  { background: var(--tint-ok); border: 1px solid #CBD9AF; color: #3B5A28; }

  .stack-item { display: flex; gap: 14px; align-items: center; padding: 13px 2px; border-bottom: 1px solid var(--rule-soft); }
  .stack-item:last-child { border-bottom: none; }
  .stack-chip { width: 42px; flex-shrink: 0; text-align: center; font-family: var(--f-data); font-size: 1.05rem; font-weight: 500; padding: 5px 0; border-radius: 2px; }
  .stack-chip.ok { background: var(--tint-ok); color: #3B5A28; }
  .stack-chip.warn { background: var(--tint-warn); color: #8A6A12; }
  .stack-chip.bad { background: var(--tint-bad); color: var(--rust); }
  .stack-main { flex: 1; min-width: 0; }
  .stack-lead { font-weight: 500; font-size: .89rem; }
  .stack-sub { font-size: .79rem; color: var(--ink-soft); }

  #map { height: 380px; border: 1px solid var(--rule); border-radius: var(--r); }
  canvas { max-width: 100%; }

  .rail-toggle { display: none; background: none; border: none; padding: 5px; }
  @media (max-width: 860px) {
    .rail { position: fixed; z-index: 70; transform: translateX(-100%); transition: transform .2s; }
    .rail.open { transform: translateX(0); }
    .rail-toggle { display: block; }
    .seek { display: none; }
    .bar { align-items: center; }
    .gauge-wrap { flex-direction: column; }
    .gauge { width: 100%; min-height: 118px; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail" id="rail">
    <div class="mark">
      <div class="mark-name">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 21c0-6 0-9 0-11" stroke="#8FB05C" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12 10C12 6 9 3.5 5.5 3c-.4 3.8 2 7 6.5 7z" fill="#8FB05C"/>
          <path d="M12 13c0-3.6 2.8-6 6-6.4.4 3.5-1.9 6.4-6 6.4z" fill="#4F7A3A"/>
        </svg>
        SmartRice AI
      </div>
      <div class="mark-sub">Field diagnostics</div>
    </div>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <div><span class="dot" id="linkDot"></span><span id="linkText">กำลังเชื่อมต่อ</span></div>
      <div style="margin-top:5px"><span class="dot" id="brainDot"></span><span id="brainText">กำลังโหลดโมเดล</span></div>
    </div>
  </aside>

  <div class="stage">
    <header class="bar">
      <div style="display:flex;align-items:center;gap:11px;min-width:0">
        <button class="rail-toggle" id="railToggle" aria-label="เปิดเมนู">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="#21281F" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div style="min-width:0">
          <div class="bar-kicker" id="barKicker">แปลงนา</div>
          <h1 class="bar-title" id="barTitle">ภาพรวมแปลง</h1>
        </div>
      </div>
      <div class="bar-tools">
        <div class="seek">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#8A9484" stroke-width="1.8"/><path d="M20 20l-3.6-3.6" stroke="#8A9484" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="text" id="seekInput" placeholder="ค้นหาบันทึกแปลง">
        </div>

// ─── ชั้นข้อมูล ────────────────────────────────
// รวมการอ่าน/เขียนไว้ที่เดียว หน้าอื่นเรียกผ่าน Store เท่านั้น
// ย้ายไป backend อื่นภายหลังแก้แค่ในนี้ ไม่ต้องแตะโค้ดหน้าเว็บ
var Store = {
  _cache: null,
  _offline: false,

  async list() {
    if (this._cache) return this._cache;
    try {
      var res = await fetch(API_BASE + "/field-logs");
      if (!res.ok) throw new Error("HTTP " + res.status);
      this._cache = await res.json();
      this._offline = false;
    } catch (err) {
      // เน็ตหลุดหรือ API ล่ม ยังใช้งานต่อได้ด้วยสำเนาในเครื่อง
      this._offline = true;
      this._cache = JSON.parse(localStorage.getItem("smartrice-logs") || "[]");
    }
    markLink();
    return this._cache;
  },

  async add(entry) {
    try {
      var res = await fetch(API_BASE + "/field-logs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(entry)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var saved = await res.json();
      this._cache = this._cache ? [saved].concat(this._cache) : [saved];
      this._offline = false;
      markLink();
      return saved;
    } catch (err) {
      this._offline = true;
      entry.id = Date.now().toString(36);
      entry.created_at = new Date().toISOString();
      var local = JSON.parse(localStorage.getItem("smartrice-logs") || "[]");
      local.unshift(entry);
      localStorage.setItem("smartrice-logs", JSON.stringify(local.slice(0, 500)));
      this._cache = this._cache ? [entry].concat(this._cache) : [entry];
      markLink();
      return entry;
    }
  },

  isOffline() { return this._offline; },

  async askGemini(prompt, image) {
    var payload = { prompt: prompt };
    if (image) payload.image = image;
    var res = await fetch(API_BASE + "/gemini", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    var data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || "เรียก AI ไม่สำเร็จ");
    return data.text;
  },

  profile() {
    return JSON.parse(localStorage.getItem("smartrice-profile") || '{"name":"เกษตรกร","farm":"","phone":""}');
  },
  saveProfile(p) { localStorage.setItem("smartrice-profile", JSON.stringify(p)); }
};

function markLink() {
  var dot = document.getElementById("linkDot"), txt = document.getElementById("linkText");
  if (!dot) return;
  var off = Store.isOffline();
  dot.className = "dot " + (off ? "down" : "live");
  txt.textContent = off ? "ออฟไลน์ เก็บในเครื่อง" : "เชื่อมต่อเซิร์ฟเวอร์แล้ว";
}

// ─── โมเดล AI (คุยผ่าน iframe แยก) ──────────────
var models = {
  rice:    { frame: document.getElementById("riceFrame"),    ready: false, props: null },
  disease: { frame: document.getElementById("diseaseFrame"), ready: false, props: null }
};
var waiting = {};
var seq = 0;

window.addEventListener("message", function (e) {
  var msg = e.data;
  if (!msg || !msg.type) return;
  var which = e.source === models.rice.frame.contentWindow ? "rice"
            : e.source === models.disease.frame.contentWindow ? "disease" : null;
  if (!which) return;

  if (msg.type === "ready") {
    models[which].ready = true;
    models[which].props = msg.properties;
    models[which].project = msg.project;
    markBrain();
  } else if (msg.type === "init-error") {
    models[which].error = msg.message;
    markBrain();
  } else if (msg.type === "result" && waiting[msg.requestId]) {
    waiting[msg.requestId].resolve(msg.result);
    delete waiting[msg.requestId];
  } else if (msg.type === "error" && waiting[msg.requestId]) {
    waiting[msg.requestId].reject(new Error(msg.message));
    delete waiting[msg.requestId];
  }
});

function classify(which, features) {
  return new Promise(function (resolve, reject) {
    var id = ++seq;
    waiting[id] = { resolve: resolve, reject: reject };
    models[which].frame.contentWindow.postMessage({ type: "classify", requestId: id, features: features }, "*");
    setTimeout(function () {
      if (waiting[id]) { delete waiting[id]; reject(new Error("โมเดลใช้เวลานานเกินไป ลองใหม่อีกครั้ง")); }
    }, 30000);
  });
}

function brainReady() { return models.rice.ready && models.disease.ready; }

function markBrain() {
  var dot = document.getElementById("brainDot"), txt = document.getElementById("brainText");
  if (dot) {
    if (models.rice.error || models.disease.error) {
      dot.className = "dot down"; txt.textContent = "โหลดโมเดลไม่สำเร็จ";
    } else if (brainReady()) {
      dot.className = "dot live"; txt.textContent = "โมเดล 2 ตัวพร้อมใช้";
    } else {
      dot.className = "dot"; txt.textContent = "กำลังโหลดโมเดล";
    }
  }
  document.querySelectorAll("[data-needs-brain]").forEach(function (btn) {
    if (models.rice.error || models.disease.error) {
      btn.textContent = "โหลดโมเดลไม่สำเร็จ"; btn.disabled = true;
    } else if (brainReady()) {
      btn.textContent = btn.dataset.readyLabel || "วิเคราะห์ภาพ";
      btn.disabled = !btn.dataset.armed;
    } else {
      btn.textContent = "กำลังโหลดโมเดล AI"; btn.disabled = true;
    }
  });
}

function inputSize(props) {
  return {
    w: (props && props.image_input_width) || 96,
    h: (props && props.image_input_height) || 96
  };
}

function extractFeatures(img, w, h) {
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  var ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  var d = ctx.getImageData(0, 0, w, h).data;
  var f = new Array(w * h);
  for (var i = 0, p = 0; i < d.length; i += 4, p++) f[p] = (d[i] << 16) + (d[i+1] << 8) + d[i+2];
  return f;
}

// ย่อรูปก่อนส่งให้ Gemini — รูปจากมือถือมักหลาย MB ส่งดิบจะช้าและเปลือง token
function imageToBase64(img, maxSide) {
  maxSide = maxSide || 800;
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  var scale = Math.min(1, maxSide / Math.max(w, h));
  var c = document.createElement("canvas");
  c.width = Math.round(w * scale);
  c.height = Math.round(h * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { data: c.toDataURL("image/jpeg", 0.85).split(",")[1], mimeType: "image/jpeg" };
}

// ─── ด่านกรองสี/พื้นผิวก่อนเข้าโมเดล ────────────
// โมเดลถูกฝึกให้ต้องเลือกคำตอบเสมอ ภาพที่ไม่ใช่พืชจึงได้คำตอบมั่วแต่มั่นใจสูง
// ด่านนี้ตัดภาพแบบนั้นทิ้งก่อนถึงโมเดล
function preCheck(img) {
  var SIZE = 64;
  var c = document.createElement("canvas");
  c.width = SIZE; c.height = SIZE;
  var ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, SIZE, SIZE);
  var d = ctx.getImageData(0, 0, SIZE, SIZE).data;

  var gray = new Float32Array(SIZE * SIZE);
  for (var p = 0; p < SIZE * SIZE; p++) {
    var i = p * 4;
    gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }

  var mid = (SIZE - 1) / 2, maxDist = Math.sqrt(2) * mid, EDGE_NORM = 900;
  var colorW = 0, edgeW = 0, wSum = 0, green = 0, yellow = 0, other = 0, total = 0;

  for (var y = 1; y < SIZE - 1; y++) {
    for (var x = 1; x < SIZE - 1; x++) {
      var k = (y * SIZE + x) * 4;
      var hsl = rgbToHsl(d[k], d[k+1], d[k+2]);
      var isGreen = hsl.h >= 60 && hsl.h <= 170;
      var isYB = hsl.h >= 20 && hsl.h < 60;
      var vivid = hsl.s > 0.12 && hsl.l > 0.08 && hsl.l < 0.9;
      total++;
      if (isGreen && vivid) green++;
      else if (isYB && vivid) yellow++;
      else other++;

      var gx = -gray[(y-1)*SIZE+(x-1)] + gray[(y-1)*SIZE+(x+1)]
             - 2*gray[y*SIZE+(x-1)] + 2*gray[y*SIZE+(x+1)]
             - gray[(y+1)*SIZE+(x-1)] + gray[(y+1)*SIZE+(x+1)];
      var gy = -gray[(y-1)*SIZE+(x-1)] - 2*gray[(y-1)*SIZE+x] - gray[(y-1)*SIZE+(x+1)]
             + gray[(y+1)*SIZE+(x-1)] + 2*gray[(y+1)*SIZE+x] + gray[(y+1)*SIZE+(x+1)];
      var edge = Math.min(Math.sqrt(gx*gx + gy*gy) / EDGE_NORM, 1);

      var dist = Math.sqrt((x-mid)*(x-mid) + (y-mid)*(y-mid)) / maxDist;
      var w = 1 - 0.6 * dist;   // กลางภาพมีน้ำหนักกว่าขอบ เพราะวัตถุหลักมักอยู่กลางเฟรม
      colorW += ((isGreen || isYB) && vivid ? 1 : 0) * w;
      edgeW += edge * w;
      wSum += w;
    }
  }

  var colorScore = colorW / wSum, edgeScore = edgeW / wSum;
  var texture = 0.5 + 0.5 * Math.min(edgeScore / 0.08, 1);
  var plant = colorScore * texture;
  if (edgeScore < 0.015) plant = Math.min(plant, 0.3);  // ผิวเรียบสนิทไม่ใช่ใบไม้จริง

  var greenPct = green / total * 100;
  var GREEN_MIN = 15;   // ใบข้าวจริงต้องมีเขียวเหลืออยู่บ้าง แม้ป่วยหนัก

  return {
    skip: greenPct < GREEN_MIN || plant < 0.18,
    why: greenPct < GREEN_MIN
      ? "ภาพนี้มีสีเขียวเพียง " + Math.round(greenPct) + "% ต่ำกว่าเกณฑ์ใบข้าว จึงไม่ส่งเข้าโมเดล"
      : "ภาพนี้ไม่มีลักษณะพื้นผิวของใบพืช จึงไม่ส่งเข้าโมเดล",
    green: Math.round(greenPct),
    yellow: Math.round(yellow / total * 100),
    other: Math.round(other / total * 100)
  };
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2, h = 0, s = 0, dd = max-min;
  if (dd !== 0) {
    s = dd / (1 - Math.abs(2*l - 1));
    if (max === r) h = 60 * (((g-b)/dd) % 6);
    else if (max === g) h = 60 * ((b-r)/dd + 2);
    else h = 60 * ((r-g)/dd + 4);
  }
  if (h < 0) h += 360;
  return { h: h, s: s, l: l };
}

// ตรวจครบ 2 ขั้น: เป็นข้าวไหม → ถ้าใช่ ตรวจโรคต่อ
async function runFullAnalysis(img) {
  var pre = preCheck(img);
  var out = { pre: pre, rice: null, disease: null, topDisease: null, isRice: false, gated: false };

  if (pre.skip) {
    var labels = (models.rice.props && models.rice.props.labels) || ["Rice", "not Rice"];
    var neg = labels.find(function (l) { return /not|non|other|ไม่ใช่/i.test(l); }) || labels[labels.length-1];
    out.rice = { results: labels.map(function (l) { return { label: l, value: l === neg ? 1 : 0 }; }) };
    out.gated = true;
    return out;
  }

  var rs = inputSize(models.rice.props);
  out.rice = await classify("rice", extractFeatures(img, rs.w, rs.h));

  var ranked = out.rice.results.slice().sort(function (a,b) { return b.value - a.value; });
  out.isRice = ranked[0] && !/not|non|other|ไม่ใช่/i.test(ranked[0].label);

  if (out.isRice && models.disease.ready) {
    var ds = inputSize(models.disease.props);
    out.disease = await classify("disease", extractFeatures(img, ds.w, ds.h));
    out.topDisease = out.disease.results.slice().sort(function (a,b) { return b.value - a.value; })[0];
  }
  return out;
}

// คะแนนสุขภาพ: ใบปกติได้เกือบเต็ม ใบป่วยหักตามความมั่นใจของโมเดล
function healthScore(r) {
  if (!r.isRice) return 99;
  if (!r.topDisease) return 90;
  if (/healthy/i.test(r.topDisease.label)) return 95;
  return Math.max(40, Math.round(100 - r.topDisease.value * 45));
}
function diagnosisName(r) {
  if (!r.isRice) return "ภาพไม่ชัดเจน";
  if (!r.topDisease) return "ไม่ระบุ";
  return th(r.topDisease.label);
}

// ─── ฐานความรู้แนวทางแก้ไข ─────────────────────
function getGuide(label) {
  return (window.DISEASE_GUIDE && window.DISEASE_GUIDE[label]) || null;
}

function buildRx(label) {
  var g = getGuide(label);
  if (!g) return null;

  var urgent = g.urgency || "";
  var tone = urgent.indexOf("สูง") === 0 ? "bad" : urgent === "ปานกลาง" ? "warn" : "";
  var box = el("div", "rx " + tone);

  var top = el("div", "rx-top");
  top.appendChild(el("div", "rx-name", "แนวทางจัดการ: " + g.thai));
  if (urgent && urgent !== "-") {
    var flagTone = urgent.indexOf("สูง") === 0 ? "hi" : urgent === "ปานกลาง" ? "mid" : "lo";
    top.appendChild(el("span", "rx-flag " + flagTone, "ความเร่งด่วน " + urgent));
  }
  box.appendChild(top);

  function part(head, body) {
    if (!body || (Array.isArray(body) && !body.length)) return;
    box.appendChild(el("div", "rx-sect", head));
    if (Array.isArray(body)) {
      var ul = el("ul");
      body.forEach(function (line) { ul.appendChild(el("li", "", line)); });
      box.appendChild(ul);
    } else {
      box.appendChild(el("p", "", body));
    }
  }
  part("สาเหตุ", g.cause);
  part("ลักษณะอาการ", g.symptoms);
  part("วิธีจัดการ", g.treatment);
  part("การป้องกันรอบหน้า", g.prevention);

  if (g.source && g.source !== "-") box.appendChild(el("div", "rx-src", "อ้างอิง: " + g.source));
  return box;
}

// ส่งฐานความรู้ให้ Gemini อ้างอิง ถ้าไม่มีข้อมูลบอกตรงๆ ไม่ปล่อยให้เดา
function guideForPrompt(label) {
  var g = getGuide(label);
  if (!g) return "\n\n[ไม่มีข้อมูลแนวทางแก้ไขของโรคนี้ในฐานข้อมูลอ้างอิง — แจ้งผู้ใช้ให้ปรึกษาเจ้าหน้าที่เกษตรในพื้นที่ ห้ามแต่งชื่อสารเคมีหรืออัตราใช้ขึ้นเอง]";
  return "\n\n[ข้อมูลอ้างอิงทางการ ให้ยึดเป็นหลัก ห้ามเพิ่มชื่อสารเคมีหรืออัตราใช้เอง]\n" +
    "โรค: " + g.thai + "\nสาเหตุ: " + g.cause + "\nอาการ: " + g.symptoms +
    "\nวิธีจัดการ: " + (g.treatment || []).join(" / ") +
    "\nการป้องกัน: " + (g.prevention || []).join(" / ");
}

// ─── ตัวช่วยสร้าง UI ────────────────────────────
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bund(label) {
  var b = el("div", "bund");
  b.appendChild(el("div", "bund-label", label));
  b.appendChild(el("div", "bund-line"));
  return b;
}

function plot(title, note) {
  var p = el("div", "plot");
  if (title) {
    var h = el("div", "plot-head");
    h.appendChild(el("div", "plot-title", title));
    if (note) h.appendChild(el("div", "plot-note", note));
    p.appendChild(h);
  }
  return p;
}

// สถานะว่าง/กำลังโหลด/ผิดพลาด ต้องบอกเสมอว่าเกิดอะไรและทำอะไรต่อ
function stateBlock(mark, lead, note) {
  var s = el("div", "state");
  s.appendChild(el("div", "state-mark", mark));
  s.appendChild(el("div", "state-lead", lead));
  if (note) s.appendChild(el("div", "state-note", note));
  return s;
}

function todayStamp() {
  var d = new Date();
  return String(d.getDate()).padStart(2,"0") + "/" +
         String(d.getMonth()+1).padStart(2,"0") + "/" +
         String(d.getFullYear()+543).slice(-2);
}

// SIGNATURE: คะแนนสุขภาพเป็นภาพตัดขวางแปลงนา ระดับน้ำ = คะแนน สี = สถานะ
function buildGauge(score, caption) {
  var wrap = el("div", "gauge-wrap");
  var s = statusOf(score);
  var g = el("div", "gauge " + (s === "none" ? "" : s));
  var water = el("div", "gauge-water");
  var read = el("div", "gauge-read");
  var hasScore = typeof score === "number";
  var fig = el("div", "gauge-figure" + (hasScore ? "" : " dim"), hasScore ? String(score) : "—");
  var unit = el("div", "gauge-unit" + (hasScore ? "" : " dim"), "คะแนนสุขภาพ");
  read.appendChild(fig); read.appendChild(unit);
  g.appendChild(water); g.appendChild(read);
  wrap.appendChild(g);

  var side = el("div", "gauge-side");
  side.appendChild(el("div", "verdict-label", "สถานะแปลงล่าสุด"));
  var name = el("div", "verdict-name " + (s === "none" ? "" : s), statusWord(s));
  side.appendChild(name);
  if (caption) side.appendChild(el("div", "read-foot", caption));
  wrap.appendChild(side);

  // ให้ระดับน้ำไหลขึ้นหลัง paint แรก เพื่อให้เห็น transition
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { water.style.height = (hasScore ? score : 0) + "%"; });
  });
  return wrap;
}

function readOut(label, value, foot, small) {
  var b = el("div");
  b.appendChild(el("div", "read-label", label));
  b.appendChild(el("div", "read-value num" + (small ? " sm" : ""), value));
  if (foot) b.appendChild(el("div", "read-foot", foot));
  return b;
}

function renderRanking(host, results, gated) {
  host.innerHTML = "";
  host.appendChild(el("div", "verdict-src", gated
    ? "ตัดสินจากด่านตรวจสี/พื้นผิว ไม่ได้ส่งภาพเข้าโมเดล AI"
    : "ผลจากโมเดลที่เทรนไว้ เรียงตามความมั่นใจ"));
  results.slice().sort(function (a,b) { return b.value - a.value; }).forEach(function (r, i) {
    var pct = Math.round(r.value * 100);
    var row = el("div", "bar-row" + (i === 0 ? " lead" : ""));
    row.appendChild(el("div", "bar-name", th(r.label)));
    var track = el("div", "bar-track");
    var fill = el("div", "bar-fill");
    fill.style.width = pct + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", "bar-pct", pct + "%"));
    host.appendChild(row);
  });
}

function renderMix(host, pre) {
  host.innerHTML = "";
  host.appendChild(el("div", "read-label", "สัดส่วนโทนสีในภาพ"));
  var bar = el("div", "mix");
  [["var(--blade)", pre.green], ["var(--grain)", pre.yellow], ["var(--ink-faint)", pre.other]].forEach(function (x) {
    var seg = el("div");
    seg.style.background = x[0];
    seg.style.width = x[1] + "%";
    bar.appendChild(seg);
  });
  host.appendChild(bar);
  var key = el("div", "mix-key");
  [["var(--blade)", "เขียว", pre.green], ["var(--grain)", "เหลือง/น้ำตาล", pre.yellow], ["var(--ink-faint)", "สีอื่น", pre.other]]
    .forEach(function (x) {
      var s = el("span");
      var sw = el("i", "swatch");
      sw.style.background = x[0];
      s.appendChild(sw);
      s.appendChild(document.createTextNode(x[1] + " "));
      s.appendChild(el("b", "", x[2] + "%"));
      key.appendChild(s);
    });
  host.appendChild(key);
}

// ตัวรับภาพ ใช้ร่วมกันทุกหน้าที่ต้องอัปโหลดรูป
function makeIntake(opts) {
  opts = opts || {};
  var wrap = el("div");
  var zone = el("div", "intake");
  zone.tabIndex = 0;
  zone.setAttribute("role", "button");
  zone.appendChild(el("div", "intake-lead", opts.lead || "เลือกภาพใบข้าว หรือลากมาวางตรงนี้"));
  zone.appendChild(el("div", "intake-hint", opts.hint || "ถ่ายใกล้ให้เห็นแผลบนใบชัดเจน จะได้ผลแม่นที่สุด"));
  var file = el("input", "hidden-file");
  file.type = "file";
  file.accept = "image/*";
  var shot = el("div", "shot");
  shot.hidden = true;
  var img = el("img");
  img.alt = "ภาพใบข้าวที่เลือก";
  var sweep = el("div", "sweep");
  sweep.hidden = true;
  sweep.appendChild(el("div", "sweep-line"));
  shot.appendChild(img); shot.appendChild(sweep);
  wrap.appendChild(zone); wrap.appendChild(file); wrap.appendChild(shot);

  var current = null;
  function take(f) {
    if (!f || f.type.indexOf("image/") !== 0) return;
    var url = URL.createObjectURL(f);
    var im = new Image();
    im.onload = function () {
      current = im;
      img.src = url;
      shot.hidden = false;
      opts.onReady && opts.onReady(im);
    };
    im.onerror = function () { opts.onFail && opts.onFail("เปิดไฟล์ภาพนี้ไม่ได้ ลองไฟล์อื่น"); };
    im.src = url;
  }

  zone.onclick = function () { file.click(); };
  zone.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } };
  zone.ondragover = function (e) { e.preventDefault(); zone.classList.add("over"); };
  zone.ondragleave = function () { zone.classList.remove("over"); };
  zone.ondrop = function (e) { e.preventDefault(); zone.classList.remove("over"); take(e.dataTransfer.files[0]); };
  file.onchange = function (e) { take(e.target.files[0]); };

  return {
    node: wrap,
    image: function () { return current; },
    sweeping: function (on) { sweep.hidden = !on; },
    clear: function () { current = null; shot.hidden = true; file.value = ""; }
  };
}

views.diagnose = function (root) {
  root.appendChild(bund("รับภาพเข้าตรวจ"));

  var wrap = el("div", "row-2");

  var left = plot("ภาพใบข้าว", "ระบบตรวจ 2 ขั้น: เป็นใบข้าวหรือไม่ → ถ้าใช่ จำแนกชนิดโรค");
  var intake = makeIntake({
    onReady: function () { runBtn.dataset.armed = "1"; markBrain(); },
    onFail: function (m) { showFlash(m, "bad"); }
  });
  left.appendChild(intake.node);

  var runBtn = el("button", "act act-go act-wide");
  runBtn.style.marginTop = "14px";
  runBtn.setAttribute("data-needs-brain", "");
  runBtn.dataset.readyLabel = "ตรวจภาพนี้";
  runBtn.disabled = true;
  left.appendChild(runBtn);

  var flashHost = el("div");
  left.appendChild(flashHost);
  wrap.appendChild(left);

  var right = plot("ผลวินิจฉัย");
  var resultHost = el("div");
  resultHost.appendChild(stateBlock("◇", "ยังไม่มีผล", "เลือกภาพแล้วกดตรวจ ผลจะแสดงที่นี่"));
  right.appendChild(resultHost);
  wrap.appendChild(right);

  root.appendChild(wrap);

  function showFlash(msg, kind) {
    flashHost.innerHTML = "";
    flashHost.appendChild(el("div", "flash flash-" + kind, msg));
  }

  runBtn.onclick = async function () {
    flashHost.innerHTML = "";
    runBtn.disabled = true;
    runBtn.textContent = "กำลังตรวจ";
    intake.sweeping(true);
    resultHost.innerHTML = "";
    resultHost.appendChild(stateBlock("◌", "กำลังตรวจภาพ", "โมเดลกำลังประมวลผลบนเครื่องของคุณ"));
    await new Promise(function (r) { setTimeout(r, 60); });

    try {
      var res = await runFullAnalysis(intake.image());
      resultHost.innerHTML = "";

      var score = healthScore(res);
      resultHost.appendChild(buildGauge(score, diagnosisName(res)));

      resultHost.appendChild(bund("ขั้นที่ 1 · เป็นใบข้าวหรือไม่"));
      var r1 = el("div");
      resultHost.appendChild(r1);

        resultHost.appendChild(bund("ขั้นที่ 2 · ชนิดของโรค"));
        var r2 = el("div");
        resultHost.appendChild(r2);
        renderRanking(r2, res.disease.results, false);

        if (res.topDisease) {
          var rx = buildRx(res.topDisease.label);
          if (rx) resultHost.appendChild(rx);
          else resultHost.appendChild(el("div", "flash flash-bad",

        }
      } else {
        resultHost.appendChild(el("div", "flash flash-bad",
          res.gated ? res.pre.why : "ภาพนี้ไม่ใช่ใบข้าว ระบบจึงไม่ตรวจโรคต่อ"));
      }

      resultHost.appendChild(bund("หลักฐานเชิงสี"));
      var mixHost = el("div");

      renderMix(mixHost, res.pre);

      await Store.add({

        owner: Store.profile().name,
        gps: "",

        disease: diagnosisName(res),
        score: score
      });
      showFlash(Store.isOffline()
        ? "บันทึกลงเครื่องแล้ว จะซิงก์ขึ้นเซิร์ฟเวอร์เมื่อเชื่อมต่อได้"

  camBtn.title = "แนบภาพใบข้าว";
  camBtn.setAttribute("aria-label", "แนบภาพใบข้าว");
  camBtn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="display:block"><path d="M4 7h3l2-2h6l2 2h3v12H4z" stroke="#21281F" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#21281F" stroke-width="1.6"/></svg>';
  var fileIn = el("input", "hidden-file");
  fileIn.type = "file";
  fileIn.accept = "image/*";
  var q = el("input");
  q.placeholder = "เช่น ใบข้าวมีจุดสีน้ำตาล ควรทำอย่างไร";
  var sendBtn = el("button", "act act-go", "ถาม");
  bar.appendChild(camBtn); bar.appendChild(fileIn); bar.appendChild(q); bar.appendChild(sendBtn);
  card.appendChild(bar);
  root.appendChild(card);

  var pinned = null;
  camBtn.onclick = function () { fileIn.click(); };
  fileIn.onchange = function (e) {
    var f = e.target.files[0];
    if (!f || f.type.indexOf("image/") !== 0) return;
    var url = URL.createObjectURL(f);
    var im = new Image();
    im.onload = function () {
      pinned = im;
      clipImg.src = url;
      clipText.textContent = "แนบภาพแล้ว ระบบจะตรวจโรคก่อนส่งให้ AI อธิบาย";
      clip.hidden = false;
    };
    im.src = url;
  };
  clipDrop.onclick = function () { pinned = null; fileIn.value = ""; clip.hidden = true; };

  var logs = await Store.list();
  var context = logs.slice(0, 5).map(function (l) {
    return "- " + l.date + " พบ " + l.disease + " คะแนน " + l.score + (l.ph ? " pH " + l.ph : "");
  }).join("\n");

  async function ask() {
    var text = q.value.trim();
    if (!text && !pinned) return;

    var mine = el("div", "say say-me");
    if (pinned) {
      var pv = el("img");
      pv.src = pinned.src;
      mine.appendChild(pv);
    }
    if (text) mine.appendChild(document.createTextNode(text));
    talk.appendChild(mine);

    var shot = pinned;
    q.value = "";
    pinned = null;
    fileIn.value = "";
    clip.hidden = true;
    talk.scrollTop = talk.scrollHeight;

    var reply = el("div", "say say-ai", shot ? "กำลังตรวจภาพด้วยโมเดล" : "กำลังคิด");
    talk.appendChild(reply);
    talk.scrollTop = talk.scrollHeight;

    try {
      var cvNote = "", payload = null;
      if (shot) {
        // ตรวจด้วยโมเดลในเครื่องก่อน แล้วส่งผลไปเป็นบริบท
        // Gemini จะอธิบายต่อยอดจากผลตรวจจริง ไม่ใช่เดาจากภาพอย่างเดียว
        try {
          var res = await runFullAnalysis(shot);
          if (!res.isRice) {
            cvNote = "\n\n[ผลจากโมเดลตรวจภาพ: ไม่ใช่ใบข้าว หรือภาพไม่ชัดพอให้จำแนกโรค]";
          } else if (res.topDisease) {
            cvNote = "\n\n[ผลจากโมเดลตรวจภาพ: เป็นใบข้าว โรคที่พบคือ " + th(res.topDisease.label) +
                     " ความมั่นใจ " + Math.round(res.topDisease.value * 100) + "%]" +
                     guideForPrompt(res.topDisease.label);
          }
        } catch (e) {
          cvNote = "\n\n[โมเดลตรวจภาพทำงานไม่สำเร็จ ให้วิเคราะห์จากภาพโดยตรง]";
        }
        reply.textContent = "กำลังให้ AI อธิบายผล";
        payload = imageToBase64(shot);
      }

      var prompt = "คุณเป็นผู้เชี่ยวชาญโรคข้าวและการเกษตรไทย ตอบภาษาไทยแบบเข้าใจง่าย กระชับ\n\n" +
        (context ? "บันทึกแปลงล่าสุดของผู้ถาม:\n" + context + "\n\n" : "") +
        "คำถาม: " + (text || "ช่วยดูภาพใบข้าวนี้ว่าเป็นโรคอะไร และควรจัดการอย่างไร") + cvNote;

      reply.textContent = await Store.askGemini(prompt, payload);
    } catch (err) {
      reply.textContent = "เชื่อมต่อ AI ไม่ได้: " + err.message;
    }
    talk.scrollTop = talk.scrollHeight;
  }

  sendBtn.onclick = ask;
  q.onkeydown = function (e) { if (e.key === "Enter") ask(); };
};

  wipe.style.marginTop = "14px";
  wipe.onclick = function () {
    if (confirm("ลบสำเนาข้อมูลในเครื่องนี้ทั้งหมด ข้อมูลบนเซิร์ฟเวอร์จะยังอยู่ ยืนยันหรือไม่")) {
      localStorage.removeItem("smartrice-logs");
      Store._cache = null;
      wipe.textContent = "ล้างข้อมูลในเครื่องแล้ว";
    }
  };
  card.appendChild(wipe);
  root.appendChild(card);
};

// ─── ตัวสลับหน้า ────────────────────────────────
var here = "overview";

function paintNav() {
  var nav = document.getElementById("railNav");
  nav.innerHTML = "";
  PAGES.forEach(function (p) {
    var b = el("button", "rail-item" + (p.id === here ? " on" : ""));
    b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + p.icon + '"/></svg>';
    b.appendChild(document.createTextNode(p.label));
    b.onclick = function () {
      open(p.id);
      document.getElementById("rail").classList.remove("open");
    };
    nav.appendChild(b);
  });
}

async function open(id) {
  here = id;
  var page = PAGES.find(function (p) { return p.id === id; });
  document.getElementById("barTitle").textContent = page.label;
  document.getElementById("barKicker").textContent = page.kicker;
  paintNav();

  var root = document.getElementById("field");
  root.innerHTML = "";
  root.appendChild(stateBlock("◌", "กำลังเปิดหน้า", null));
  try {
    root.innerHTML = "";
    await views[id](root);
  } catch (err) {
    root.innerHTML = "";
    root.appendChild(stateBlock("!", "เปิดหน้านี้ไม่ได้", err.message + " — ลองรีเฟรชหน้าอีกครั้ง"));
  }
}

function paintWho() {
  var p = Store.profile();
  document.getElementById("whoName").textContent = p.name;
  document.getElementById("whoBadge").textContent = (p.name || "ก").charAt(0);
}

document.getElementById("railToggle").onclick = function () {
  document.getElementById("rail").classList.toggle("open");
};
document.getElementById("seekInput").oninput = function () {
  if (here === "ledger") open("ledger");
};

paintWho();
markBrain();
open("overview");

})();
</script>
</body>
