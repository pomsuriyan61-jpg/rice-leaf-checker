// opts.hasImage = true เมื่อผู้ใช้แนบภาพมาด้วย
function knowledgeFor(text, opts) {
  var q = text || "";
  opts = opts || {};

  var hits = [];
  Object.keys(TOPICS).forEach(function (k) {
    if (TOPICS[k].words.test(q)) hits.push(k);
  });

  var blocks = [];
  hits.slice(0, 2).forEach(function (k) {
    var b = TOPICS[k].build(q);
    if (b) blocks.push(b);
  });

  // ── เพิ่ม 2026-08 แก้ปัญหาที่คำถามอาการกว้างไม่เคยได้ข้อมูลแมลงเลย ──
  //
  // คนที่ถ่ายรูปมาถามว่า "เกิดจากอะไร" คือคนที่ยังไม่รู้สาเหตุ
  // จึงเป็นไปไม่ได้ที่เขาจะพิมพ์คำว่าเพลี้ยหรือแมลงมาให้ระบบจับ
  // ของเดิมจึงให้ความรู้เรื่องแมลงเฉพาะกับคนที่รู้อยู่แล้วว่าเป็นแมลง
  // ซึ่งกลับหัวกลับหางกับสิ่งที่ควรเป็น
  //
  // อาการเหลือง แห้ง ตาย เกิดได้จากทั้งโรค แมลง ดิน และน้ำ
  // ถ้าไม่ส่งตัวแยกไปด้วย AI จะเดาจากข้อมูลแปลงที่มีอยู่ เช่นค่า pH
  // แล้วฟันธงว่าเป็นเรื่องดินทั้งที่ยังไม่ได้ตัดความเป็นไปได้อื่นออกเลย
  var vague = /เกิดจากอะไร|สาเหตุ|ทำไม|เป็นอะไร|เป็นโรคอะไร|ช่วยดู|วิเคราะห์|ประเมิน|แก้ยังไง|ทำไงดี|เหลือง|แห้ง|ตาย|เฉา|เหี่ยว|ไหม้|หย่อม|แคระ|ไม่โต|ผิดปกติ/i;

  if ((opts.hasImage || vague.test(q)) && hits.indexOf("pest") === -1) {
    var tri = pestTriage();
    if (tri) blocks.push(tri);
  }

  if (!blocks.length) blocks.push(knowledgeIndex());
  return "\n\n" + blocks.join("\n\n");
}

function buildFarmContext(logs) {
  var prof = Store.profile();
  if (!logs.length) {
    return "ข้อมูลผู้ใช้: " + prof.name + (prof.farm ? " แปลง " + prof.farm : "") +
           "\n" + varietyContext() +
           "\nยังไม่มีบันทึกสำรวจในระบบ";
  }

  var scores = logs.map(function (l) { return l.score; }).filter(function (v) { return typeof v === "number"; });
  var phs = logs.map(function (l) { return l.ph; }).filter(function (v) { return typeof v === "number"; });
  var avg = function (arr) { return arr.reduce(function (a,b) { return a+b; }, 0) / arr.length; };

  var tally = {};
  logs.forEach(function (l) { tally[l.disease] = (tally[l.disease] || 0) + 1; });
  var ranked = Object.keys(tally).sort(function (a,b) { return tally[b] - tally[a]; });

  var lines = [];
  lines.push("ข้อมูลผู้ใช้: " + prof.name + (prof.farm ? " แปลง " + prof.farm : ""));
  lines.push("จำนวนการสำรวจสะสม: " + logs.length + " ครั้ง");
  lines.push(varietyContext());
  if (scores.length) {
    lines.push("คะแนนสุขภาพเฉลี่ย: " + Math.round(avg(scores)) + " (" + statusWord(statusOf(Math.round(avg(scores)))) + ")");
  }
  if (phs.length) {
    lines.push("pH ดินเฉลี่ย: " + avg(phs).toFixed(2) + " จากการวัด " + phs.length + " ครั้ง");
  } else {
    lines.push("pH ดิน: ยังไม่เคยวัด");
  }
  lines.push("โรคที่พบบ่อยที่สุด: " + ranked.slice(0, 3).map(function (k) {
    return k + " " + tally[k] + " ครั้ง";
  }).join(", "));

  var withGps = logs.filter(function (l) { return l.gps; });
  if (withGps.length) lines.push("พิกัดแปลงล่าสุด: " + withGps[0].gps);

  // ผลวิเคราะห์ดินคือข้อมูลที่ทำให้ AI แนะนำปุ๋ยเฉพาะแปลงได้จริง
  // ต่างจากค่า pH อย่างเดียวซึ่งบอกไม่ได้ว่าดินขาดธาตุอะไร
  var soil = logs.filter(function (l) { return l.kind === "soil"; })[0];
  if (soil && window.readNutrient) {
    var parts = [];
    ["om", "p", "k", "n"].forEach(function (k) {
      if (soil[k] == null) return;
      var r = window.readNutrient(k, soil[k]);
      if (r) parts.push(r.nutrient.thai + " " + soil[k] + " " + r.nutrient.unit + " (ระดับ" + r.band.word + ")");
    });
    if (parts.length) {
      lines.push("ผลวิเคราะห์ดินล่าสุด เมื่อ " + soil.date + ": " + parts.join(", "));
      lines.push("[มีผลวิเคราะห์ดินแล้ว ให้แนะนำสูตรปุ๋ยโดยพิจารณาจากค่าเหล่านี้ " +
                 "ธาตุที่อยู่ในระดับสูงไม่ต้องใส่เพิ่ม ธาตุที่ต่ำให้เสริม " +
                 "และบอกด้วยว่าประหยัดค่าปุ๋ยได้อย่างไรเมื่อเทียบกับการใส่สูตรรวมแบบเหมา]");
    }
  }

  lines.push("บันทึก 5 ครั้งล่าสุด:");
  logs.slice(0, 5).forEach(function (l) {
    lines.push("  " + l.date + " พบ " + l.disease + " คะแนน " + l.score +
               (l.ph != null ? " pH " + l.ph : ""));
  });

  return lines.join("\n");
}

// ส่งออกเป็น CSV ให้เปิดใน Excel ได้
// ใส่ BOM นำหน้าเพราะ Excel บน Windows อ่านภาษาไทยเป็นตัวต่างดาวถ้าไม่มี
function exportCsv(logs) {
  var head = ["วันที่", "ผู้บันทึก", "ผลตรวจจาก AI", "ผู้ใช้ยืนยัน", "โรคที่ถูกต้อง", "pH", "คะแนนสุขภาพ", "พิกัด", "มีภาพ"];
  var cell = function (v) {
    var s = (v === null || v === undefined) ? "" : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
  };
  var rows = logs.map(function (l) {
    var judged = l.verify ? (l.verify.correct ? "ถูกต้อง" : "ไม่ถูกต้อง") : "ยังไม่ยืนยัน";
    return [l.date, l.owner || "", l.disease, judged,
            l.verify && l.verify.actual ? l.verify.actual : "",
            l.ph != null ? l.ph : "", l.score, l.gps || "",
            l.hasImage ? "มี" : "ไม่มี"].map(cell).join(",");
  });

  var csv = "\uFEFF" + head.map(cell).join(",") + "\n" + rows.join("\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "smartrice-บันทึกแปลง-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      var s = 0;
      // ความชื้นคือตัวขับหลัก เชื้อต้องการฟิล์มน้ำบนผิวกาบใบเพื่อเข้าทำลาย
      if (w.humidity >= 88) s += 38; else if (w.humidity >= 80) s += 22; else if (w.humidity >= 72) s += 10;
      // ช่วง 28-32°C คือช่วงที่เส้นใยเชื้อลุกลามเร็วที่สุด
      if (w.tempMax >= 28 && w.tempMax <= 32) s += 25; else if (w.tempMax >= 25) s += 12;
      if (w.rain7 >= 40) s += 22; else if (w.rain7 >= 15) s += 12;
      // แดดน้อยแปลว่าทรงพุ่มแห้งช้า ความชื้นค้างอยู่ในกอนานขึ้น
      if (w.sunHours <= 5) s += 15; else if (w.sunHours <= 7) s += 7;
      return s;
    }
  },
  {
    label: "Brownspot",
    thai: "โรคใบจุดสีน้ำตาล",
    why: "มักรุนแรงในช่วงที่ต้นข้าวเครียด เช่น ฝนทิ้งช่วงหรือดินขาดธาตุอาหาร ต่างจากโรคอื่นที่ชอบฝนชุก",
    score: function (w) {
      var s = 0;
      if (w.rain7 <= 5) s += 35; else if (w.rain7 <= 20) s += 18;
      if (w.humidity >= 80) s += 20; else if (w.humidity >= 70) s += 12;
      if (w.tempMax >= 28) s += 20; else if (w.tempMax >= 24) s += 10;
      if (w.sunHours >= 8) s += 15;
      return s;
    }
  },
  {
    label: "Rice Tungro",
    thai: "โรคใบสีส้ม (ทุงโร)",
    // ข้อจำกัดที่ต้องบอกผู้ใช้ตรงๆ: โรคนี้มาจากแมลงพาหะ ไม่ใช่สภาพอากาศโดยตรง
    // ดัชนีนี้จึงบอกได้แค่ "อากาศเอื้อให้เพลี้ยจักจั่นเพิ่มจำนวน" ไม่ใช่ "โรคกำลังจะระบาด"
    // การเดินสำรวจแปลงจริงยังจำเป็นเสมอสำหรับโรคนี้ มากกว่าโรคอื่นในรายการ
    why: "เกิดจากไวรัสที่มีเพลี้ยจักจั่นสีเขียวเป็นพาหะ อากาศอุ่นและชื้นปานกลางทำให้แมลงเพิ่มจำนวนเร็ว แต่ค่านี้บอกได้แค่โอกาสที่แมลงจะมาก ไม่ได้บอกว่ามีเชื้อในแปลงหรือไม่ ต้องเดินสำรวจแปลงประกอบเสมอ",
    score: function (w) {
      var s = 0;
      // เพลี้ยจักจั่นสีเขียวขยายพันธุ์ได้ดีในช่วงอุ่น ไม่ร้อนจัด
      if (w.tempMax >= 28 && w.tempMax <= 34) s += 30; else if (w.tempMax >= 25) s += 15;
      if (w.tempMin >= 23) s += 15; else if (w.tempMin >= 20) s += 8;
      // ฝนปานกลางเอื้อที่สุด ฝนหนักมากจะชะตัวแมลงร่วง ส่วนแล้งจัดแมลงก็ไม่ชุก
      // จึงให้คะแนนสูงสุดที่ช่วงกลาง ไม่ใช่ปลายทั้งสองด้าน
      if (w.rain7 >= 10 && w.rain7 <= 45) s += 25; else if (w.rain7 < 10) s += 5;
      if (w.humidity >= 70 && w.humidity <= 88) s += 18; else s += 4;
      return s;
    }
  }
];

function riskBand(score) {
  if (score >= 70) return { key: "bad",  word: "สูง" };
  if (score >= 45) return { key: "warn", word: "ปานกลาง" };
  return { key: "ok", word: "ต่ำ" };
}

// ดึงข้อมูลอากาศจาก 2 แหล่งที่วัดคนละวิธี เพื่อให้ตรวจสอบไขว้กันได้
//
// WeatherAPI  — ค่าปัจจุบัน อัปเดตทุก 10-15 นาที เป็นแหล่งอ้างอิงหลักของค่าปัจจุบัน
//               ข้อจำกัด: ข้อมูลย้อนหลังเป็นค่าพยากรณ์ที่เก็บถาวรไว้ ไม่ใช่ค่าที่วัดได้จริง
// Open-Meteo  — ย้อนหลัง 7 วันและชั่วโมงแสงแดด ซึ่ง WeatherAPI ไม่มีให้
//
// ถ้าจะเปลี่ยนไปใช้ API กรมอุตุนิยมวิทยา แก้เฉพาะ 2 ฟังก์ชันนี้
// (ข้อมูลกรมอุตุฯ มีลิขสิทธิ์ หากเผยแพร่ต้องระบุแหล่งที่มากำกับทุกครั้ง
//  และตรวจวัดทุก 3 ชั่วโมง ไม่ได้ละเอียดรายชั่วโมง)
async function fetchLiveWeather(lat, lon) {
  return await api("/weather?lat=" + lat + "&lon=" + lon);
}

async function fetchWeather(lat, lon) {
  var url = "https://api.open-meteo.com/v1/forecast" +
    "?latitude=" + lat + "&longitude=" + lon +
    "&daily=precipitation_sum,sunshine_duration,temperature_2m_max,temperature_2m_min" +
    "&hourly=relative_humidity_2m" +
    "&past_days=7&forecast_days=7&timezone=Asia%2FBangkok";

  var res = await fetch(url);
  if (!res.ok) throw new Error("ดึงข้อมูลอากาศไม่สำเร็จ (HTTP " + res.status + ")");
  var d = await res.json();

  var days = d.daily.time.map(function (date, i) {
    return {
      date: date,
      rain: d.daily.precipitation_sum[i],
      // Open-Meteo คืนค่าแสงแดดเป็นวินาที แปลงเป็นชั่วโมงให้อ่านง่าย
      sunHours: d.daily.sunshine_duration[i] != null
        ? +(d.daily.sunshine_duration[i] / 3600).toFixed(1) : null,
      tempMax: d.daily.temperature_2m_max[i],
      tempMin: d.daily.temperature_2m_min[i]
    };
  });

  // เฉลี่ยความชื้นรายชั่วโมงให้เป็นรายวัน เพราะ Open-Meteo ไม่ได้ให้ค่ารายวันมาตรง
  if (d.hourly && d.hourly.relative_humidity_2m) {
    var byDate = {};
    d.hourly.time.forEach(function (t, i) {
      var day = t.slice(0, 10);
      if (!byDate[day]) byDate[day] = [];
      var v = d.hourly.relative_humidity_2m[i];
      if (v != null) byDate[day].push(v);
    });
    days.forEach(function (day) {
      var arr = byDate[day.date];
      day.humidity = arr && arr.length
        ? Math.round(arr.reduce(function (a, b) { return a + b; }, 0) / arr.length) : null;
    });
  }

  var todayIndex = days.findIndex(function (day) {
    return day.date === new Date().toISOString().slice(0, 10);
  });
  if (todayIndex === -1) todayIndex = 7;

  var past = days.slice(0, todayIndex + 1);
  var rain7 = past.reduce(function (a, day) { return a + (day.rain || 0); }, 0);
  var recent = past.slice(-3);
  var avg = function (key) {
    var vals = recent.map(function (r) { return r[key]; }).filter(function (v) { return v != null; });
    return vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : 0;
  };

  return {
    days: days,
    todayIndex: todayIndex,
    // พิกัดจุดตรวจอากาศที่ผู้ให้บริการเลือกให้ ซึ่งมักไม่ตรงกับพิกัดแปลงเป๊ะๆ
    // เก็บไว้เพื่อแสดงให้ผู้ใช้เห็นว่าค่าที่อ่านอยู่มาจากจุดไหน ไม่ใช่วัดที่แปลงโดยตรง
    station: {
      lat: d.latitude,
      lon: d.longitude,
      elevation: d.elevation,
      timezone: d.timezone_abbreviation || d.timezone || "Asia/Bangkok"
    },
    summary: {
      rain7: +rain7.toFixed(1),
      humidity: Math.round(avg("humidity")),
      sunHours: +avg("sunHours").toFixed(1),
      tempMax: +avg("tempMax").toFixed(1),
      tempMin: +avg("tempMin").toFixed(1)
    }
  };
}

// ═══ การหาพิกัด ═══
//
// ── ทำไมต้องมีตัวกลาง แทนที่จะเรียก getCurrentPosition ตรงๆ (แก้ไข 2026-08) ──
//
// เดิมทุกหน้าเรียก navigator.geolocation.getCurrentPosition() เองโดยไม่ส่งตัวเลือกใดๆ
// ซึ่งแปลว่าใช้ค่าเริ่มต้นของเบราว์เซอร์คือ enableHighAccuracy: false
// บนมือถือ ค่านี้ทำให้ระบบหาตำแหน่งจากเสาสัญญาณและ WiFi แทนดาวเทียม GPS
// ความคลาดเคลื่อนจึงอยู่ที่หลักร้อยเมตรถึงหลายกิโลเมตร
//
// นี่คือสาเหตุที่ชื่อหมู่บ้านหรือตำบลที่ระบบแสดงมักไม่ตรงกับที่ผู้ใช้อยู่จริง
// ไม่ใช่เพราะฐานข้อมูลชื่อสถานที่ผิด แต่เพราะพิกัดที่ส่งไปถามมันผิดตั้งแต่ต้น
// ในชนบทที่เสาสัญญาณห่างกันมาก ความคลาดเคลื่อนยิ่งสูงกว่าในเมืองอีก
//
// ตัวกลางนี้บังคับสามอย่าง
//   enableHighAccuracy: true  ให้ใช้ดาวเทียม GPS จริง แลกกับใช้เวลานานขึ้นและกินแบตกว่า
//   maximumAge: 0             ห้ามใช้ค่าเก่าที่เบราว์เซอร์แคชไว้ ต้องวัดใหม่ทุกครั้ง
//   timeout                   ไม่ปล่อยให้ผู้ใช้รอไม่มีกำหนดเมื่อหาดาวเทียมไม่เจอ
//
// และคืนค่า accuracy กับ timestamp กลับมาด้วย เพื่อให้ทุกหน้าบอกผู้ใช้ได้ว่า
// พิกัดที่ได้แม่นแค่ไหนและวัดเมื่อไหร่ ซึ่งเป็นข้อมูลที่ผู้ใช้ต้องรู้เพื่อตัดสินใจว่าจะเชื่อไหม
function getFix(opts) {
  opts = opts || {};
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) {
      return reject(new Error("อุปกรณ์นี้ไม่รองรับการหาตำแหน่ง"));
    }
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        resolve({
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy: pos.coords.accuracy,   // รัศมีความคลาดเคลื่อนเป็นเมตร
          at: pos.timestamp                // เวลาที่วัดได้จริง ไม่ใช่เวลาที่เรียกฟังก์ชัน
        });
      },
      function (e) {
        // แยกสาเหตุให้ชัด เพราะทางแก้ต่างกันคนละเรื่อง
        // ผู้ใช้ที่ยังไม่ได้กดอนุญาต กับผู้ใช้ที่อยู่ในตึกจนจับดาวเทียมไม่ได้
        // ถ้าบอกเหมือนกันว่า "หาตำแหน่งไม่ได้" ทั้งคู่จะไม่รู้ว่าต้องทำอะไรต่อ
        if (e && e.code === 1) return reject(new Error("ยังไม่ได้อนุญาตให้เว็บเข้าถึงตำแหน่ง"));
        if (e && e.code === 3) return reject(new Error("หาสัญญาณดาวเทียมไม่ทัน ลองออกไปที่โล่งแล้วกดใหม่"));
        return reject(new Error("หาตำแหน่งไม่สำเร็จ"));
      },
      {
        enableHighAccuracy: opts.high !== false,
        timeout: opts.timeout || 15000,
        maximumAge: 0
      }
    );
  });
}

// แปลงค่าความคลาดเคลื่อนเป็นข้อความที่ผู้ใช้ตัดสินใจได้
//
// เกณฑ์มาจากขนาดแปลงนาจริง แปลงหนึ่งไร่กว้างประมาณ 40 เมตร
// ถ้าคลาดเคลื่อนเกิน 50 เมตร ก็อาจชี้ไปแปลงข้างเคียงแล้ว
// และถ้าเกิน 200 เมตร มีโอกาสข้ามหมู่บ้านซึ่งทำให้ชื่อสถานที่ผิดไปเลย
function accuracyNote(m) {
  if (m == null) return { ok: true, text: "" };
  var r = Math.round(m);
  if (m <= 20)  return { ok: true,  text: "ความแม่นยำ ±" + r + " เมตร ใช้ระบุแปลงได้ดี" };
  if (m <= 50)  return { ok: true,  text: "ความแม่นยำ ±" + r + " เมตร พอใช้ระบุแปลงได้" };
  if (m <= 200) return { ok: false, text: "ความแม่นยำ ±" + r + " เมตร ซึ่งกว้างกว่าแปลงนาทั่วไป อาจชี้ไปแปลงข้างเคียง ลองออกที่โล่งแล้วกดใหม่" };
  return { ok: false, text: "ความแม่นยำ ±" + r + " เมตร ซึ่งหยาบมาก น่าจะจับจากเสาสัญญาณไม่ใช่ดาวเทียม ชื่อสถานที่ที่ได้อาจผิดหมู่บ้าน ให้ออกไปที่โล่งแล้วกดใหม่" };
}

// ระยะทางระหว่างสองพิกัดเป็นเมตร (สูตร haversine)
// ใช้บอกว่าจุดพยากรณ์อากาศอยู่ห่างจากแปลงเท่าไหร่
function metersBetween(lat1, lon1, lat2, lon2) {
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return Math.round(2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

// อายุของพิกัดที่บันทึกไว้ บอกเป็นภาษาคน
// พิกัดแปลงไม่ค่อยเปลี่ยน แต่ผู้ใช้ควรรู้ว่ากำลังดูของเก่าแค่ไหน
// โดยเฉพาะคนที่ทำหลายแปลงแล้วอาจลืมว่าปักหมุดไว้ที่แปลงไหน
function ageWords(ms) {
  if (!ms) return "";
  var d = Math.floor((Date.now() - ms) / 86400000);
  if (d <= 0) return "วันนี้";
  if (d === 1) return "เมื่อวาน";
  if (d < 30) return d + " วันก่อน";
  if (d < 365) return Math.floor(d / 30) + " เดือนก่อน";
  return Math.floor(d / 365) + " ปีก่อน";
}

// ═══ ข้อมูลแปลงนาที่ใช้ร่วมกันทุกหน้า ═══
//
// เดิมแต่ละหน้าหาพิกัดเอง หน้าอากาศใช้พิกัดจากบันทึกเก่า หน้าแผนที่ใช้อีกจุด
// ผลคือดูอากาศของที่หนึ่งแต่แผนที่ชี้อีกที่ โดยผู้ใช้ไม่รู้ตัว
// ตอนนี้ทุกหน้าดึงจากที่เดียวกันผ่าน fieldCoords()
var FIELD_KEY_BASE = "smartrice-field:";
function fieldKey() {
  return FIELD_KEY_BASE + (Session.user ? Session.user.username : "guest");
}
function readField() {
  try { return JSON.parse(localStorage.getItem(fieldKey()) || "null"); }
  catch (e) { return null; }
}
function writeField(f) {
  try { localStorage.setItem(fieldKey(), JSON.stringify(f)); } catch (e) { /* พื้นที่เต็ม */ }
}

// คืนพิกัดแปลงพร้อมบอกว่าได้มาจากไหน เพื่อให้หน้าปลายทางแสดงที่มาให้ผู้ใช้เห็นได้
function fieldCoords() {
  var f = readField();
  if (f && f.lat != null && f.lon != null) {
    return { lat: f.lat, lon: f.lon, from: "ที่นาที่คุณปักหมุดไว้", field: f };
  }
  return null;
}

// ── พันธุ์ข้าวของแปลง ────────────────────────────
//
// เก็บไว้ในระเบียนแปลงเดียวกับพิกัด เพราะเป็นคุณสมบัติของแปลงในฤดูนั้น
// ไม่ใช่การตั้งค่าการแสดงผล ทุกหน้าที่ให้คำแนะนำเรื่องจังหวะปุ๋ยต้องอ่านค่านี้
//
// ทำไมสำคัญ: ข้าวไวต่อช่วงแสงออกดอกตามความยาวกลางวัน ไม่ใช่ตามอายุ
// ปฏิทินปุ๋ยครั้งที่ 2 ของสองกลุ่มนี้จึงห่างกันได้เป็นเดือน
// ถ้าไม่รู้พันธุ์ ระบบจะแนะนำจังหวะผิดโดยที่ผู้ใช้ไม่มีทางรู้ตัว
//
// ค่าเริ่มต้นเป็น photo (ไวต่อช่วงแสง) เพราะเป็นข้าวส่วนใหญ่ของประเทศ
// และการเดาผิดไปทางนี้ปลอดภัยกว่า เพราะคำแนะนำจะบอกให้นับจากวันออกดอก
// ซึ่งใช้ได้กับทั้งสองกลุ่ม ต่างจากการเดาเป็นนาปรังที่ให้ตัวเลขอายุตายตัว
function fieldVariety() {
  var f = readField();
  var v = f && f.variety;
  var list = (window.CARE_GUIDE && window.CARE_GUIDE.varieties) || [];
  for (var i = 0; i < list.length; i++) if (list[i].key === v) return v;
  return (window.CARE_GUIDE && window.CARE_GUIDE.defaultVariety) || "photo";
}

function setFieldVariety(v) {
  var f = readField() || {};
  f.variety = v;
  writeField(f);
}

// ── ชื่อพันธุ์และวันหว่าน (เพิ่ม 2026-08) ──
//
// เดิมเก็บแค่กลุ่มพันธุ์ (photo/nonphoto) ซึ่งพอให้คำแนะนำถูกหลักการ
// แต่ผู้ใช้ยังต้องไปหาเองว่าพันธุ์ที่ปลูกออกดอกวันไหน
// พอเก็บชื่อพันธุ์กับวันหว่านเพิ่ม ระบบคำนวณวันจริงให้ได้เลย
//
// เก็บทั้งสองค่าแยกจาก field.variety โดยตั้งใจ ไม่รวมเป็นค่าเดียว
// เพราะผู้ใช้ที่ยังไม่รู้ชื่อพันธุ์ต้องยังใช้ระบบได้ด้วยการเลือกแค่กลุ่ม
// ถ้าบังคับให้เลือกชื่อพันธุ์ก่อน คนที่ซื้อเมล็ดมาโดยไม่รู้ชื่อจะใช้ไม่ได้เลย
function fieldVarietyKey() {
  var f = readField();
  return (f && f.varietyKey) || null;
}

function setFieldVarietyKey(k) {
  var f = readField() || {};
  f.varietyKey = k || null;
  // ตั้งกลุ่มให้ตรงกับพันธุ์อัตโนมัติ ป้องกันสองค่าขัดกันเอง
  // ซึ่งจะทำให้หน้าหนึ่งบอกนาปีอีกหน้าบอกนาปรังโดยผู้ใช้ไม่รู้ตัว
  if (k && typeof window.findVariety === "function") {
    var v = window.findVariety(k);
    if (v) f.variety = v.photo ? "photo" : "nonphoto";
  }
  writeField(f);
}

function fieldSowDate() {
  var f = readField();
  if (!f || !f.sowDate) return null;
  var d = new Date(f.sowDate);
  return isNaN(d.getTime()) ? null : d;
}

function setFieldSowDate(iso) {
  var f = readField() || {};
  f.sowDate = iso || null;
  writeField(f);
}

// ปฏิทินของแปลงนี้ คืน null ถ้าข้อมูลไม่พอ ไม่เดาแทนผู้ใช้
function fieldCalendar() {
  var k = fieldVarietyKey();
  var sow = fieldSowDate();
  if (!k || !sow || typeof window.varietyCalendar !== "function") return null;
  return window.varietyCalendar(k, sow);
}

// จริงหรือไม่ว่าผู้ใช้เคยเลือกพันธุ์ไว้แล้ว ใช้เตือนเมื่อยังไม่ได้เลือก
function fieldVarietyChosen() {
  var f = readField();
  return !!(f && f.variety);
}

// ── ตาข่ายรองรับเมื่อ care-guide.js เป็นคนละเวอร์ชันกับ index.html ──
//
// สองไฟล์นี้ต้องอัปเดตพร้อมกันเสมอ เพราะ index.html เรียก window.careText
// ซึ่งเพิ่งมีในไฟล์ความรู้เวอร์ชันใหม่ ถ้าเบราว์เซอร์ยังใช้ไฟล์เก่าที่ค้างในแคช
// การเรียกฟังก์ชันที่ไม่มีจะโยน TypeError แล้วหน้าทั้งหน้าตายเงียบๆ
//
// วิธีป้องกันที่ถูกคือเติมฟังก์ชันสำรองให้เอง ไม่ใช่ปล่อยให้พัง
// เกษตรกรที่เปิดเว็บอยู่จะยังใช้งานต่อได้ แค่เห็นเนื้อหาชุดเริ่มต้นแทนชุดตามพันธุ์
// ซึ่งดีกว่าเจอหน้าขาวโดยไม่รู้ว่าเกิดอะไรขึ้นและทำอะไรต่อไม่ได้เลย
if (typeof window.careText !== "function") {
  window.careText = function (field, varietyKey) {
    if (field == null) return "";
    if (typeof field === "string") return field;
    var v = varietyKey || "photo";
    if (field[v] != null) return field[v];
    if (field.photo != null) return field.photo;
    // ไฟล์เก่าสุดที่ยังไม่มีการแยกพันธุ์เลย ค่าอาจเป็นอ็อบเจกต์รูปแบบอื่น
    // คืนค่าแรกที่เป็นข้อความ ดีกว่าคืนค่าว่างจนการ์ดโล่ง
    for (var k in field) if (typeof field[k] === "string") return field[k];
    return "";
  };
}

if (typeof window.careVariety !== "function") {
  window.careVariety = function () {
    return {
      key: "photo",
      thai: "ข้าวไวต่อช่วงแสง",
      short: "นาปี",
      examples: "ขาวดอกมะลิ 105, กข6",
      note: "ข้อมูลพันธุ์ยังโหลดไม่ครบ กรุณารีเฟรชหน้าเว็บอีกครั้ง"
    };
  };
}

// ── พื้นที่ตามโฉนด และการเทียบความถูกต้อง ──
//
// ทำไมวิธีนี้ได้ผลมากที่สุดต่อแรงที่ลง:
//
// GPS บอกไม่ได้เลยว่าจุดที่ปักเป็นแปลงของผู้ใช้จริงหรือไม่ มันบอกได้แค่ว่า
// เครื่องอยู่ตรงไหน ณ ตอนนั้น จะปักผิดแปลง ปักที่บ้าน หรือปักตอนนั่งรถผ่าน
// ระบบก็รับไว้เหมือนกันหมด ไม่มีทางแยกออก
//
// แต่ชาวนาทุกคนรู้ว่าที่ตัวเองกี่ไร่ เพราะเป็นตัวเลขในโฉนด ในใบขึ้นทะเบียนเกษตรกร
// และเป็นตัวเลขที่เขาใช้คิดค่าปุ๋ยค่าเมล็ดพันธุ์มาทั้งชีวิต
// พอเอาพื้นที่ที่คำนวณจากหมุดมาเทียบกับตัวเลขนั้น เราได้ชุดข้อมูลตรวจสอบที่
// เป็นอิสระจาก GPS โดยสิ้นเชิง และจับความผิดพลาดแบบ "ปักผิดแปลงไปเลย"
// ได้เกือบทั้งหมด เพราะแปลงข้างเคียงแทบไม่มีทางมีขนาดเท่ากันพอดี
//
// เกณฑ์ 15% มาจากความคลาดเคลื่อนที่ยอมรับได้จริง คือขอบแปลงที่วาดพลาดไปเล็กน้อย
// กับพื้นที่คันนาที่โฉนดนับรวมแต่ปลูกข้าวไม่ได้ ถ้าเกินกว่านั้นแปลว่าผิดคนละเรื่อง
function raiToSqm(rai, ngan, wa) {
  return ((rai || 0) * 1600) + ((ngan || 0) * 400) + ((wa || 0) * 4);
}

function readDeed() {
  var f = readField();
  if (!f || !f.deed) return null;
  var d = f.deed;
  var sqm = raiToSqm(d.rai, d.ngan, d.wa);
  return sqm > 0 ? { rai: d.rai || 0, ngan: d.ngan || 0, wa: d.wa || 0, sqm: sqm } : null;
}

function setDeed(rai, ngan, wa) {
  var f = readField() || {};
  if (raiToSqm(rai, ngan, wa) > 0) f.deed = { rai: rai, ngan: ngan, wa: wa };
  else delete f.deed;
  writeField(f);
}

// เทียบพื้นที่ที่วัดได้กับพื้นที่ตามเอกสาร
// คืน null ถ้าเทียบไม่ได้ ไม่เดาแทนผู้ใช้
function deedCheck(measuredSqm) {
  var d = readDeed();
  if (!d || !measuredSqm) return null;
  var diff = measuredSqm - d.sqm;
  var pct = (diff / d.sqm) * 100;
  var a = Math.abs(pct);
  var out = { pct: pct, diff: diff, deedSqm: d.sqm, deedText: d.rai + " ไร่ " + d.ngan + " งาน " + d.wa + " ตารางวา" };

  if (a <= 5) {
    out.level = "ok";
    out.text = "ตรงกับพื้นที่ตามเอกสารดีมาก ต่างกันเพียง " + a.toFixed(1) + " เปอร์เซ็นต์";
  } else if (a <= 15) {
    out.level = "ok";
    out.text = "ใกล้เคียงพื้นที่ตามเอกสาร ต่างกัน " + a.toFixed(1) +
               " เปอร์เซ็นต์ ซึ่งอยู่ในช่วงปกติของการวัดด้วย GPS และการนับคันนา";
  } else if (a <= 35) {
    out.level = "warn";
    out.text = "ต่างจากพื้นที่ตามเอกสาร " + a.toFixed(0) + " เปอร์เซ็นต์ (วัดได้" +
               (diff > 0 ? "มากกว่า" : "น้อยกว่า") + "เอกสาร) " +
               (diff > 0 ? "อาจวาดขอบเลยออกไปนอกแปลง หรือรวมแปลงข้างเคียงเข้ามา"
                         : "อาจปักมุมไม่ครบ หรือวาดขอบเข้ามาในแปลงมากไป") +
               " ลองตรวจขอบเขตอีกครั้ง";
  } else {
    out.level = "bad";
    out.text = "ต่างจากพื้นที่ตามเอกสารถึง " + a.toFixed(0) +
               " เปอร์เซ็นต์ ซึ่งมากเกินกว่าจะเป็นความคลาดเคลื่อนของ GPS " +
               "มีโอกาสสูงว่าปักหมุดผิดแปลง หรือกรอกพื้นที่ตามเอกสารผิดหน่วย กรุณาตรวจทั้งสองอย่าง";
  }
  return out;
}

// ── ระดับความน่าเชื่อถือของพิกัดแปลง ──
//
// บอกตามตรงว่าพิกัดนี้ได้มาอย่างไร แทนที่จะแสดงตัวเลขเหมือนกันหมดราวกับแม่นเท่ากัน
// หลักการเดียวกับที่เราให้ Health Score คืนขีดกลางแทนการเดาคะแนน
// ระบบที่ยอมรับว่าตัวเองไม่แน่ใจ น่าเชื่อถือกว่าระบบที่ทำเป็นแม่นทุกอย่าง
var FIX_METHODS = {
  tap:     { thai: "แตะบนแผนที่",        rank: 1, note: "ทำได้จากที่ไหนก็ได้ ไม่ได้ยืนยันว่าเคยไปที่แปลงจริง" },
  single:  { thai: "ปักจากตำแหน่งปัจจุบัน", rank: 2, note: "ยืนยันว่าอยู่ที่แปลงตอนปัก แต่เป็นค่าเดียวจึงแกว่งได้" },
  average: { thai: "เฉลี่ยหลายค่า",       rank: 3, note: "ยืนนิ่งเก็บหลายค่าแล้วหาค่ากลาง คลาดเคลื่อนน้อยกว่าค่าเดียวมาก" },
  walk:    { thai: "เดินรอบแปลง",        rank: 4, note: "แม่นที่สุด และเป็นวิธีที่ทำได้เฉพาะคนที่อยู่ในแปลงจริงเท่านั้น" }
};

function setFixMethod(m) {
  var f = readField() || {};
  f.fixMethod = m;
  f.fixedAt = Date.now();
  writeField(f);
}

function clampRadius(r) {
  if (!r || isNaN(r) || r < 5) return 5;
  return r > 5000 ? 5000 : r;
}

// 1 ไร่ = 1,600 ตารางเมตร แสดงเป็นไร่-งาน-วา ด้วย
// เพราะเกษตรกรใช้หน่วยนี้ในการซื้อขายและทำเอกสารสิทธิ์
function raiFromSqm(sqm) {
  var rai = sqm / 1600;
  var whole = Math.floor(rai);
  var ngan = Math.floor((rai - whole) * 4);
  var wa = Math.round((((rai - whole) * 4) - ngan) * 100);
  return { rai: rai, text: whole + " ไร่ " + ngan + " งาน " + wa + " ตารางวา" };
}

// พื้นที่รูปหลายเหลี่ยมจากพิกัดละติจูด-ลองจิจูด
//
// แปลงเป็นเมตรด้วยการฉายภาพแบบ equirectangular รอบจุดศูนย์กลางแปลงก่อน
// แล้วใช้สูตร shoelace ตามปกติ
// วิธีนี้แม่นพอสำหรับแปลงนาที่กว้างไม่กี่ร้อยเมตร ความคลาดเคลื่อนต่ำกว่า 0.1%
// ถ้าเป็นพื้นที่ระดับหลายกิโลเมตรต้องใช้สูตรทรงกลมซึ่งซับซ้อนกว่าโดยไม่จำเป็นที่นี่
function polygonArea(points) {
  if (!points || points.length < 3) return 0;
  var R = 6371000;
  var lat0 = points.reduce(function (a, p) { return a + p[0]; }, 0) / points.length;
  var cosLat = Math.cos(lat0 * Math.PI / 180);
  var xy = points.map(function (p) {
    return [
      R * (p[1] * Math.PI / 180) * cosLat,
      R * (p[0] * Math.PI / 180)
    ];
  });
  var sum = 0;
  for (var i = 0; i < xy.length; i++) {
    var j = (i + 1) % xy.length;
    sum += xy[i][0] * xy[j][1] - xy[j][0] * xy[i][1];
  }
  return Math.abs(sum) / 2;
}

function centroid(points) {
  var lat = points.reduce(function (a, p) { return a + p[0]; }, 0) / points.length;
  var lon = points.reduce(function (a, p) { return a + p[1]; }, 0) / points.length;
  return [lat, lon];
}

// ─── ตัวช่วยสร้าง UI ────────────────────────────
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bund(label) {
  var b = el("div", "bund");
  b.appendChild(el("div", "bund-label", label));
  b.appendChild(el("div", "bund-line"));
  return b;
}

function plot(title, note) {
  var p = el("div", "plot");
  if (title) {
    var h = el("div", "plot-head");
    h.appendChild(el("div", "plot-title", title));
    if (note) h.appendChild(el("div", "plot-note", note));
    p.appendChild(h);
  }
  return p;
}

// รายการพับได้ ใช้ทุกหน้าที่มีขั้นตอนยาว
//
// เปิดอันแรกไว้เสมอ เพื่อให้ผู้ใช้เห็นทันทีว่าข้างในหน้าตาเป็นอย่างไร
// ถ้าพับหมดทุกอันผู้ใช้จะไม่รู้ว่าควรกดหรือไม่ และอาจคิดว่าหน้ายังโหลดไม่เสร็จ
// แตกข้อความที่คั่นด้วยบรรทัดว่างออกเป็นย่อหน้าจริง
// ฐานความรู้บางหัวข้อยาวหลายย่อหน้าแล้ว การยัดลง <p> เดียวทำให้อ่านไม่ไหว
function paras(host, text) {
  String(text == null ? "" : text).split(/\n\s*\n/).forEach(function (chunk) {
    var t = chunk.trim();
    if (t) host.appendChild(el("p", "", t));
  });
  return host;
}

function fold(num, title, sub, fill, open) {
  var box = el("div", "fold" + (open ? " on" : ""));

  var head = el("button", "fold-head");
  head.setAttribute("aria-expanded", open ? "true" : "false");
  if (num != null) head.appendChild(el("div", "fold-num", String(num)));
  var txt = el("div", "fold-text");
  txt.appendChild(el("div", "fold-title", title));
  if (sub) txt.appendChild(el("div", "fold-sub", sub));
  head.appendChild(txt);
  head.appendChild(el("div", "fold-arrow"));
  box.appendChild(head);

  var body = el("div", "fold-body");
  body.hidden = !open;
  fill(body);
  box.appendChild(body);

  head.onclick = function () {
    var nowOpen = body.hidden;
    body.hidden = !nowOpen;
    box.classList.toggle("on", nowOpen);
    head.setAttribute("aria-expanded", nowOpen ? "true" : "false");
  };
  return box;
}

// ข้อความประกอบที่ยาวแต่ไม่ใช่ใจความหลัก ยุบไว้ก่อน
// เช่น ที่มาของข้อมูล ข้อจำกัด คำอธิบายเชิงเทคนิค
// ข้อมูลพวกนี้จำเป็นต้องมีเพื่อความโปร่งใส แต่ไม่ควรแย่งที่กับสิ่งที่ต้องลงมือทำ
function more(label, text) {
  var wrap = el("div", "more");
  var btn = el("button", "more-btn", label);
  var body = el("div", "more-body", text);
  body.hidden = true;
  btn.onclick = function () {
    body.hidden = !body.hidden;
    btn.textContent = body.hidden ? label : "ย่อกลับ";
  };
  wrap.appendChild(btn);
  wrap.appendChild(body);
  return wrap;
}

// สถานะว่าง/กำลังโหลด/ผิดพลาด ต้องบอกเสมอว่าเกิดอะไรและทำอะไรต่อ
function stateBlock(mark, lead, note) {
  var s = el("div", "state");
  s.appendChild(el("div", "state-mark", mark));
  s.appendChild(el("div", "state-lead", lead));
  if (note) s.appendChild(el("div", "state-note", note));
  return s;
}

function todayStamp() {
  var d = new Date();
  return String(d.getDate()).padStart(2,"0") + "/" +
         String(d.getMonth()+1).padStart(2,"0") + "/" +
         String(d.getFullYear()+543).slice(-2);
}

// SIGNATURE: คะแนนสุขภาพเป็นภาพตัดขวางแปลงนา ระดับน้ำ = คะแนน สี = สถานะ
function buildGauge(score, caption) {
  var wrap = el("div", "gauge-wrap");
  var s = statusOf(score);
  var g = el("div", "gauge " + (s === "none" ? "" : s));
  var water = el("div", "gauge-water");
  var read = el("div", "gauge-read");
  var hasScore = typeof score === "number";
  var fig = el("div", "gauge-figure" + (hasScore ? "" : " dim"), hasScore ? String(score) : "—");
  var unit = el("div", "gauge-unit" + (hasScore ? "" : " dim"), "คะแนนสุขภาพ");
  read.appendChild(fig); read.appendChild(unit);
  g.appendChild(water); g.appendChild(read);
  wrap.appendChild(g);

  var side = el("div", "gauge-side");
  side.appendChild(el("div", "verdict-label", "สถานะแปลงล่าสุด"));
  var name = el("div", "verdict-name " + (s === "none" ? "" : s), statusWord(s));
  side.appendChild(name);
  if (caption) side.appendChild(el("div", "read-foot", caption));
  wrap.appendChild(side);

  // ให้ระดับน้ำไหลขึ้นหลัง paint แรก เพื่อให้เห็น transition
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { water.style.height = (hasScore ? score : 0) + "%"; });
  });
  return wrap;
}

function readOut(label, value, foot, small) {
  var b = el("div");
  b.appendChild(el("div", "read-label", label));
  b.appendChild(el("div", "read-value num" + (small ? " sm" : ""), value));
  if (foot) b.appendChild(el("div", "read-foot", foot));
  return b;
}

// แสดงผลเป็น "ชื่อโรค" ไม่ใช่ตัวเลขเปอร์เซ็นต์
//
// เหตุผลที่เอาเปอร์เซ็นต์ออก: ค่าความมั่นใจของโมเดลจำแนกภาพไม่ใช่ความน่าจะเป็นจริง
// โมเดลถูกบังคับให้เลือกคำตอบเสมอและให้คะแนนรวมกันได้ 100% ทุกครั้ง
// การโชว์ "88%" จึงทำให้เกษตรกรเข้าใจผิดว่าแม่นยำ 88% ทั้งที่โมเดลให้ค่าสูงพอกัน
// กับภาพที่ไม่ใช่ใบข้าวด้วยซ้ำ ตัวเลขนี้เลยหลอกมากกว่าช่วย
//
// สิ่งที่แทนที่: บอกชื่อโรคตรงๆ และถ้าความมั่นใจต่ำกว่าเกณฑ์ให้บอกว่า
// "ระบุไม่ชัดเจน" แทนที่จะเอ่ยชื่อโรค — ความไม่แน่นอนยังสื่อถึงผู้ใช้อยู่
// เพียงแต่สื่อเป็นคำพูดที่ตีความถูก แทนตัวเลขที่ตีความผิด
function renderVerdict(host, results, opts) {
  opts = opts || {};
  host.innerHTML = "";

  var sorted = results.slice().sort(function (a, b) { return b.value - a.value; });
  var top = sorted[0];
  if (!top) return;

  var unsure = opts.threshold != null && top.value < opts.threshold;

  var card = el("div", "verdict" + (unsure ? " verdict-unsure" : ""));
  card.appendChild(el("div", "verdict-kicker", opts.kicker || "ผลการจำแนก"));
  card.appendChild(el("div", "verdict-main", unsure ? "ระบุไม่ชัดเจน" : th(top.label)));

  // ชื่อคลาสภาษาอังกฤษไว้ให้ตรวจสอบย้อนกลับได้ว่าโมเดลตอบอะไรจริงๆ
  if (!unsure && th(top.label) !== top.label) {
    card.appendChild(el("div", "verdict-sub", top.label));
  }

  host.appendChild(card);

  if (unsure) {
    host.appendChild(el("div", "verdict-alt",
      "ภาพยังไม่ชัดพอ ลองถ่ายใหม่ให้ใบเต็มจอ แสงสม่ำเสมอ อย่าถ่ายย้อนแสง"));
  } else if (sorted.length > 1 && sorted[1].value > 0.05) {
    // บอกตัวเลือกรองเป็น "ชื่อ" อย่างเดียว ไม่มีตัวเลข
    // มีประโยชน์เวลาผู้ใช้เห็นอาการแล้วรู้สึกว่าน่าจะเป็นอีกโรค จะได้รู้ว่าโมเดลก็ลังเลระหว่างสองตัวนี้
    var alts = sorted.slice(1, 3)
      .filter(function (r) { return r.value > 0.05; })
      .map(function (r) { return th(r.label); });
    if (alts.length) {
      host.appendChild(el("div", "verdict-alt", "โรคที่มีลักษณะใกล้เคียง: " + alts.join(", ")));
    }
  }

  host.appendChild(el("div", "verdict-src", opts.gated
    ? "ตัดสินจากด่านตรวจสี/พื้นผิว ไม่ได้ส่งภาพเข้าโมเดล AI"
    : "ผลจากโมเดลที่เทรนไว้"));
}

function renderMix(host, pre) {
  host.innerHTML = "";
  host.appendChild(el("div", "read-label", "สัดส่วนโทนสีในภาพ"));
  var bar = el("div", "mix");
  [["var(--blade)", pre.green], ["var(--grain)", pre.yellow], ["var(--ink-faint)", pre.other]].forEach(function (x) {
    var seg = el("div");
    seg.style.background = x[0];
    seg.style.width = x[1] + "%";
    bar.appendChild(seg);
  });
  host.appendChild(bar);
  var key = el("div", "mix-key");
  [["var(--blade)", "เขียว", pre.green], ["var(--grain)", "เหลือง/น้ำตาล", pre.yellow], ["var(--ink-faint)", "สีอื่น", pre.other]]
    .forEach(function (x) {
      var s = el("span");
      var sw = el("i", "swatch");
      sw.style.background = x[0];
      s.appendChild(sw);
      s.appendChild(document.createTextNode(x[1] + " "));
      s.appendChild(el("b", "", x[2] + "%"));
      key.appendChild(s);
    });
  host.appendChild(key);
}

// ตัวรับภาพ ใช้ร่วมกันทุกหน้าที่ต้องอัปโหลดรูป
//
// ── เพิ่มการถ่ายภาพในเว็บ (2026-08) ──
//
// เดิมมีแค่การเลือกไฟล์ ซึ่งบนมือถือต้องผ่านหน้าเลือกแอปแล้วค่อยเปิดกล้อง
// และที่สำคัญกว่านั้นคือผู้ใช้ไม่รู้ว่าต้องจัดองค์ประกอบภาพอย่างไร
// จึงมักถ่ายทั้งกอมา ทำให้ใบเล็กจนโมเดลมองไม่เห็นแผลแล้วตอบว่าระบุไม่ชัดเจน
//
// กล้องในเว็บแก้ตรงจุดนั้น เพราะมีกรอบเล็งบอกตั้งแต่ตอนเล็งว่าต้องให้ใบเต็มกรอบ
// และระบบครอปเฉพาะในกรอบก่อนส่งเข้าโมเดล พื้นหลังที่ไม่เกี่ยวจึงถูกตัดทิ้งไปเลย
//
// ยังเก็บปุ่มเลือกจากคลังภาพไว้ เพราะผู้ใช้ที่ถ่ายรูปเก็บไว้แล้วต้องใช้งานได้
// และบนคอมพิวเตอร์ที่ไม่มีกล้อง ปุ่มถ่ายจะซ่อนตัวเองอัตโนมัติ
function makeIntake(opts) {
  opts = opts || {};

  // ── สไตล์ของกล้อง ──
  // ฝังไว้ในฟังก์ชันและใส่ครั้งเดียว เพื่อให้ไฟล์นี้เป็นหน่วยเดียวจบ
  // ย้ายหรือแก้ทีหลังไม่ต้องตามไปแก้ CSS อีกที่
  if (!document.getElementById("camStyles")) {
    var st = document.createElement("style");
    st.id = "camStyles";
    st.textContent =
      ".intake-acts{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}" +
      ".intake-acts .act{flex:1;min-width:140px}" +
      ".cam{position:fixed;inset:0;z-index:95;background:#0B1A12;display:flex;" +
        "flex-direction:column;align-items:center;justify-content:center}" +
      ".cam-stage{width:100%;flex:1;min-height:0;" +
        "display:flex;align-items:center;justify-content:center;overflow:hidden}" +
      /* กรอบนี้หุ้มวิดีโอพอดีตัว กรอบเล็งจึงทับพื้นที่ภาพจริงเท่านั้น
         ไม่ใช่ทับพื้นที่ว่างสีดำข้างวิดีโอตอนอัตราส่วนจอไม่ตรงกับกล้อง */
      ".cam-frame{position:relative;display:inline-flex;max-width:100%;max-height:100%}" +
      ".cam-frame video{max-width:100%;max-height:100%;display:block}" +
      /* กรอบเล็งวางทับวิดีโอ ต้อง pointer-events:none ไม่งั้นบังปุ่มที่อยู่ข้างใต้ */
      ".cam-guide{position:absolute;inset:0;pointer-events:none;" +
        "display:flex;align-items:center;justify-content:center}" +
      /* ขนาดกำหนดจาก JS ตามขนาดวิดีโอที่แสดงจริง เพื่อให้ตรงกับพื้นที่ที่ครอป */
      ".cam-box{position:relative;box-shadow:0 0 0 3000px rgba(11,26,18,.55)}" +
      ".cam-corner{position:absolute;width:26px;height:26px;border:3px solid #6FBF73}" +
      ".cam-corner.tl{top:0;left:0;border-right:none;border-bottom:none}" +
      ".cam-corner.tr{top:0;right:0;border-left:none;border-bottom:none}" +
      ".cam-corner.bl{bottom:0;left:0;border-right:none;border-top:none}" +
      ".cam-corner.br{bottom:0;right:0;border-left:none;border-top:none}" +
      ".cam-hint{position:absolute;left:0;right:0;bottom:-46px;text-align:center;" +
        "color:#F2EBDD;font-size:.85rem;line-height:1.5;padding:0 18px}" +
      ".cam-bar{display:flex;align-items:center;justify-content:space-between;" +
        "gap:18px;width:100%;padding:18px 22px 26px;flex:none}" +
      ".cam-ghost{background:none;border:1px solid rgba(255,255,255,.35);" +
        "color:#F2EBDD;border-radius:10px;padding:9px 16px;font-size:.85rem}" +
      ".cam-shutter{width:72px;height:72px;border-radius:50%;flex:none;" +
        "background:#FFFFFF;border:4px solid rgba(255,255,255,.35)}" +
      ".cam-shutter:disabled{opacity:.4}" +
      ".cam-msg{color:#F2EBDD;text-align:center;padding:28px 24px;max-width:340px;line-height:1.7}";
    document.head.appendChild(st);
  }

  var wrap = el("div");

  var zone = el("div", "intake");
  zone.tabIndex = 0;
  zone.setAttribute("role", "button");
  zone.appendChild(el("div", "intake-lead", opts.lead || "เลือกภาพใบข้าว หรือลากมาวางตรงนี้"));
  zone.appendChild(el("div", "intake-hint", opts.hint || "ถ่ายใกล้ให้เห็นแผลบนใบชัดเจน จะได้ผลแม่นที่สุด"));

  var file = el("input", "hidden-file");
  file.type = "file";
  file.accept = "image/*";

  var acts = el("div", "intake-acts");
  var camBtn = el("button", "act act-go", "ถ่ายรูปด้วยกล้อง");
  var pickBtn = el("button", "act act-line", "เลือกจากคลังภาพ");
  acts.appendChild(camBtn);
  acts.appendChild(pickBtn);

  // ไม่มี getUserMedia แปลว่าเบราว์เซอร์เก่าหรือเปิดผ่าน http ที่ไม่ใช่ localhost
  // ซ่อนปุ่มดีกว่าปล่อยให้กดแล้ว error เพราะผู้ใช้จะคิดว่าระบบพัง
  var canCam = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  if (!canCam) camBtn.hidden = true;

  var shot = el("div", "shot");
  shot.hidden = true;
  var img = el("img");
  img.alt = "ภาพใบข้าวที่เลือก";
  var sweep = el("div", "sweep");
  sweep.hidden = true;
  sweep.appendChild(el("div", "sweep-line"));
  shot.appendChild(img);
  shot.appendChild(sweep);

  wrap.appendChild(zone);
  wrap.appendChild(acts);
  wrap.appendChild(file);
  wrap.appendChild(shot);

  var current = null;

  // รับภาพเข้าระบบ ใช้ร่วมกันทั้งจากไฟล์และจากกล้อง
  function useSource(src) {
    var im = new Image();
    im.onload = function () {
      current = im;
      img.src = src;
      shot.hidden = false;
      opts.onReady && opts.onReady(im);
    };
    im.onerror = function () {
      opts.onFail && opts.onFail("เปิดภาพนี้ไม่ได้ ลองใหม่อีกครั้ง");
    };
    im.src = src;
  }

  function take(f) {
    if (!f || f.type.indexOf("image/") !== 0) return;
    useSource(URL.createObjectURL(f));
  }

  // ══ กล้องในเว็บ ══
  function openCamera() {
    var facing = "environment";   // กล้องหลังก่อนเสมอ เพราะถ่ายใบข้าวไม่ใช่เซลฟี่
    var stream = null;

    var cam = el("div", "cam");

    var stage = el("div", "cam-stage");
    var frame = el("div", "cam-frame");
    var video = document.createElement("video");
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;              // จำเป็นบน iOS ไม่งั้นวิดีโอจะเด้งเต็มจอเอง
    video.setAttribute("playsinline", "");
    frame.appendChild(video);

    var guide = el("div", "cam-guide");
    var box = el("div", "cam-box");
    ["tl", "tr", "bl", "br"].forEach(function (c) {
      box.appendChild(el("div", "cam-corner " + c));
    });
    box.appendChild(el("div", "cam-hint",
      "จัดใบข้าวให้เต็มกรอบ ให้เห็นแผลชัด · ระบบจะตัดเฉพาะในกรอบไปตรวจ"));
    guide.appendChild(box);
    frame.appendChild(guide);
    stage.appendChild(frame);
    guide.hidden = true;                   // ซ่อนไว้จนกว่าภาพจะมาจริง

    // ── ขนาดกรอบเล็งต้องตรงกับพื้นที่ที่ครอปเป๊ะ ──
    //
    // ถ้ากำหนดกรอบเป็น 78vw แต่ครอป 78% ของภาพจากกล้อง สองค่านี้จะไม่ตรงกัน
    // ทุกครั้งที่อัตราส่วนจอไม่เท่าอัตราส่วนกล้อง ผู้ใช้จะจัดใบให้พอดีกรอบ
    // แล้วได้ภาพที่ตัดขอบใบทิ้ง ซึ่งแย่กว่าไม่มีกรอบเสียอีกเพราะเขาเชื่อกรอบ
    //
    // จึงวัดขนาดวิดีโอที่แสดงจริงแล้วคำนวณกรอบจากค่านั้น ด้วยสัดส่วนเดียวกับตอนครอป
    var CROP_RATIO = 0.78;
    function sizeGuide() {
      var r = video.getBoundingClientRect();
      if (!r.width || !r.height) return;
      var s = Math.round(Math.min(r.width, r.height) * CROP_RATIO);
      box.style.width = s + "px";
      box.style.height = s + "px";
    }
    window.addEventListener("resize", sizeGuide);
    window.addEventListener("orientationchange", sizeGuide);

    cam.appendChild(stage);

    var bar = el("div", "cam-bar");
    var closeBtn = el("button", "cam-ghost", "ปิด");
    var shutter = el("button", "cam-shutter");
    shutter.setAttribute("aria-label", "ถ่ายภาพ");
    shutter.disabled = true;
    var flipBtn = el("button", "cam-ghost", "สลับกล้อง");
    bar.appendChild(closeBtn);
    bar.appendChild(shutter);
    bar.appendChild(flipBtn);
    cam.appendChild(bar);

    function stopStream() {
      if (!stream) return;
      // ต้องหยุดทุก track ไม่งั้นไฟกล้องยังติดและกินแบตต่อแม้ปิดหน้าต่างไปแล้ว
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }

    function close() {
      stopStream();
      cam.remove();
      document.removeEventListener("keydown", onKey);
      window.removeEventListener("resize", sizeGuide);
      window.removeEventListener("orientationchange", sizeGuide);
    }
    function onKey(e) { if (e.key === "Escape") close(); }

    function fail(text) {
      frame.hidden = true;
      stage.appendChild(el("div", "cam-msg", text));
      shutter.disabled = true;
      flipBtn.hidden = true;
    }

    async function start() {
      stopStream();
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facing },
            // ขอความละเอียดสูงไว้ก่อน เพราะเราจะครอปเหลือแค่ในกรอบ
            // ถ้าต้นทางเล็ก ภาพที่ครอปแล้วจะเล็กจนโมเดลมองไม่เห็นรายละเอียดแผล
            width: { ideal: 1920 },
            height: { ideal: 1920 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        guide.hidden = false;
        sizeGuide();
        shutter.disabled = false;
      } catch (err) {
        // แยกสาเหตุให้ชัด เพราะทางแก้ต่างกันคนละเรื่อง
        var name = err && err.name;
        if (name === "NotAllowedError" || name === "SecurityError") {
          fail("ยังไม่ได้อนุญาตให้เว็บใช้กล้อง\n\n" +
               "กดไอคอนรูปกุญแจข้างที่อยู่เว็บ แล้วเปิดสิทธิ์กล้อง " +
               "จากนั้นกดถ่ายรูปใหม่อีกครั้ง");
        } else if (name === "NotFoundError" || name === "OverconstrainedError") {
          fail("ไม่พบกล้องบนอุปกรณ์นี้\n\nใช้ปุ่มเลือกจากคลังภาพแทนได้");
        } else if (name === "NotReadableError") {
          fail("กล้องถูกแอปอื่นใช้อยู่\n\nปิดแอปกล้องหรือแอปวิดีโอคอลก่อน แล้วลองใหม่");
        } else {
          fail("เปิดกล้องไม่สำเร็จ\n\n" + (err && err.message ? err.message : "ลองใหม่อีกครั้ง"));
        }
      }
    }

    // ── ครอปเฉพาะพื้นที่ในกรอบเล็ง ──
    //
    // นี่คือหัวใจของการเพิ่มกล้อง ไม่ใช่แค่ความสะดวก
    //
    // โมเดลถูกเทรนจากภาพใบเดี่ยวเต็มเฟรม พอผู้ใช้ถ่ายทั้งกอแล้วระบบย่อทั้งภาพ
    // เหลือ 224 พิกเซล รอยโรคจะเล็กจนแทบหายไป โมเดลจึงตอบว่าระบุไม่ชัดเจน
    //
    // การครอปตามกรอบทำให้สิ่งที่ส่งเข้าโมเดลใกล้เคียงกับภาพที่มันเคยเห็นตอนเทรน
    // และผู้ใช้เห็นกรอบตั้งแต่ตอนเล็ง จึงจัดองค์ประกอบได้ถูกตั้งแต่แรก
    // ไม่ต้องมาเดาทีหลังว่าทำไมระบบตอบไม่ชัดเจน
    function capture() {
      var vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return;

      // ใช้ CROP_RATIO ตัวเดียวกับที่คำนวณขนาดกรอบบนหน้าจอ
      // ถ้าแยกเป็นสองค่า วันหนึ่งจะแก้ที่เดียวแล้วลืมอีกที่ ทำให้กรอบกับภาพไม่ตรงกัน
      var side = Math.round(Math.min(vw, vh) * CROP_RATIO);
      var sx = Math.round((vw - side) / 2);
      var sy = Math.round((vh - side) / 2);

      // จำกัดที่ 1400 พอเหลือเฟือสำหรับโมเดล 224-320 และเก็บลงทะเบียน
      // ใหญ่กว่านี้เปลืองหน่วยความจำและเวลาอัปโหลดโดยไม่ได้ความแม่นเพิ่ม
      var out = Math.min(side, 1400);

      var c = document.createElement("canvas");
      c.width = out;
      c.height = out;
      c.getContext("2d").drawImage(video, sx, sy, side, side, 0, 0, out, out);

      var data = c.toDataURL("image/jpeg", 0.92);
      close();
      useSource(data);
    }

    shutter.onclick = capture;
    closeBtn.onclick = close;
    flipBtn.onclick = function () {
      facing = (facing === "environment") ? "user" : "environment";
      guide.hidden = true;
      shutter.disabled = true;
      start();
    };

    document.addEventListener("keydown", onKey);
    document.body.appendChild(cam);
    start();
  }

  camBtn.onclick = function (e) { e.preventDefault(); openCamera(); };
  pickBtn.onclick = function (e) { e.preventDefault(); file.click(); };

  zone.onclick = function () { file.click(); };
  zone.onkeydown = function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); }
  };
  zone.ondragover = function (e) { e.preventDefault(); zone.classList.add("over"); };
  zone.ondragleave = function () { zone.classList.remove("over"); };
  zone.ondrop = function (e) {
    e.preventDefault();
    zone.classList.remove("over");
    take(e.dataTransfer.files[0]);
  };
  file.onchange = function (e) { take(e.target.files[0]); };

  return {
    node: wrap,
    image: function () { return current; },
    sweeping: function (on) { sweep.hidden = !on; },
    clear: function () { current = null; shot.hidden = true; file.value = ""; }
  };
}

// แผงให้ผู้ใช้ยืนยันว่าโมเดลทายถูกหรือไม่
// ถ้าผิด ให้เลือกโรคที่ถูกต้องจากคลาสที่โมเดลรู้จัก เพื่อให้ข้อมูลนำไปเทรนต่อได้ทันที
function buildVerifyPanel(saved, res) {
  var box = el("div", "verify");
  box.appendChild(el("div", "verify-ask", "ผลนี้ตรงกับที่คุณเห็นในแปลงจริงหรือไม่"));
  box.appendChild(el("div", "verify-note",
    "คำตอบของคุณช่วยให้เรารู้ว่าระบบแม่นแค่ไหนในการใช้งานจริง"));

  var actions = el("div", "verify-acts");
  var yes = el("button", "act act-go act-sm", "ตรงกัน");
  var no = el("button", "act act-line act-sm", "ไม่ตรง แจ้งโรคที่ถูกต้อง");
  actions.appendChild(yes);
  actions.appendChild(no);
  box.appendChild(actions);

  var picker = el("div", "verify-pick");
  picker.hidden = true;
  var labels = (res.disease && res.disease.results.map(function (r) { return r.label; })) ||
               (models.disease.props && models.disease.props.labels) || [];
  var select = el("select");
  select.style.cssText = "padding:8px 11px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF;flex:1;min-width:150px";
  labels.forEach(function (l) {
    var o = el("option", "", th(l));
    o.value = l;
    select.appendChild(o);
  });
  var confirm = el("button", "act act-go act-sm", "ส่งคำตอบ");
  picker.appendChild(select);
  picker.appendChild(confirm);
  box.appendChild(picker);

  function settle(msg) {
    box.innerHTML = "";
    box.className = "verify done";
    box.appendChild(el("div", "verify-ask", msg));
  }

  function send(correct, actual) {
    [yes, no, confirm].forEach(function (b) { b.disabled = true; });
    Store.verify(saved.id, correct, actual)
      .then(function () {
        settle(correct
          ? "ขอบคุณครับ บันทึกว่าผลตรวจถูกต้องแล้ว"
          : "ขอบคุณครับ บันทึกว่าที่ถูกต้องคือ " + th(actual) + " แล้ว");
      })
      .catch(function (err) {
        box.appendChild(el("div", "flash flash-bad", err.message));
        [yes, no, confirm].forEach(function (b) { b.disabled = false; });
      });
  }

  yes.onclick = function () { send(true, null); };
  no.onclick = function () { picker.hidden = false; no.disabled = true; };
  confirm.onclick = function () { send(false, select.value); };

  return box;
}

  var phCard = plot(null);
  var cv = el("canvas");
  cv.height = 210;

  } else {
    phCard.appendChild(cv);
  }
  root.appendChild(phCard);

  if (phValues.length >= 2) {
    var series = logs.filter(function (l) { return typeof l.ph === "number"; }).slice(0, 8).reverse();
    // สีเส้นและกริดปรับตามธีมมืด ส่วนตรรกะกราฟเหมือนเดิมทุกอย่าง
    new Chart(cv, {
      type: "line",
      data: {
        labels: series.map(function (l) { return l.date; }),
        datasets: [{
          label: "pH ดิน", data: series.map(function (l) { return l.ph; }),
          borderColor: "#2E8B57", backgroundColor: "rgba(46,139,87,.10)",
          fill: true, tension: .32, pointRadius: 3, pointBackgroundColor: "#2E8B57", borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: false,
               grid: { color: "#E6F1E7" },
               ticks: { color: "#7C9385", font: { family: "IBM Plex Mono" } } },
          x: { grid: { display: false },
               ticks: { color: "#7C9385", font: { family: "IBM Plex Mono", size: 10 } } }
        }
      }
    });
  }

  // อากาศจาก open-meteo (ฟรี ไม่ต้องใช้ key) — ถ้าผู้ใช้ไม่ให้สิทธิ์ตำแหน่ง ต้องบอกให้ชัด
  // ใช้พิกัดแปลงที่ปักหมุดไว้ก่อนเสมอ ค่อยขอตำแหน่งปัจจุบันเมื่อไม่มี
  // เพราะการ์ดนี้บอกอากาศ "ที่แปลง" ไม่ใช่ "ที่ผู้ใช้ยืนอยู่"
  // ซึ่งต่างกันมากสำหรับคนที่กลับมาดูจากบ้านหรือจากในเมือง
  (async function () {
    var c = fieldCoords();
    if (!c) {
      try {
        var fix = await getFix({ timeout: 10000 });
        c = { lat: fix.lat, lon: fix.lon };
      } catch (err) {
        setWxFail(err.message);
        return;
      }
    }
    try {
      var r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=" + c.lat +
                          "&longitude=" + c.lon + "&current=temperature_2m,relative_humidity_2m");
      var d = await r.json();
      var v = document.getElementById("wxRead"), f = document.getElementById("wxFoot");
      if (v && d.current) {
        v.textContent = d.current.temperature_2m + "°C";
        if (f) f.textContent = "ความชื้น " + d.current.relative_humidity_2m + "%";
      }
    } catch (e) {
      setWxFail("อ่านค่าอากาศไม่ได้");
    }
  })();
  function setWxFail(msg) {
    var f = document.getElementById("wxFoot");
    if (f) f.textContent = msg;
  }
};

views.diagnose = function (root) {
  root.appendChild(bund("รับภาพเข้าตรวจ"));

  var wrap = el("div", "row-2");

  var left = plot("ภาพใบข้าว", "ตรวจ 2 ขั้น — ใช่ใบข้าวไหม แล้วค่อยดูว่าเป็นโรคอะไร");
  var intake = makeIntake({
    onReady: function () { runBtn.dataset.armed = "1"; markBrain(); },
    onFail: function (m) { showFlash(m, "bad"); }
  });
  left.appendChild(intake.node);

  var runBtn = el("button", "act act-go act-wide");
  runBtn.style.marginTop = "14px";
  runBtn.setAttribute("data-needs-brain", "");
  runBtn.dataset.readyLabel = "ตรวจภาพนี้";
  runBtn.disabled = true;
  left.appendChild(runBtn);

  var flashHost = el("div");
  left.appendChild(flashHost);
  wrap.appendChild(left);

  var right = plot("ผลวินิจฉัย");
  var resultHost = el("div");
  resultHost.appendChild(stateBlock("◇", "ยังไม่มีผล", "เลือกภาพแล้วกดตรวจ ผลจะแสดงที่นี่"));
  right.appendChild(resultHost);
  wrap.appendChild(right);

  root.appendChild(wrap);

  function showFlash(msg, kind) {
    flashHost.innerHTML = "";
    flashHost.appendChild(el("div", "flash flash-" + kind, msg));
  }

  runBtn.onclick = async function () {
    flashHost.innerHTML = "";
    runBtn.disabled = true;
    runBtn.textContent = "กำลังตรวจ";
    intake.sweeping(true);
    resultHost.innerHTML = "";
    resultHost.appendChild(stateBlock("◌", "กำลังตรวจภาพ", "โมเดลกำลังประมวลผลบนเครื่องของคุณ ยังไม่ส่งภาพออกไปไหน"));
    await new Promise(function (r) { setTimeout(r, 60); });

    try {
      var res = await runFullAnalysis(intake.image());
      resultHost.innerHTML = "";

      var score = healthScore(res);
      resultHost.appendChild(buildGauge(score, diagnosisName(res)));

      resultHost.appendChild(bund("ขั้นที่ 1 · เป็นใบข้าวหรือไม่"));
      var r1 = el("div");
      resultHost.appendChild(r1);
      renderVerdict(r1, res.rice.results, { kicker: "ภาพนี้คือ", gated: res.gated });

      if (res.disease) {
        resultHost.appendChild(bund("ขั้นที่ 2 · ชนิดของโรค"));
        var r2 = el("div");
        resultHost.appendChild(r2);

        // ใช้เกณฑ์ที่โมเดลกำหนดมาเอง (classification_threshold จาก Edge Impulse)
        // ต่ำกว่านี้จะไม่เอ่ยชื่อโรคเลย เพราะการเอ่ยชื่อผิดแล้วเกษตรกรไปพ่นยาตาม
        // เสียหายมากกว่าการบอกว่า "ยังระบุไม่ได้ ถ่ายใหม่"
        var thr = (models.disease.props && models.disease.props.classification_threshold) || 0.6;
        renderVerdict(r2, res.disease.results, { kicker: "โรคที่พบ", threshold: thr });

        if (res.topDisease && res.topDisease.value >= thr) {
          var rx = buildRx(res.topDisease.label);
          if (rx) resultHost.appendChild(rx);
          else resultHost.appendChild(el("div", "flash flash-bad",
            "ยังไม่มีแนวทางจัดการของโรคนี้ในฐานข้อมูล กรุณาปรึกษาเจ้าหน้าที่เกษตรในพื้นที่"));
        }
      } else {
        // ระบบแยกไม่ออกระหว่าง "ไม่ใช่ใบข้าวจริงๆ" กับ "ใช่ใบข้าวแต่ถ่ายมาไม่ดี"
        // ทั้งสองกรณีมาถึงตรงนี้เหมือนกัน จึงต้องเขียนข้อความให้ครอบคลุมทั้งคู่
        // ถ้าฟันธงว่า "ไม่ใช่ใบข้าว" อย่างเดียว เกษตรกรที่ถ่ายใบข้าวจริงมาจะงงและเลิกใช้
        // ทั้งที่แค่ถ่ายใหม่ให้ชัดขึ้นก็ผ่านแล้ว
        var miss = el("div", "flash flash-bad");
        miss.appendChild(el("div", "verify-ask",
          "นี่อาจไม่ใช่รูปใบข้าว กรุณาใช้รูปใบข้าว"));
        miss.appendChild(el("div", "verify-note",
          "ถ้าเป็นใบข้าวจริง ลองถ่ายใหม่ให้ใบเต็มจอ เห็นแผลชัด และอย่าถ่ายย้อนแสง"));
        resultHost.appendChild(miss);

        // เหตุผลทางเทคนิคยังต้องบอก แต่แยกออกมาเป็นบรรทัดรองที่ไม่แย่งความสนใจ
        // เพราะคนที่อยากรู้ว่าทำไมระบบตัดสินแบบนี้ควรตรวจสอบย้อนกลับได้
        var why = res.gated ? res.pre.why : "โมเดลจำแนกภาพตัดสินว่าภาพนี้ไม่ใช่ใบข้าว";
        resultHost.appendChild(el("div", "verdict-src", "เหตุผลของระบบ: " + why));
      }

      // คำเตือนถาวร — ขึ้นทุกครั้งที่มีผล ไม่ว่าผลจะออกมาแบบไหน
      // วางไว้หลังแนวทางแก้ไข เพื่อให้เป็นสิ่งสุดท้ายที่ผู้ใช้อ่านก่อนลงมือทำ
      resultHost.appendChild(el("div", "flash flash-warn",
        "ผลนี้อาจผิดพลาดได้ ควรให้เจ้าหน้าที่เกษตรยืนยันก่อนใช้สารเคมีทุกครั้ง"));

      resultHost.appendChild(bund("หลักฐานเชิงสี"));
      var mixHost = el("div");
      resultHost.appendChild(mixHost);
      renderMix(mixHost, res.pre);

      // ── ภาพที่ไม่ใช่ใบข้าวต้องไม่เข้าทะเบียน (แก้ไข 2026-08) ──
      //
      // ทะเบียนไม่ใช่แค่ที่เก็บประวัติ แต่เป็นแหล่งข้อมูลที่ระบบเอาไปคิดต่อทั้งหมด
      // ทั้งคะแนนเฉลี่ยของแปลง กราฟแนวโน้ม และบริบทที่ส่งให้ AI ทุกคำถาม
      // ถ้าปล่อยภาพที่ระบบเองบอกว่า "ไม่ใช่ใบข้าว" เข้าไป เท่ากับยอมให้ข้อมูล
      // ที่รู้อยู่แล้วว่าไม่มีความหมายไปปนกับข้อมูลจริงอย่างถาวร แยกออกทีหลังไม่ได้
      //
      // ทางเลือกคือบันทึกแต่ใส่ธงกำกับ ซึ่งซับซ้อนกว่าและต้องไปแก้ทุกที่ที่อ่านทะเบียน
      // การไม่บันทึกตั้งแต่ต้นตรงไปตรงมากว่า และผู้ใช้แค่ถ่ายใหม่ก็จบ
      // แต่ต้องบอกให้ชัดว่าไม่ได้บันทึก ไม่ใช่เงียบไป ไม่งั้นผู้ใช้จะคิดว่าบันทึกแล้ว
      if (!res.isRice) {
        resultHost.appendChild(el("div", "flash flash-warn",
          "ไม่ได้บันทึกผลนี้ลงทะเบียน เพราะระบบตัดสินว่าภาพนี้ไม่ใช่ใบข้าว " +
          "ถ้าเป็นใบข้าวจริง ให้ถ่ายใหม่ให้ใบเต็มจอและเห็นแผลชัด แล้วตรวจอีกครั้ง"));
        showFlash("ไม่ได้บันทึกลงทะเบียน เพราะไม่ใช่ภาพใบข้าว", "warn");
      } else {
        // เก็บภาพย่อไว้กับบันทึกด้วย ใช้ 640px พอสำหรับย้อนดูภายหลัง
        // เล็กกว่าที่ส่งให้ Gemini (800px) เพื่อประหยัดพื้นที่เก็บ
        var saved = await Store.add({
          date: todayStamp(),
          owner: Store.profile().name,
          gps: "",
          ph: null,
          disease: diagnosisName(res),
          score: score,
          image: imageToBase64(intake.image(), 640)
        });

        showFlash(Store.isOffline()
          ? "บันทึกลงเครื่องแล้ว จะซิงก์ขึ้นเซิร์ฟเวอร์เมื่อเชื่อมต่อได้"
          : "บันทึกผลลงทะเบียนแล้ว", "ok");

        // ให้ผู้ใช้ยืนยันว่า AI ทายถูกไหม ข้อมูลนี้ใช้วัดความแม่นยำจริง
        // และชี้เป้าว่าควรเพิ่มภาพคลาสไหนตอนเทรนรอบหน้า
        if (!Store.isOffline() && saved.id) {
          resultHost.appendChild(buildVerifyPanel(saved, res));
        }
      }
    } catch (err) {
      resultHost.innerHTML = "";
      resultHost.appendChild(stateBlock("!", "ตรวจภาพไม่สำเร็จ", err.message));
      showFlash("ตรวจไม่สำเร็จ: " + err.message, "bad");
    } finally {
      intake.sweeping(false);
      runBtn.disabled = false;
      runBtn.textContent = "ตรวจภาพนี้";
    }
  };

  markBrain();
};

  // บรรทัดบอกคุณภาพของพิกัดที่เพิ่งได้
  // ตัวเลข lat,lon เพียวๆ ดูน่าเชื่อถือเสมอไม่ว่าจะแม่นหรือไม่
  // ผู้ใช้จึงต้องเห็นค่าความคลาดเคลื่อนควบคู่กันเพื่อรู้ว่าควรกดใหม่ไหม
  var gpsNote = el("div", "read-foot", "");
  gpsNote.style.marginTop = "6px";

  gpsBtn.onclick = async function () {
    gpsBtn.textContent = "กำลังหาพิกัด";
    gpsBtn.disabled = true;
    gpsNote.textContent = "กำลังจับสัญญาณดาวเทียม อาจใช้เวลาสักครู่ ถ้าอยู่ในอาคารให้ออกมาที่โล่ง";
    try {
      var fix = await getFix();
      document.getElementById("svGps").value = fix.lat.toFixed(5) + "," + fix.lon.toFixed(5);
      var n = accuracyNote(fix.accuracy);
      gpsNote.textContent = n.text;
      gpsNote.style.color = n.ok ? "" : "var(--rust)";
    } catch (err) {
      gpsNote.textContent = err.message;
      gpsNote.style.color = "var(--rust)";
    }
    gpsBtn.textContent = "ดึงพิกัดปัจจุบัน";
    gpsBtn.disabled = false;
  };
  gpsBox.appendChild(gpsBtn);
  gpsBox.appendChild(gpsNote);
  grid.appendChild(gpsBox);

  for (var n = 1; n <= 5; n++) grid.appendChild(inputBox("pH จุดที่ " + n, "svPh" + n, "0.0", "", false, true));
  grid.appendChild(inputBox("ค่าเฉลี่ย", "svAvg", "คำนวณให้อัตโนมัติ", "", true, true));
  form.appendChild(grid);

  function recalc() {
    var vals = [];
    for (var i = 1; i <= 5; i++) {
      var v = parseFloat(document.getElementById("svPh" + i).value);
      if (!isNaN(v)) vals.push(v);
    }
    document.getElementById("svAvg").value = vals.length
      ? (vals.reduce(function (a,b) { return a+b; },0) / vals.length).toFixed(2) : "";
  }
  for (var k = 1; k <= 5; k++) grid.querySelector("#svPh" + k).oninput = recalc;

  var intakeWrap = el("div");
  intakeWrap.style.marginTop = "15px";
  intakeWrap.appendChild(el("div", "read-label", "แนบภาพใบข้าว (ไม่บังคับ)"));
  var intake = makeIntake({ lead: "แนบภาพเพื่อตรวจโรคไปพร้อมกัน", hint: "ถ้าไม่แนบ ระบบจะบันทึกเฉพาะค่า pH และพิกัด" });
  intakeWrap.appendChild(intake.node);
  form.appendChild(intakeWrap);

  var saveBtn = el("button", "act act-go act-wide", "บันทึกแบบสำรวจ");
  saveBtn.style.marginTop = "15px";
  form.appendChild(saveBtn);
  var msgHost = el("div");
  form.appendChild(msgHost);

  saveBtn.onclick = async function () {
    saveBtn.disabled = true;
    saveBtn.textContent = "กำลังบันทึก";
    msgHost.innerHTML = "";
    try {
      var entry = {
        date: todayStamp(),
        owner: document.getElementById("svOwner").value.trim() || "ไม่ระบุ",
        gps: document.getElementById("svGps").value.trim(),
        ph: parseFloat(document.getElementById("svAvg").value) || null,
        disease: "ไม่ได้ตรวจภาพ",
        score: 90
      };
      var img = intake.image();
      var notRice = false;
      if (img) {
        intake.sweeping(true);
        var res = await runFullAnalysis(img);
        intake.sweeping(false);
        entry.image = imageToBase64(img, 640);

        // แบบสำรวจต่างจากหน้าวินิจฉัยตรงที่มีค่า pH และพิกัดที่ยังมีค่าอยู่
        // ต่อให้ภาพใช้ไม่ได้ ก็ไม่ควรทิ้งบันทึกทั้งใบ จึงบันทึกต่อแต่ตัดผลตรวจภาพออก
        // ไม่ใช่ปล่อยให้คะแนนจากภาพที่ไม่ใช่ข้าวไปปนกับสถิติของแปลง
        if (res.isRice) {
          entry.disease = diagnosisName(res);
          entry.score = healthScore(res);
        } else {
          notRice = true;
          entry.disease = "ภาพที่แนบไม่ใช่ใบข้าว";
          entry.score = null;
        }
      }
      await Store.add(entry);
      if (notRice) {
        msgHost.appendChild(el("div", "flash flash-warn",
          "บันทึกค่า pH และพิกัดแล้ว แต่ไม่ได้นับผลตรวจภาพ เพราะภาพที่แนบไม่ใช่ใบข้าว"));
      }
      msgHost.appendChild(el("div", "flash flash-ok", Store.isOffline()
        ? "บันทึกลงเครื่องแล้ว จะซิงก์เมื่อเชื่อมต่อได้"
        : "บันทึกแบบสำรวจแล้ว"));
      setTimeout(function () { open("survey"); }, 900);
    } catch (err) {
      msgHost.appendChild(el("div", "flash flash-bad", "บันทึกไม่สำเร็จ: " + err.message));
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "บันทึกแบบสำรวจ";
    }
  };
  wrap.appendChild(form);

  var recent = plot("บันทึกล่าสุด", "8 รายการหลังสุด");
  var recentBody = el("div");
  recent.appendChild(recentBody);

  // ── คำเตือนเรื่องข้อมูลข้ามฤดู ──
  //
  // ระบบนำบันทึกทั้งหมดไปคำนวณโดยไม่แยกฤดู ทั้งค่า pH เฉลี่ย คะแนนสุขภาพล่าสุด
  // โรคที่พบบ่อย และบริบทที่ส่งให้ AI
  // ถ้าเริ่มฤดูใหม่แล้วยังมีบันทึกฤดูก่อนค้างอยู่ ตัวเลขจะเพี้ยนโดยผู้ใช้ไม่รู้ตัว
  // เช่นฤดูก่อนเจอโรคไหม้หนัก ฤดูใหม่ยังไม่ปลูกเลยแต่หน้าภาพรวมยังขึ้นว่าต้องจัดการด่วน
  recent.appendChild(el("div", "flash flash-warn",
    "จะเริ่มฤดูปลูกใหม่ ให้ลบบันทึกของฤดูก่อนออกก่อน เพราะระบบนำบันทึกทั้งหมดมาคำนวณรวมกัน " +
    "ทั้งค่า pH เฉลี่ย คะแนนสุขภาพ และคำแนะนำจาก AI ถ้าไม่ลบ ข้อมูลฤดูเก่าจะทำให้ผลของฤดูใหม่คลาดเคลื่อน"));

  function paintRecent() {
    recentBody.innerHTML = "";
    if (!logs.length) {
      recentBody.appendChild(stateBlock("◇", "ยังไม่มีบันทึก", "กรอกแบบสำรวจด้านซ้ายเพื่อเริ่มเก็บข้อมูลแปลง"));
      return;
    }

    var wrapT = el("div");
    wrapT.style.overflowX = "auto";
    var t = el("table");
    t.innerHTML = "<thead><tr><th>วันที่</th><th>ผลตรวจ</th><th>pH</th><th>คะแนน</th><th></th></tr></thead>";
    var tb = el("tbody");

    logs.slice(0, 8).forEach(function (l) {
      var tr = el("tr");
      var wellClass = l.kind === "soil" ? "" :
        l.disease === "ไม่พบโรค" ? " well" : l.disease.indexOf("โรค") === 0 ? " ill" : "";
      tr.appendChild(el("td", "n", l.date));
      tr.appendChild(el("td", "dx" + wellClass, l.disease));
      tr.appendChild(el("td", "n", l.ph != null ? String(l.ph) : "—"));
      tr.appendChild(el("td", "n", scoreText(l.score)));

      var tdAct = el("td");
      var del = el("button", "act act-line act-sm", "ลบ");
      del.style.cssText = "border-color:var(--rust);color:var(--rust)";
      del.onclick = function () {
        if (!confirm("ลบบันทึกวันที่ " + l.date + " (" + l.disease + ")\n\nลบแล้วกู้คืนไม่ได้ และค่า pH กับคะแนนสุขภาพจะถูกคำนวณใหม่")) return;
        del.disabled = true;
        del.textContent = "กำลังลบ";
        Store.remove(l.id)
          .then(function () {
            logs = logs.filter(function (x) { return x.id !== l.id; });
            paintRecent();
          })
          .catch(function (err) {
            del.disabled = false;
            del.textContent = "ลบไม่ได้";
            alert("ลบไม่สำเร็จ: " + err.message);
          });
      };
      tdAct.appendChild(del);
      tr.appendChild(tdAct);
      tb.appendChild(tr);
    });

    t.appendChild(tb);
    wrapT.appendChild(t);
    recentBody.appendChild(wrapT);

    // ลบทั้งหมดสำหรับตอนขึ้นฤดูใหม่ ยืนยัน 2 ชั้นเพราะย้อนกลับไม่ได้
    if (logs.length > 1) {
      var clearAll = el("button", "act act-line act-sm", "ลบบันทึกทั้งหมด " + logs.length + " รายการ");
      clearAll.style.cssText = "margin-top:13px;border-color:var(--rust);color:var(--rust)";
      clearAll.onclick = async function () {
        if (!confirm("ลบบันทึกทั้งหมด " + logs.length + " รายการ\n\nใช้เมื่อขึ้นฤดูปลูกใหม่เท่านั้น ลบแล้วกู้คืนไม่ได้")) return;
        if (!confirm("ยืนยันอีกครั้ง ข้อมูลทั้งหมดจะหายถาวร รวมถึงภาพที่แนบไว้และกราฟแนวโน้ม pH")) return;

        clearAll.disabled = true;
        var fail = 0;
        for (var i = 0; i < logs.length; i++) {
          try { await Store.remove(logs[i].id); } catch (e) { fail++; }
        }
        logs = fail ? await Store.list() : [];
        paintRecent();
        if (fail) alert("ลบไม่สำเร็จ " + fail + " รายการ ลองใหม่อีกครั้ง");
      };
      recentBody.appendChild(clearAll);
    }
  }

  paintRecent();
  wrap.appendChild(recent);
  root.appendChild(wrap);
};

// ─── หน้าเตรียมดิน ─────────────────────────────
//
// เป็นคู่มืออ่าน ไม่ใช่เครื่องคำนวณ โดยตั้งใจ
// เหตุผล: อัตราปูนขาวที่ถูกต้องต้องมาจากค่าความต้องการปูนที่ได้จากการวิเคราะห์ดิน
// ไม่ใช่คำนวณจาก pH อย่างเดียว การใส่ปูนเกินทำให้ดินเป็นด่างถาวรซึ่งแก้ยากกว่าเดิมมาก
// ระบบจึงบอกได้แค่ว่าดินอยู่ในสภาพไหนและควรไปปรึกษาใคร
//
// สิ่งที่ระบบทำได้จริงคือ "ปรับคู่มือให้ตรงกับบริบทของแปลงนี้"
// เพราะขั้นตอนของนาหว่านน้ำตมกับนาหว่านข้าวแห้งต่างกันคนละทิศ
// การให้อ่านคู่มือกลางที่รวมทุกแบบไว้ด้วยกันจะทำให้ทำผิดขั้นตอนได้ง่ายกว่า
views.soil = async function (root) {
  var G = window.SOIL_GUIDE;
  if (!G) {
    root.appendChild(stateBlock("!", "ไม่พบไฟล์ฐานความรู้",
      "ไฟล์ soil-guide.js ยังไม่ได้อัปโหลดขึ้นเซิร์ฟเวอร์ กรุณาวางไว้ในโฟลเดอร์เดียวกับ index.html"));
    return;
  }

  var logs = await Store.list();
  var phs = logs.filter(function (l) { return typeof l.ph === "number"; });

  // จำค่าที่เลือกไว้ในเครื่อง เพราะวิธีทำนากับชนิดดินของแปลงหนึ่งไม่เปลี่ยนบ่อย
  // ให้ตั้งค่าใหม่ทุกครั้งที่เข้าหน้าเป็นการเสียเวลาโดยไม่จำเป็น
  var KEY = "smartrice-soil:" + (Session.user ? Session.user.username : "guest");
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { saved = {}; }
  var pick = {
    method: G.methods[saved.method] ? saved.method : "wet",
    soil:   G.soils[saved.soil]     ? saved.soil   : "clay"
  };
  function remember() {
    try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) { /* พื้นที่เต็ม ข้ามไป */ }
  }

  // ══ สภาพดินจากค่าที่บันทึกไว้ ══
  root.appendChild(bund("สภาพดินของแปลงคุณ"));
  var phCard = plot(null);
  if (!phs.length) {
    phCard.appendChild(stateBlock("◇", "ยังไม่เคยวัดค่า pH ดิน",
      "ไปที่หน้าบันทึกสำรวจ วัด pH 5 จุดในแปลงแล้วบันทึกไว้ ระบบจะแปลผลให้ที่นี่"));
  } else {
    var latest = phs[0];
    var band = window.readSoilPh(latest.ph);
    var color = band.key === "bad" ? "var(--rust)" : band.key === "warn" ? "var(--grain)" : "var(--blade)";

    var head = el("div");
    head.style.cssText = "display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px";
    var big = el("div", "num", String(latest.ph));
    big.style.cssText = "font-size:2.4rem;font-weight:500;line-height:1;color:" + color;
    head.appendChild(big);
    var side = el("div");
    var nm = el("div", "", band.title);
    nm.style.cssText = "font-weight:600;font-size:1.05rem;color:" + color;
    side.appendChild(nm);
    side.appendChild(el("div", "read-foot", "วัดเมื่อ " + latest.date + " · เฉลี่ยจาก 5 จุดในแปลง"));
    head.appendChild(side);
    phCard.appendChild(head);

    phCard.appendChild(el("div", "rx-sect", "หมายความว่าอย่างไร"));
    phCard.appendChild(el("p", "", band.say));
    phCard.appendChild(el("div", "rx-sect", "ควรทำอย่างไรต่อ"));
    phCard.appendChild(el("p", "", band.todo));

    // เตือนเมื่อค่าเก่าเกินไป — ดินเปลี่ยนตามการใส่ปุ๋ยและการชะล้าง
    // ค่าเมื่อ 8 เดือนก่อนอาจไม่ตรงกับสภาพวันนี้แล้ว
    var age = (Date.now() - new Date(phs[0].created_at || Date.now()).getTime()) / 86400000;
    if (age > 120) {
      phCard.appendChild(el("div", "flash flash-warn",
        "ค่านี้วัดไว้นานกว่า 4 เดือนแล้ว ดินเปลี่ยนสภาพได้ตามการใส่ปุ๋ยและการชะล้างของน้ำ ควรวัดใหม่ก่อนเตรียมดินรอบนี้"));
    }
  }
  root.appendChild(phCard);

  // ══ วิธีแก้ปัญหาดิน ══
  // วางไว้ต่อจากการแปลผล pH ทันที เพราะเป็นคำถามถัดไปที่ผู้ใช้จะถามเสมอ
  // ถ้าบอกว่า "ดินเปรี้ยวจัด" แล้วไม่บอกวิธีแก้ ผู้ใช้จะไปหาข้อมูลที่อื่นแทน
  if (G.problems) {
    root.appendChild(bund("วิธีแก้ปัญหาดิน"));
    var probCard = plot(null, "ไม่แน่ใจว่าเป็นปัญหาไหน ให้ดูจากอาการที่เห็นในแปลง");
    var probBody = el("div");

    // ถ้ามีค่า pH แล้วและอยู่ในเกณฑ์ที่มีปัญหา ให้เปิดหัวข้อนั้นไว้เลย
    // ประหยัดขั้นตอนให้ผู้ใช้ที่วัด pH มาแล้วและกำลังหาทางแก้
    var openKey = null;
    if (phs.length) {
      var b0 = window.readSoilPh(phs[0].ph);
      if (b0 && b0.problem) openKey = b0.problem;
    }
    if (!openKey) openKey = Object.keys(G.problems)[0];

    function paintProblems() {
      probCard.innerHTML = "";
      probCard.appendChild(el("div", "plot-note",
        "เลือกปัญหาที่ตรงกับแปลงของคุณ ถ้าไม่แน่ใจให้ดูจากอาการที่สังเกตได้"));

      var row = el("div");
      row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-top:11px";
      Object.keys(G.problems).forEach(function (k) {
        var b = el("button", "act act-sm " + (k === openKey ? "act-go" : "act-line"), G.problems[k].thai);
        b.onclick = function () { openKey = k; paintProblems(); };
        row.appendChild(b);
      });
      probCard.appendChild(row);

      var pr = G.problems[openKey];
      probBody.innerHTML = "";

      var info = plot("อาการที่สังเกตได้", "มักพบเมื่อ " + pr.when);
      info.style.marginTop = "13px";
      info.appendChild(el("p", "", pr.sign));
      info.appendChild(more("ทำไมถึงกระทบผลผลิต", pr.why));
      probBody.appendChild(info);

      var fixBox = plot("วิธีแก้ เรียงจากต้นทุนต่ำไปสูง");
      fixBox.style.marginTop = "13px";
      pr.fixes.forEach(function (fx, i) {
        fixBox.appendChild(fold(i + 1, fx.title, fx.cost, function (body) {
          body.appendChild(el("p", "", fx.detail));
        }, false));
      });
      if (pr.warn) fixBox.appendChild(el("div", "flash flash-bad", "ข้อควรระวัง: " + pr.warn));
      fixBox.appendChild(el("div", "rx-src", "อ้างอิง: " + pr.source));
      probBody.appendChild(fixBox);
    }

    root.appendChild(probCard);
    root.appendChild(probBody);
    paintProblems();
  }

  // ══ ตัวเลือกบริบทแปลง ══
  root.appendChild(bund("เลือกให้ตรงกับแปลงของคุณ"));
  var pickCard = plot(null, "ขั้นตอนด้านล่างจะเปลี่ยนตามที่เลือก");

  function chooser(label, dict, current, onPick) {
    var box = el("div");
    box.style.marginBottom = "14px";
    box.appendChild(el("div", "read-label", label));
    var row = el("div");
    row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap";
    Object.keys(dict).forEach(function (k) {
      var b = el("button", "act act-sm " + (k === current ? "act-go" : "act-line"), dict[k].thai);
      b.onclick = function () { onPick(k); };
      row.appendChild(b);
    });
    box.appendChild(row);
    return box;
  }

  var stepsHost = el("div");

  function repaint() {
    pickCard.innerHTML = "";
    pickCard.appendChild(el("div", "plot-note",
      "ขั้นตอนด้านล่างจะเปลี่ยนตามที่เลือก เพราะการเตรียมดินแต่ละแบบต่างกันจริง"));
    pickCard.appendChild(chooser("วิธีทำนา", G.methods, pick.method, function (k) {
      pick.method = k; remember(); repaint();
    }));
    pickCard.appendChild(chooser("ชนิดดินในแปลง", G.soils, pick.soil, function (k) {
      pick.soil = k; remember(); repaint();
    }));

    var m = G.methods[pick.method], sl = G.soils[pick.soil];

    stepsHost.innerHTML = "";

    // ── ขั้นตอนหลักตามวิธีทำนา ──
    stepsHost.appendChild(bund("ขั้นตอนเตรียมดิน · " + m.thai));
    var intro = plot(null);
    intro.appendChild(el("p", "", m.note));

          var lo = rai * t.calc.perRaiMin, hi = rai * t.calc.perRaiMax;

          outHost.appendChild(grid);

        if (t.calc.timeline && dateIn && dateIn.value) {

          var tl = t.calc.timeline;

          } else {

          outHost.appendChild(cal);
        } else if (t.calc.timeline) {
          outHost.appendChild(el("div", "read-foot",

        }
      }

      raiIn.oninput = recalc;
      if (dateIn) dateIn.onchange = recalc;
      recalc();

    body.appendChild(calcCard);

  } catch (e) { /* อ่านไม่ได้ก็ใช้ค่าเริ่มต้น */ }

  }
  function itemCost(it) {
    var v = st.items[it.key];

  // ถ้าเคยวัดพื้นที่ไว้ที่หน้าที่นา ให้ดึงมาใช้ได้เลย ไม่ต้องพิมพ์ซ้ำ
  // ไม่เติมให้อัตโนมัติ เพราะผู้ใช้อาจคิดต้นทุนเฉพาะบางส่วนของแปลง

  f3.appendChild(sSel);
  grid.appendChild(f3);

  var f4 = el("div", "inp");
  f4.appendChild(el("label", "", "ผลผลิตที่คาดว่าจะได้ (กก./ไร่)"));
  var yIn = el("input");
  yIn.className = "num-in";
  yIn.inputMode = "decimal";

  grid.appendChild(f4);

  var f5 = el("div", "inp");

  var pIn = el("input");
  pIn.className = "num-in";
  pIn.inputMode = "decimal";
  f5.appendChild(pIn);
  grid.appendChild(f5);

  inCard.appendChild(grid);
  inCard.appendChild(el("div", "read-foot",
    "ค่าตั้งต้นอ้างอิง " + C.asOf + " · ราคาข้าวเปลี่ยนทุกสัปดาห์ ควรถามราคารับซื้อจากโรงสีในพื้นที่ก่อนตัดสินใจจริง"));
  root.appendChild(inCard);

  // ── รายการต้นทุน ──
  root.appendChild(bund("รายการต้นทุนต่อไร่"));
  var costCard = plot(null, "รายการไหนไม่มีให้ใส่ 0");
  var itemInputs = {};
  C.costItems.forEach(function (it) {
    var row = el("div");
    row.style.cssText = "display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule-soft)";

    var left = el("div");
    left.style.cssText = "flex:1;min-width:0";
    var nm = el("div");
    nm.style.cssText = "font-size:.88rem;display:flex;align-items:center;gap:7px;flex-wrap:wrap";
    nm.appendChild(document.createTextNode(it.name));
    // บอกให้ชัดว่าตัวไหนมีแหล่งอ้างอิงตรง ตัวไหนเป็นค่าประมาณ
    // ถ้าแสดงเหมือนกันหมด ผู้ใช้จะเข้าใจว่าทุกตัวเลขแม่นเท่ากัน
    nm.appendChild(el("span", it.cited ? "tag-yes" : "tag-wait", it.cited ? "มีอ้างอิง" : "ค่าประมาณ"));
    left.appendChild(nm);
    left.appendChild(el("div", "read-foot", it.note));
    row.appendChild(left);

    var inp = el("input");
    inp.className = "num-in";
    inp.inputMode = "decimal";
    inp.value = String(itemCost(it));
    inp.style.cssText = "width:110px;flex:none;padding:7px 10px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF;color:var(--ink);text-align:right";
    inp.oninput = function () {
      var v = parseFloat(inp.value);
      st.items[it.key] = isNaN(v) ? it.perRai : v;
      save();
      recalc();
    };
