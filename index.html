    costCard.appendChild(row);
  });
  root.appendChild(costCard);

  root.appendChild(bund("ผลการคำนวณ"));
  root.appendChild(outHost);

  function syncDefaults() {
    var v = varOf();
    if (st.yieldPerRai == null) yIn.value = String(v.yieldPerRai);
    else yIn.value = String(st.yieldPerRai);
    if (st.price == null) pIn.value = String(v.price);
    else pIn.value = String(st.price);
  }

  function recalc() {
    outHost.innerHTML = "";

    var rai = parseFloat(raiIn.value);
    var yPer = parseFloat(yIn.value);
    var price = parseFloat(pIn.value);

    if (!rai || rai <= 0 || !yPer || yPer <= 0 || !price || price <= 0) {
      outHost.appendChild(stateBlock("◇", "กรอกข้อมูลให้ครบก่อน",
        "ขนาดแปลง ผลผลิตต่อไร่ และราคาขาย ต้องเป็นตัวเลขมากกว่า 0 ทั้งหมด"));
      return;
    }

    var perRai = C.costItems.reduce(function (a, it) { return a + itemCost(it); }, 0);
    var cost = perRai * rai;
    var kg = yPer * rai;
    var revenue = kg * price;
    var profit = revenue - cost;
    // จุดคุ้มทุนคือตัวเลขที่มีประโยชน์ที่สุดของทั้งหน้า
    // เพราะเป็นราคาที่เกษตรกรเอาไปเทียบกับที่โรงสีเสนอได้ทันทีว่าควรขายหรือรอ
    var breakEven = cost / kg;
    var good = profit >= 0;

    // ── สรุปผล ──
    var sum = plot(null);
    var hero = el("div");
    hero.style.cssText = "text-align:center;padding:8px 0 16px;border-bottom:1px solid var(--rule-soft);margin-bottom:16px";
    hero.appendChild(el("div", "read-label", good ? "กำไรที่คาดว่าจะได้" : "ผลขาดทุนที่คาดว่าจะเกิด"));
    var big = el("div", "num", (good ? "" : "-") + money(Math.abs(profit)) + " บาท");
    big.style.cssText = "font-size:2.5rem;font-weight:500;line-height:1.1;color:" +
      (good ? "var(--blade)" : "var(--rust)");
    hero.appendChild(big);
    hero.appendChild(el("div", "read-foot",
      (good ? "กำไร " : "ขาดทุน ") + money(Math.abs(profit) / rai) + " บาทต่อไร่ จากทั้งหมด " + rai + " ไร่"));
    sum.appendChild(hero);

    var cells = el("div");
    cells.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px";
    cells.appendChild(readOut("ต้นทุนรวม", money(cost) + " บาท", money(perRai) + " บาท/ไร่"));
    cells.appendChild(readOut("ผลผลิตที่คาด", money(kg) + " กก.", yPer + " กก./ไร่"));
    cells.appendChild(readOut("รายได้จากการขาย", money(revenue) + " บาท", "ที่ราคา " + price + " บาท/กก."));
    sum.appendChild(cells);
    outHost.appendChild(sum);

    // ── จุดคุ้มทุน ──
    var be = plot(null);
    be.style.marginTop = "13px";
    be.appendChild(el("div", "rx-sect", "ราคาที่ต้องขายให้ได้อย่างน้อย (จุดคุ้มทุน)"));
    var beBig = el("div", "num", breakEven.toFixed(2) + " บาท/กก.");
    beBig.style.cssText = "font-size:1.9rem;font-weight:500;line-height:1.2;color:" +
      (price >= breakEven ? "var(--blade)" : "var(--rust)");
    be.appendChild(beBig);

    var diff = price - breakEven;
    be.appendChild(el("p", "", price >= breakEven
      ? "ราคาที่คุณกรอกไว้สูงกว่าจุดคุ้มทุน " + diff.toFixed(2) + " บาทต่อกิโลกรัม ทุกกิโลกรัมที่ขายได้เกินจากนี้คือกำไร"
      : "ราคาที่คุณกรอกไว้ต่ำกว่าจุดคุ้มทุน " + Math.abs(diff).toFixed(2) + " บาทต่อกิโลกรัม แปลว่ายิ่งขายยิ่งขาดทุน"));
    be.querySelector("p").style.cssText = "margin:6px 0 0;font-size:.87rem";

    be.appendChild(el("div", "read-foot",
      "เอาตัวเลขนี้ไปเทียบกับราคาที่โรงสีเสนอได้ทันที ถ้าต่ำกว่านี้แปลว่าขายแล้วขาดทุน"));
    outHost.appendChild(be);

    // ── คำเตือนเมื่อขาดทุน พร้อมทางออกที่ทำได้จริง ──
    if (!good) {
      var fix = el("div", "flash flash-bad");
      fix.appendChild(el("div", "verify-ask", "ตัวเลขนี้ขาดทุน ลองพิจารณา 3 ทาง"));
      var ul = el("ul");
      ul.style.cssText = "margin:8px 0 0;padding-left:19px;font-size:.86rem";
      // เรียงตามผลที่ทำได้จริงเร็วที่สุดก่อน
      [
        "ลดค่าปุ๋ยด้วยปุ๋ยอินทรีย์และการใส่ตามค่าวิเคราะห์ดิน — เป็นรายการที่ลดได้มากที่สุดโดยไม่กระทบผลผลิต",
        "เพิ่มผลผลิตต่อไร่ด้วยการเตรียมดินให้ดีขึ้นและตรวจพบโรคเร็ว ต้นทุนเท่าเดิมแต่ได้ข้าวมากขึ้น",
        "ชะลอการขายถ้าเก็บได้ ราคาข้าวขึ้นลงตามฤดู มีโครงการสินเชื่อชะลอการขายของ ธ.ก.ส. ให้ค่าฝากเก็บ"
      ].forEach(function (x) {
        var li = el("li", "", x);
        li.style.marginBottom = "5px";
        ul.appendChild(li);
      });
      fix.appendChild(ul);
      outHost.appendChild(fix);
    }

    // ── ข้อสังเกตตามชนิดดิน ──
    var sn = C.soilNotes[st.soil];
    if (sn) {
      var sc = plot(null);
      sc.style.marginTop = "13px";
      sc.appendChild(el("div", "rx-sect", "ข้อสังเกตสำหรับ" + sn.thai));
      var p1 = el("p", "", sn.say);
      p1.style.cssText = "margin:0 0 7px;font-size:.87rem";
      sc.appendChild(p1);
      sc.appendChild(el("div", "flash flash-warn", "แนะนำให้ปรับ: " + sn.adjust));
      outHost.appendChild(sc);
    }

    // ── ราคาปุ๋ยอ้างอิง ──
    // ปุ๋ยเป็นรายการต้นทุนที่ใหญ่ที่สุดและผันผวนที่สุด จึงแสดงราคาไว้ให้เทียบ
    if (C.fertPrices) {
      var fp = plot(null);
      fp.style.marginTop = "13px";
      fp.appendChild(el("div", "rx-sect", "ราคาปุ๋ยเคมีอ้างอิง (" + C.fertPrices.unit + ")"));
      C.fertPrices.items.forEach(function (x) {
        var line = el("div");
        line.style.cssText = "display:flex;justify-content:space-between;gap:12px;padding:8px 0;" +
          "border-bottom:1px solid var(--rule-soft);font-size:.87rem";
        var left = el("div");
        left.appendChild(el("span", "num", x.formula));
        var nm = el("span", "", "  " + x.name);
        nm.style.color = "var(--ink-soft)";
        left.appendChild(nm);
        line.appendChild(left);
        line.appendChild(el("span", "num",
          x.low === x.high ? x.low.toLocaleString() : x.low.toLocaleString() + "-" + x.high.toLocaleString()));
        fp.appendChild(line);
      });
      fp.appendChild(el("div", "read-foot", C.fertPrices.asOf + " · " + C.fertPrices.note));
      outHost.appendChild(fp);
    }

    // ── ให้ AI ค้นราคาล่าสุดจากเว็บ ──
    //
    // ทำไมไม่ดึงราคาอัตโนมัติ: ไม่มี API ราคาข้าวและปุ๋ยไทยที่ฟรีและเชื่อถือได้
    // การให้ AI ค้นแล้วแสดงพร้อมแหล่งอ้างอิงให้ผู้ใช้อ่านเอง ปลอดภัยกว่าการเติมตัวเลขให้อัตโนมัติ
    // เพราะถ้า AI อ่านผิดแล้วระบบเติมลงช่องเลย ผู้ใช้จะไม่มีทางรู้ว่าผิด
    var upd = plot(null);
    upd.style.marginTop = "13px";
    upd.appendChild(el("div", "rx-sect", "ราคาล่าสุด"));
    upd.appendChild(el("div", "read-foot",
      "ราคาในระบบเป็นข้อมูล " + C.asOf + " กดปุ่มด้านล่างให้ AI ค้นราคาปัจจุบันจากเว็บ แล้วนำมากรอกเองในช่องด้านบน"));
    var updBtn = el("button", "act act-line act-sm", "ค้นราคาข้าวและปุ๋ยล่าสุด");
    updBtn.style.marginTop = "11px";
    var updOut = el("div");
    upd.appendChild(updBtn);
    upd.appendChild(updOut);

    updBtn.onclick = async function () {
      updBtn.disabled = true;
      updBtn.textContent = "กำลังค้นหา";
      updOut.innerHTML = "";
      try {
        var ans = await Store.askGemini(
          "ค้นหาราคาปัจจุบันในประเทศไทยแล้วรายงานให้สั้นที่สุด\n" +
          "1. ราคารับซื้อข้าวเปลือกหอมมะลิและข้าวเปลือกเจ้า บาทต่อกิโลกรัม\n" +
          "2. ราคาปุ๋ยเคมีสูตร 46-0-0, 16-20-0 และ 16-16-8 บาทต่อกระสอบ 50 กิโลกรัม\n\n" +
          "ตอบเป็นรายการสั้นๆ ระบุวันที่ของข้อมูลทุกรายการ " +
          "ถ้าหาราคาปัจจุบันไม่เจอให้บอกตรงๆ ว่าไม่พบ ห้ามเดาตัวเลขเด็ดขาด",
          null, { search: true });

        updOut.innerHTML = "";
        var p2 = el("p", "", ans.text);
        p2.style.cssText = "margin:11px 0 0;font-size:.87rem;white-space:pre-wrap";
        updOut.appendChild(p2);

        if (ans.sources && ans.sources.length) {
          var sb = el("div", "src-box");
          sb.style.cssText = "margin-top:11px;padding:11px 13px;border:1px solid;border-radius:var(--r-sm)";
          sb.appendChild(el("div", "src-head", "แหล่งที่ AI ค้นมา"));
          ans.sources.slice(0, 4).forEach(function (sx) {
            var a2 = el("a", "src-link");
            a2.href = sx.url; a2.target = "_blank"; a2.rel = "noopener noreferrer";
            a2.textContent = sx.title;
            sb.appendChild(a2);
          });
          updOut.appendChild(sb);
        }
        updOut.appendChild(el("div", "flash flash-warn",
          "AI อาจอ่านราคาคลาดเคลื่อน ควรกดดูแหล่งต้นทางก่อนนำตัวเลขมากรอก " +
          "และราคารับซื้อจริงของโรงสีในพื้นที่คุณอาจต่างจากราคากลาง"));
      } catch (err) {
        updOut.appendChild(el("div", "flash flash-bad", friendlyError(err.message)));
      } finally {
        updBtn.disabled = false;
        updBtn.textContent = "ค้นราคาข้าวและปุ๋ยล่าสุด";
      }
    };
    outHost.appendChild(upd);

    // ── ที่มาของตัวเลข ──
    var srcBox = plot(null);
    srcBox.style.marginTop = "13px";
    srcBox.appendChild(more("ที่มาของค่าตั้งต้นทั้งหมด", C.sources.join(" · ")));
    srcBox.appendChild(el("div", "flash flash-warn",
      "ค่าตั้งต้นเป็นข้อมูล " + C.asOf + " ราคาข้าวเปลี่ยนทุกสัปดาห์ " +
      "ตัวเลขนี้ใช้วางแผนได้ แต่ไม่ใช่การรับประกัน ควรถามราคารับซื้อจากโรงสีก่อนตัดสินใจจริง"));
    outHost.appendChild(srcBox);
  }

  raiIn.oninput = function () {
    var v = parseFloat(raiIn.value);
    if (!isNaN(v)) { st.rai = v; save(); }
    recalc();
  };
  yIn.oninput = function () {
    var v = parseFloat(yIn.value);
    st.yieldPerRai = isNaN(v) ? null : v;
    save();
    recalc();
  };
  pIn.oninput = function () {
    var v = parseFloat(pIn.value);
    st.price = isNaN(v) ? null : v;
    save();
    recalc();
  };
  vSel.onchange = function () {
    st.variety = vSel.value;
    // เปลี่ยนชนิดข้าวแล้วรีเซ็ตผลผลิตกับราคากลับเป็นค่าตั้งต้นของชนิดนั้น
    // ไม่งั้นผู้ใช้จะได้ราคาข้าวเจ้าติดมากับหอมมะลิโดยไม่รู้ตัว
    st.yieldPerRai = null;
    st.price = null;
    save();
    syncDefaults();
    recalc();
  };
  sSel.onchange = function () { st.soil = sSel.value; save(); recalc(); };

  syncDefaults();
  recalc();
};

views.plots = async function (root) {
  var logs = await Store.list();
  root.appendChild(bund("โรคที่พบจากการตรวจทั้งหมด"));
  var card = plot();
  if (!logs.length) {
    card.appendChild(stateBlock("◇", "ยังไม่พบโรคในระบบ",
      "เริ่มจากหน้าวินิจฉัยใบข้าว หรือบันทึกสำรวจ แล้วรายการโรคที่ตรวจพบจะขึ้นที่นี่"));
  } else {
    logs.forEach(function (l) {
      var item = el("div", "stack-item");
      var chip = el("div", "stack-chip " + statusOf(l.score), scoreText(l.score));
      item.appendChild(chip);
      var main = el("div", "stack-main");
      main.appendChild(el("div", "stack-lead", l.disease));
      main.appendChild(el("div", "stack-sub",

      card.appendChild(item);
    });
  }
  root.appendChild(card);
};

views.ledger = async function (root) {
  var logs = await Store.list();
  root.appendChild(bund("ทะเบียนบันทึกทั้งหมด"));
  var card = plot(null);

  var tools = el("div");
  tools.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px";
  var dl = el("button", "act act-line act-sm", "ส่งออกเป็นไฟล์ CSV");
  dl.disabled = !logs.length;
  dl.onclick = function () { exportCsv(logs); };
  tools.appendChild(dl);
  var find = el("input");
  find.placeholder = "กรองตามวันที่ ชื่อ หรือโรค";
  find.style.cssText = "padding:7px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF;width:250px;max-width:100%";
  tools.appendChild(find);
  card.appendChild(tools);

  var body = el("div");
  card.appendChild(body);

  // คืน element แทนสตริง HTML เพราะค่า actual มาจากผู้ใช้
  // การต่อสตริงแล้วยัดเข้า innerHTML เปิดช่องให้ฝังแท็กลงในบันทึกของตัวเองได้
  // แม้กระทบแค่บัญชีตัวเอง แต่เป็นช่องที่ปิดได้ง่ายจึงไม่ควรเปิดทิ้งไว้
  function judgeTag(l) {
    if (!l.verify) return el("span", "tag-wait", "ยังไม่ยืนยัน");
    if (l.verify.correct) return el("span", "tag-yes", "ถูกต้อง");
    return el("span", "tag-no", "ผิด · ที่จริงคือ " + th(l.verify.actual || "ไม่ระบุ"));
  }

  function draw(filter) {
    body.innerHTML = "";
    if (!logs.length) {
      body.appendChild(stateBlock("◇", "ทะเบียนยังว่าง", "บันทึกผลตรวจครั้งแรกเพื่อเริ่มทะเบียน"));
      return;
    }
    var rows = logs.filter(function (l) {
      if (!filter) return true;
      return (l.date + " " + (l.owner||"") + " " + l.disease).toLowerCase().indexOf(filter.toLowerCase()) !== -1;
    });
    if (!rows.length) {
      body.appendChild(stateBlock("◇", "ไม่พบรายการที่ตรงกับคำค้น", "ลองพิมพ์คำอื่น หรือล้างช่องค้นหา"));
      return;
    }

    var wrap = el("div");
    wrap.style.overflowX = "auto";
    var t = el("table");
    t.innerHTML = "<thead><tr><th>ภาพ</th><th>วันที่</th><th>ผลตรวจ AI</th><th>ผู้ใช้ยืนยัน</th><th>pH</th><th>คะแนน</th><th></th></tr></thead>";
    var tb = el("tbody");

    rows.forEach(function (l) {
      var tr = el("tr");

      var tdImg = el("td");
      if (l.hasImage) {
        var img = el("img", "thumb");
        img.alt = "ภาพใบข้าวที่ตรวจเมื่อ " + l.date;
        img.loading = "lazy";
        // โหลดภาพเฉพาะแถวที่มีจริง เพื่อไม่ให้ยิง request ที่ไม่จำเป็น
        Store.imageOf(l.id)
          .then(function (im) { img.src = "data:" + im.mimeType + ";base64," + im.data; })
          .catch(function () { img.replaceWith(el("div", "thumb-blank", "โหลดไม่ได้")); });
        img.onclick = function () { openLens(img.src, l); };
        tdImg.appendChild(img);
      } else {
        tdImg.appendChild(el("div", "thumb-blank", "ไม่มี"));
      }
      tr.appendChild(tdImg);

      var wellClass = l.kind === "soil" ? "" : l.disease === "ไม่พบโรค" ? " well" : l.disease.indexOf("โรค") === 0 ? " ill" : "";
      var rest = el("td", "n", l.date);
      tr.appendChild(rest);
      var tdDx = el("td", "dx" + wellClass, l.disease);
      tr.appendChild(tdDx);
      var tdJudge = el("td");
      tdJudge.appendChild(judgeTag(l));
      tr.appendChild(tdJudge);
      tr.appendChild(el("td", "n", l.ph != null ? String(l.ph) : "—"));
      tr.appendChild(el("td", "n", scoreText(l.score)));

      var tdAct = el("td");
      var del = el("button", "act act-line act-sm", "ลบ");
      del.onclick = function () {
        if (!confirm("ลบบันทึกวันที่ " + l.date + " ออกจากทะเบียน ยืนยันหรือไม่")) return;
        del.disabled = true;
        del.textContent = "กำลังลบ";
        Store.remove(l.id)
          .then(function () {
            logs = logs.filter(function (x) { return x.id !== l.id; });
            draw(find.value);
          })
          .catch(function (err) {
            del.disabled = false;
            del.textContent = "ลบไม่ได้";
            alert(err.message);
          });
      };
      tdAct.appendChild(del);
      tr.appendChild(tdAct);

      tb.appendChild(tr);
    });

    t.appendChild(tb);
    wrap.appendChild(t);
    body.appendChild(wrap);
  }

  find.oninput = function () { draw(find.value); };
  draw(document.getElementById("seekInput").value);
  root.appendChild(card);
};

// ขยายดูภาพเต็ม ปิดด้วยปุ่ม คลิกพื้นหลัง หรือกด Escape
function openLens(src, log) {
  if (!src) return;
  var lens = el("div", "lens");
  var img = el("img");
  img.src = src;
  img.alt = "ภาพใบข้าวที่ตรวจเมื่อ " + log.date;
  var shut = el("button", "lens-shut", "ปิด");
  lens.appendChild(img);
  lens.appendChild(shut);

  function close() {
    lens.remove();
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e) { if (e.key === "Escape") close(); }

  shut.onclick = close;
  lens.onclick = function (e) { if (e.target === lens) close(); };
  document.addEventListener("keydown", onKey);
  document.body.appendChild(lens);
  shut.focus();
}


views.weather = async function (root) {
  root.appendChild(bund("สภาพอากาศแปลงนา"));

  var host = el("div");
  host.appendChild(stateBlock("◌", "กำลังหาตำแหน่งแปลง", "กรุณาอนุญาตให้เว็บเข้าถึงตำแหน่ง"));
  root.appendChild(host);

  // ใช้พิกัดที่เคยบันทึกไว้ก่อน ถ้าไม่มีค่อยขอตำแหน่งปัจจุบัน
  // เพราะพิกัดแปลงที่บันทึกไว้ตรงกับที่ต้องการดูมากกว่าตำแหน่งที่ผู้ใช้ยืนอยู่ตอนนี้
  var logs = await Store.list();
  var saved = logs.filter(function (l) { return l.gps && l.gps.indexOf(",") !== -1; })[0];

  var coords = null;
  var source = "";

  // ลำดับความสำคัญ: ที่นาที่ปักหมุดไว้ → พิกัดจากบันทึกเก่า → ตำแหน่งปัจจุบัน
  // ที่นาที่ปักหมุดมาก่อนเสมอ เพราะเป็นจุดที่ผู้ใช้ตั้งใจกำหนดเอง
  var pinned = fieldCoords();
  var fieldRec = readField();
  if (pinned) {
    coords = { lat: pinned.lat, lon: pinned.lon };
    source = "อ้างอิง" + pinned.from;
    // บอกอายุของพิกัดที่ใช้ ผู้ใช้ต้องรู้ว่ากำลังดูค่าที่ปักไว้เมื่อไหร่
    // เพราะคนที่ทำหลายแปลงอาจลืมไปแล้วว่าหมุดปักอยู่ที่แปลงไหน
    if (fieldRec && fieldRec.fixedAt) {
      source += " ซึ่งปักหมุดไว้" + ageWords(fieldRec.fixedAt);
      if (fieldRec.accuracy != null) source += " ด้วยความแม่นยำ ±" + fieldRec.accuracy + " เมตร";
    }
  } else if (saved) {
    var parts = saved.gps.split(",").map(Number);
    coords = { lat: parts[0], lon: parts[1] };
    source = "อ้างอิงพิกัดแปลงที่บันทึกไว้เมื่อ " + saved.date + " ไม่ใช่ตำแหน่งปัจจุบัน";
  } else {
    try {
      var pos = await getFix({ timeout: 12000 });
      coords = { lat: pos.lat, lon: pos.lon };
      source = "อ้างอิงตำแหน่งปัจจุบันของอุปกรณ์ ความแม่นยำ ±" + Math.round(pos.accuracy) + " เมตร";
    } catch (err) {
      host.innerHTML = "";
      host.appendChild(stateBlock("!", "ยังดูสภาพอากาศไม่ได้",
        err.message + " — ทางแก้คือไปที่หน้าบันทึกสำรวจ กดดึงพิกัดปัจจุบันแล้วบันทึกไว้ 1 ครั้ง ระบบจะใช้พิกัดนั้นตลอดไป"));
      return;
    }
  }

  host.innerHTML = "";
  host.appendChild(stateBlock("◌", "กำลังดึงข้อมูลอากาศ", null));

  var w;
  try {
    w = await fetchWeather(coords.lat.toFixed(4), coords.lon.toFixed(4));
  } catch (err) {
    host.innerHTML = "";
    host.appendChild(stateBlock("!", "ดึงข้อมูลอากาศไม่สำเร็จ", err.message + " — ลองรีเฟรชหน้าอีกครั้ง"));
    return;
  }

  host.innerHTML = "";

  // ── ฝนและแสงแดด วันนี้กับพรุ่งนี้ ──
  // สองค่านี้คือสิ่งที่เกษตรกรใช้ตัดสินใจจริงในแต่ละวัน
  // (จะพ่นยาไหม จะระบายน้ำไหม) จึงยกขึ้นมาไว้บนสุดแยกจากกราฟย้อนหลัง
  (function () {
    var d = w.days || [];
    var i = w.todayIndex;
    var today = d[i], tomorrow = d[i + 1];
    if (!today) return;

    var card = plot("ฝนและแสงแดด");
    var st = w.station || {};

    // บอกให้ชัดว่าค่านี้มาจากจุดพยากรณ์ใกล้แปลง ไม่ใช่เครื่องวัดที่ตั้งอยู่ในแปลง
    // ถ้าไม่บอก ผู้ใช้จะเข้าใจว่าเป็นค่าที่วัดจากนาตัวเองแล้วไปโทษระบบเมื่อคลาดเคลื่อน
    // ── บอกระยะห่างจริง ไม่ใช่แค่คำว่า "ใกล้แปลง" (แก้ไข 2026-08) ──
    //
    // ผู้ให้บริการพยากรณ์แบ่งพื้นที่เป็นตาราง แล้วคืนค่าจุดกึ่งกลางของตารางที่ครอบแปลงอยู่
    // จุดนั้นอาจห่างจากแปลงจริงหลายกิโลเมตร คำว่า "ใกล้แปลง" จึงกำกวมเกินไป
    // การบอกเป็นตัวเลขให้ผู้ใช้ตัดสินเองว่าจะเชื่อแค่ไหน ตรงไปตรงมากว่าการรับประกันแทนเขา
    if (st.lat != null) {
      var gap = metersBetween(coords.lat, coords.lon, st.lat, st.lon);
      var gapText = gap >= 1000
        ? "ห่างจากแปลงประมาณ " + (gap / 1000).toFixed(1) + " กิโลเมตร"
        : "ห่างจากแปลงประมาณ " + gap + " เมตร";
      card.appendChild(el("div", "read-foot",
        "อ่านจากจุดพยากรณ์ที่ " + st.lat.toFixed(3) + ", " + st.lon.toFixed(3) +
        " " + gapText + " — เป็นค่าจากแบบจำลอง ไม่ใช่เครื่องวัดในแปลงจริง"));
      if (gap > 15000) {
        card.appendChild(el("div", "read-foot",
          "ระยะนี้ไกลพอที่ฝนอาจตกคนละที่กับแปลงคุณ ให้ใช้เป็นแนวโน้มเท่านั้น"));
      }
    }

    var grid = el("div", "fx-grid");
    function cell(when, day) {
      var c = el("div", "fx-cell");
      c.appendChild(el("div", "fx-when", when));

      var rain = day.rain == null ? null : day.rain;
      c.appendChild(el("div", "fx-big", rain == null ? "–" : rain.toFixed(1) + " มม."));
      c.appendChild(el("div", "fx-cap", rain == null ? "ไม่มีข้อมูลฝน"
        : rain < 0.5 ? "แทบไม่มีฝน"
        : rain < 10  ? "ฝนเล็กน้อย"
        : rain < 35  ? "ฝนปานกลาง"
        : rain < 90  ? "ฝนหนัก" : "ฝนหนักมาก"));

      var sun = day.sunHours;
      c.appendChild(el("div", "fx-big2", sun == null ? "–" : sun.toFixed(1) + " ชม."));
      c.appendChild(el("div", "fx-cap", sun == null ? "ไม่มีข้อมูลแสง"
        : sun < 3 ? "แดดน้อย ใบแห้งช้า"
        : sun < 6 ? "แดดปานกลาง" : "แดดจัด"));
      return c;
    }
    grid.appendChild(cell("วันนี้", today));
    if (tomorrow) grid.appendChild(cell("พรุ่งนี้", tomorrow));
    card.appendChild(grid);
    host.appendChild(card);
  })();

  // ── ค่าปัจจุบันจาก WeatherAPI (อัปเดตทุก 10-15 นาที) ──
  var liveCard = plot(null);
  var liveBody = el("div");
  liveBody.appendChild(stateBlock("◌", "กำลังอ่านค่าปัจจุบัน", null));
  liveCard.appendChild(liveBody);
  host.appendChild(liveCard);

  async function paintLive() {
    try {
      var live = await fetchLiveWeather(coords.lat.toFixed(4), coords.lon.toFixed(4));
      liveBody.innerHTML = "";

      var head = el("div");
      head.style.cssText = "display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px";
      // ── ชื่อสถานที่นี้ไม่ใช่ที่อยู่ของผู้ใช้ (แก้ไข 2026-08) ──
      //
      // ค่านี้มาจากผู้ให้บริการอากาศ ซึ่งจับคู่พิกัดที่เราส่งไปกับ "สถานีที่ใกล้ที่สุด"
      // ในฐานข้อมูลของเขา ไม่ได้แปลงพิกัดเป็นชื่อหมู่บ้านหรือตำบลตามทะเบียนราษฎร
      // ฐานข้อมูลนั้นครอบคลุมระดับอำเภอหรือจังหวัดเป็นหลัก ชื่อที่ได้จึงมักเป็น
      // อำเภอข้างเคียงหรือตัวจังหวัด ไม่ใช่หมู่บ้านที่ผู้ใช้อยู่จริง
      //
      // ของเดิมเอาชื่อนี้มาต่อท้ายคำว่า "ค่าปัจจุบัน" เฉยๆ ผู้ใช้จึงอ่านว่าเป็นที่อยู่ตัวเอง
      // แล้วสรุปว่าระบบระบุตำแหน่งผิด ทั้งที่พิกัดถูกแต่ชื่อมาจากคนละระบบ
      // แก้โดยเรียกให้ตรงกับสิ่งที่มันเป็นจริงคือชื่อสถานีตรวจอากาศ
      var t = el("div", "plot-title", "ค่าปัจจุบัน");
      head.appendChild(t);
      var stamp = el("span", "read-foot", "อัปเดตล่าสุด " + (live.current.lastUpdated || "-"));
      head.appendChild(stamp);
      liveBody.appendChild(head);

      if (live.location) {
        liveBody.appendChild(el("div", "read-foot",
          "ค่าเหล่านี้รายงานจากสถานีตรวจอากาศชื่อ " + live.location +
          " ซึ่งเป็นชื่อสถานีของผู้ให้บริการ ไม่ใช่ชื่อหมู่บ้านหรือตำบลของแปลงคุณ " +
          "พิกัดแปลงที่ระบบใช้คือ " + coords.lat.toFixed(4) + ", " + coords.lon.toFixed(4) +
          " แก้ไขได้ที่หน้าที่นาของฉัน"));
      }

      var grid = el("div", "row-3");
      [

        ["อุณหภูมิ", live.current.tempC + "°C", "ความชื้น " + live.current.humidity + "%"],

          live.current.cloud >= 80 ? "ครึ้มมาก แดดน้อย" : live.current.cloud <= 30 ? "ท้องฟ้าโปร่ง" : "มีเมฆบางส่วน"],
        ["ดัชนี UV", String(live.current.uv), "ตัวชี้วัดความแรงของแสงแดด"]
      ].forEach(function (c) {
        var b = el("div");
        b.appendChild(readOut(c[0], c[1], c[2]));
        grid.appendChild(b);
      });
      liveBody.appendChild(grid);

      var cite = el("p", "",
        "แหล่งข้อมูล: " + live.source + " · ข้อมูลปัจจุบันอัปเดตทุก 10-15 นาที หน้านี้ดึงค่าใหม่อัตโนมัติทุก 1 ชั่วโมง");
      cite.style.cssText = "font-size:.76rem;color:var(--ink-faint);margin:12px 0 0";
      liveBody.appendChild(cite);
    } catch (err) {
      liveBody.innerHTML = "";
      liveBody.appendChild(stateBlock("!", "อ่านค่าปัจจุบันไม่ได้",
        err.message + " — ข้อมูลย้อนหลังและความเสี่ยงด้านล่างยังใช้งานได้ตามปกติ"));
    }
  }
  paintLive();
  // อัปเดตค่าปัจจุบันเองทุก 1 ชั่วโมง ไม่ต้องให้ผู้ใช้กดรีเฟรช
  onPageTimer(paintLive, 60 * 60 * 1000);

  // ── สรุปย้อนหลังจาก Open-Meteo ──
  root.appendChild(bund("สรุปย้อนหลัง 7 วัน"));
  var s = w.summary;
  var stats = el("div", "row-3");
  var cards = [
    ["ฝนสะสม 7 วัน", s.rain7 + " มม.", s.rain7 >= 40 ? "ฝนชุก เสี่ยงเชื้อรา" : s.rain7 <= 5 ? "ฝนทิ้งช่วง" : "ปริมาณปานกลาง"],
    ["แสงแดดเฉลี่ย", s.sunHours + " ชม./วัน", s.sunHours <= 4 ? "แดดน้อย เชื้อราเติบโตดี" : "แดดเพียงพอ"],
    ["ความชื้นเฉลี่ย", s.humidity + "%", s.humidity >= 85 ? "ชื้นจัด ต้องเฝ้าระวัง" : "อยู่ในเกณฑ์ปกติ"],
    ["อุณหภูมิสูงสุด", s.tempMax + "°C", "ต่ำสุด " + s.tempMin + "°C"]
  ];
  cards.forEach(function (c) {
    var p = plot();
    p.appendChild(readOut(c[0], c[1], c[2]));
    stats.appendChild(p);
  });
  root.appendChild(stats);

  var src = el("p", "",
    source + " · แหล่งข้อมูลย้อนหลังและชั่วโมงแสงแดด: Open-Meteo (ค่าเฉลี่ย 3 วันล่าสุด) " +
    "ใช้คนละแหล่งกับค่าปัจจุบันด้านบน เพื่อให้ตรวจสอบไขว้กันได้");
  src.style.cssText = "font-size:.76rem;color:var(--ink-faint);margin:10px 0 0";
  root.appendChild(src);

  // ความเสี่ยงรายโรค
  root.appendChild(bund("ความเสี่ยงโรคจากสภาพอากาศ"));
  var riskCard = plot(null);

  var ranked = RISK_RULES.map(function (r) {
    var score = Math.min(100, r.score(s));
    return { rule: r, score: score, band: riskBand(score) };
  }).sort(function (a, b) { return b.score - a.score; });

      var g = getGuide(r.rule.label);
      if (g && g.prevention && g.prevention.length) {
        var tip = el("div", "read-foot", "ป้องกันล่วงหน้า: " + g.prevention[0]);
        tip.style.marginTop = "5px";
        tip.style.color = "var(--ink)";
        row.appendChild(tip);
      }
    }
    riskCard.appendChild(row);
  });

  riskCard.appendChild(more("ดัชนีนี้บอกอะไรได้และบอกไม่ได้",
    "ดัชนีนี้ประเมินจากสภาพอากาศเท่านั้น ใช้เพื่อการเฝ้าระวังล่วงหน้า ไม่ใช่การพยากรณ์การระบาด " +
    "ปัจจัยอื่นที่มีผลมากแต่ยังไม่ได้นำมาคำนวณ ได้แก่ พันธุ์ข้าวที่ปลูก ความหนาแน่นของการปลูก " +
    "ปริมาณปุ๋ยไนโตรเจน และประวัติการระบาดในพื้นที่ ควรใช้ประกอบการสำรวจแปลงด้วยตาเสมอ"));
  root.appendChild(riskCard);

  // กราฟย้อนหลังและพยากรณ์
  root.appendChild(bund("ฝนและแสงแดด ย้อนหลัง 7 วัน และล่วงหน้า 7 วัน"));
  var chartCard = plot(null);
  var cv = el("canvas");
  cv.height = 230;
  chartCard.appendChild(cv);
  root.appendChild(chartCard);

  var labels = w.days.map(function (d) { return d.date.slice(5).replace("-", "/"); });
  new Chart(cv, {
    data: {
      labels: labels,
      datasets: [
        {
          type: "bar", label: "ฝน (มม.)",
          data: w.days.map(function (d) { return d.rain; }),
          backgroundColor: w.days.map(function (d, i) {
            return i <= w.todayIndex ? "#1B5E3A" : "#6FBF73";
          }),
          borderRadius: 2, yAxisID: "y"
        },
        {
          type: "line", label: "แสงแดด (ชม.)",
          data: w.days.map(function (d) { return d.sunHours; }),
          borderColor: "#B8860B", backgroundColor: "rgba(184,134,11,.10)",
          tension: .3, pointRadius: 3, borderWidth: 2, yAxisID: "y1"
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "top", align: "start" },
        tooltip: { callbacks: {
          title: function (items) {
            var i = items[0].dataIndex;
            return labels[i] + (i > w.todayIndex ? " (พยากรณ์)" : " (ผ่านมาแล้ว)");
          }
        }}
      },
      scales: {
        y:  { position: "left", beginAtZero: true, title: { display: true, text: "ฝน (มม.)" },
              grid: { color: "#E6F1E7" }, ticks: { font: { family: "IBM Plex Mono" } } },
        y1: { position: "right", beginAtZero: true, max: 14, title: { display: true, text: "แดด (ชม.)" },
              grid: { display: false }, ticks: { font: { family: "IBM Plex Mono" } } },
        x:  { grid: { display: false }, ticks: { font: { family: "IBM Plex Mono", size: 10 } } }
      }
    }
  });

  var legend = el("p", "", "แท่งสีเข้มคือข้อมูลที่ผ่านมาแล้ว แท่งสีอ่อนคือค่าพยากรณ์ล่วงหน้า");
  legend.style.cssText = "font-size:.76rem;color:var(--ink-faint);margin:10px 0 0";
  chartCard.appendChild(legend);

  // ให้ AI อ่านสภาพอากาศพร้อมบันทึกแปลง แล้วแนะนำสิ่งที่ควรทำสัปดาห์นี้
  root.appendChild(bund("คำแนะนำจาก AI"));
  var aiCard = plot();
  var aiBody = el("div");
  aiBody.appendChild(stateBlock("◌", "กำลังให้ AI ประเมิน", "ใช้เวลาสักครู่"));
  aiCard.appendChild(aiBody);
  root.appendChild(aiCard);

  var forecast = w.days.slice(w.todayIndex + 1);
  var rainAhead = forecast.reduce(function (a, d) { return a + (d.rain || 0); }, 0).toFixed(1);

  Store.askGemini(
    "คุณเป็นผู้เชี่ยวชาญโรคข้าวไทย ประเมินสิ่งที่เกษตรกรควรทำในสัปดาห์นี้จากข้อมูลต่อไปนี้\n\n" +
    "สภาพอากาศแปลง (ค่าเฉลี่ย 3 วันล่าสุด):\n" +
    "- ฝนสะสม 7 วันที่ผ่านมา " + s.rain7 + " มม.\n" +
    "- ฝนพยากรณ์อีก 7 วันข้างหน้า " + rainAhead + " มม.\n" +
    "- แสงแดดเฉลี่ย " + s.sunHours + " ชั่วโมงต่อวัน\n" +
    "- ความชื้นเฉลี่ย " + s.humidity + "%\n" +
    "- อุณหภูมิ " + s.tempMin + " ถึง " + s.tempMax + " องศา\n\n" +
    "ดัชนีความเสี่ยงที่ระบบคำนวณได้: " +
    ranked.map(function (r) { return r.rule.thai + " " + r.band.word; }).join(", ") + "\n\n" +
    buildFarmContext(logs) + "\n\n" +
    "ตอบภาษาไทย 3-4 ประโยค บอกสิ่งที่ควรลงมือทำสัปดาห์นี้อย่างเป็นรูปธรรม ไม่ต้องใส่หัวข้อ " +
    "ห้ามแต่งชื่อสารเคมีหรืออัตราการใช้ขึ้นเอง"
  ).then(function (answer) {
    aiBody.innerHTML = "";
    var p = el("p", "", answer.text);
    p.style.cssText = "margin:0;font-size:.89rem";
    aiBody.appendChild(p);
  }).catch(function (err) {
    aiBody.innerHTML = "";
    aiBody.appendChild(stateBlock("!", "ยังให้ AI ประเมินไม่ได้", friendlyError(err.message)));
  });
};

// ─── หน้าคำแนะนำการดูแลและปรึกษา AI ────────────
//
// โครงหน้าแบ่งเป็น 2 ส่วนโดยตั้งใจ
//   1. การ์ดคำแนะนำแยกตามระยะข้าว — ตอบคำถามที่พบบ่อยที่สุดโดยไม่ต้องพิมพ์และไม่กินโควตา AI
//   2. ช่องถาม AI — สำหรับเรื่องเฉพาะของแปลงที่การ์ดสำเร็จรูปตอบไม่ได้
//
// เหตุผลที่เอาการ์ดขึ้นก่อน: คำถาม 80% ของเกษตรกรคือ "ตอนนี้ควรทำอะไร"
// ซึ่งตอบได้จากอายุข้าวอย่างเดียว ไม่ต้องใช้ AI เลย
// การให้พิมพ์ถามทุกครั้งจึงเป็นภาระเกินจำเป็นและเปลืองโควตาที่มีจำกัด
views.consult = async function (root) {
  var C = window.CARE_GUIDE;

  // ══ การ์ดคำแนะนำแยกตามระยะ ══
  if (C) {
    root.appendChild(bund("คำแนะนำการดูแลแปลงนา"));

    // จำระยะที่ดูล่าสุด เพราะข้าวอยู่ระยะเดิมนานหลายสัปดาห์
    var SKEY = "smartrice-stage:" + (Session.user ? Session.user.username : "guest");
    var pick = "tiller";
    try {
      var sv = localStorage.getItem(SKEY);
      if (sv && C.stages.some(function (x) { return x.key === sv; })) pick = sv;
    } catch (e) { /* ใช้ค่าเริ่มต้น */ }

    // พันธุ์ข้าวมาจากระเบียนแปลง ไม่ใช่ตัวเลือกเฉพาะหน้านี้
    // เพื่อให้หน้าอื่นและบริบทที่ส่งให้ AI ใช้ค่าเดียวกันเสมอ
    var vKey = fieldVariety();

    var tabCard = plot(null);
    var cardHost = el("div");

    // แถบบอกพันธุ์ที่ระบบกำลังใช้คำนวณปฏิทิน พร้อมทางลัดไปเปลี่ยน
    // จำเป็นต้องเห็นตลอด เพราะคำแนะนำทั้งหน้าเปลี่ยนตามค่านี้
    var vBar = plot(null);
    function paintVarietyBar() {
      vBar.innerHTML = "";
      var v = window.careVariety(vKey);
      vBar.appendChild(el("div", "plot-title", "ปฏิทินนี้คำนวณสำหรับ " + v.thai + " (" + v.short + ")"));
      vBar.appendChild(el("div", "plot-note", v.examples));
      vBar.appendChild(el("div", "read-foot", v.note));
      if (!fieldVarietyChosen()) {
        vBar.appendChild(el("div", "read-foot",
          "ยังไม่ได้เลือกพันธุ์ไว้ ระบบใช้ค่าเริ่มต้นนี้ไปก่อน ถ้าปลูกพันธุ์อีกกลุ่มให้เปลี่ยนก่อนใช้ปฏิทิน"));
      }
      // ถ้าผู้ใช้ระบุพันธุ์และวันหว่านแล้ว แสดงวันจริงแทนการบอกหลักการลอยๆ
      // นี่คือความต่างระหว่างระบบที่มีข้อมูล กับระบบที่คิดให้
      var cal = fieldCalendar();
      if (cal) {
        vBar.appendChild(el("div", "plot-title", "ปฏิทินของแปลงคุณ: " + cal.variety.thai));
        var cg = el("div", "row-3");
        cg.style.marginTop = "10px";
        [["ใส่ปุ๋ยครั้งที่ 2", cal.text.fert2],
         ["ข้าวออกดอก", cal.text.bloom],
         ["เก็บเกี่ยว", cal.text.harvest]].forEach(function (c) {
          var b = el("div");
          b.appendChild(readOut(c[0], c[1]));
          cg.appendChild(b);
        });
        vBar.appendChild(cg);

        // นับถอยหลังจากวันนี้ ให้ผู้ใช้รู้ว่าต้องเตรียมตัวเมื่อไหร่
        var daysLeft = Math.round((cal.fert2 - new Date()) / 86400000);
        vBar.appendChild(el("div", daysLeft >= 0 && daysLeft <= 14 ? "flash flash-warn" : "read-foot",
          daysLeft > 0
            ? "เหลืออีก " + daysLeft + " วันถึงกำหนดใส่ปุ๋ยครั้งที่ 2"
            : daysLeft === 0
              ? "วันนี้คือกำหนดใส่ปุ๋ยครั้งที่ 2"
              : "เลยกำหนดใส่ปุ๋ยครั้งที่ 2 มาแล้ว " + Math.abs(daysLeft) + " วัน"));
        vBar.appendChild(el("div", "read-foot",
          "ณ วันใส่ปุ๋ยครั้งที่ 2 ข้าวอายุประมาณ " + cal.ageAtFert2 + " วัน · แก้ไขพันธุ์และวันหว่านได้ที่หน้าที่นาของฉัน"));
      }

      var sw = el("button", "act act-line act-sm", "เปลี่ยนเป็น" +
        window.careVariety(vKey === "photo" ? "nonphoto" : "photo").thai);
      sw.style.marginTop = "12px";
      sw.onclick = function () {
        vKey = (vKey === "photo") ? "nonphoto" : "photo";
        setFieldVariety(vKey);
        paintVarietyBar();
        paintStage();
      };
      vBar.appendChild(sw);
    }
    root.appendChild(vBar);
    paintVarietyBar();

    function paintStage() {
      tabCard.innerHTML = "";

      var tabs = el("div", "stage-tabs");
      C.stages.forEach(function (st) {
        var b = el("button", "stage-tab" + (st.key === pick ? " on" : ""));
        b.appendChild(el("span", "stage-name", st.thai));
        b.appendChild(el("span", "stage-age", window.careText(st.age, vKey)));
        b.onclick = function () {
          pick = st.key;
          try { localStorage.setItem(SKEY, pick); } catch (e) {}
          paintStage();
        };
        tabs.appendChild(b);
      });
      tabCard.appendChild(tabs);

      var st = C.stages.filter(function (x) { return x.key === pick; })[0];
      tabCard.appendChild(el("div", "read-foot", st.note));
      tabCard.appendChild(el("div", "read-foot", "ช่วงเวลา: " + window.careText(st.age, vKey)));

      cardHost.innerHTML = "";
      st.cards.forEach(function (c) {
        var ic = C.icons[c.icon] || C.icons.fert;
        var row = el("div", "care");

        var chip = el("div", "care-icon");
        chip.style.background = "color-mix(in srgb, " + ic.color + " 14%, transparent)";
        chip.innerHTML = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="' + ic.color +
          '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + ic.path + '"/></svg>';
        row.appendChild(chip);

        var mid = el("div", "care-mid");
        mid.appendChild(el("div", "care-title", window.careText(c.title, vKey)));
        mid.appendChild(el("div", "care-sum", window.careText(c.summary, vKey)));
        // รายละเอียดซ่อนไว้ กดปุ่มถึงจะโผล่ ตามที่ผู้ใช้ต้องการ

        row.appendChild(mid);

        btn.onclick = function () {
          det.hidden = !det.hidden;
          btn.textContent = det.hidden ? "ดูรายละเอียด" : "ย่อกลับ";
        };
        row.appendChild(btn);

        cardHost.appendChild(row);
      });
    }

    root.appendChild(tabCard);
    root.appendChild(cardHost);
    paintStage();
    root.appendChild(more("ที่มาของคำแนะนำ", C.source));
  }

  // ══ ถาม AI เรื่องเฉพาะของแปลง ══
  root.appendChild(bund("ถามเพิ่มเติมกับ AI"));

  // ── บอกตามจริงว่าภาพเดินทางไปไหนบ้าง (เพิ่ม 2026-08) ──
  //
  // ระบบนี้พูดอยู่หลายที่ว่าโมเดลทำงาน "ในเครื่องของคุณ" ซึ่งจริงเฉพาะขั้นตรวจโรค
  // แต่ทันทีที่ผู้ใช้แนบภาพมาถาม AI ภาพจะถูกส่งขึ้น Cloudflare Worker แล้วต่อไปยัง Google
  // และภาพย่อยังถูกเก็บไว้ในบัญชีบนเซิร์ฟเวอร์ทุกครั้งที่บันทึกลงทะเบียนด้วย
  //
  // การพูดครึ่งเดียวแบบนั้นอันตรายกว่าการไม่พูดเลย เพราะผู้ใช้จะเชื่อว่าภาพไม่ออกจากเครื่อง
  // แล้วถ่ายสิ่งที่ไม่ตั้งใจให้ใครเห็นติดมาด้วยโดยไม่ระวัง เช่น ตัวบ้าน คนในครอบครัว
  // หรือเอกสารที่วางอยู่ข้างๆ ความไว้ใจที่ตั้งอยู่บนข้อมูลไม่ครบไม่ใช่ความไว้ใจ
  //
  // เขียนเป็นภาษาที่เกษตรกรอ่านแล้วตัดสินใจได้เอง ไม่ใช่ศัพท์กฎหมายที่ไม่มีใครอ่าน
  var privacy = plot("ภาพของคุณถูกใช้อย่างไร");
  [
    "ขั้นตรวจโรคจากภาพ ทำงานในเครื่องของคุณทั้งหมด ภาพไม่ถูกส่งออกไปไหน",
    "เมื่อบันทึกผลลงทะเบียน ภาพย่อจะถูกเก็บไว้ในบัญชีของคุณบนเซิร์ฟเวอร์ เพื่อให้ย้อนดูได้จากเครื่องอื่น",
    "เมื่อแนบภาพมาถามในช่องด้านล่าง ภาพจะถูกส่งไปยังบริการ AI ของ Google เพื่อให้ช่วยอธิบาย",
    "ถ้าไม่ต้องการให้ภาพออกจากเครื่อง ให้ใช้หน้าวินิจฉัยใบข้าวอย่างเดียว และไม่ต้องแนบภาพตอนถาม AI"
  ].forEach(function (line) {
    privacy.appendChild(el("div", "read-foot", "· " + line));
  });
  root.appendChild(privacy);

  var card = plot(null);

  // ความจำบทสนทนา — Gemini ไม่จำอะไรข้ามคำถาม ต้องส่งประวัติไปเองทุกครั้ง
  // ถ้าไม่ทำ ผู้ใช้แนบรูปแล้วถามต่อว่า "แล้วต้องใช้ยาอะไร" AI จะไม่รู้ว่าพูดถึงรูปไหน
  // เก็บแค่ 6 ตาล่าสุดเพื่อไม่ให้ prompt ยาวจนเปลือง token และช้า

    if (history.length > 12) history = history.slice(-12);
  }

  // คำถามต่อเนื่องทุกคำถามจะได้อ้างอิงผลตรวจนี้ได้ แม้ผู้ใช้ไม่แนบรูปซ้ำ
  var lastVision = null;

  var talk = el("div", "talk");
  talk.appendChild(el("div", "say say-ai",
    "สวัสดีครับ ผมใช้ผลจากโมเดลตรวจภาพ ค่า pH ดิน และบันทึกแปลงของคุณประกอบการตอบ\n\n" +
    "ถามได้ทั้งเรื่องโรคข้าว การเตรียมดิน การเตรียมต้นกล้า ปุ๋ยอินทรีย์ และปุ๋ยเคมี " +
    "เช่น ข้าวอายุ 25 วันควรใส่ปุ๋ยสูตรอะไร หรือจะแนบภาพใบข้าวมาให้ดูก็ได้ครับ"));
  card.appendChild(talk);

  var clip = el("div", "clip");
  clip.hidden = true;
  var clipImg = el("img");
  var clipText = el("span");
  var clipDrop = el("button", "act act-line act-sm", "เอาออก");
  clip.appendChild(clipImg); clip.appendChild(clipText); clip.appendChild(clipDrop);
  card.appendChild(clip);

  var bar = el("div", "talk-bar");
  var camBtn = el("button", "act act-line");
  camBtn.title = "แนบภาพใบข้าว";
  camBtn.setAttribute("aria-label", "แนบภาพใบข้าว");
  camBtn.innerHTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="display:block"><path d="M4 7h3l2-2h6l2 2h3v12H4z" stroke="#4A6353" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#4A6353" stroke-width="1.6"/></svg>';
  var fileIn = el("input", "hidden-file");
  fileIn.type = "file";
  fileIn.accept = "image/*";
  var q = el("input");
  q.placeholder = "เช่น ใบข้าวมีจุดสีน้ำตาล ควรทำอย่างไร";
  var sendBtn = el("button", "act act-go", "ถาม");
  bar.appendChild(camBtn); bar.appendChild(fileIn); bar.appendChild(q); bar.appendChild(sendBtn);
  card.appendChild(bar);
  root.appendChild(card);

  var pinned = null;
  camBtn.onclick = function () { fileIn.click(); };
  fileIn.onchange = function (e) {
    var f = e.target.files[0];
    if (!f || f.type.indexOf("image/") !== 0) return;
    var url = URL.createObjectURL(f);
    var im = new Image();
    im.onload = function () {
      pinned = im;
      clipImg.src = url;
      clipText.textContent = "แนบภาพแล้ว ระบบจะตรวจโรคก่อนส่งให้ AI อธิบาย";
      clip.hidden = false;
    };
    im.src = url;
  };
  clipDrop.onclick = function () { pinned = null; fileIn.value = ""; clip.hidden = true; };

  var logs = await Store.list();
  var farmContext = buildFarmContext(logs);

  async function ask() {
    var text = q.value.trim();
    if (!text && !pinned) return;

    var mine = el("div", "say say-me");
    if (pinned) {
      var pv = el("img");
      pv.src = pinned.src;
      mine.appendChild(pv);
    }
    if (text) mine.appendChild(document.createTextNode(text));
    talk.appendChild(mine);

    var shot = pinned;
    q.value = "";
    pinned = null;
    fileIn.value = "";
    clip.hidden = true;
    talk.scrollTop = talk.scrollHeight;

    var reply = el("div", "say say-ai", shot ? "กำลังตรวจภาพด้วยโมเดล" : "กำลังคิด");
    talk.appendChild(reply);
    talk.scrollTop = talk.scrollHeight;

    try {
      var cvNote = "", payload = null;
      if (shot) {
        // ตรวจด้วยโมเดลในเครื่องก่อน แล้วส่งผลไปเป็นบริบท
        // Gemini จะอธิบายต่อยอดจากผลตรวจจริง ไม่ใช่เดาจากภาพอย่างเดียว
        try {
          var res = await runFullAnalysis(shot);
          var thrC = (models.disease.props && models.disease.props.classification_threshold) || 0.6;
          if (!res.isRice) {
            cvNote = "\n\n[ผลตรวจภาพที่แนบมา: ไม่ใช่ใบข้าว หรือภาพไม่ชัดพอให้จำแนกโรค]";
            lastVision = cvNote;
          } else if (res.topDisease && res.topDisease.value >= thrC) {
            // ไม่ส่งตัวเลขความมั่นใจให้ AI แล้ว เพราะ AI มักเอาไปพูดต่อว่า "มั่นใจ 88%"
            // ซึ่งเป็นตัวเลขที่ตีความผิดได้ และเราเอาออกจากหน้าจอไปแล้วด้วย
            cvNote = "\n\n[ผลตรวจภาพที่แนบมาจากโมเดลของระบบ: เป็นใบข้าว โรคที่พบคือ " +
                     th(res.topDisease.label) + "]" + guideForPrompt(res.topDisease.label);
            lastVision = cvNote;
          } else if (res.topDisease) {
            cvNote = "\n\n[ผลตรวจภาพที่แนบมา: เป็นใบข้าว แต่โมเดลยังระบุโรคไม่ชัดเจน " +
                     "ห้ามฟันธงชื่อโรค ให้แนะนำให้ถ่ายภาพใหม่หรือปรึกษาเจ้าหน้าที่เกษตร]";
            lastVision = cvNote;
          }
        } catch (e) {
          cvNote = "\n\n[โมเดลตรวจภาพทำงานไม่สำเร็จ ให้วิเคราะห์จากภาพที่แนบมาโดยตรง]";
        }
        reply.textContent = "กำลังให้ AI อธิบายผล";
        payload = imageToBase64(shot);
      }

      // เมื่อมีภาพแนบมา ต้องระบุให้ชัดว่าภาพคือประเด็นหลัก
      // ไม่งั้น AI มักไปตอบจากบันทึกเก่าในบริบทแทน
      var focus = shot
        ? "ผู้ใช้แนบภาพใบข้าวมาด้วย ให้ตอบโดยยึดภาพที่แนบมาและผลตรวจภาพเป็นหลัก " +
          "ใช้บันทึกแปลงด้านล่างเป็นข้อมูลประกอบเท่านั้น ห้ามตอบจากบันทึกเก่าแทนภาพที่แนบมา\n\n"
        : "";

      // คำถามต่อเนื่องที่ไม่ได้แนบรูปใหม่ ให้ยึดผลตรวจของรูปเดิมไว้
      // ไม่งั้น AI จะลืมว่าเพิ่งดูรูปอะไรไป แล้วตอบกว้างๆ จนไม่มีประโยชน์
      var carry = (!shot && lastVision)
        ? "\n\nผลตรวจภาพล่าสุดในบทสนทนานี้ (ผู้ใช้ยังพูดถึงภาพนี้อยู่):" + lastVision
        : "";

      var convo = history.length
        ? "\n\nบทสนทนาก่อนหน้า:\n" + history.join("\n") + "\n"
        : "";

      // เลือกความรู้ตามเรื่องที่ถาม ครอบคลุมทุกหมวดไม่ใช่แค่ปุ๋ยกับดิน
      // ถ้าไม่ตรงหมวดไหน จะส่งสารบัญย่อไปแทน เพื่อให้ AI ชี้ทางผู้ใช้ได้
      var soilRef = knowledgeFor(text, { hasImage: !!shot });

      var prompt = "คุณเป็นผู้ช่วยเกษตรกรผู้ปลูกข้าวไทย ดูแลได้ครบทั้งโรคข้าว การเตรียมดิน " +
        "การแก้ปัญหาดิน ปุ๋ยอินทรีย์และปุ๋ยเคมี การดูแลตามระยะการเจริญเติบโต และต้นทุนการผลิต\n\n" +
        "วิธีตอบ:\n" +
        "1. ตอบภาษาไทยแบบคุยกับเกษตรกร ไม่ต้องเป็นทางการ ใช้คำง่ายๆ ไม่เกิน 5-6 ประโยค\n" +
        "2. บอกสิ่งที่ลงมือทำได้ก่อน แล้วค่อยอธิบายเหตุผลสั้นๆ\n" +
        "3. ถ้าเรื่องที่ถามมีหน้าเฉพาะในระบบ ให้บอกชื่อหน้านั้นด้วยเพื่อให้ไปดูต่อได้\n" +
        "4. ถ้าข้อมูลไม่พอตอบ ให้ถามกลับ 1 คำถามที่จะช่วยให้ตอบได้ตรงขึ้น " +
        "เช่น ข้าวอายุกี่วัน ดินเป็นแบบไหน หรือมีผลวิเคราะห์ดินไหม อย่าตอบว่าไม่ทราบเฉยๆ\n" +
        "5. ห้ามแต่งชื่อสารเคมี อัตราการใช้ สูตรปุ๋ย หรือตัวเลขใดๆ ที่ไม่มีในข้อมูลด้านล่างเด็ดขาด\n\n" +
        focus +
        "ข้อมูลแปลงนาของผู้ถาม (จากบันทึกในระบบ):\n" + farmContext + soilRef + "\n" +
        convo + carry + "\n" +
        "คำถาม: " + (text || "ช่วยดูภาพใบข้าวที่แนบมาว่าเป็นโรคอะไร และควรจัดการอย่างไร") + cvNote;

      // แนบภาพ = ให้ยึดผลจากโมเดลของระบบ ไม่ต้องค้นเว็บ
      // ไม่แนบภาพ = เป็นคำถามความรู้ทั่วไป เปิดค้นเว็บให้ข้อมูลทันสมัยขึ้น
      var answer = await Store.askGemini(prompt, payload, { search: !shot });
      reply.textContent = answer.text;
      remember("ผู้ใช้", (text || "(แนบภาพใบข้าวมาให้ดู)"));
      remember("ผู้เชี่ยวชาญ", answer.text.slice(0, 400));

      // แสดงแหล่งอ้างอิงเมื่อ AI ค้นเว็บมาตอบ
      // จำเป็นมากสำหรับงานนี้ เพราะคำแนะนำเรื่องสารเคมีที่ผิดทำให้เสียหายจริง
      // ผู้ใช้ต้องตามไปตรวจสอบต้นทางได้ ไม่ใช่เชื่อ AI ลอยๆ
      if (answer.searchUsed && answer.sources.length) {
        var srcBox = el("div", "say say-ai src-box");
        srcBox.appendChild(el("div", "src-head", "แหล่งข้อมูลที่ AI ค้นมาประกอบ"));
        answer.sources.slice(0, 4).forEach(function (sx) {
          var a = el("a", "src-link");
          a.href = sx.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = sx.title;
          srcBox.appendChild(a);
        });
        srcBox.appendChild(el("div", "src-foot",
          "AI อาจสรุปคลาดเคลื่อนจากต้นทาง ควรตรวจสอบก่อนนำไปใช้ โดยเฉพาะชื่อสารเคมีและอัตราการใช้"));
        talk.appendChild(srcBox);
      }

      // ถ้าแนบรูปแต่ Worker ไม่ได้ส่งรูปไปถึง Gemini ต้องบอกตรงๆ
      // ไม่ปล่อยให้ผู้ใช้เข้าใจผิดว่า AI ดูรูปแล้ว
      if (shot && !answer.sawImage) {
        var warn = el("div", "flash flash-bad",
          "AI ยังไม่ได้เห็นภาพที่แนบมา — เซิร์ฟเวอร์ที่ใช้อยู่เป็นเวอร์ชันเก่าที่ยังไม่รองรับรูป " +
          "คำตอบด้านบนมาจากผลตรวจของโมเดลและบันทึกแปลงเท่านั้น " +
          "แก้โดยนำโค้ด smartrice-worker.js เวอร์ชันล่าสุดไป Deploy ทับใน Cloudflare");
        warn.style.maxWidth = "87%";
        talk.appendChild(warn);
      }
    } catch (err) {
      reply.textContent = friendlyError(err.message);
    }
    talk.scrollTop = talk.scrollHeight;
  }

  sendBtn.onclick = ask;
  q.onkeydown = function (e) { if (e.key === "Enter") ask(); };
};

// ─── หน้าที่นาของฉัน ───────────────────────────
//
// รองรับ 2 แบบ เพราะที่นาจริงแทบไม่มีที่เป็นวงกลม
//   วงกลม — ปักหมุดกลางแล้วใส่รัศมี เร็วที่สุด ใช้ประเมินคร่าวๆ
//   วาดขอบเขต — กดตามมุมแปลงทีละจุด ได้พื้นที่จริงตามรูปร่างแปลง
//
// พิกัดที่ล็อกไว้ถูกใช้เป็นตำแหน่งหลักของทั้งระบบ หน้าอากาศจะดึงไปใช้ด้วย
// เพื่อให้ทุกหน้าอ้างอิงจุดเดียวกัน ไม่ใช่ต่างคนต่างใช้พิกัดคนละที่
views.map = async function (root) {
  var logs = await Store.list();
  var pins = logs.filter(function (l) { return l.gps && l.gps.indexOf(",") !== -1; });

  var field = readField();
  function save() { writeField(field); }

  root.appendChild(bund("ที่นาของฉัน"));

  // ══ แผงควบคุม ══
  var ctl = plot(null);
  var head = el("div");
  head.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px";
  var info = el("div");
  info.appendChild(el("div", "plot-title", "ตำแหน่งและขนาดที่นา"));
  var infoNote = el("div", "plot-note", "");
  info.appendChild(infoNote);
  head.appendChild(info);
  var lockBtn = el("button", "act act-go act-sm", "ล็อกไว้");
  head.appendChild(lockBtn);
  ctl.appendChild(head);

  // ── เลือกวิธีวัด ──
  var modeRow = el("div");
  modeRow.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px";
  var toolRow = el("div");
  toolRow.style.cssText = "display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap";
  ctl.appendChild(modeRow);
  ctl.appendChild(toolRow);

  var areaBox = el("div");
  areaBox.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:16px;padding-top:15px;border-top:1px solid var(--rule-soft)";
  ctl.appendChild(areaBox);
  // กล่องแสดงผลการตรวจสอบ แยกจาก areaBox เพราะ areaBox เป็นกริดตัวเลข
  // ส่วนนี้เป็นข้อความเตือนที่ต้องกินความกว้างเต็มแถว
  var verifyBox = el("div");
  verifyBox.style.marginTop = "14px";
  ctl.appendChild(verifyBox);
  var msg = el("div");
  ctl.appendChild(msg);
  root.appendChild(ctl);

  // ══ พันธุ์ข้าวที่ปลูกในฤดูนี้ ══
  //
  // วางไว้หน้าเดียวกับขนาดแปลง เพราะเป็นข้อมูลประจำแปลงเหมือนกัน
  // และเป็นหน้าที่ผู้ใช้เปิดก่อนปลูกอยู่แล้วตามลำดับเมนู
  //
  // ค่านี้ไปเปลี่ยนปฏิทินในหน้าคำแนะนำการดูแลและบริบทที่ส่งให้ AI โดยตรง
  // ไม่ใช่แค่ป้ายกำกับ จึงต้องอธิบายผลของการเลือกให้ชัดตรงนี้
  if (window.CARE_GUIDE && window.CARE_GUIDE.varieties) {
    var vCard = plot("พันธุ์ข้าวที่ปลูกฤดูนี้",
      "ระบบใช้ค่านี้กำหนดปฏิทินการใส่ปุ๋ย เลือกผิดจะได้จังหวะปุ๋ยครั้งที่ 2 ผิดไปเป็นเดือน");

    var vRow = el("div");
    vRow.style.cssText = "display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap";
    var vLab = el("div");
    vLab.appendChild(el("div", "read-foot", "กลุ่มพันธุ์"));
    var vSelect = el("select");
    vSelect.style.cssText = "padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF;min-width:230px";
    window.CARE_GUIDE.varieties.forEach(function (v) {
      var o = el("option", null, v.thai + " (" + v.short + ")");
      o.value = v.key;
      vSelect.appendChild(o);
    });
    vSelect.value = fieldVariety();
    vLab.appendChild(vSelect);
    vRow.appendChild(vLab);
    vCard.appendChild(vRow);

    var vNote = el("div", "read-foot", "");
    vNote.style.marginTop = "12px";
    vCard.appendChild(vNote);

    var vWarn = el("div", "read-foot", "");
    vWarn.style.marginTop = "8px";
    vCard.appendChild(vWarn);

    function paintVariety() {
      var v = window.careVariety(vSelect.value);
      vNote.textContent = "ตัวอย่างพันธุ์: " + v.examples + " — " + v.note;
      vWarn.textContent = fieldVarietyChosen()
        ? ""
        : "ยังไม่ได้ยืนยันพันธุ์ ระบบใช้ค่าเริ่มต้นเป็นข้าวไวต่อช่วงแสงไปก่อน ถ้าปลูกนาปรังให้เปลี่ยนแล้วกดบันทึก";
    }

    var vSave = el("button", "act act-go act-sm", "บันทึกพันธุ์");
    vSave.onclick = function () {
      setFieldVariety(vSelect.value);
      field = readField();
      paintVariety();
      vSave.textContent = "บันทึกแล้ว";
      setTimeout(function () { vSave.textContent = "บันทึกพันธุ์"; }, 1600);
    };
    vRow.appendChild(vSave);

    vSelect.onchange = paintVariety;
    paintVariety();
    root.appendChild(vCard);

    // ══ ชื่อพันธุ์และวันหว่าน — ปฏิทินที่คำนวณวันจริงให้ ══
    //
    // แยกเป็นการ์ดต่างหากจากการเลือกกลุ่ม เพราะเป็นข้อมูลเสริมที่ไม่บังคับ
    // ผู้ใช้ที่ไม่รู้ชื่อพันธุ์ต้องยังใช้ระบบได้ด้วยการเลือกแค่กลุ่มด้านบน
    if (window.VARIETY_GUIDE) {
      var cCard = plot("ปฏิทินแปลงนา",
        "เลือกชื่อพันธุ์และกรอกวันหว่าน ระบบจะคำนวณวันใส่ปุ๋ยครั้งที่ 2 วันออกดอก และวันเก็บเกี่ยวให้");

      var cRow = el("div");
      cRow.style.cssText = "display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap";

      var kBox = el("div");
      kBox.appendChild(el("div", "read-foot", "ชื่อพันธุ์"));
      var kSel = el("select");
      kSel.style.cssText = "padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF;min-width:230px";
      var oNone = el("option", null, "ยังไม่ระบุพันธุ์");
      oNone.value = "";
      kSel.appendChild(oNone);
      // จัดกลุ่มในเมนูให้เห็นชัดว่าพันธุ์ไหนอยู่กลุ่มไหน
      // เพราะผู้ใช้จำนวนมากไม่รู้ว่าพันธุ์ที่ตัวเองปลูกไวต่อช่วงแสงหรือไม่
      [["photo", "ไวต่อช่วงแสง (นาปี)"], ["nonphoto", "ไม่ไวต่อช่วงแสง (นาปรัง)"]].forEach(function (g) {
        var grp = document.createElement("optgroup");
        grp.label = g[1];
        window.VARIETY_GUIDE.varieties
          .filter(function (v) { return (g[0] === "photo") === !!v.photo; })
          .forEach(function (v) {
            var o = el("option", null, v.thai + " (" + v.grain + ")");
            o.value = v.key;
            grp.appendChild(o);
          });
        kSel.appendChild(grp);
      });
      kSel.value = fieldVarietyKey() || "";
      kBox.appendChild(kSel);
      cRow.appendChild(kBox);

      var dBox = el("div");
      dBox.appendChild(el("div", "read-foot", "วันหว่าน หรือวันปักดำ"));
      var dIn = el("input");
      dIn.type = "date";
      dIn.style.cssText = "padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF";
      var sd = fieldSowDate();
      if (sd) dIn.value = sd.toISOString().slice(0, 10);
      dBox.appendChild(dIn);
      cRow.appendChild(dBox);

      var cSave = el("button", "act act-go act-sm", "คำนวณปฏิทิน");
      cRow.appendChild(cSave);
      cCard.appendChild(cRow);

      var cOut = el("div");
      cOut.style.marginTop = "14px";
      cCard.appendChild(cOut);

      function paintCal() {
        cOut.innerHTML = "";
        var k = kSel.value;
        if (!k) {
          cOut.appendChild(el("div", "read-foot",
            "ยังไม่ได้เลือกพันธุ์ ระบบจะใช้คำแนะนำระดับกลุ่มแทน ซึ่งบอกหลักการได้แต่บอกวันที่ไม่ได้"));
          return;
        }
        var v = window.findVariety(k);
        if (!dIn.value) {
          cOut.appendChild(el("div", "flash flash-warn",
            v.photo
              ? "กรอกวันหว่านเพื่อให้ระบบเลือกฤดูให้ถูกและเตือนได้ถ้าหว่านช้าเกินไป"
              : "พันธุ์นี้ออกดอกตามอายุ ต้องกรอกวันหว่านก่อนจึงจะคำนวณวันที่ได้"));
        } else {
          var cal = window.varietyCalendar(k, new Date(dIn.value));
          if (cal) {
            var g = el("div", "row-3");
            [["ใส่ปุ๋ยครั้งที่ 2", cal.text.fert2, "ระยะกำเนิดช่อดอก"],
             ["ข้าวออกดอก", cal.text.bloom, "ห้ามให้ขาดน้ำช่วงนี้"],
             ["เก็บเกี่ยว", cal.text.harvest, "ระบายน้ำก่อน 7-10 วัน"]
            ].forEach(function (c) {
              var b = el("div");
              b.appendChild(readOut(c[0], c[1], c[2]));
              g.appendChild(b);
            });
            cOut.appendChild(g);

            // อายุข้าว ณ วันใส่ปุ๋ย เป็นตัวเลขที่พิสูจน์ว่าทำไมสูตร "45-50 วัน" ใช้ไม่ได้ทุกพันธุ์
            // แสดงให้เห็นชัดๆ ดีกว่าอธิบายเป็นข้อความยาว
            cOut.appendChild(el("div", "read-foot",
              "ณ วันใส่ปุ๋ยครั้งที่ 2 ข้าวจะมีอายุประมาณ " + cal.ageAtFert2 + " วัน" +
              (v.photo && cal.ageAtFert2 > 60
                ? " — สังเกตว่ามากกว่าสูตร 45-50 วันที่ใช้กับนาปรังอยู่มาก ถ้าใส่ตามสูตรนั้นจะเร็วเกินไปเกือบ " +
                  (cal.ageAtFert2 - 47) + " วัน"
                : "")));
            cOut.appendChild(el("div", "read-foot",
              "รวมอายุตั้งแต่หว่านถึงเก็บเกี่ยวประมาณ " + cal.totalDays + " วัน"));
          }
        }

        // ข้อมูลพันธุ์ที่มีผลกับการตัดสินใจจริง วางไว้ใต้ปฏิทิน
        cOut.appendChild(el("div", "read-foot",
          "ผลผลิตอ้างอิง " + v["yield"] + " กก./ไร่ · สูงประมาณ " + v.height + " ซม. · แนะนำปลูกใน" + v.region));
        if (v.weakDisease && v.weakDisease.length) {
          cOut.appendChild(el("div", "flash flash-warn",
            "พันธุ์นี้ไม่ต้านทานโรค: " + v.weakDisease.join(", ") +
            (v.weakPest && v.weakPest.length ? " และไม่ต้านทาน: " + v.weakPest.join(", ") : "") +
            " — ถ้าระบบตรวจพบโรคเหล่านี้จากภาพ ให้เชื่อผลมากขึ้นและรีบจัดการ"));
        }
        if (v.note) cOut.appendChild(el("div", "read-foot", v.note));
        cOut.appendChild(el("div", "read-foot",
          "วันที่ทั้งหมดเป็นค่าประมาณ เลื่อนได้หลายวันตามอากาศและพื้นที่ " +
          "วิธียืนยันที่แม่นที่สุดคือผ่าลำต้นดู ถ้าเห็นช่อดอกอ่อนสีขาว 1-2 มิลลิเมตรในกาบใบ นั่นคือจังหวะใส่ปุ๋ยจริง"));
      }

      cSave.onclick = function () {
        setFieldVarietyKey(kSel.value || null);
        setFieldSowDate(dIn.value || null);
        field = readField();
        paintCal();
        paintVariety();
        vSelect.value = fieldVariety();
        cSave.textContent = "บันทึกแล้ว";
        setTimeout(function () { cSave.textContent = "คำนวณปฏิทิน"; }, 1600);
      };
      kSel.onchange = paintCal;
      dIn.onchange = paintCal;
      paintCal();
      root.appendChild(cCard);
    }
  }

  // ══ พื้นที่ตามเอกสารสิทธิ์ ══
  //
  // วางไว้ก่อนแผนที่โดยตั้งใจ เพราะอยากให้ผู้ใช้กรอกก่อนไปวาดขอบเขต
  // ถ้ากรอกทีหลังจะกลายเป็นการ "ปรับตัวเลขให้ตรงกับที่วาดไปแล้ว" ซึ่งเสียจุดประสงค์
  // การตรวจสอบที่มีค่าคือการที่สองค่ามาจากคนละแหล่งโดยไม่รู้กันมาก่อน
  var deedCard = plot("พื้นที่ตามโฉนด",
    "กรอกพื้นที่ที่ระบุในโฉนดหรือใบขึ้นทะเบียนเกษตรกร ระบบจะใช้เทียบว่าขอบเขตที่วาดบนแผนที่ตรงกับแปลงจริงหรือไม่");

  var dRow = el("div");
  dRow.style.cssText = "display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap";
  var deedNow = readDeed();
  var dInputs = {};
  [["rai", "ไร่", 0], ["ngan", "งาน", 0], ["wa", "ตารางวา", 0]].forEach(function (u) {
    var b = el("div");
    b.appendChild(el("div", "read-foot", u[1]));
    var i = el("input");
    i.type = "number";
    i.min = "0";
    i.step = u[0] === "wa" ? "0.1" : "1";
    i.style.cssText = "padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF;width:100px";
    if (deedNow) i.value = deedNow[u[0]];
    dInputs[u[0]] = i;
    b.appendChild(i);
    dRow.appendChild(b);
  });

  var dSave = el("button", "act act-go act-sm", "บันทึกพื้นที่");
  var dFoot = el("div", "read-foot", "");
  dFoot.style.marginTop = "10px";

  dSave.onclick = function () {
    setDeed(
      parseFloat(dInputs.rai.value) || 0,
      parseFloat(dInputs.ngan.value) || 0,
      parseFloat(dInputs.wa.value) || 0
    );
    field = readField();
    var d = readDeed();
    dFoot.textContent = d
      ? "บันทึกแล้ว รวม " + Math.round(d.sqm).toLocaleString("th-TH") + " ตารางเมตร"
      : "ล้างค่าแล้ว ระบบจะไม่เทียบพื้นที่";
    draw();
  };
  dRow.appendChild(dSave);
  deedCard.appendChild(dRow);
  deedCard.appendChild(dFoot);
  deedCard.appendChild(el("div", "read-foot",
    "หน่วยไทย: 1 ไร่ = 4 งาน = 400 ตารางวา = 1,600 ตารางเมตร · " +
    "ถ้ามีเฉพาะตัวเลขไร่ กรอกช่องแรกช่องเดียวก็พอ"));
  root.appendChild(deedCard);

  var mapCard = plot(null);
  var canvasHost = el("div");
  canvasHost.id = "map";
  mapCard.appendChild(canvasHost);
  root.appendChild(mapCard);

  // ══ แผนที่ ══
  var center = field ? [field.lat, field.lon]
             : pins.length ? pins[0].gps.split(",").map(Number)
             : [15.87, 100.99];
  var map = L.map("map").setView(center, field ? 16 : pins.length ? 12 : 6);

  // ภาพถ่ายดาวเทียมช่วยให้เห็นขอบแปลงจริง วาดขอบเขตได้แม่นกว่าแผนที่เส้น
  var streets = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap", maxZoom: 19
  });
  var sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    attribution: "Esri World Imagery", maxZoom: 19
  });
  sat.addTo(map);
  L.control.layers({ "ภาพถ่ายดาวเทียม": sat, "แผนที่เส้น": streets }, null, { position: "topright" }).addTo(map);

  pins.forEach(function (p) {
    var c = p.gps.split(",").map(Number);
    L.circleMarker(c, { radius: 5, color: "#7C9385", fillColor: "#C8E6C9", fillOpacity: .8, weight: 1.5 })
      .addTo(map).bindPopup(p.date + "<br>" + p.disease);
  });

  var layers = [];
  function clearLayers() {
    layers.forEach(function (l) { map.removeLayer(l); });
    layers = [];
  }

  function showArea(sqm, extra) {
    var a = raiFromSqm(sqm);
    areaBox.innerHTML = "";
    areaBox.appendChild(readOut("พื้นที่", a.rai.toFixed(2) + " ไร่", a.text));
    areaBox.appendChild(readOut("ตารางเมตร", Math.round(sqm).toLocaleString("th-TH"), extra || ""));
    if (field && field.lat != null) {
      areaBox.appendChild(readOut("พิกัดกลางแปลง", field.lat.toFixed(5), field.lon.toFixed(5)));
    }

    // ── ผลการเทียบกับเอกสารสิทธิ์ ──
    // วางไว้ติดกับตัวเลขพื้นที่โดยตั้งใจ เพราะสองอย่างนี้ต้องอ่านคู่กันเสมอ
    // ตัวเลขพื้นที่ที่ไม่มีอะไรยืนยันคือตัวเลขที่เชื่อไม่ได้
    verifyBox.innerHTML = "";
    var chk = deedCheck(sqm);
    if (chk) {
      verifyBox.appendChild(el("div",
        chk.level === "ok" ? "flash flash-ok" : chk.level === "warn" ? "flash flash-warn" : "flash flash-bad",
        chk.text));
      verifyBox.appendChild(el("div", "read-foot",
        "พื้นที่ตามเอกสาร " + chk.deedText + " (" + Math.round(chk.deedSqm).toLocaleString("th-TH") + " ตร.ม.)"));
    } else if (readDeed() === null) {
      verifyBox.appendChild(el("div", "read-foot",
        "ยังไม่ได้กรอกพื้นที่ตามโฉนด ถ้ากรอกไว้ ระบบจะเทียบให้ทันทีว่าขอบเขตที่วาดตรงกับแปลงจริงหรือไม่"));
    }

    // ระดับความน่าเชื่อถือของพิกัด
    var fm = field && field.fixMethod && FIX_METHODS[field.fixMethod];
    if (fm) {
      var line = el("div", "read-foot",
        "พิกัดนี้ได้มาจาก: " + fm.thai + " — " + fm.note +
        (field.accuracy != null ? " · ความแม่นยำขณะบันทึก ±" + field.accuracy + " เมตร" : "") +
        (field.fixedAt ? " · บันทึกเมื่อ " + ageWords(field.fixedAt) : ""));
      line.style.marginTop = "8px";
      verifyBox.appendChild(line);
    }
  }

  function draw() {
    clearLayers();
    var locked = field && field.locked;

    if (!field || (field.mode === "poly" && (!field.points || field.points.length < 3) && field.lat == null)) {
      areaBox.innerHTML = "";
      areaBox.appendChild(readOut("พื้นที่", "—", "ยังไม่ได้กำหนดแปลง"));
    }

    if (field && field.mode === "poly") {
      var pts = field.points || [];
      pts.forEach(function (pt, i) {
        var mk = L.circleMarker(pt, {
          radius: 7, color: "#FFFFFF", weight: 2,
          fillColor: locked ? "#1B5E3A" : "#2E8B57", fillOpacity: 1
        }).addTo(map).bindTooltip("มุมที่ " + (i + 1));
        layers.push(mk);
      });
      if (pts.length >= 3) {
        var poly = L.polygon(pts, {
          color: locked ? "#1B5E3A" : "#2E8B57",
          fillColor: "#6FBF73", fillOpacity: .28, weight: 2,
          dashArray: locked ? null : "6 5"
        }).addTo(map);
        layers.push(poly);
        var sqm = polygonArea(pts);
        var c = centroid(pts);
        field.lat = c[0]; field.lon = c[1];
        showArea(sqm, "จาก " + pts.length + " มุมที่ปักไว้");
      } else if (pts.length) {
        areaBox.innerHTML = "";
        areaBox.appendChild(readOut("พื้นที่", "—", "ปักครบ 3 มุมขึ้นไปจึงจะคำนวณได้ ตอนนี้มี " + pts.length));
      }
      infoNote.textContent = locked
        ? "ล็อกไว้แล้ว เปิดจากที่ไหนก็เห็นแปลงเดิม"
        : "กดบนแผนที่ตามมุมแปลงทีละจุด อย่างน้อย 3 มุม แล้วกดล็อกไว้";

    } else if (field && field.lat != null) {
      var r = clampRadius(field.radius);
      field.radius = r;
      var mk2 = L.marker([field.lat, field.lon], { draggable: !locked }).addTo(map);
      var ci = L.circle([field.lat, field.lon], {
        radius: r, color: locked ? "#1B5E3A" : "#2E8B57",
        fillColor: "#6FBF73", fillOpacity: .2, weight: 2,
        dashArray: locked ? null : "6 5"
      }).addTo(map);
      layers.push(mk2); layers.push(ci);
      mk2.on("dragend", function (e) {
        var ll = e.target.getLatLng();
        field.lat = ll.lat; field.lon = ll.lng;
        save(); draw();
      });
      showArea(Math.PI * r * r, "รัศมี " + r + " เมตร");
      infoNote.textContent = locked
        ? "ล็อกไว้แล้ว เปิดจากที่ไหนก็เห็นแปลงเดิม"
        : "ลากหมุดปรับตำแหน่งได้ หรือกดบนแผนที่เพื่อย้าย";
    } else {
      infoNote.textContent = "เลือกวิธีวัดด้านล่าง แล้วกดบนแผนที่ตรงที่นาของคุณ";
    }

    lockBtn.disabled = !field || (field.mode === "poly" ? (field.points || []).length < 3 : field.lat == null);
    lockBtn.textContent = locked ? "ปลดล็อกเพื่อแก้ไข" : "ล็อกไว้";
    lockBtn.className = "act act-sm " + (locked ? "act-line" : "act-go");
    save();
  }

  function paintTools() {
    modeRow.innerHTML = "";
    [["circle", "วงกลม", "ปักจุดกลาง ใส่รัศมี"],
     ["poly", "วาดขอบเขตแปลง", "กดตามมุมแปลง ได้พื้นที่จริง"]].forEach(function (m) {
      var on = field && field.mode === m[0];
      var b = el("button", "act act-sm " + (on ? "act-go" : "act-line"));
      b.appendChild(document.createTextNode(m[1]));
      var sub = el("span", "", " · " + m[2]);
      sub.style.opacity = ".72";
      b.appendChild(sub);
      b.onclick = function () {
        if (field && field.locked) { warnLocked(); return; }
        field = field || { mode: m[0], radius: 100, points: [] };
        field.mode = m[0];
        if (m[0] === "poly" && !field.points) field.points = [];
        save(); paintTools(); draw();
      };
      modeRow.appendChild(b);
    });

    toolRow.innerHTML = "";
    if (field && field.mode === "poly") {
      var undo = el("button", "act act-line act-sm", "ลบมุมล่าสุด");
      undo.onclick = function () {
        if (field.locked) { warnLocked(); return; }
        (field.points || []).pop();
        save(); draw();
      };
      var clr = el("button", "act act-line act-sm", "ล้างทั้งหมด");
      clr.onclick = function () {
        if (field.locked) { warnLocked(); return; }
        field.points = [];
        save(); draw();
      };
      toolRow.appendChild(undo);
      toolRow.appendChild(clr);
    } else {
      var fR = el("div", "inp");
      fR.style.cssText = "flex:1;min-width:150px";
      fR.appendChild(el("label", "", "รัศมี (เมตร)"));
      var rIn = el("input");
      rIn.className = "num-in";
      rIn.inputMode = "numeric";
      rIn.value = String(field && field.radius ? field.radius : 100);
      rIn.oninput = function () {
        if (!field || field.locked) return;
        field.radius = clampRadius(parseInt(rIn.value, 10));
        save(); draw();
      };
      fR.appendChild(rIn);
      toolRow.appendChild(fR);
    }

    var hereBtn = el("button", "act act-line act-sm", "ใช้ตำแหน่งปัจจุบัน");
    hereBtn.onclick = async function () {
      if (field && field.locked) { warnLocked(); return; }
      hereBtn.textContent = "กำลังหาตำแหน่ง";
      hereBtn.disabled = true;
      msg.innerHTML = "";
      try {
        var fix = await getFix();
        field = field || { mode: "circle", radius: 100, points: [] };
        if (field.mode === "poly") {
          field.points = (field.points || []).concat([[fix.lat, fix.lon]]);
        } else {
          field.lat = fix.lat; field.lon = fix.lon;
        }
        // จำไว้ว่าพิกัดชุดนี้วัดเมื่อไหร่และแม่นแค่ไหน
        // ทุกหน้าที่ใช้พิกัดแปลงจะได้บอกผู้ใช้ได้ว่ากำลังอ้างอิงข้อมูลเก่าแค่ไหน
        field.fixedAt = fix.at;
        field.accuracy = Math.round(fix.accuracy);
        field.fixMethod = "single";
        save();
        map.setView([fix.lat, fix.lon], 17);
        draw();
        var n = accuracyNote(fix.accuracy);
        msg.appendChild(el("div", n.ok ? "flash flash-ok" : "flash flash-warn", n.text));
      } catch (err) {
        msg.appendChild(el("div", "flash flash-bad", err.message));
      }
      hereBtn.textContent = "ใช้ตำแหน่งปัจจุบัน";
      hereBtn.disabled = false;
    };
    toolRow.appendChild(hereBtn);

    // ══ ปุ่มเดินรอบแปลง ══
    //
    // แม่นที่สุดในบรรดาวิธีที่มี และมีคุณสมบัติที่วิธีอื่นไม่มีเลย
    // คือทำได้เฉพาะคนที่เดินอยู่ในแปลงจริงเท่านั้น นั่งที่บ้านทำไม่ได้
    // จึงเป็นทั้งเครื่องมือวัดและหลักฐานยืนยันว่าเคยไปที่แปลงจริงในตัวเดียวกัน
    var walkBtn = el("button", "act act-line act-sm", "เดินรอบแปลง");
    var walking = false, walkId = null, walkPts = [], walkLine = null, walkStat = null;

    function stopWalk(save_) {
      if (walkId != null) navigator.geolocation.clearWatch(walkId);
      walkId = null; walking = false;
      walkBtn.textContent = "เดินรอบแปลง";
      walkBtn.className = "act act-line act-sm";
      if (walkLine) { map.removeLayer(walkLine); walkLine = null; }

      if (save_ && walkPts.length >= 3) {
        field = field || { radius: 100 };
        field.mode = "poly";
        field.points = walkPts.slice();
        setFixMethod("walk");
        field = readField();
        save();
        paintTools();
        draw();
        msg.innerHTML = "";
        msg.appendChild(el("div", "flash flash-ok",
          "บันทึกขอบเขตจากการเดินรอบแปลงแล้ว ได้ " + walkPts.length + " จุด"));
      } else if (save_) {
        msg.innerHTML = "";
        msg.appendChild(el("div", "flash flash-warn",
          "เก็บจุดได้เพียง " + walkPts.length + " จุด ซึ่งไม่พอสร้างรูปแปลง ต้องได้อย่างน้อย 3 จุด"));
      }
      walkPts = [];
      if (walkStat) { walkStat.remove(); walkStat = null; }
    }

    walkBtn.onclick = function () {
      if (field && field.locked) { warnLocked(); return; }
      if (walking) { stopWalk(true); return; }
      if (!navigator.geolocation) {
        msg.innerHTML = "";
        msg.appendChild(el("div", "flash flash-bad", "อุปกรณ์นี้ไม่รองรับการหาตำแหน่ง"));
        return;
      }

      walking = true;
      walkPts = [];
      walkBtn.textContent = "หยุดและบันทึก";
      walkBtn.className = "act act-go act-sm";
      msg.innerHTML = "";
      walkStat = el("div", "flash flash-warn",
        "กำลังเก็บเส้นทาง เดินตามคันนารอบแปลงให้ครบรอบ แล้วกดหยุดและบันทึก");
      msg.appendChild(walkStat);

      walkId = navigator.geolocation.watchPosition(function (pos) {
        var lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy;

        // ── ตัวกรอง 2 ชั้น สำคัญมาก ไม่งั้นได้ขยะ ──
        //
        // ชั้นแรก ทิ้งจุดที่ความแม่นยำแย่กว่า 20 เมตร เพราะจุดพวกนั้นมาจาก
        // เสาสัญญาณไม่ใช่ดาวเทียม เอามาวาดขอบแปลงจะเพี้ยนไปเป็นสิบเมตร
        //
        // ชั้นที่สอง ทิ้งจุดที่ห่างจากจุดก่อนหน้าน้อยกว่า 3 เมตร เพราะคนเดิน
        // มักหยุดยืนคุยหรือดูของกลางทาง ถ้าไม่กรองจะได้จุดกระจุกเป็นก้อนใหญ่
        // ทำให้รูปแปลงบิดเบี้ยวตรงจุดที่หยุด และไฟล์บวมโดยไม่ได้ข้อมูลเพิ่ม
        if (acc > 20) {
          walkStat.textContent = "สัญญาณยังหยาบ (±" + Math.round(acc) +
            " เมตร) กำลังรอให้จับดาวเทียมได้ดีขึ้น · เก็บได้ " + walkPts.length + " จุด";
          return;
        }
        if (walkPts.length) {
          var last = walkPts[walkPts.length - 1];
          if (metersBetween(last[0], last[1], lat, lon) < 3) return;
        }

        walkPts.push([lat, lon]);
        if (walkLine) map.removeLayer(walkLine);
        walkLine = L.polyline(walkPts, { color: "#B8860B", weight: 3, dashArray: "5 4" }).addTo(map);
        map.setView([lat, lon]);

        var live = walkPts.length >= 3 ? raiFromSqm(polygonArea(walkPts)) : null;
        walkStat.textContent = "เก็บได้ " + walkPts.length + " จุด · ความแม่นยำ ±" +
          Math.round(acc) + " เมตร" +
          (live ? " · พื้นที่ตอนนี้ประมาณ " + live.rai.toFixed(2) + " ไร่" : " · เดินต่อจนครบ 3 จุดขึ้นไป");
      }, function (e) {
        walkStat.className = "flash flash-bad";
        walkStat.textContent = e && e.code === 1
          ? "ยังไม่ได้อนุญาตให้เข้าถึงตำแหน่ง"
          : "หาสัญญาณไม่ได้ ลองออกไปที่โล่ง";
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    };
    toolRow.appendChild(walkBtn);
  }

  function warnLocked() {
    msg.innerHTML = "";
    msg.appendChild(el("div", "flash flash-warn", "ต้องปลดล็อกก่อนจึงจะแก้ไขได้"));
  }

  map.on("click", function (e) {
    if (!field) field = { mode: "circle", radius: 100, points: [] };
    if (field.locked) return;
    if (field.mode === "poly") {
      field.points = (field.points || []).concat([[e.latlng.lat, e.latlng.lng]]);
    } else {
      field.lat = e.latlng.lat; field.lon = e.latlng.lng;
    }

    // แตะบนแผนที่ทำได้จากที่ไหนก็ได้ จึงเป็นระดับความน่าเชื่อถือต่ำสุด
    // ต้องบันทึกตามจริง ไม่ใช่ปล่อยให้ดูเหมือนกับพิกัดที่ได้จากการยืนในแปลง
    //
    // ตั้งค่าบน field โดยตรง ไม่ใช่เขียนลง storage แยก
    // เพราะ save() ด้านล่างเขียน field ทับทั้งก้อน ถ้าเขียนแยกจะถูกลบทันที
    field.fixMethod = "tap";
    field.fixedAt = Date.now();
    delete field.accuracy;

    save(); draw();
  });

  lockBtn.onclick = function () {
    if (!field) return;
    field.locked = !field.locked;
    save(); paintTools(); draw();
    msg.innerHTML = "";
    msg.appendChild(el("div", "flash " + (field.locked ? "flash-ok" : "flash-warn"),
      field.locked
        ? "ล็อกแล้ว หน้าอากาศและหน้าอื่นจะใช้พิกัดนี้เป็นตำแหน่งแปลงของคุณ"
        : "ปลดล็อกแล้ว แก้ไขตำแหน่งและขอบเขตได้"));
  };

  paintTools();
  draw();
};
