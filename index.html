<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartRice AI — ระบบวินิจฉัยโรคข้าวและติดตามแปลงนา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    /* ══ จานสี "นาข้าวเช้าตรู่" — เขียว ขาว เขียวอ่อน ══
       พื้นขาวอมเขียวจางๆ แทนขาวล้วน เพราะขาวบริสุทธิ์บนจอกลางแดด
       จะสะท้อนจ้าจนแสบตา และทำให้ภาพใบข้าวที่อัปโหลดดูอมฟ้าผิดจากสีจริง
       ไล่ระดับเขียวจากอ่อนไปเข้ม 3 ชั้น เพื่อให้แยกพื้นหน้า/การ์ด/แถบเมนูได้
       โดยไม่ต้องพึ่งเส้นขอบหนาหรือเงาเข้ม */
    --mist:     #F4F9F2;  /* หมอกเช้าเหนือนา — พื้นหลังหน้า */
    --paper:    #FFFFFF;  /* พื้นการ์ด */
    --paper-up: #F0F7EE;  /* การ์ดตอนชี้ / แถบอ่อน */
    --canopy:   #EAF4E6;  /* เขียวอ่อนสุด ใช้เป็นพื้นรอง */

    /* สีสถานะ ใช้ความหมายเดียวกันทั้งระบบ ห้ามสลับ
       เขียว = ปกติ | ทอง = เฝ้าระวัง | แดงอิฐ = ต้องจัดการ | ฟ้า = ข้อมูลกลาง
       ทุกสีเลือกให้ผ่านเกณฑ์ contrast กับพื้นขาวเมื่อใช้เป็นสีตัวอักษร */
    --deep:     #1B5E3A;  /* เขียวเข้มสุด — แถบเมนู หัวข้อ ปุ่มหลัก */
    --blade:    #2E8B57;  /* ใบข้าวเขียวสมบูรณ์ — สีหลัก */
    --sprout:   #6FBF73;  /* ต้นกล้าอ่อน — สีเน้น */
    --leaf-pale:#C8E6C9;  /* เขียวอ่อน — พื้นป้ายและแถบ */
    --grain:    #B8860B;  /* รวงข้าวสุก — เฝ้าระวัง */
    --rust:     #B0472F;  /* สีแผลโรคบนใบ — อันตราย */
    --water:    #2E7D95;  /* น้ำสะท้อนฟ้า — ข้อมูลกลาง */

    /* ชื่อเดิม คงไว้ให้กฎ CSS ชุดเก่าใช้ต่อได้โดยไม่ต้องไล่แก้ทีละจุด */
    --husk:     var(--mist);
    --flood:    var(--deep);
    --flood-up: #24734A;

    --ink:      #17301F;  /* ตัวอักษรหลัก เขียวเข้มเกือบดำ ไม่ใช่ดำสนิท */
    --ink-soft: #4A6353;
    --ink-faint:#7C9385;

    --rule:     #D3E6D6;  /* เส้นคันนา */
    --rule-soft:#E6F1E7;

    --tint-ok:   #E8F5E9;
    --tint-warn: #FDF6E3;
    --tint-bad:  #FBEAE5;

    --f-display: 'IBM Plex Sans Thai', sans-serif;
    --f-body: 'IBM Plex Sans Thai', sans-serif;
    --f-data: 'IBM Plex Mono', monospace;

    --r: 14px;
    --r-sm: 10px;
    --rail-w: 236px;

    /* เงาบนพื้นสว่างต้องนุ่มและอมเขียว ไม่ใช่เงาเทาดำ
       ไม่งั้นการ์ดจะดูเหมือนลอยอยู่คนละที่กับพื้นหลัง */
    --lift: 0 1px 2px rgba(27,94,58,.05), 0 8px 24px rgba(27,94,58,.07);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--f-body);
    font-size: 15px;
    color: var(--ink);
    background: var(--husk);
    line-height: 1.65;
  }
  h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; }
  a { color: var(--blade); }
  :focus-visible { outline: 2px solid var(--blade); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .num { font-family: var(--f-data); font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  /* ─── โครงหน้า ─────────────────────────────── */
  .shell { display: flex; min-height: 100vh; }

  .rail {
    width: var(--rail-w); flex-shrink: 0; background: var(--flood);
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .mark { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.09); }
  .mark-name {
    font-family: var(--f-display); font-weight: 600; font-size: 1.12rem;
    color: #F2EBDD; letter-spacing: -.015em; display: flex; align-items: center; gap: 9px;
  }
  .mark-sub {
    font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
    color: #7E9587; margin-top: 5px; padding-left: 30px;
  }

  .rail-nav { padding: 12px 10px; flex: 1; }
  .rail-item {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 9px 12px 9px 13px; margin-bottom: 1px; background: none;
    border: none; border-left: 2px solid transparent;
    color: #A8BBAD; font-size: .875rem; text-align: left;
    transition: color .14s, background .14s;
  }
  .rail-item:hover { color: #F2EBDD; background: rgba(255,255,255,.05); }
  .rail-item.on {
    color: #FBF8F1; background: rgba(143,176,92,.14);
    border-left-color: var(--sprout); font-weight: 500;
  }
  .rail-item svg { flex-shrink: 0; opacity: .85; }
  .rail-item.on svg { opacity: 1; }

  .rail-foot {
    padding: 14px 20px 18px; border-top: 1px solid rgba(255,255,255,.09);
    font-size: .7rem; color: #6E8375; line-height: 1.5;
  }
  .rail-foot .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; background: #6E8375; }
  .rail-foot .dot.live { background: var(--sprout); }
  .rail-foot .dot.down { background: var(--rust); }

  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .bar {
    display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
    padding: 20px clamp(18px,3vw,36px) 16px;
    border-bottom: 1px solid var(--rule);
    background: var(--husk);
  }
  .bar-title { font-size: 1.5rem; line-height: 1.25; }
  .bar-kicker {
    font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 3px;
  }
  .bar-tools { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .seek {
    display: flex; align-items: center; gap: 7px;
    background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r);
    padding: 6px 12px;
  }
  .seek input { border: none; background: none; outline: none; font-size: .84rem; width: 148px; color: var(--ink); }
  .seek input::placeholder { color: var(--ink-faint); }

  .who { display: flex; align-items: center; gap: 8px; font-size: .84rem; font-weight: 500; color: var(--ink); }
  .who-badge {
    width: 27px; height: 27px; border-radius: 50%; background: var(--flood); color: #F2EBDD;
    display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 600;
  }

  .field { padding: clamp(18px,3vw,30px) clamp(18px,3vw,36px) 72px; }

  /* ─── คันนา: เส้นแบ่งหมวด ───────────────────── */
  .bund { display: flex; align-items: center; gap: 13px; margin: 30px 0 16px; }
  .bund:first-child { margin-top: 0; }
  .bund-label {
    font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
    color: var(--ink-faint); white-space: nowrap; flex-shrink: 0;
  }
  .bund-line {
    flex: 1; height: 3px;
    background: repeating-linear-gradient(90deg, var(--rule) 0 9px, transparent 9px 15px);
  }

  /* ─── การ์ด ───────────────────────────────── */
  .plot {
    background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r);
    padding: 19px;
  }
  .plot-head { margin-bottom: 15px; }
  .plot-title { font-size: 1rem; font-weight: 600; font-family: var(--f-display); }
  .plot-note { font-size: .8rem; color: var(--ink-soft); margin-top: 2px; }

  .row-2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 15px; align-items: start; }
  .row-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 15px; }
  @media (max-width: 940px) { .row-2 { grid-template-columns: 1fr; } }

  /* ─── SIGNATURE: แปลงนามาตรวัด ──────────────── */
  .gauge-wrap { display: flex; gap: 20px; align-items: stretch; }
  .gauge {
    position: relative; width: 128px; flex-shrink: 0; min-height: 152px;
    border: 1px solid var(--rule); border-radius: var(--r);
    background: linear-gradient(180deg, #F7F2E7 0%, #EFE7D6 100%);
    overflow: hidden;
  }
  .gauge-water {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: var(--blade);
    transition: height .9s cubic-bezier(.22,.85,.3,1), background-color .3s;
  }
  .gauge-water::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: rgba(255,255,255,.55);
  }
  .gauge.warn .gauge-water { background: var(--grain); }
  .gauge.bad  .gauge-water { background: var(--rust); }
  @media (prefers-reduced-motion: reduce) { .gauge-water { transition: none; } }

  .gauge-read {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 2;
  }
  .gauge-figure { font-family: var(--f-data); font-size: 2.7rem; font-weight: 500; line-height: 1; color: var(--paper); text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .gauge-figure.dim { color: var(--ink); text-shadow: none; }
  .gauge-unit { font-size: .68rem; letter-spacing: .13em; text-transform: uppercase; color: var(--paper); opacity: .85; margin-top: 4px; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .gauge-unit.dim { color: var(--ink-faint); text-shadow: none; opacity: 1; }

  .gauge-side { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 13px; }
  .verdict-label { font-size: .7rem; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-faint); }
  .verdict-name { font-family: var(--f-display); font-size: 1.4rem; font-weight: 600; line-height: 1.25; margin-top: 3px; }
  .verdict-name.ok  { color: var(--blade); }
  .verdict-name.warn{ color: #8A6A12; }
  .verdict-name.bad { color: var(--rust); }

  /* ─── ตัวเลขวัดค่า ─────────────────────────── */
  .read-label { font-size: .7rem; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; }
  .read-value { font-family: var(--f-data); font-size: 1.65rem; font-weight: 500; line-height: 1.15; }
  .read-value.sm { font-size: 1.15rem; }
  .read-foot { font-size: .76rem; color: var(--ink-soft); margin-top: 3px; }

  /* ─── ปุ่ม ────────────────────────────────── */
  .act {
    border: 1px solid transparent; border-radius: var(--r);
    padding: 10px 20px; font-size: .88rem; font-weight: 500;
    transition: background .14s, border-color .14s, color .14s;
  }
  .act-go { background: var(--flood); color: var(--husk); }
  .act-go:hover:not(:disabled) { background: var(--flood-up); }
  .act-go:disabled { background: var(--rule); color: var(--ink-faint); cursor: not-allowed; }
  .act-line { background: none; border-color: var(--rule); color: var(--ink); }
  .act-line:hover { border-color: var(--ink-faint); background: var(--husk); }
  .act-wide { width: 100%; }
  .act-sm { padding: 6px 13px; font-size: .78rem; }

  /* ─── ฟอร์ม ──────────────────────────────── */
  .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  @media (max-width: 600px) { .inputs { grid-template-columns: 1fr; } }
  .inp label { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; }
  .inp input {
    width: 100%; padding: 9px 12px; border: 1px solid var(--rule); border-radius: var(--r);
    background: var(--paper); color: var(--ink);
  }
  .inp input:focus { border-color: var(--blade); outline: none; }
  .inp input[readonly] { background: var(--husk); color: var(--ink-soft); }
  .inp .num-in { font-family: var(--f-data); }

  /* ─── รับภาพ ─────────────────────────────── */
  .intake {
    border: 1px dashed var(--rule); border-radius: var(--r);
    padding: 30px 18px; text-align: center; cursor: pointer;
    background: var(--husk); transition: border-color .14s, background .14s;
  }
  .intake:hover, .intake.over { border-color: var(--blade); background: var(--tint-ok); }
  .intake-lead { font-weight: 500; font-size: .93rem; }
  .intake-hint { font-size: .8rem; color: var(--ink-soft); margin-top: 3px; }
  .hidden-file { display: none; }

  .shot { margin-top: 14px; position: relative; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
  .shot img { display: block; width: 100%; max-height: 290px; object-fit: contain; background: var(--husk); }
  .sweep { position: absolute; inset: 0; pointer-events: none; background: rgba(20,53,44,.07); }
  .sweep-line { position: absolute; left: 0; right: 0; height: 2px; top: 0; background: var(--sprout); box-shadow: 0 0 14px 3px rgba(143,176,92,.55); }
  @media (prefers-reduced-motion: no-preference) {
    .sweep-line { animation: sweep 1.5s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes sweep { 0% { top: 0; } 100% { top: 100%; } }
  }

  /* ─── แถบผลจำแนก ─────────────────────────── */
  .verdict-src { font-size: .76rem; color: var(--ink-soft); margin-bottom: 11px; padding-bottom: 9px; border-bottom: 1px solid var(--rule-soft); }
  .bar-row { display: grid; grid-template-columns: minmax(104px,auto) 1fr 50px; align-items: center; gap: 11px; padding: 7px 0; }
  .bar-row + .bar-row { border-top: 1px solid var(--rule-soft); }
  .bar-name { font-size: .87rem; color: var(--ink-soft); }
  .bar-row.lead .bar-name { color: var(--ink); font-weight: 600; }
  .bar-track { height: 6px; background: var(--rule-soft); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--ink-faint); border-radius: 99px; }
  .bar-row.lead .bar-fill { background: var(--blade); }
  .bar-pct { font-family: var(--f-data); font-size: .84rem; text-align: right; color: var(--ink-faint); }
  .bar-row.lead .bar-pct { color: var(--ink); font-weight: 500; }

  /* ─── สัดส่วนสี ──────────────────────────── */
  .mix { display: flex; height: 7px; border-radius: 99px; overflow: hidden; background: var(--rule-soft); }
  .mix-key { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 9px; font-size: .77rem; color: var(--ink-soft); }
  .mix-key b { font-family: var(--f-data); font-weight: 500; color: var(--ink); }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  /* ─── ใบสั่งการรักษา ─────────────────────── */
  .rx { margin-top: 18px; border: 1px solid var(--rule); border-left: 3px solid var(--blade); border-radius: 0; background: var(--tint-ok); padding: 17px 19px; }
  .rx.warn { border-left-color: var(--grain); background: var(--tint-warn); }
  .rx.bad  { border-left-color: var(--rust);  background: var(--tint-bad); }
  .rx-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .rx-name { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; }
  .rx-flag { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
  .rx-flag.hi { background: var(--rust); color: var(--paper); }
  .rx-flag.mid{ background: var(--grain); color: #3A2C05; }
  .rx-flag.lo { background: var(--sprout); color: #22300F; }
  .rx-sect { font-size: .7rem; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); margin: 13px 0 4px; }
  .rx-sect:first-of-type { margin-top: 0; }
  .rx p { margin: 0; font-size: .87rem; }
  .rx ul { margin: 0; padding-left: 18px; font-size: .87rem; }
  .rx li { margin-bottom: 3px; }
  .rx-src { font-size: .73rem; color: var(--ink-faint); margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--rule); }

  /* ─── สนทนา ─────────────────────────────── */
  .talk { min-height: 250px; max-height: 430px; overflow-y: auto; padding-right: 4px; }
  .say { padding: 12px 15px; border-radius: var(--r); margin-bottom: 10px; font-size: .89rem; max-width: 87%; }
  .say-ai { background: var(--tint-ok); border-left: 2px solid var(--blade); }
  .say-me { background: var(--husk); border: 1px solid var(--rule); margin-left: auto; }
  .say img { max-width: 168px; border-radius: var(--r); display: block; margin-bottom: 7px; }
  .talk-bar { display: flex; gap: 8px; margin-top: 13px; }
  .talk-bar input { flex: 1; padding: 10px 14px; border: 1px solid var(--rule); border-radius: var(--r); background: var(--paper); outline: none; }
  .talk-bar input:focus { border-color: var(--blade); }
  .clip { display: flex; align-items: center; gap: 11px; margin-top: 11px; padding: 8px 11px; background: var(--tint-ok); border: 1px solid var(--rule); border-radius: var(--r); }
  .clip img { width: 42px; height: 42px; object-fit: cover; border-radius: 2px; }
  .clip span { flex: 1; font-size: .8rem; color: var(--ink-soft); }

  /* ─── ตาราง ─────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  thead th {
    text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--rule);
    font-size: .7rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 500; white-space: nowrap;
  }
  tbody td { padding: 10px 9px; border-bottom: 1px solid var(--rule-soft); }
  tbody tr:last-child td { border-bottom: none; }
  td.dx { font-weight: 500; }
  td.dx.ill { color: var(--rust); }
  td.dx.well { color: var(--blade); }
  td.n { font-family: var(--f-data); }

  /* ─── สถานะว่าง/โหลด/ผิดพลาด ──────────────── */
  /* ─── แผงยืนยันผลจากผู้ใช้ ─────────────────── */
  .verify { margin-top: 18px; padding: 15px 17px; border: 1px solid var(--rule); border-left: 3px solid var(--flood); background: var(--husk); }
  .verify.done { border-left-color: var(--blade); background: var(--tint-ok); }
  .verify-ask { font-weight: 500; font-size: .9rem; }
  .verify-note { font-size: .78rem; color: var(--ink-soft); margin-top: 3px; }
  .verify-acts { display: flex; gap: 9px; margin-top: 12px; flex-wrap: wrap; }
  .verify-pick { display: flex; gap: 9px; margin-top: 11px; flex-wrap: wrap; align-items: center; }

  .thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 2px; border: 1px solid var(--rule); display: block; cursor: pointer; background: var(--husk); }
  .thumb-blank { width: 46px; height: 46px; border: 1px dashed var(--rule); border-radius: 2px; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: .68rem; }

  .lens { position: fixed; inset: 0; background: rgba(20,40,31,.86); z-index: 90; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .lens img { max-width: 100%; max-height: 84vh; border-radius: var(--r); }
  .lens-shut { position: absolute; top: 18px; right: 20px; background: var(--paper); border: none; border-radius: var(--r); padding: 8px 16px; font-weight: 500; }

  .tag-yes { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--tint-ok); color: #3B5A28; white-space: nowrap; }
  .tag-no  { font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--tint-bad); color: var(--rust); white-space: nowrap; }
  .tag-wait{ font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--husk); color: var(--ink-faint); white-space: nowrap; border: 1px solid var(--rule); }

  /* ─── หน้าจอเข้าสู่ระบบ ─────────────────────── */
  .gate {
    position: fixed; inset: 0; z-index: 100; background: var(--husk);
    display: flex; align-items: center; justify-content: center; padding: 22px;
    overflow-y: auto;
  }
  .gate-card {
    width: 100%; max-width: 396px; background: var(--paper);
    border: 1px solid var(--rule); border-radius: var(--r); padding: 30px 28px;
  }
  .gate-mark { display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 600; font-size: 1.2rem; color: var(--flood); }
  .gate-sub { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); margin: 5px 0 24px 30px; }
  .gate-title { font-size: 1.22rem; margin-bottom: 4px; }
  .gate-note { font-size: .84rem; color: var(--ink-soft); margin-bottom: 20px; }
  .gate-field { margin-bottom: 14px; }
  .gate-field label { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 5px; }
  .gate-field input {
    width: 100%; padding: 10px 13px; border: 1px solid var(--rule);
    border-radius: var(--r); background: var(--paper); color: var(--ink);
  }
  .gate-field input:focus { border-color: var(--blade); outline: none; }
  .gate-hint { font-size: .74rem; color: var(--ink-faint); margin-top: 4px; }
  .gate-swap { text-align: center; margin-top: 18px; font-size: .84rem; color: var(--ink-soft); }
  .gate-swap button { background: none; border: none; color: var(--blade); font-weight: 500; text-decoration: underline; padding: 0; font-size: inherit; }
  .gate-foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule-soft); font-size: .74rem; color: var(--ink-faint); line-height: 1.55; }

  .rail-out {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 12px; margin-top: 10px; background: none; border: 1px solid rgba(255,255,255,.16);
    border-radius: var(--r); color: #A8BBAD; font-size: .8rem; justify-content: center;
  }
  .rail-out:hover { color: #F2EBDD; border-color: rgba(255,255,255,.3); }

  .state { text-align: center; padding: 44px 22px; }  .state-mark { font-size: 1.6rem; margin-bottom: 8px; opacity: .5; }
  .state-lead { font-weight: 500; font-size: .93rem; margin-bottom: 4px; }
  .state-note { font-size: .83rem; color: var(--ink-soft); max-width: 300px; margin: 0 auto; }
  .flash { padding: 11px 15px; border-radius: var(--r); font-size: .85rem; margin-top: 12px; }
  .flash-bad { background: var(--tint-bad); border: 1px solid #E0BDB2; color: var(--rust); }
  .flash-warn { background: var(--tint-warn); border: 1px solid #E4CE94; color: #7A5A11; }

  /* กล่องสรุปผลวินิจฉัย — เน้นชื่อโรคให้อ่านได้จากระยะแขน ไม่ต้องเพ่ง */
  .verdict { border: 1px solid var(--rule); border-left: 3px solid var(--blade);
             background: var(--tint-ok); padding: 16px 18px; }
  .verdict-unsure { border-left-color: var(--grain); background: var(--tint-warn); }
  .verdict-kicker { font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
                    color: var(--ink-faint); margin-bottom: 6px; }
  .verdict-main { font-size: 25px; line-height: 1.25; font-weight: 600; color: var(--ink); }
  .verdict-sub { margin-top: 3px; font-size: 12px; color: var(--ink-faint); font-family: ui-monospace, monospace; }
  .verdict-alt { margin-top: 10px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  .verdict-src { margin-top: 8px; font-size: 11.5px; color: var(--ink-faint); }

  /* ฝน/แสง วันนี้–พรุ่งนี้ */
  .fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); margin-top: 14px; }
  .fx-cell { background: var(--paper); padding: 14px 16px; }
  .fx-when { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
  .fx-big  { font-size: 22px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .fx-big2 { font-size: 18px; font-weight: 600; color: var(--grain); line-height: 1.2; margin-top: 10px; }
  .fx-cap  { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  @media (max-width: 420px) { .fx-grid { grid-template-columns: 1fr; } }

  /* กล่องแหล่งอ้างอิงจากการค้นเว็บ */
  .src-box { background: var(--tint-warn) !important; border-color: #E4CE94 !important; }
  .src-head { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: #7A5A11; margin-bottom: 7px; }
  .src-link { display: block; font-size: 13px; color: #14352C; text-decoration: underline;
              margin-bottom: 4px; overflow-wrap: anywhere; }
  .src-foot { margin-top: 8px; font-size: 11.5px; color: #7A5A11; line-height: 1.55; }
  .flash-ok  { background: var(--tint-ok); border: 1px solid #CBD9AF; color: #3B5A28; }

  .stack-item { display: flex; gap: 14px; align-items: center; padding: 13px 2px; border-bottom: 1px solid var(--rule-soft); }
  .stack-item:last-child { border-bottom: none; }
  .stack-chip { width: 42px; flex-shrink: 0; text-align: center; font-family: var(--f-data); font-size: 1.05rem; font-weight: 500; padding: 5px 0; border-radius: 2px; }
  .stack-chip.ok { background: var(--tint-ok); color: #3B5A28; }
  .stack-chip.warn { background: var(--tint-warn); color: #8A6A12; }
  .stack-chip.bad { background: var(--tint-bad); color: var(--rust); }
  .stack-main { flex: 1; min-width: 0; }
  .stack-lead { font-weight: 500; font-size: .89rem; }
  .stack-sub { font-size: .79rem; color: var(--ink-soft); }

  #map { height: 380px; border: 1px solid var(--rule); border-radius: var(--r); }
  canvas { max-width: 100%; }

  .rail-toggle { display: none; background: none; border: none; padding: 5px; }
  @media (max-width: 860px) {
    .rail { position: fixed; z-index: 70; transform: translateX(-100%); transition: transform .2s; }
    .rail.open { transform: translateX(0); }
    .rail-toggle { display: block; }
    .seek { display: none; }
    .bar { align-items: center; }
    .gauge-wrap { flex-direction: column; }
    .gauge { width: 100%; min-height: 118px; }
  }

  /* ══════════════════════════════════════════════════════════
     ชั้นตกแต่ง — ธีม "นาข้าวเช้าตรู่"
     เขียนทับกฎเดิมโดยไม่แตะโครงสร้าง คลาสทั้งหมดของหน้าอื่นยังใช้ได้เหมือนเดิม
     ══════════════════════════════════════════════════════════ */

  /* ── ฉากหลัง: แสงเช้าสาดผ่านทุ่ง ──
     ใช้ gradient ซ้อนกันแทนภาพถ่าย เพราะภาพถ่ายจะทำให้หน้าเว็บหนักขึ้นหลาย MB
     ซึ่งขัดกับสถานการณ์ใช้งานจริงคือเกษตรกรเปิดกลางนาด้วยสัญญาณอ่อน
     ความเข้มต่ำมากโดยตั้งใจ ให้รู้สึกว่าพื้นไม่แบน แต่ไม่แย่งสายตาจากตัวเลข */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(1100px 620px at 82% -10%, rgba(111,191,115,.20), transparent 62%),
      radial-gradient(900px  520px at 8%  6%,   rgba(200,230,201,.42), transparent 60%),
      radial-gradient(1200px 700px at 50% 112%, rgba(46,139,87,.10),   transparent 68%);
  }
  /* ริ้วแนวนอนบางๆ จำลองร่องคันนาที่ทอดไปสุดขอบฟ้า */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: repeating-linear-gradient(
      180deg, rgba(46,139,87,.022) 0 1px, transparent 1px 8px);
    mask-image: linear-gradient(180deg, rgba(0,0,0,.7), transparent 50%);
    -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.7), transparent 50%);
  }

  ::selection { background: var(--leaf-pale); color: var(--deep); }

  /* ── การ์ดสีขาวลอยเหนือพื้นเขียวจาง ── */
  .plot {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--r);
    box-shadow: var(--lift);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .plot:hover { border-color: var(--sprout); box-shadow: 0 2px 4px rgba(27,94,58,.06), 0 12px 30px rgba(27,94,58,.1); }

  /* ── แถบเมนูซ้าย: เขียวเข้ม ตัดกับพื้นขาวชัดเจน ── */
  .rail {
    background: linear-gradient(180deg, var(--deep), #164C30);
    border-right: none;
    box-shadow: 2px 0 16px rgba(27,94,58,.1);
  }
  .mark { border-bottom: 1px solid rgba(255,255,255,.14); }
  .mark-name { color: #FFFFFF; }
  .mark-sub  { color: rgba(255,255,255,.55); letter-spacing: .16em; }

  .rail-item {
    border-radius: var(--r-sm);
    border-left: none;
    color: rgba(255,255,255,.78);
    position: relative;
    transition: background .18s ease, color .18s ease;
  }
  .rail-item:hover { background: rgba(255,255,255,.1); color: #FFFFFF; }
  .rail-item[aria-current="page"], .rail-item.on {
    background: rgba(255,255,255,.16);
    color: #FFFFFF;
    font-weight: 500;
  }
  /* ขีดสว่างด้านซ้ายบอกหน้าที่เปิดอยู่ — อ่านได้เร็วกว่าสีพื้นอย่างเดียว */
  .rail-item[aria-current="page"]::before, .rail-item.on::before {
    content: "";
    position: absolute; left: 0; top: 18%; bottom: 18%;
    width: 3px; border-radius: 0 3px 3px 0;
    background: var(--sprout);
  }
  .rail-item svg path, .rail-item svg circle { stroke: currentColor; }
  .rail-foot { color: rgba(255,255,255,.6); border-top: 1px solid rgba(255,255,255,.14); }
  .rail-foot .dot { background: rgba(255,255,255,.45); }
  .rail-foot .dot.live { background: var(--sprout); }
  .rail-foot .dot.down { background: #E8927C; }
  .rail-out {
    border: 1px solid rgba(255,255,255,.28);
    background: transparent;
    color: rgba(255,255,255,.85);
    border-radius: var(--r-sm);
  }
  .rail-out:hover { border-color: #FFFFFF; color: #FFFFFF; background: rgba(255,255,255,.08); }

  /* ── แถบบน ── */
  .bar {
    background: rgba(255,255,255,.82);
    border-bottom: 1px solid var(--rule);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .bar-kicker { color: var(--ink-faint); }
  .bar-title  { color: var(--deep); }
  .seek {
    background: var(--canopy);
    border: 1px solid var(--rule);
    border-radius: 999px;
  }
  .seek:focus-within { border-color: var(--blade); background: #FFFFFF; }
  .seek input { background: transparent; color: var(--ink); }
  .seek input::placeholder { color: var(--ink-faint); }
  .who { color: var(--ink); }
  .who-badge {
    background: linear-gradient(140deg, var(--blade), var(--sprout));
    color: #FFFFFF;
    font-weight: 600;
  }
  .rail-toggle { background: #FFFFFF; border: 1px solid var(--rule); border-radius: var(--r-sm); }
  .rail-toggle svg path { stroke: var(--deep); }

  /* ── ฟอร์มและปุ่ม ── */
  .inp input, .gate-field input, .talk-bar input,
  input[type="text"], input[type="password"], input[type="email"],
  input[type="number"], input[type="date"], select, textarea {
    background: #FFFFFF;
    border: 1px solid var(--rule);
    color: var(--ink);
    border-radius: var(--r-sm);
  }
  .inp input:focus, .gate-field input:focus, .talk-bar input:focus,
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--blade);
    box-shadow: 0 0 0 3px rgba(46,139,87,.14);
  }
  .inp input[readonly] { background: var(--canopy); color: var(--ink-soft); }

  .act { border-radius: var(--r-sm); font-weight: 500; }
  .act-go {
    background: linear-gradient(135deg, var(--deep), var(--blade));
    color: #FFFFFF;
    border: none;
    box-shadow: 0 4px 14px rgba(27,94,58,.22);
  }
  .act-go:hover:not(:disabled) { filter: brightness(1.1); }
  .act-go:disabled { background: var(--rule); color: var(--ink-faint); box-shadow: none; }
  .act-line { background: #FFFFFF; border: 1px solid var(--rule); color: var(--ink-soft); }
  .act-line:hover { border-color: var(--blade); color: var(--deep); background: var(--tint-ok); }

  /* โฟกัสด้วยคีย์บอร์ดต้องเห็นชัด — จำเป็นสำหรับคนที่ใช้ปุ่ม Tab */
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--blade);
    outline-offset: 2px;
  }
  a { color: var(--blade); }

  .bund-label { color: var(--ink-faint); }
  .bund-line  { background: repeating-linear-gradient(90deg, var(--rule) 0 9px, transparent 9px 15px); }
  .intake     { border: 1px dashed var(--rule); background: var(--tint-ok); }
  .intake:hover, .intake.over { border-color: var(--blade); background: var(--leaf-pale); }
  .shot img   { background: var(--canopy); }

  /* ── มาตรวัดคะแนนสุขภาพ ── */
  .gauge { background: linear-gradient(180deg, #FFFFFF, var(--canopy)); border-color: var(--rule); }
  .gauge-figure { color: #FFFFFF; }
  .gauge-figure.dim { color: var(--ink-faint); }
  .gauge-unit.dim { color: var(--ink-faint); }
  .verdict-name.ok  { color: var(--blade); }
  .verdict-name.warn{ color: var(--grain); }
  .verdict-name.bad { color: var(--rust); }

  /* ── สนทนา ── */
  .say-ai { background: var(--tint-ok); border-left: 2px solid var(--blade); color: var(--ink); }
  .say-me { background: var(--deep); border: none; color: #FFFFFF; }
  .clip   { background: var(--tint-ok); border: 1px solid var(--rule); }

  /* ── กล่องผล ── */
  .verdict { background: var(--tint-ok); border: 1px solid var(--rule); border-left: 3px solid var(--blade); }
  .verdict-unsure { background: var(--tint-warn); border-left-color: var(--grain); }
  .verdict-main { color: var(--deep); }
  .flash-ok   { background: var(--tint-ok);   border: 1px solid #B6DDBA; color: #1B5E3A; }
  .flash-warn { background: var(--tint-warn); border: 1px solid #E8D9A8; color: #7A5A11; }
  .flash-bad  { background: var(--tint-bad);  border: 1px solid #E5C0B6; color: var(--rust); }
  .src-box   { background: var(--tint-warn) !important; border-color: #E8D9A8 !important; }
  .src-head, .src-foot { color: #7A5A11; }
  .src-link  { color: var(--deep); }
  .fx-cell   { background: #FFFFFF; }
  .fx-grid   { background: var(--rule); border-radius: var(--r-sm); overflow: hidden; }
  .fx-big2   { color: var(--grain); }

  .rx { background: var(--tint-ok); border: 1px solid var(--rule); border-left: 3px solid var(--blade); border-radius: var(--r-sm); }
  .rx.warn { background: var(--tint-warn); border-left-color: var(--grain); }
  .rx.bad  { background: var(--tint-bad);  border-left-color: var(--rust); }
  .rx-flag.hi { background: var(--rust);  color: #FFFFFF; }
  .rx-flag.mid{ background: var(--grain); color: #FFFFFF; }
  .rx-flag.lo { background: var(--blade); color: #FFFFFF; }

  .stack-chip.ok   { background: var(--tint-ok);   color: #1B5E3A; }
  .stack-chip.warn { background: var(--tint-warn); color: #7A5A11; }
  .stack-chip.bad  { background: var(--tint-bad);  color: var(--rust); }
  .tag-yes  { background: var(--tint-ok);   color: #1B5E3A; }
  .tag-no   { background: var(--tint-bad);  color: var(--rust); }
  .tag-wait { background: var(--canopy); color: var(--ink-faint); border: 1px solid var(--rule); }

  .bar-track { background: var(--rule-soft); }
  .bar-fill  { background: var(--ink-faint); }
  .bar-row.lead .bar-fill { background: var(--blade); }
  .verify { background: var(--tint-ok); border: 1px solid var(--rule); border-left: 3px solid var(--blade); border-radius: var(--r-sm); }
  .verify.done { border-left-color: var(--sprout); }
  .thumb, .thumb-blank { border-radius: var(--r-sm); }
  .lens { background: rgba(23,48,31,.88); }
  .lens-shut { background: #FFFFFF; color: var(--deep); }

  /* ── หน้าเข้าสู่ระบบ ── */
  .gate { background: var(--mist); }
  .gate-card { background: #FFFFFF; border: 1px solid var(--rule); box-shadow: var(--lift); }
  .gate-mark { color: var(--deep); }

  /* ── ปรับตามขนาดจอ ──
     เปลี่ยนเฉพาะการจัดวาง ไม่ซ่อนหรือเพิ่มฟังก์ชันใดๆ */
  @media (max-width: 860px) {
    .row-2, .row-3 { grid-template-columns: 1fr !important; }
    .bar-title { font-size: 19px; }
    .seek { display: none; }   /* ช่องค้นหาซ่อนบนจอแคบ ใช้ที่หน้าทะเบียนบันทึกแทนได้ */
  }
  @media (max-width: 520px) {
    .who span:not(.who-badge) { display: none; }  /* เหลือแค่วงกลมตัวอักษร ประหยัดที่ */
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ══════════════════════════════════════════════════════════
     ปรับให้ตรงกับต้นแบบ — เมนูขาว การ์ดสะอาด ปุ่มเขียวชัด
     ══════════════════════════════════════════════════════════ */

  /* ── เมนูซ้ายเปลี่ยนเป็นพื้นขาว ──
     เดิมพื้นเขียวเข้มทำให้เมนูดูหนักและแย่งความสนใจจากเนื้อหา
     พื้นขาวทำให้สายตาไปอยู่ที่เนื้อหาตรงกลางซึ่งเป็นสิ่งที่ผู้ใช้มาหา
     ส่วนสีเขียวเก็บไว้ใช้เฉพาะ "หน้าที่เปิดอยู่" จึงเด่นขึ้นกว่าเดิม */
  .rail {
    background: #FFFFFF;
    border-right: 1px solid var(--rule);
    box-shadow: none;
  }
  .mark { border-bottom: 1px solid var(--rule); }
  .mark-name { color: var(--deep); }
  .mark-sub  { color: var(--ink-faint); }

  .rail-item {
    color: var(--ink-soft);
    font-size: .9rem;
    padding: 11px 13px;
    margin-bottom: 2px;
  }
  .rail-item:hover { background: var(--tint-ok); color: var(--deep); }
  .rail-item[aria-current="page"], .rail-item.on {
    background: var(--tint-ok);
    color: var(--deep);
    font-weight: 600;
  }
  /* เอาขีดเรืองด้านซ้ายออก พื้นสีอ่อนบอกสถานะได้ชัดพอแล้วบนพื้นขาว */
  .rail-item[aria-current="page"]::before, .rail-item.on::before { display: none; }
  .rail-foot { color: var(--ink-faint); border-top: 1px solid var(--rule); }
  .rail-foot .dot { background: var(--ink-faint); }
  .rail-foot .dot.live { background: var(--blade); }
  .rail-foot .dot.down { background: var(--rust); }
  .rail-out {
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    background: #FFFFFF;
  }
  .rail-out:hover { border-color: var(--rust); color: var(--rust); background: var(--tint-bad); }

  /* หัวข้อกลุ่มในเมนู บอกลำดับงานตามฤดูกาล */
  .rail-group {
    font-size: .7rem; letter-spacing: .06em; font-weight: 600;
    color: var(--ink-faint); padding: 16px 13px 6px;
  }
  .rail-nav > .rail-group:first-child { padding-top: 6px; }

  /* ── แถบบนขาวสะอาด ── */
  .bar { background: #FFFFFF; border-bottom: 1px solid var(--rule); backdrop-filter: none; }
  .bar-title { font-size: 1.42rem; font-weight: 700; letter-spacing: -.015em; }
  .seek { background: var(--mist); }

  /* ── พื้นหลังหน้าอ่อนลง ให้การ์ดขาวลอยขึ้นมา ── */
  body::before { opacity: .55; }
  body::after { display: none; }   /* ริ้วคันนาทำให้ดูรกบนธีมสว่าง */

  /* ── การ์ดเรียบขึ้น เงาบางลง ── */
  .plot {
    box-shadow: 0 1px 3px rgba(27,94,58,.05);
    padding: 20px 22px;
  }
  .plot:hover { box-shadow: 0 1px 3px rgba(27,94,58,.05); border-color: var(--rule); }
  .plot-title { font-size: 1.05rem; font-weight: 600; }

  /* ── หัวข้อคั่น: เอาเส้นประออก ใช้ตัวหนาสีเขียวแทน ──
     เส้นประยาวทั้งบรรทัดดึงสายตาไปตามเส้นแทนที่จะอ่านหัวข้อ */
  .bund { margin: 26px 0 13px; }
  .bund-label {
    font-size: .95rem; font-weight: 600; letter-spacing: 0;
    text-transform: none; color: var(--deep);
  }
  .bund-line { display: none; }

  /* ── ปุ่ม ── */
  .act { padding: 11px 22px; font-size: .9rem; border-radius: 8px; }
  .act-sm { padding: 7px 15px; font-size: .82rem; border-radius: 7px; }
  .act-go { background: var(--blade); box-shadow: none; font-weight: 600; }
  .act-go:hover:not(:disabled) { background: var(--deep); filter: none; }

  /* ── ตาราง ── */
  thead th {
    background: var(--tint-ok); color: var(--deep); font-weight: 600;
    font-size: .78rem; letter-spacing: 0; text-transform: none;
    padding: 11px 12px; border-bottom: none;
  }
  tbody td { padding: 12px; }
  tbody tr:hover { background: var(--mist); }

  /* ── ค่าตัวเลขในการ์ด ── */
  .read-label { font-size: .78rem; letter-spacing: 0; text-transform: none; color: var(--ink-faint); }
  .read-value { font-size: 1.5rem; color: var(--deep); }

  /* ── รายการพับให้เข้าชุด ── */
  .fold { border-color: var(--rule); }
  .fold-title { font-size: .92rem; }

  /* ── ป้ายสถานะ ── */
  .tag-yes, .tag-no, .tag-wait { font-weight: 600; padding: 3px 10px; }

  /* ── แถบเลือกระยะการเจริญเติบโต ── */
  .stage-tabs {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .stage-tab {
    display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
    padding: 11px 13px; border-radius: 9px;
    background: var(--mist); border: 1px solid var(--rule);
    cursor: pointer; font-family: var(--f-body); text-align: left;
    transition: background .16s ease, border-color .16s ease;
  }
  .stage-tab:hover { border-color: var(--blade); }
  .stage-tab.on { background: var(--blade); border-color: var(--blade); }
  .stage-name { font-size: .87rem; font-weight: 600; color: var(--ink); }
  .stage-age  { font-size: .74rem; color: var(--ink-faint); font-family: var(--f-data); }
  .stage-tab.on .stage-name, .stage-tab.on .stage-age { color: #FFFFFF; }
  @media (max-width: 700px) {
    .stage-tabs { grid-template-columns: 1fr 1fr; }
  }

  /* ── การ์ดคำแนะนำ ── */
  .care {
    display: flex; align-items: flex-start; gap: 14px;
    background: #FFFFFF; border: 1px solid var(--rule); border-radius: var(--r);
    padding: 16px 18px; margin-top: 11px;
    box-shadow: 0 1px 3px rgba(27,94,58,.05);
  }
  .care-icon {
    flex: none; width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center;
  }
  .care-mid { flex: 1; min-width: 0; }
  .care-title { font-weight: 600; font-size: .96rem; line-height: 1.4; }
  .care-sum { font-size: .85rem; color: var(--ink-soft); margin-top: 3px; line-height: 1.6; max-width: 62ch; }
  /* pre-line เพราะรายละเอียดบางการ์ดยาวหลายย่อหน้าแล้ว
     ถ้าไม่ตั้ง ข้อความจะไหลติดกันเป็นก้อนเดียวจนอ่านไม่ออกบนมือถือ */
  .care-detail {
    margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--rule-soft);
    font-size: .86rem; line-height: 1.75; color: var(--ink); max-width: 66ch;
    white-space: pre-line;
  }
  .care .act { flex: none; align-self: center; white-space: nowrap; }
  @media (max-width: 640px) {
    .care { flex-wrap: wrap; }
    .care .act { align-self: flex-start; margin-left: 52px; }
  }

  /* หัวข้อพับต้องดูกดได้ชัด เพราะตอนนี้ยุบหมดตั้งแต่แรก
     ถ้าดูเหมือนรายการเฉยๆ ผู้ใช้จะไม่รู้ว่ามีเนื้อหาซ่อนอยู่ */
  .fold-head::after {
    content: "ดูรายละเอียด";
    font-size: .74rem; color: var(--deep); white-space: nowrap;
  }
  .fold.on .fold-head::after { content: "ย่อกลับ"; }
  @media (max-width: 520px) { .fold-head::after { display: none; } }

  /* ══════════════════════════════════════════════════════════
     การอ่านออก
     ปัญหาเดิม: ทุกขั้นตอนกางออกหมดพร้อมกัน หน้าหนึ่งมีข้อความ 20 ย่อหน้าเรียงต่อกัน
     ผู้ใช้เลื่อนหาสิ่งที่ต้องการไม่เจอ และไม่รู้ว่าทั้งหมดมีกี่ขั้น
     แก้โดยให้เห็นหัวข้อทั้งหมดก่อน แล้วกดขยายเฉพาะอันที่สนใจ
     ══════════════════════════════════════════════════════════ */

  /* จำกัดความกว้างบรรทัด ยาวเกิน 75 ตัวอักษรสายตาจะหาบรรทัดถัดไปไม่เจอ */
  .plot p, .plot li, .state-note, .verdict-alt { max-width: 68ch; }
  .plot p, .plot li { line-height: 1.75; }
  .plot li { margin-bottom: 7px; }

  /* ── รายการพับได้ ── */
  .fold {
    border: 1px solid var(--rule);
    border-radius: var(--r-sm);
    background: #FFFFFF;
    margin-bottom: 9px;
    overflow: hidden;
  }
  .fold-head {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 13px 15px; background: none; border: none; cursor: pointer;
    text-align: left; font-family: var(--f-body); color: var(--ink);
    transition: background .16s ease;
  }
  .fold-head:hover { background: var(--tint-ok); }
  .fold.on .fold-head { background: var(--tint-ok); }
  .fold-num {
    flex: none; width: 27px; height: 27px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--canopy); color: var(--deep);
    font-family: var(--f-data); font-size: .8rem; font-weight: 600;
  }
  .fold.on .fold-num { background: var(--deep); color: #FFFFFF; }
  .fold-text { flex: 1; min-width: 0; }
  .fold-title { font-weight: 600; font-size: .95rem; line-height: 1.4; }
  .fold-sub { font-size: .76rem; color: var(--ink-faint); margin-top: 2px; }
  /* ลูกศรหมุนบอกสถานะเปิดปิด ชัดกว่าเครื่องหมายบวกลบ */
  .fold-arrow {
    flex: none; width: 9px; height: 9px; margin-right: 3px;
    border-right: 2px solid var(--ink-faint); border-bottom: 2px solid var(--ink-faint);
    transform: rotate(45deg); transition: transform .2s ease;
  }
  .fold.on .fold-arrow { transform: rotate(-135deg); border-color: var(--deep); }
  .fold-body { padding: 0 15px 15px 54px; font-size: .88rem; }
  .fold-body p { margin: 0 0 9px; }
  .fold-body p:last-child { margin-bottom: 0; }
  @media (max-width: 520px) { .fold-body { padding-left: 15px; } }

  /* กล่องเตือนในรายการพับ ให้เบากว่ากล่องเตือนระดับหน้า */
  .fold-note {
    margin-top: 10px; padding: 9px 12px; border-radius: 8px;
    font-size: .83rem; line-height: 1.6;
    background: var(--tint-warn); color: #7A5A11;
  }

  /* ── ข้อความประกอบที่ยาว ยุบไว้ก่อน ── */
  .more { margin-top: 12px; }
  .more-btn {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: var(--f-body); font-size: .82rem; color: var(--deep);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .more-body { margin-top: 9px; font-size: .82rem; color: var(--ink-soft); line-height: 1.7; }

  /* การ์ดซ้อนในการ์ดไม่ต้องมีเงา ไม่งั้นหน้าดูรกเป็นชั้นๆ */
  .plot .plot { box-shadow: none; }

  /* ══════════════════════════════════════════════════════════
     แสงและการเคลื่อนไหว
     หลักที่ยึด: motion ต้องบอกอะไรบางอย่าง ไม่ใช่ใส่เพราะสวย
     ทุกอย่างในนี้ถูกปิดทั้งหมดถ้าผู้ใช้ตั้งค่าลดการเคลื่อนไหวไว้
     ══════════════════════════════════════════════════════════ */

  /* ── แถบโหลดตอนเปลี่ยนหน้า ──
     หลายหน้าต้องรอเครือข่าย (บันทึก อากาศ AI) ซึ่งบนเน็ตกลางนาอาจกินเวลาหลายวินาที
     แถบนี้บอกว่า "ระบบรับคำสั่งแล้วกำลังทำอยู่" ทำให้ไม่มีช่วงที่หน้าจอนิ่งจนคนคิดว่าค้าง */
  .loadbar {
    height: 3px;
    background: transparent;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transition: opacity .2s ease;
  }
  .loadbar.on { opacity: 1; }
  .loadbar.on::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--blade), var(--deep), transparent);
    animation: loadslide 1.05s cubic-bezier(.45,.05,.35,1) infinite;
  }
  @keyframes loadslide {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }

  /* ── การ์ดไล่กันขึ้นมาตอนเปิดหน้า ──
     หน่วงทีละ 40ms ทำให้สายตาไล่จากบนลงล่างตามลำดับความสำคัญของเนื้อหา
     ไม่หน่วงเกิน 8 ใบ เพราะถ้าไล่ยาวกว่านั้นจะกลายเป็นรอ ไม่ใช่ลื่น */
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }
  .field.enter > * {
    animation: riseIn .42s cubic-bezier(.2,.75,.3,1) both;
  }
  .field.enter > *:nth-child(1) { animation-delay: 0ms; }
  .field.enter > *:nth-child(2) { animation-delay: 40ms; }
  .field.enter > *:nth-child(3) { animation-delay: 80ms; }
  .field.enter > *:nth-child(4) { animation-delay: 120ms; }
  .field.enter > *:nth-child(5) { animation-delay: 160ms; }
  .field.enter > *:nth-child(6) { animation-delay: 200ms; }
  .field.enter > *:nth-child(7) { animation-delay: 240ms; }
  .field.enter > *:nth-child(n+8) { animation-delay: 280ms; }

  /* ── ชื่อหน้าบนแถบบนเลื่อนตาม ──
     ช่วยยืนยันว่าหน้าเปลี่ยนแล้วจริง ไม่ใช่แค่เนื้อหาข้างล่างขยับ */
  @keyframes titleIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: none; }
  }
  .bar-title.swap, .bar-kicker.swap { animation: titleIn .34s ease both; }

  /* ── ไฟวิ่งบนขอบการ์ดตอนชี้ ──
     ใช้เฉพาะการ์ดที่กดได้ เพื่อให้ "เรืองแสง = กดได้" มีความหมายเดียวทั้งระบบ */
  .plot { position: relative; }
  .intake:hover {
    box-shadow: 0 0 0 1px rgba(46,139,87,.25), 0 6px 20px rgba(27,94,58,.12);
  }

  /* ── เมนูซ้าย: ขีดเรืองเลื่อนตามหน้าที่เปิด ── */
  .rail-item::before { transition: opacity .24s ease, transform .24s ease; }
  .rail-item[aria-current="page"]::before, .rail-item.on::before {
    animation: markGlow 2.6s ease-in-out infinite;
  }
  /* บนพื้นสว่างแสงเรืองมองไม่เห็น จึงเปลี่ยนเป็นขีดยืด-หดแทน
     สื่อความหมายเดียวกันคือ "หน้านี้กำลังเปิดอยู่" แต่เห็นได้จริงบนพื้นขาว */
  @keyframes markGlow {
    0%, 100% { transform: scaleY(1);   opacity: 1; }
    50%      { transform: scaleY(.72); opacity: .75; }
  }

  /* ── จุดสถานะการเชื่อมต่อเต้นเบาๆ ตอนออนไลน์ ──
     หายใจ = ระบบยังติดต่อเซิร์ฟเวอร์อยู่ นิ่ง = หลุด ต่างกันชัดโดยไม่ต้องอ่านตัวหนังสือ */
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(111,191,115,.65); }
    70%      { box-shadow: 0 0 0 6px rgba(111,191,115,0); }
  }
  .dot.live { animation: breathe 2.4s ease-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .field.enter > *, .bar-title.swap, .bar-kicker.swap { animation: none !important; }
    .loadbar.on::after, .dot.live, .rail-item.on::before { animation: none !important; }
  }
</style>
</head>

<script>
(function () {
"use strict";

// URL ของ Cloudflare Worker — เก็บ Field Log และเป็นตัวกลางเรียก Gemini
// (API key ของ Gemini อยู่ฝั่ง Worker ไม่หลุดมาที่หน้าเว็บ)
var API_BASE = "https://divine-frost-abbb.pomsuriyan61.workers.dev";

// เกณฑ์แบ่งสถานะสุขภาพ ใช้ร่วมกันทั้งระบบ ห้ามนิยามซ้ำที่อื่น
// เพื่อให้ความหมายของสีคงที่ทุกหน้า (เขียว=ปกติ ทอง=เฝ้าระวัง แดงสนิม=เร่งด่วน)
var SCORE_OK = 85, SCORE_WARN = 60;
function statusOf(score) {
  if (typeof score !== "number") return "none";
  if (score >= SCORE_OK) return "ok";
  if (score >= SCORE_WARN) return "warn";
  return "bad";
}
function statusWord(s) {

// เพื่อไม่ให้ต้องแก้ชื่อโรค 2 ที่แล้วลืมที่ใดที่หนึ่ง ซึ่งเคยทำให้ชื่อไม่ตรงกันมาแล้ว

// การคืนชื่ออังกฤษเป็นทางสุดท้ายสำคัญ เพราะถ้าโมเดลส่งคลาสใหม่ที่ยังไม่มีข้อมูล

// ─── สิทธิ์การเข้าใช้ ───────────────────────────
// เก็บ token ไว้ใน localStorage เพื่อไม่ต้องล็อกอินซ้ำทุกครั้งที่เปิดเว็บ
// ข้อจำกัดที่ต้องรู้: ถ้าเว็บถูกเจาะด้วย XSS token ก็หลุดได้
// เหมาะกับการใช้งานในวงจำกัด ถ้าขยายเป็นสาธารณะควรย้ายไปใช้ auth provider เต็มรูปแบบ
var Session = {
  token: localStorage.getItem("smartrice-token") || null,
  user: null,

  save: function (token, user) {
    this.token = token;
    this.user = user;
    localStorage.setItem("smartrice-token", token);
  },

  clear: function () {
    this.token = null;
    this.user = null;
    localStorage.removeItem("smartrice-token");
  },

  headers: function (extra) {
    var h = extra || {};
    if (this.token) h["Authorization"] = "Bearer " + this.token;
    return h;
  }
};

// เรียก API พร้อมแนบ token ให้อัตโนมัติ
// ถ้าเซิร์ฟเวอร์ตอบว่า token ใช้ไม่ได้ จะเด้งกลับหน้าล็อกอินทันที
// ไม่ปล่อยให้ผู้ใช้เจอหน้าเปล่าโดยไม่รู้สาเหตุ
async function api(path, options) {
  options = options || {};
  var init = {
    method: options.method || "GET",
    headers: Session.headers(options.body ? { "Content-Type": "application/json" } : {})
  };
  if (options.body) init.body = JSON.stringify(options.body);

  var res = await fetch(API_BASE + path, init);
  var data = null;
  try { data = await res.json(); } catch (e) { data = {}; }

  if (res.status === 401 && data.needLogin) {
    Session.clear();
    showAuthScreen("หมดเวลาใช้งาน กรุณาเข้าสู่ระบบใหม่");
    throw new Error("หมดเวลาใช้งาน");
  }
  if (!res.ok) throw new Error(data.error || "คำขอไม่สำเร็จ (HTTP " + res.status + ")");
  return data;
}

// แปลงข้อความผิดพลาดให้ผู้ใช้อ่านรู้เรื่อง
//
// ทำไมต้องมีทั้งที่ Worker ส่งข้อความไทยมาให้แล้ว: หน้าเว็บกับ Worker
// อัปเดตคนละเวลา ถ้าผู้ใช้เปิดเว็บใหม่แต่ Worker ยังเป็นเวอร์ชันเก่า
// จะได้ JSON ดิบจาก Google โผล่เต็มหน้าจอเหมือนเดิม ตัวนี้เป็นตาข่ายรองรับชั้นสุดท้าย
//
// หลักการ: ถ้าเจอร่องรอยของข้อความดิบจากระบบ ให้แทนที่ด้วยคำอธิบายที่ทำอะไรต่อได้
// ไม่ใช่แค่ตัดให้สั้นลง เพราะข้อความสั้นที่อ่านไม่รู้เรื่องก็ยังไร้ประโยชน์เท่าเดิม
function friendlyError(msg) {
  var raw = String(msg || "เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ");

  // limit: 0 คือบัญชีไม่ได้รับโควตาตั้งแต่ต้น คนละเรื่องกับใช้จนหมด
  if (/limit:\s*0\b/.test(raw)) {
    return "บัญชี AI ที่ตั้งค่าไว้ยังไม่ได้รับโควตาใช้งาน กรุณาแจ้งผู้ดูแลระบบให้ตรวจสอบคีย์ " +
           "ระหว่างนี้การตรวจโรคจากภาพยังใช้ได้ตามปกติ เพราะทำงานในเครื่องของคุณเอง";
  }
  if (/429|RESOURCE_EXHAUSTED|quota/i.test(raw)) {
    var m = /retry in ([\d.]+)s/i.exec(raw);
    return "ตอนนี้มีผู้ใช้ AI พร้อมกันจำนวนมาก" +
           (m ? " กรุณาลองใหม่ในอีกประมาณ " + Math.ceil(parseFloat(m[1])) + " วินาที" : " กรุณาลองใหม่ในอีกสักครู่") +
           " ส่วนการตรวจโรคจากภาพยังใช้ได้ตามปกติ";
  }
  // JSON ดิบหรือข้อความยาวผิดปกติ = ข้อความสำหรับนักพัฒนา ไม่ใช่สำหรับผู้ใช้
  if (raw.indexOf("{") !== -1 || raw.length > 180) {
    console.warn("[AI] ข้อความผิดพลาดดิบ:", raw);
    return "ตอนนี้เชื่อมต่อบริการ AI ไม่ได้ กรุณาลองใหม่อีกครั้ง ถ้ายังไม่ได้ให้แจ้งผู้ดูแลระบบ";
  }
  return raw;
}

// ─── ชั้นข้อมูล ────────────────────────────────
// รวมการอ่าน/เขียนไว้ที่เดียว หน้าอื่นเรียกผ่าน Store เท่านั้น
// ย้ายไป backend อื่นภายหลังแก้แค่ในนี้ ไม่ต้องแตะโค้ดหน้าเว็บ
var Store = {
  _cache: null,
  _offline: false,

  async list() {
    if (this._cache) return this._cache;
    try {
      this._cache = await api("/field-logs");
      this._offline = false;
    } catch (err) {
      if (/หมดเวลา/.test(err.message)) throw err;
      // เน็ตหลุดหรือเซิร์ฟเวอร์ล่ม ยังใช้งานต่อได้ด้วยสำเนาในเครื่อง
      // แยกสำเนาตามชื่อผู้ใช้ ไม่ให้ข้อมูลคนละบัญชีปนกันบนเครื่องเดียว
      this._offline = true;
      this._cache = JSON.parse(localStorage.getItem(this._localKey()) || "[]");
    }
    markLink();
    return this._cache;
  },

  _localKey() {
    return "smartrice-logs:" + (Session.user ? Session.user.username : "guest");
  },

  async add(entry) {
    try {
      var saved = await api("/field-logs", { method: "POST", body: entry });
      this._cache = this._cache ? [saved].concat(this._cache) : [saved];
      this._offline = false;
      markLink();
      return saved;
    } catch (err) {
      if (/หมดเวลา/.test(err.message)) throw err;
      this._offline = true;
      delete entry.image;   // ไม่เก็บภาพลง localStorage จะเต็มโควตาเบราว์เซอร์เร็วมาก
      entry.id = Date.now().toString(36);
      entry.created_at = new Date().toISOString();
      entry.hasImage = false;
      entry.verify = null;
      var local = JSON.parse(localStorage.getItem(this._localKey()) || "[]");
      local.unshift(entry);
      try {
        localStorage.setItem(this._localKey(), JSON.stringify(local.slice(0, 200)));
      } catch (e) { /* พื้นที่เต็ม ข้ามการเก็บสำเนา ผลตรวจยังแสดงบนหน้าจอได้ */ }
      this._cache = this._cache ? [entry].concat(this._cache) : [entry];
      markLink();
      return entry;
    }
  },

  isOffline() { return this._offline; },

  // บันทึกผลยืนยันว่า AI ทายถูกหรือผิด ต้องออนไลน์เพราะแก้ข้อมูลที่เซิร์ฟเวอร์
  async verify(id, correct, actual) {
    var updated = await api("/field-logs/" + id, {
      method: "PATCH",
      body: { correct: correct, actual: actual || null }
    });
    if (this._cache) {
      var i = this._cache.findIndex(function (l) { return l.id === id; });
      if (i !== -1) this._cache[i] = updated;
    }
    return updated;
  },

  async remove(id) {
    await api("/field-logs/" + id, { method: "DELETE" });
    if (this._cache) {
      this._cache = this._cache.filter(function (l) { return l.id !== id; });
    }
  },

  async imageOf(id) {
    return await api("/images/" + id);
  },

  // opts.search = true เพื่อให้ AI ค้นข้อมูลจากเว็บประกอบการตอบ
  // ไม่เปิดตลอดเพราะตอนวิเคราะห์ภาพเราต้องการให้ยึดผลจากโมเดลกับฐานความรู้ในระบบ
  // ถ้าเปิดค้นเว็บด้วย AI มักไปหยิบบทความทั่วไปที่อาจมีชื่อสารเคมีไม่ตรงกับกรมการข้าว
  async askGemini(prompt, image, opts) {
    var body = { prompt: prompt };
    if (image) body.image = image;
    if (opts && opts.search) body.search = true;
    var data = await api("/gemini", { method: "POST", body: body });
    // Worker เวอร์ชันเก่าไม่ส่ง imageReceived กลับมา ถือว่าภาพไม่ถึง Gemini
    return {
      text: data.text,
      sawImage: data.imageReceived === true,
      searchUsed: data.searchUsed === true,
      sources: data.sources || []
    };
  },

  // โปรไฟล์มาจากบัญชีที่ล็อกอิน ไม่ใช่ localStorage แล้ว
  // ข้อมูลจึงตามผู้ใช้ไปทุกเครื่อง
  profile() {
    return Session.user || { name: "ผู้ใช้", farm: "", phone: "" };
  },

  async saveProfile(p) {
    var data = await api("/auth/me", { method: "PATCH", body: p });
    Session.user = data.user;
    return data.user;
  },

  reset() {
    this._cache = null;
    this._offline = false;
  }
};


function markLink() {
  var dot = document.getElementById("linkDot"), txt = document.getElementById("linkText");
  if (!dot) return;
  var off = Store.isOffline();
  dot.className = "dot " + (off ? "down" : "live");
  txt.textContent = off ? "ออฟไลน์ เก็บในเครื่อง" : "เชื่อมต่อเซิร์ฟเวอร์แล้ว";
}

// ─── โมเดล AI (คุยผ่าน iframe แยก) ──────────────
var models = {
  rice:    { frame: document.getElementById("riceFrame"),    ready: false, props: null },
  disease: { frame: document.getElementById("diseaseFrame"), ready: false, props: null }
};
var waiting = {};
var seq = 0;

window.addEventListener("message", function (e) {
  var msg = e.data;
  if (!msg || !msg.type) return;
  var which = e.source === models.rice.frame.contentWindow ? "rice"
            : e.source === models.disease.frame.contentWindow ? "disease" : null;
  if (!which) return;

  if (msg.type === "ready") {
    models[which].ready = true;
    models[which].props = msg.properties;
    models[which].project = msg.project;
    // เช็คตั้งแต่ตอนโหลดว่าทุกคลาสของโมเดลมีข้อมูลแนวทางแก้ไขครบไหม
    // ถ้าขาดจะเตือนใน console ทันที ดีกว่าไปรู้ตอนสาธิตแล้วการ์ดไม่ขึ้น
    if (which === "disease" && typeof window.auditDiseaseLabels === "function") {
      console.info("[โมเดลโรค] คลาสที่โมเดลส่งได้:", (msg.properties && msg.properties.labels) || []);
      window.auditDiseaseLabels((msg.properties && msg.properties.labels) || []);
    }
    markBrain();
  } else if (msg.type === "init-error") {
    models[which].error = msg.message;
    markBrain();
  } else if (msg.type === "result" && waiting[msg.requestId]) {
    waiting[msg.requestId].resolve(msg.result);
    delete waiting[msg.requestId];
  } else if (msg.type === "error" && waiting[msg.requestId]) {
    waiting[msg.requestId].reject(new Error(msg.message));
    delete waiting[msg.requestId];
  }
});

function classify(which, features) {
  return new Promise(function (resolve, reject) {
    var id = ++seq;
    waiting[id] = { resolve: resolve, reject: reject };
    models[which].frame.contentWindow.postMessage({ type: "classify", requestId: id, features: features }, "*");
    setTimeout(function () {
      if (waiting[id]) { delete waiting[id]; reject(new Error("โมเดลใช้เวลานานเกินไป ลองใหม่อีกครั้ง")); }
    }, 30000);
  });
}

function brainReady() { return models.rice.ready && models.disease.ready; }

// ไฟล์โมเดลมีขนาดหลายสิบเมกะไบต์ ครั้งแรกที่เปิดเว็บบนเน็ตมือถือจึงอาจใช้เวลานาน
// ถ้าไม่บอกอะไรเลยผู้ใช้จะคิดว่าเว็บค้างแล้วปิดทิ้ง ทั้งที่กำลังโหลดอยู่
// ตัวจับเวลานี้จึงเปลี่ยนข้อความหลังผ่านไประยะหนึ่ง เพื่ออธิบายว่าเกิดอะไรขึ้น
var brainStart = Date.now();
function loadPhase() {
  var sec = (Date.now() - brainStart) / 1000;
  if (sec < 12) return "กำลังโหลดโมเดล";
  if (sec < 45) return "กำลังดาวน์โหลดโมเดล (ครั้งแรกใช้เวลาสักครู่)";
  return "เน็ตช้า ยังดาวน์โหลดโมเดลอยู่ ครั้งต่อไปจะเร็วขึ้นเพราะเบราว์เซอร์เก็บไว้แล้ว";
}

function markBrain() {
  var dot = document.getElementById("brainDot"), txt = document.getElementById("brainText");
  if (dot) {
    if (models.rice.error || models.disease.error) {
      dot.className = "dot down"; txt.textContent = "โหลดโมเดลไม่สำเร็จ";
    } else if (brainReady()) {
      dot.className = "dot live"; txt.textContent = "โมเดล 2 ตัวพร้อมใช้";
    } else {
      dot.className = "dot"; txt.textContent = loadPhase();
    }
  }
  document.querySelectorAll("[data-needs-brain]").forEach(function (btn) {
    if (models.rice.error || models.disease.error) {
      btn.textContent = "โหลดโมเดลไม่สำเร็จ"; btn.disabled = true;
    } else if (brainReady()) {
      btn.textContent = btn.dataset.readyLabel || "วิเคราะห์ภาพ";
      btn.disabled = !btn.dataset.armed;
    } else {
      btn.textContent = "กำลังโหลดโมเดล AI"; btn.disabled = true;
    }
  });

  // ระหว่างที่ยังโหลดไม่เสร็จ ให้อัปเดตข้อความเองทุก 5 วินาที
  // เพราะไม่มีอีเวนต์อะไรมากระตุ้น markBrain ในช่วงนี้
  if (!brainReady() && !models.rice.error && !models.disease.error) {
    clearTimeout(markBrain._t);
    markBrain._t = setTimeout(markBrain, 5000);
  } else {
    clearTimeout(markBrain._t);
  }
}

function inputSize(props) {
  return {
    w: (props && props.image_input_width) || 96,
    h: (props && props.image_input_height) || 96
  };
}

function extractFeatures(img, w, h) {
  var c = document.createElement("canvas");
  c.width = w; c.height = h;
  var ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  var d = ctx.getImageData(0, 0, w, h).data;
  var f = new Array(w * h);
  for (var i = 0, p = 0; i < d.length; i += 4, p++) f[p] = (d[i] << 16) + (d[i+1] << 8) + d[i+2];
  return f;
}

// ย่อรูปก่อนส่งให้ Gemini — รูปจากมือถือมักหลาย MB ส่งดิบจะช้าและเปลือง token
function imageToBase64(img, maxSide) {
  maxSide = maxSide || 800;
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  var scale = Math.min(1, maxSide / Math.max(w, h));
  var c = document.createElement("canvas");
  c.width = Math.round(w * scale);
  c.height = Math.round(h * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { data: c.toDataURL("image/jpeg", 0.85).split(",")[1], mimeType: "image/jpeg" };
}

// ─── ด่านกรองสี/พื้นผิวก่อนเข้าโมเดล ────────────
// โมเดลถูกฝึกให้ต้องเลือกคำตอบเสมอ ภาพที่ไม่ใช่พืชจึงได้คำตอบมั่วแต่มั่นใจสูง
// ด่านนี้ตัดภาพแบบนั้นทิ้งก่อนถึงโมเดล
function preCheck(img) {
  var SIZE = 64;
  var c = document.createElement("canvas");
  c.width = SIZE; c.height = SIZE;
  var ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, SIZE, SIZE);
  var d = ctx.getImageData(0, 0, SIZE, SIZE).data;

  var gray = new Float32Array(SIZE * SIZE);
  for (var p = 0; p < SIZE * SIZE; p++) {
    var i = p * 4;
    gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }

  var mid = (SIZE - 1) / 2, maxDist = Math.sqrt(2) * mid, EDGE_NORM = 900;
  var colorW = 0, edgeW = 0, wSum = 0, green = 0, yellow = 0, other = 0, total = 0;

  for (var y = 1; y < SIZE - 1; y++) {
    for (var x = 1; x < SIZE - 1; x++) {
      var k = (y * SIZE + x) * 4;
      var hsl = rgbToHsl(d[k], d[k+1], d[k+2]);
      var isGreen = hsl.h >= 60 && hsl.h <= 170;
      var isYB = hsl.h >= 20 && hsl.h < 60;
      var vivid = hsl.s > 0.12 && hsl.l > 0.08 && hsl.l < 0.9;
      total++;
      if (isGreen && vivid) green++;
      else if (isYB && vivid) yellow++;
      else other++;

      var gx = -gray[(y-1)*SIZE+(x-1)] + gray[(y-1)*SIZE+(x+1)]
             - 2*gray[y*SIZE+(x-1)] + 2*gray[y*SIZE+(x+1)]
             - gray[(y+1)*SIZE+(x-1)] + gray[(y+1)*SIZE+(x+1)];
      var gy = -gray[(y-1)*SIZE+(x-1)] - 2*gray[(y-1)*SIZE+x] - gray[(y-1)*SIZE+(x+1)]
             + gray[(y+1)*SIZE+(x-1)] + 2*gray[(y+1)*SIZE+x] + gray[(y+1)*SIZE+(x+1)];
      var edge = Math.min(Math.sqrt(gx*gx + gy*gy) / EDGE_NORM, 1);

      var dist = Math.sqrt((x-mid)*(x-mid) + (y-mid)*(y-mid)) / maxDist;
      var w = 1 - 0.6 * dist;   // กลางภาพมีน้ำหนักกว่าขอบ เพราะวัตถุหลักมักอยู่กลางเฟรม
      colorW += ((isGreen || isYB) && vivid ? 1 : 0) * w;
      edgeW += edge * w;
      wSum += w;
    }
  }

  var colorScore = colorW / wSum, edgeScore = edgeW / wSum;
  var texture = 0.5 + 0.5 * Math.min(edgeScore / 0.08, 1);
  var plant = colorScore * texture;
  if (edgeScore < 0.015) plant = Math.min(plant, 0.3);  // ผิวเรียบสนิทไม่ใช่ใบไม้จริง

  var greenPct = green / total * 100;
  var GREEN_MIN = 15;   // ใบข้าวจริงต้องมีเขียวเหลืออยู่บ้าง แม้ป่วยหนัก

  return {
    skip: greenPct < GREEN_MIN || plant < 0.18,
    why: greenPct < GREEN_MIN
      ? "ภาพนี้มีสีเขียวเพียง " + Math.round(greenPct) + "% ต่ำกว่าเกณฑ์ใบข้าว จึงไม่ส่งเข้าโมเดล"
      : "ภาพนี้ไม่มีลักษณะพื้นผิวของใบพืช จึงไม่ส่งเข้าโมเดล",
    green: Math.round(greenPct),
    yellow: Math.round(yellow / total * 100),
    other: Math.round(other / total * 100)
  };
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b), l = (max+min)/2, h = 0, s = 0, dd = max-min;
  if (dd !== 0) {
    s = dd / (1 - Math.abs(2*l - 1));
    if (max === r) h = 60 * (((g-b)/dd) % 6);
    else if (max === g) h = 60 * ((b-r)/dd + 2);
    else h = 60 * ((r-g)/dd + 4);
  }
  if (h < 0) h += 360;
  return { h: h, s: s, l: l };
}

// ตรวจครบ 2 ขั้น: เป็นข้าวไหม → ถ้าใช่ ตรวจโรคต่อ
async function runFullAnalysis(img) {
  var pre = preCheck(img);
  var out = { pre: pre, rice: null, disease: null, topDisease: null, isRice: false, gated: false };

  if (pre.skip) {
    var labels = (models.rice.props && models.rice.props.labels) || ["Rice", "not Rice"];
    var neg = labels.find(function (l) { return /not|non|other|ไม่ใช่/i.test(l); }) || labels[labels.length-1];
    out.rice = { results: labels.map(function (l) { return { label: l, value: l === neg ? 1 : 0 }; }) };
    out.gated = true;
    return out;
  }

  var rs = inputSize(models.rice.props);
  out.rice = await classify("rice", extractFeatures(img, rs.w, rs.h));

  var ranked = out.rice.results.slice().sort(function (a,b) { return b.value - a.value; });
  out.isRice = ranked[0] && !/not|non|other|ไม่ใช่/i.test(ranked[0].label);

  if (out.isRice && models.disease.ready) {
    var ds = inputSize(models.disease.props);
    out.disease = await classify("disease", extractFeatures(img, ds.w, ds.h));
    out.topDisease = out.disease.results.slice().sort(function (a,b) { return b.value - a.value; })[0];
  }
  return out;
}

// คะแนนสุขภาพ: ใบปกติได้เกือบเต็ม ใบป่วยหักตามความมั่นใจของโมเดล
//
// ── แก้ไข 2026-08: ภาพที่ไม่ใช่ใบข้าวต้องไม่มีคะแนน ไม่ใช่ได้ 99 ──
//
// ของเดิมคืน 99 ให้ภาพที่ไม่ใช่ใบข้าว ซึ่งเป็นคะแนนสูงสุดในทั้งระบบ
// สูงกว่าใบข้าวที่แข็งแรงจริง (95) ด้วยซ้ำ ถ่ายอะไรก็ได้ที่ไม่ใช่ข้าวเข้าไป
// ระบบจะบอกว่าแปลงสมบูรณ์ที่สุด ซึ่งตรงข้ามกับความจริงโดยสิ้นเชิง
//
// และความเสียหายไม่ได้จบที่ตัวเลขบนหน้าจอ คะแนนนี้ถูกเก็บลงทะเบียน
// แล้ว buildFarmContext() เอาไปหาค่าเฉลี่ยส่งให้ AI ทุกคำถาม
// ภาพหลุดเข้าไปไม่กี่ภาพก็ดันค่าเฉลี่ยขึ้นจนคำแนะนำที่ AI ให้เกษตรกรเพี้ยนตาม
// เท่ากับข้อมูลขยะไหลจากหน้าจอไปถึงชั้นที่ให้คำแนะนำจริงในแปลง
//
// คืน null แทน แปลว่า "ประเมินไม่ได้" ซึ่งต่างจาก "ประเมินแล้วได้คะแนนต่ำ"
// buildGauge รองรับ null อยู่แล้วโดยแสดงขีดกลางแทนตัวเลข
// และตัวรวมสถิติกรองเฉพาะค่าที่เป็นตัวเลขอยู่แล้ว จึงไม่ปนเข้าค่าเฉลี่ย
function healthScore(r) {
  if (!r.isRice) return null;
  if (!r.topDisease) return 90;
  if (/healthy/i.test(r.topDisease.label)) return 95;
  return Math.max(40, Math.round(100 - r.topDisease.value * 45));
}

// แสดงคะแนนในตาราง ค่าที่ประเมินไม่ได้ต้องเป็นขีดกลาง ไม่ใช่คำว่า null
function scoreText(v) {
  return typeof v === "number" ? String(v) : "—";
}
function diagnosisName(r) {
  if (!r.isRice) return "ภาพไม่ชัดเจน";
  if (!r.topDisease) return "ไม่ระบุ";
  return th(r.topDisease.label);
}

// ─── ฐานความรู้แนวทางแก้ไข ─────────────────────
// ใช้ findDiseaseGuide จาก disease-guide.js ซึ่งเทียบชื่อแบบ normalize
// ("Brown spot" = "brownspot" = "BROWNSPOT") เพื่อไม่ให้การ์ดแนวทางแก้ไข
// หายไปเงียบๆ ทุกครั้งที่เทรนโมเดลใหม่แล้วชื่อ label เปลี่ยน
// ส่วน fallback ด้านล่างไว้กันกรณีใช้ disease-guide.js เวอร์ชันเก่าที่ยังไม่มีฟังก์ชันนี้
function getGuide(label) {
  if (!label) return null;
  if (typeof window.findDiseaseGuide === "function") return window.findDiseaseGuide(label);
  return (window.DISEASE_GUIDE && window.DISEASE_GUIDE[label]) || null;
}

function buildRx(label) {
  var g = getGuide(label);
  if (!g) return null;

  var urgent = g.urgency || "";
  var tone = urgent.indexOf("สูง") === 0 ? "bad" : urgent === "ปานกลาง" ? "warn" : "";
  var box = el("div", "rx " + tone);

  var top = el("div", "rx-top");
  top.appendChild(el("div", "rx-name", "แนวทางจัดการ: " + g.thai));
  if (urgent && urgent !== "-") {
    var flagTone = urgent.indexOf("สูง") === 0 ? "hi" : urgent === "ปานกลาง" ? "mid" : "lo";
    top.appendChild(el("span", "rx-flag " + flagTone, "ความเร่งด่วน " + urgent));
  }
  box.appendChild(top);

  function part(head, body) {
    if (!body || (Array.isArray(body) && !body.length)) return;
    box.appendChild(el("div", "rx-sect", head));
    if (Array.isArray(body)) {
      var ul = el("ul");
      body.forEach(function (line) { ul.appendChild(el("li", "", line)); });
      box.appendChild(ul);
    } else {
      box.appendChild(el("p", "", body));
    }
  }
  part("สาเหตุ", g.cause);
  part("ลักษณะอาการ", g.symptoms);
  part("วิธีจัดการ", g.treatment);
  part("การป้องกันรอบหน้า", g.prevention);

  if (g.source && g.source !== "-") box.appendChild(el("div", "rx-src", "อ้างอิง: " + g.source));
  return box;
}

// ส่งฐานความรู้ให้ Gemini อ้างอิง ถ้าไม่มีข้อมูลบอกตรงๆ ไม่ปล่อยให้เดา
function guideForPrompt(label) {
  var g = getGuide(label);
  if (!g) return "\n\n[ไม่มีข้อมูลแนวทางแก้ไขของโรคนี้ในฐานข้อมูลอ้างอิง — แจ้งผู้ใช้ให้ปรึกษาเจ้าหน้าที่เกษตรในพื้นที่ ห้ามแต่งชื่อสารเคมีหรืออัตราใช้ขึ้นเอง]";
  return "\n\n[ข้อมูลอ้างอิงทางการ ให้ยึดเป็นหลัก ห้ามเพิ่มชื่อสารเคมีหรืออัตราใช้เอง]\n" +
    "โรค: " + g.thai + "\nสาเหตุ: " + g.cause + "\nอาการ: " + g.symptoms +
    "\nวิธีจัดการ: " + (g.treatment || []).join(" / ") +
    "\nการป้องกัน: " + (g.prevention || []).join(" / ");
}

// ═══ ระบบเลือกความรู้ส่งให้ AI ═══
//
// ปัญหาเดิม: ระบบเช็คแค่คำว่า "ปุ๋ย" กับ "ดิน" ถามเรื่องโรค ต้นทุน หรือระยะข้าว
// AI จะไม่ได้รับข้อมูลอะไรเลยและต้องเดาเอาเองล้วนๆ ทั้งที่เรามีฐานความรู้ครบ
//
// วิธีแก้: ให้คะแนนแต่ละหมวดตามคำที่พบในคำถาม แล้วส่งเฉพาะหมวดที่เกี่ยวข้อง
// ถ้าไม่ตรงหมวดไหนเลย ส่งสารบัญย่อของทุกหมวดแทนการไม่ส่งอะไร
// เพราะ AI ที่รู้ว่า "ระบบมีข้อมูลอะไรบ้าง" จะชี้ทางให้ผู้ใช้ได้ถูกหน้า
//
// เพดานอยู่ที่ 2 หมวดต่อคำถาม เพื่อคุมความยาวไม่ให้เปลืองโควตาเกินจำเป็น

var TOPICS = {

  // ── แมลงและสัตว์ศัตรูข้าว (เพิ่ม 2026-08) ──
  //
  // วางเป็นหมวดแรกโดยตั้งใจ เพราะ knowledgeFor เรียงตามลำดับที่นิยามไว้ในอ็อบเจกต์นี้
  // และหยิบแค่ 2 หมวดแรกที่ตรง คำถามที่มีทั้งคำว่า "เพลี้ย" และ "ใบเหลือง" จึงได้หมวดนี้แน่นอน
  // ซึ่งถูกต้อง เพราะร่องรอยทางกายภาพอย่างรอยกัดหรือตัวแมลงเป็นหลักฐานที่หนักแน่นกว่าสีของใบ
  pest: {
    // ใช้คำสั้นอย่าง "กัด" "แหว่ง" "เหี่ยว" แทนวลียาวอย่าง "ใบแหว่ง" "ยอดเหี่ยว"
    // เพราะผู้ใช้พิมพ์ตามธรรมชาติว่า "ใบข้าวมีรอยกัดแหว่ง" หรือ "ยอดข้าวเหี่ยวดึงหลุดง่าย"
    // ซึ่งวลียาวจับไม่ได้เลย ทั้งที่เป็นอาการที่ชี้ชัดว่าเป็นแมลงมากที่สุด
    words: /แมลง|เพลี้ย|หนอน|หอยเชอรี่|หอย|ปูนา|บั่ว|แมลงสิง|กัด|แทะ|แหว่ง|เหี่ยว|ใบขาด|ม้วนใบ|หัวหงอก|ห่อใบ|เจาะ|ดูดกิน|ศัตรูพืช|ศัตรูข้าว|ตัวหนอน|ผีเสื้อ|ไข่สีชมพู|หลอดบั่ว|ตัวห้ำ|แตนเบียน|มวนเขียว/i,
    build: function (q) {
      var P = window.PEST_GUIDE;
      if (!P) return null;
      var t = q || "";

      var out = ["[ฐานความรู้แมลงและสัตว์ศัตรูข้าว อ้างอิงเอกสารความรู้ Rice Knowledge Bank กรมการข้าว]"];

      // ตัวแยกอาการต้องส่งไปทุกครั้ง เพราะเป็นหัวใจของหมวดนี้
      // ผู้ใช้ส่วนใหญ่ไม่รู้ว่าที่เจอเป็นโรคหรือแมลง ถ้า AI แยกไม่ได้ก็ช่วยอะไรไม่ได้เลย
      out.push("[วิธีแยกว่าเป็นแมลงหรือโรค ใช้ก่อนเสมอเมื่อผู้ใช้บรรยายอาการ]");
      P.triage.forEach(function (x) { out.push("- " + x); });

      // เลือกส่งเฉพาะชนิดที่ตรงกับคำถาม ถ้าไม่ตรงชนิดไหนเลยจึงส่งทั้งหมด

      var match = {

      // ถ้าไม่เอ่ย ส่งทุกพันธุ์แบบย่อเพื่อให้ AI เปรียบเทียบและแนะนำได้
      var named = V.varieties.filter(function (v) {
        var alt = v.thai.replace(/\s/g, "");
        return new RegExp(v.thai.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i").test(t) ||
               new RegExp(alt.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i").test(t.replace(/\s/g, ""));

      if (named.length) {
        named.forEach(function (v) {
          out.push("- " + v.thai + " (" + v.en + ") " + v.grain +
                   " | " + (v.photo ? "ไวต่อช่วงแสง ปลูกเป็นนาปี เก็บเกี่ยวประมาณวันที่ " +
                              v.harvestDate.day + " เดือน " + v.harvestDate.month + " ของทุกปี ไม่ขึ้นกับวันหว่าน"
                            : "ไม่ไวต่อช่วงแสง ปลูกเป็นนาปรัง อายุเก็บเกี่ยว " + v.harvestDays + " วันหลังหว่าน") +
                   " | ผลผลิตประมาณ " + v["yield"] + " กก./ไร่" +
                   " | ต้นสูงประมาณ " + v.height + " ซม." +
                   " | ลักษณะเด่น: " + (v.strengths || []).join(" ") +
                   (v.resistDisease && v.resistDisease.length ? " | ต้านทานโรค: " + v.resistDisease.join(", ") : "") +
                   " | ไม่ต้านทานโรค: " + (v.weakDisease || []).join(", ") +
                   " | ไม่ต้านทานแมลง: " + (v.weakPest || []).join(", ") +
                   " | พื้นที่แนะนำ: " + v.region +
                   (v.note ? " | ข้อควรระวัง: " + v.note : ""));
        });
      } else {
        out.push("[พันธุ์ที่ระบบมีข้อมูล เรียงตามกลุ่ม]");
        V.varieties.forEach(function (v) {
          out.push("- " + v.thai + " (" + v.grain + ") " +
                   (v.photo ? "นาปี เก็บเกี่ยวประมาณ " + v.harvestDate.day + "/" + v.harvestDate.month
                            : "นาปรัง อายุ " + v.harvestDays + " วัน") +
                   " ผลผลิต " + v["yield"] + " กก./ไร่ | อ่อนแอต่อ: " +
                   (v.weakDisease || []).concat(v.weakPest || []).join(", "));
        });
      }

      out.push("[กฎการตอบหมวดนี้] " +
               "1. เรื่องจังหวะใส่ปุ๋ยครั้งที่ 2 ให้ยึดหลัก 30 วันก่อนออกดอก และออกดอกคือ 30 วันก่อนเก็บเกี่ยว " +
               "พันธุ์ไวต่อช่วงแสงคำนวณจากวันเก็บเกี่ยวในปฏิทินได้เลย ส่วนพันธุ์ไม่ไวต่อช่วงแสงต้องรู้วันหว่านก่อน " +
               "ถ้าผู้ใช้ยังไม่บอกวันหว่าน ให้ถาม อย่าเดา | " +
               "2. แนะนำให้ผู้ใช้ไปตั้งชื่อพันธุ์และวันหว่านที่หน้าที่นาของฉัน แล้วระบบจะคำนวณวันจริงให้ทุกหน้า | " +
               "3. ห้ามแนะนำให้ปลูกพันธุ์เดียวติดต่อกันเกิน 4 ฤดู เพราะแมลงจะปรับตัวทำลายพันธุ์ต้านทานได้ | " +
               "4. เรื่องผลผลิตต่อไร่เป็นค่าจากแปลงทดลอง ผลผลิตจริงของเกษตรกรมักต่ำกว่า ต้องบอกด้วยทุกครั้ง]");
      return out.join("\n");
    }
  },

  // ── การปลูกและการจัดการน้ำ (เพิ่ม 2026-08) ──
  //
  // เนื้อหาจาก Rice Knowledge Bank หมวดการปลูกและการดูแลรักษา
  // เดิมระบบตอบเรื่องดิน ปุ๋ย โรค และระยะข้าวได้ แต่ตอบไม่ได้เลยว่า
  // "จะปลูกยังไง" ซึ่งเป็นคำถามแรกสุดของคนที่กำลังจะเริ่มทำนา
  //
  // วางไว้ก่อน cost เพราะ knowledgeFor() หยิบแค่ 2 หมวดแรกที่ตรง
  // คำถามเรื่องวิธีปลูกมักมีคำว่า "ไร่" หรือ "กี่กิโล" ปนมาด้วย
  // ถ้าวางหลัง cost จะโดนหมวดต้นทุนแย่งไปทั้งที่ผู้ใช้ถามเรื่องวิธีทำ
  planting: {
    words: /ปลูก|ทำนา|นาดำ|นาหว่าน|นาหยอด|นาปรัง|นาปี|หว่าน|ปักดำ|โยนกล้า|ตกกล้า|กล้า|เมล็ดพันธุ์|แช่เมล็ด|หุ้มเมล็ด|ตุ่มตา|เทือก|ไถดะ|ไถแปร|คราด|ขั้นบันได|เปียกสลับแห้ง|ให้น้ำ|ขังน้ำ|ระยะปักดำ|อัตราเมล็ด|ข้าวไร่|ดำนา|เครื่องปักดำ/i,
    build: function (q) {
      var P = window.PLANTING_GUIDE;
      if (!P) return null;

      // ── ส่งเฉพาะหัวข้อย่อยที่ตรงกับคำถาม ──
      //
      // หมวดนี้ใหญ่กว่าหมวดอื่นมาก ถ้าส่งทั้งก้อนจะยาวเกือบ 17,000 ตัวอักษร
      // เมื่อรวมกับอีกหมวดที่ knowledgeFor เลือกมาด้วย พรอมต์จะทะลุ 25,000
      // ซึ่งเปลืองโควตาและทำให้ AI ตอบคลุมเครือลงเพราะข้อมูลเยอะเกินจะโฟกัส
      //
      // จึงแยกเป็น 4 หัวข้อย่อยแล้วเลือกส่งเฉพาะที่ตรง ถ้าไม่ตรงหัวข้อไหนเลย
      // แปลว่าเป็นคำถามกว้างอย่าง "ปลูกข้าวยังไง" จึงส่งภาพรวมของทุกหัวข้อแทน
      // ซึ่งสั้นกว่าและตรงกับสิ่งที่ผู้ใช้ต้องการจริงคือคำตอบระดับภาพรวม
      var t = q || "";
      var want = {
        land:  /เตรียมดิน|ไถ|คราด|เทือก|ตากดิน|ตอซัง|ฟาง|ดินเปรี้ยว/i.test(t),
        seed:  /เมล็ดพันธุ์|แช่เมล็ด|หุ้มเมล็ด|ตุ่มตา|ความงอก|ตกกล้า|กล้า|ถาดเพาะ|แผ่นกล้า/i.test(t),
        how:   /ปลูก|ทำนา|นาดำ|นาหว่าน|นาหยอด|หว่าน|ปักดำ|โยนกล้า|ขั้นบันได|ข้าวไร่|ระยะปักดำ|เครื่องปักดำ|อัตราเมล็ด/i.test(t),
        water: /น้ำ|เปียกสลับแห้ง|ขังน้ำ|ระบายน้ำ|ให้น้ำ|ระดับน้ำ|ชลประทาน|แล้ง|ประหยัดน้ำ/i.test(t)
      };
      var any = want.land || want.seed || want.how || want.water;

      var out = ["[ฐานความรู้การปลูกข้าวและการจัดการน้ำ อ้างอิง Rice Knowledge Bank กรมการข้าว " +
                 "ห้ามแต่งอัตราเมล็ดพันธุ์ ระยะปักดำ หรือจำนวนวันที่ไม่มีในข้อมูลนี้]"];

      // คำถามกว้าง ส่งภาพรวมสั้นๆ แล้วชวนให้ถามเจาะจงต่อ
      if (!any) {
        out.push("[ภาพรวม] " + P.landPrep.intro);
        out.push("วิธีปลูกข้าวที่ระบบมีข้อมูล: " + P.methods.map(function (m) {
          return m.thai;
        }).join(" · "));
        out.push("อัตราเมล็ดพันธุ์ต่างกันมากตามวิธี — นาดำใช้ 80-90 กก./ไร่ ในแปลงกล้า " +
                 "ซึ่งได้กล้าปักดำ 15-20 ไร่ | นาหว่านน้ำตมใช้ 7-8 กก./ไร่ ถ้าเตรียมดินดี " +
                 "หรือ 15-20 กก./ไร่ ถ้าปรับพื้นที่ได้ไม่ดี | การโยนกล้าใช้เพียง 4-5 กก./ไร่");
        out.push("การจัดการน้ำมีทั้งแบบขังตลอดฤดู แบบเปียกสลับแห้งที่ประหยัดน้ำ " +
                 "แบบหมุนเวียน และการระบายน้ำกลางฤดู");
        out.push("[ถามให้เจาะจงขึ้นได้ เช่น เตรียมดินยังไง แช่เมล็ดพันธุ์กี่ชั่วโมง " +
                 "นาหว่านใช้เมล็ดกี่กิโลต่อไร่ หรือเปียกสลับแห้งทำยังไง " +
                 "ให้ชวนผู้ใช้ถามต่อในหัวข้อที่เขาสนใจ อย่าเดารายละเอียดเอง]");
        return out.join("\n");
      }

      if (want.land) {
      out.push("[การเตรียมดิน] " + P.landPrep.intro);
      P.landPrep.steps.forEach(function (x) {
        out.push("- " + x.title + ": " + x.detail);
      });
      P.landPrep.cautions.forEach(function (c) {
        out.push("  ข้อควรระวัง: " + c);
      });
      }

      var sp = P.seedPrep;
      if (want.seed) {
      out.push("[การเตรียมเมล็ดพันธุ์] " + sp.seed.quality);
      out.push("- ทดสอบความงอก: " + sp.seed.test);
      out.push("- " + sp.seed.soak);
      out.push("  ข้อควรระวัง: " + sp.seed.warn);

      out.push("[การตกกล้า]");
      out.push("- " + sp.nurseryWet.thai + ": " + sp.nurseryWet.detail +
               " | อัตราเมล็ด: " + sp.nurseryWet.rate +
               " | การหว่าน: " + sp.nurseryWet.sow +
               " | การให้น้ำ: " + sp.nurseryWet.water +
               " | ปุ๋ยแปลงกล้า: " + sp.nurseryWet.fert);
      out.push("- " + sp.nurseryDry.thai + ": " + sp.nurseryDry.when);
      sp.nurseryDry.kinds.forEach(function (k) { out.push("    " + k); });
      out.push("- " + sp.matSeedling.thai + ": " + sp.matSeedling.spec +
               " | " + sp.matSeedling.tray + " | " + sp.matSeedling.bed +
               " | ข้อควรระวัง: " + sp.matSeedling.cautions.join(" "));
      out.push("- " + sp.tossSeedling.thai + ": " + sp.tossSeedling.steps.join(" ") +
               " | ข้อควรระวัง: " + sp.tossSeedling.cautions.join(" "));
      }

      if (want.how) {
      out.push("[วิธีปลูกข้าว]");
      P.methods.forEach(function (m) {
        var line = "- " + m.thai + ": " + m.what;
        ["spacing", "depth", "age", "water", "dry", "wet", "prep", "level", "rate", "care", "kinds", "cautions"]
          .forEach(function (k) { if (m[k]) line += " | " + m[k]; });
        if (m.steps) line += " | ขั้นตอน: " + m.steps.join(" ");
        out.push(line);
      });
      }

      if (want.water) {
      out.push("[การจัดการน้ำ] " + P.water.intro);
      out.push("แบบเต็มรูปแบบ:");
      P.water.full.forEach(function (w) { out.push("- " + w.title + ": " + w.detail); });
      out.push("แบบประหยัดน้ำ — " + P.water.awd.thai + " (" + P.water.awd.note + ")");
      P.water.awd.steps.forEach(function (x, i) { out.push("    " + (i + 1) + ". " + x); });
      out.push("    ข้อจำกัดของ AWD: " + P.water.awd.limits.join(" | "));
      P.water.saving.forEach(function (w) { out.push("- " + w.title + ": " + w.detail); });
      }

      out.push("[กฎการตอบหมวดนี้] " +
               "1. ต้องถามหรือระบุก่อนเสมอว่าผู้ใช้ทำนาแบบไหน เพราะอัตราเมล็ดพันธุ์ต่างกันหลายเท่า " +
               "นาดำใช้ 80-90 กก./ไร่ ในแปลงกล้าซึ่งได้กล้าปักดำ 15-20 ไร่ ส่วนนาหว่านน้ำตมใช้ 7-20 กก./ไร่ " +
               "และการโยนกล้าใช้เพียง 4-5 กก./ไร่ ถ้าตอบตัวเลขโดยไม่ระบุวิธี ผู้ใช้จะซื้อเมล็ดผิดจำนวนมาก | " +
               "2. ระยะปักดำและอายุกล้าต่างกันตามพันธุ์ไวหรือไม่ไวต่อช่วงแสง ต้องระบุให้ชัดทุกครั้ง | " +
               "3. เรื่องสารกำจัดวัชพืช ห้ามระบุชื่อสารหรืออัตราใช้ ให้แนะนำปรึกษาเกษตรอำเภอ]");
      return out.join("\n");
    }
  },

  cost: {
    words: /ต้นทุน|กำไร|ขาดทุน|ราคา|บาท|ขาย|รายได้|คุ้มทุน|ลงทุน|ค่าใช้จ่าย|แพง|ถูก|ประหยัด|ผลผลิต|กี่ไร่|ต่อไร่/i,
    build: function () {

      var out = ["[ข้อมูลต้นทุนและราคาข้าว อ้างอิงสำนักงานเศรษฐกิจการเกษตร " + C.asOf + "]"];
      out.push("ค่ากลางประเทศ: ต้นทุน " + C.baseline.costPerRai + " บาท/ไร่ | ผลผลิต " +

               "และแนะนำให้ใช้หน้าต้นทุนและกำไรซึ่งคำนวณให้ครบและปรับตัวเลขเองได้]");
      return out.join("\n");
    }
  },

  weather: {
    words: /อากาศ|ฝน|แดด|ความชื้น|อุณหภูมิ|ร้อน|หนาว|แล้ง|น้ำท่วม|พยากรณ์|ลม|ฤดู/i,
    build: function () {
      if (typeof RISK_RULES === "undefined") return null;
      var out = ["[ความสัมพันธ์ระหว่างสภาพอากาศกับความเสี่ยงโรค]"];
      RISK_RULES.forEach(function (r) {
        out.push("- " + r.thai + ": " + r.why);
      });
      out.push("[ระบบมีหน้าอากาศและความเสี่ยงที่คำนวณดัชนีให้อัตโนมัติจากพิกัดแปลง แนะนำให้ผู้ใช้ไปดู]");
      return out.join("\n");
    }
  }
};

// สารบัญย่อ ส่งเมื่อคำถามไม่ตรงหมวดไหนเลย

// ตัวแยกโรคกับแมลงแบบย่อ ส่งไปได้บ่อยโดยไม่เปลืองโควตา

function pestTriage() {
  var P = window.PEST_GUIDE;

  return "[วิธีแยกว่าอาการที่เห็นเกิดจากโรคหรือแมลง ใช้ก่อนเสมอเมื่อยังไม่รู้สาเหตุ]\n" +
    P.triage.map(function (x) { return "- " + x; }).join("\n") +
    "\n[ห้ามสรุปว่าเป็นโรคหรือปัญหาดินโดยไม่ตัดความเป็นไปได้เรื่องแมลงออกก่อน " +

    "ส่วนกระจายทั่วแปลงตามพื้นที่ลุ่มมักเกิดจากดินหรือน้ำ]";
