views.diagnose = function (root) {
  root.appendChild(bund("รับภาพเข้าตรวจ"));

  var wrap = el("div", "row-2");

  var left = plot("ภาพใบข้าว", "ระบบตรวจ 2 ขั้น: เป็นใบข้าวหรือไม่ → ถ้าใช่ จำแนกชนิดโรค");
  var intake = makeIntake({
    onReady: function () { runBtn.dataset.armed = "1"; markBrain(); },
    onFail: function (m) { showFlash(m, "bad"); }
  });
  left.appendChild(intake.node);

  var runBtn = el("button", "act act-go act-wide");
  runBtn.style.marginTop = "14px";
  runBtn.setAttribute("data-needs-brain", "");
  runBtn.dataset.readyLabel = "ตรวจภาพนี้";
  runBtn.disabled = true;
  left.appendChild(runBtn);

  var flashHost = el("div");
  left.appendChild(flashHost);
  wrap.appendChild(left);

  var right = plot("ผลวินิจฉัย");
  var resultHost = el("div");
  resultHost.appendChild(stateBlock("◇", "ยังไม่มีผล", "เลือกภาพแล้วกดตรวจ ผลจะแสดงที่นี่"));
  right.appendChild(resultHost);
  wrap.appendChild(right);

  root.appendChild(wrap);

  function showFlash(msg, kind) {
    flashHost.innerHTML = "";
    flashHost.appendChild(el("div", "flash flash-" + kind, msg));
  }

  runBtn.onclick = async function () {
    flashHost.innerHTML = "";
    runBtn.disabled = true;
    runBtn.textContent = "กำลังตรวจ";
    intake.sweeping(true);
    resultHost.innerHTML = "";
    resultHost.appendChild(stateBlock("◌", "กำลังตรวจภาพ", "โมเดลกำลังประมวลผลบนเครื่องของคุณ"));
    await new Promise(function (r) { setTimeout(r, 60); });

    try {
      var res = await runFullAnalysis(intake.image());
      resultHost.innerHTML = "";

      var score = healthScore(res);
      resultHost.appendChild(buildGauge(score, diagnosisName(res)));

      resultHost.appendChild(bund("ขั้นที่ 1 · เป็นใบข้าวหรือไม่"));
      var r1 = el("div");
      resultHost.appendChild(r1);
      renderVerdict(r1, res.rice.results, { kicker: "ภาพนี้คือ", gated: res.gated });

      if (res.disease) {
        resultHost.appendChild(bund("ขั้นที่ 2 · ชนิดของโรค"));
        var r2 = el("div");
        resultHost.appendChild(r2);

        // ใช้เกณฑ์ที่โมเดลกำหนดมาเอง (classification_threshold จาก Edge Impulse)
        // ต่ำกว่านี้จะไม่เอ่ยชื่อโรคเลย เพราะการเอ่ยชื่อผิดแล้วเกษตรกรไปพ่นยาตาม
        // เสียหายมากกว่าการบอกว่า "ยังระบุไม่ได้ ถ่ายใหม่"
        var thr = (models.disease.props && models.disease.props.classification_threshold) || 0.6;
        renderVerdict(r2, res.disease.results, { kicker: "โรคที่พบ", threshold: thr });

        if (res.topDisease && res.topDisease.value >= thr) {
          var rx = buildRx(res.topDisease.label);
          if (rx) resultHost.appendChild(rx);
          else resultHost.appendChild(el("div", "flash flash-bad",
            "ยังไม่มีแนวทางจัดการของโรคนี้ในฐานข้อมูล กรุณาปรึกษาเจ้าหน้าที่เกษตรในพื้นที่"));
        }
      } else {
        resultHost.appendChild(el("div", "flash flash-bad",
          res.gated ? res.pre.why : "ภาพนี้ไม่ใช่ใบข้าว ระบบจึงไม่ตรวจโรคต่อ"));
      }

      // คำเตือนถาวร — ขึ้นทุกครั้งที่มีผล ไม่ว่าผลจะออกมาแบบไหน
      // วางไว้หลังแนวทางแก้ไข เพื่อให้เป็นสิ่งสุดท้ายที่ผู้ใช้อ่านก่อนลงมือทำ
      resultHost.appendChild(el("div", "flash flash-warn",
        "การวิเคราะห์นี้อาจผิดพลาดได้ กรุณาปรึกษาเจ้าหน้าที่เกษตรหรือผู้เชี่ยวชาญเพื่อยืนยันโรคก่อนใช้สารเคมีทุกครั้ง"));

      resultHost.appendChild(bund("หลักฐานเชิงสี"));
      var mixHost = el("div");
      resultHost.appendChild(mixHost);
      renderMix(mixHost, res.pre);

      // เก็บภาพย่อไว้กับบันทึกด้วย ใช้ 640px พอสำหรับย้อนดูภายหลัง
      // เล็กกว่าที่ส่งให้ Gemini (800px) เพื่อประหยัดพื้นที่เก็บ
      var saved = await Store.add({
        date: todayStamp(),
        owner: Store.profile().name,
        gps: "",
        ph: null,
        disease: diagnosisName(res),
        score: score,
        image: imageToBase64(intake.image(), 640)
      });

      showFlash(Store.isOffline()
        ? "บันทึกลงเครื่องแล้ว จะซิงก์ขึ้นเซิร์ฟเวอร์เมื่อเชื่อมต่อได้"
        : "บันทึกผลลงทะเบียนแล้ว", "ok");

      // ให้ผู้ใช้ยืนยันว่า AI ทายถูกไหม ข้อมูลนี้ใช้วัดความแม่นยำจริง
      // และชี้เป้าว่าควรเพิ่มภาพคลาสไหนตอนเทรนรอบหน้า
      if (!Store.isOffline() && saved.id) {
        resultHost.appendChild(buildVerifyPanel(saved, res));
      }
    } catch (err) {
      resultHost.innerHTML = "";
      resultHost.appendChild(stateBlock("!", "ตรวจภาพไม่สำเร็จ", err.message));
      showFlash("ตรวจไม่สำเร็จ: " + err.message, "bad");
    } finally {
      intake.sweeping(false);
      runBtn.disabled = false;
      runBtn.textContent = "ตรวจภาพนี้";
    }
  };

  markBrain();
};

  gpsBtn.onclick = function () {
    gpsBtn.textContent = "กำลังหาพิกัด";
    gpsBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(function (p) {
      document.getElementById("svGps").value = p.coords.latitude.toFixed(5) + "," + p.coords.longitude.toFixed(5);
      gpsBtn.textContent = "ดึงพิกัดปัจจุบัน";
      gpsBtn.disabled = false;
    }, function () {
      gpsBtn.textContent = "หาพิกัดไม่ได้ ลองอีกครั้ง";
      gpsBtn.disabled = false;
    });
  };
  gpsBox.appendChild(gpsBtn);
  grid.appendChild(gpsBox);

  for (var n = 1; n <= 5; n++) grid.appendChild(inputBox("pH จุดที่ " + n, "svPh" + n, "0.0", "", false, true));
  grid.appendChild(inputBox("ค่าเฉลี่ย", "svAvg", "คำนวณให้อัตโนมัติ", "", true, true));
  form.appendChild(grid);

  function recalc() {
    var vals = [];
    for (var i = 1; i <= 5; i++) {
      var v = parseFloat(document.getElementById("svPh" + i).value);
      if (!isNaN(v)) vals.push(v);
    }
    document.getElementById("svAvg").value = vals.length
      ? (vals.reduce(function (a,b) { return a+b; },0) / vals.length).toFixed(2) : "";
  }
  for (var k = 1; k <= 5; k++) grid.querySelector("#svPh" + k).oninput = recalc;

  var intakeWrap = el("div");
  intakeWrap.style.marginTop = "15px";
  intakeWrap.appendChild(el("div", "read-label", "แนบภาพใบข้าว (ไม่บังคับ)"));
  var intake = makeIntake({ lead: "แนบภาพเพื่อตรวจโรคไปพร้อมกัน", hint: "ถ้าไม่แนบ ระบบจะบันทึกเฉพาะค่า pH และพิกัด" });
  intakeWrap.appendChild(intake.node);
  form.appendChild(intakeWrap);

  var saveBtn = el("button", "act act-go act-wide", "บันทึกแบบสำรวจ");
  saveBtn.style.marginTop = "15px";
  form.appendChild(saveBtn);
  var msgHost = el("div");
  form.appendChild(msgHost);

  saveBtn.onclick = async function () {
    saveBtn.disabled = true;
    saveBtn.textContent = "กำลังบันทึก";
    msgHost.innerHTML = "";
    try {
      var entry = {
        date: todayStamp(),
        owner: document.getElementById("svOwner").value.trim() || "ไม่ระบุ",
        gps: document.getElementById("svGps").value.trim(),
        ph: parseFloat(document.getElementById("svAvg").value) || null,
        disease: "ไม่ได้ตรวจภาพ",
        score: 90
      };
      var img = intake.image();
      if (img) {
        intake.sweeping(true);
        var res = await runFullAnalysis(img);
        intake.sweeping(false);
        entry.disease = diagnosisName(res);
        entry.score = healthScore(res);
        entry.image = imageToBase64(img, 640);
      }
      await Store.add(entry);
      msgHost.appendChild(el("div", "flash flash-ok", Store.isOffline()
        ? "บันทึกลงเครื่องแล้ว จะซิงก์เมื่อเชื่อมต่อได้"
        : "บันทึกแบบสำรวจแล้ว"));
      setTimeout(function () { open("survey"); }, 900);
    } catch (err) {
      msgHost.appendChild(el("div", "flash flash-bad", "บันทึกไม่สำเร็จ: " + err.message));
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "บันทึกแบบสำรวจ";
    }
  };
  wrap.appendChild(form);

  var recent = plot("บันทึกล่าสุด", "8 รายการหลังสุด");
  if (!logs.length) {
    recent.appendChild(stateBlock("◇", "ยังไม่มีบันทึก", "กรอกแบบสำรวจด้านซ้ายเพื่อเริ่มเก็บข้อมูลแปลง"));
  } else {
    var t = el("table");
    t.innerHTML = "<thead><tr><th>วันที่</th><th>ผลตรวจ</th><th>pH</th><th>คะแนน</th></tr></thead>";
    var tb = el("tbody");
    logs.slice(0, 8).forEach(function (l) {
      var tr = el("tr");
      var wellClass = l.disease === "ไม่พบโรค" ? " well" : l.disease.indexOf("โรค") === 0 ? " ill" : "";
      tr.innerHTML = "<td class='n'>" + l.date + "</td>" +
        "<td class='dx" + wellClass + "'>" + l.disease + "</td>" +
        "<td class='n'>" + (l.ph != null ? l.ph : "—") + "</td>" +
        "<td class='n'>" + l.score + "</td>";
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    recent.appendChild(t);
  }
  wrap.appendChild(recent);
  root.appendChild(wrap);
};

// ─── หน้าเตรียมดิน ─────────────────────────────
//
// เป็นคู่มืออ่าน ไม่ใช่เครื่องคำนวณ โดยตั้งใจ
// เหตุผล: อัตราปูนขาวที่ถูกต้องต้องมาจากค่าความต้องการปูนที่ได้จากการวิเคราะห์ดิน
// ไม่ใช่คำนวณจาก pH อย่างเดียว การใส่ปูนเกินทำให้ดินเป็นด่างถาวรซึ่งแก้ยากกว่าเดิมมาก
// ระบบจึงบอกได้แค่ว่าดินอยู่ในสภาพไหนและควรไปปรึกษาใคร
//
// สิ่งที่ระบบทำได้จริงคือ "ปรับคู่มือให้ตรงกับบริบทของแปลงนี้"
// เพราะขั้นตอนของนาหว่านน้ำตมกับนาหว่านข้าวแห้งต่างกันคนละทิศ
// การให้อ่านคู่มือกลางที่รวมทุกแบบไว้ด้วยกันจะทำให้ทำผิดขั้นตอนได้ง่ายกว่า
views.soil = async function (root) {
  var G = window.SOIL_GUIDE;
  if (!G) {
    root.appendChild(stateBlock("!", "ไม่พบไฟล์ฐานความรู้",
      "ไฟล์ soil-guide.js ยังไม่ได้อัปโหลดขึ้นเซิร์ฟเวอร์ กรุณาวางไว้ในโฟลเดอร์เดียวกับ index.html"));
    return;
  }

  var logs = await Store.list();
  var phs = logs.filter(function (l) { return typeof l.ph === "number"; });

  // จำค่าที่เลือกไว้ในเครื่อง เพราะวิธีทำนากับชนิดดินของแปลงหนึ่งไม่เปลี่ยนบ่อย
  // ให้ตั้งค่าใหม่ทุกครั้งที่เข้าหน้าเป็นการเสียเวลาโดยไม่จำเป็น
  var KEY = "smartrice-soil:" + (Session.user ? Session.user.username : "guest");
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { saved = {}; }
  var pick = {
    method: G.methods[saved.method] ? saved.method : "wet",
    soil:   G.soils[saved.soil]     ? saved.soil   : "clay"
  };
  function remember() {
    try { localStorage.setItem(KEY, JSON.stringify(pick)); } catch (e) { /* พื้นที่เต็ม ข้ามไป */ }
  }

  // ══ สภาพดินจากค่าที่บันทึกไว้ ══
  root.appendChild(bund("สภาพดินของแปลงคุณ"));
  var phCard = plot(null);
  if (!phs.length) {
    phCard.appendChild(stateBlock("◇", "ยังไม่เคยวัดค่า pH ดิน",
      "ไปที่หน้าบันทึกสำรวจ วัด pH 5 จุดในแปลงแล้วบันทึกไว้ ระบบจะแปลผลให้ที่นี่"));
  } else {
    var latest = phs[0];
    var band = window.readSoilPh(latest.ph);
    var color = band.key === "bad" ? "var(--rust)" : band.key === "warn" ? "var(--grain)" : "var(--blade)";

    var head = el("div");
    head.style.cssText = "display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px";
    var big = el("div", "num", String(latest.ph));
    big.style.cssText = "font-size:2.4rem;font-weight:500;line-height:1;color:" + color;
    head.appendChild(big);
    var side = el("div");
    var nm = el("div", "", band.title);
    nm.style.cssText = "font-weight:600;font-size:1.05rem;color:" + color;
    side.appendChild(nm);
    side.appendChild(el("div", "read-foot", "วัดเมื่อ " + latest.date + " · เฉลี่ยจาก 5 จุดในแปลง"));
    head.appendChild(side);
    phCard.appendChild(head);

    phCard.appendChild(el("div", "rx-sect", "หมายความว่าอย่างไร"));
    phCard.appendChild(el("p", "", band.say));
    phCard.appendChild(el("div", "rx-sect", "ควรทำอย่างไรต่อ"));
    phCard.appendChild(el("p", "", band.todo));

    // เตือนเมื่อค่าเก่าเกินไป — ดินเปลี่ยนตามการใส่ปุ๋ยและการชะล้าง
    // ค่าเมื่อ 8 เดือนก่อนอาจไม่ตรงกับสภาพวันนี้แล้ว
    var age = (Date.now() - new Date(phs[0].created_at || Date.now()).getTime()) / 86400000;
    if (age > 120) {
      phCard.appendChild(el("div", "flash flash-warn",
        "ค่านี้วัดไว้นานกว่า 4 เดือนแล้ว ดินเปลี่ยนสภาพได้ตามการใส่ปุ๋ยและการชะล้างของน้ำ ควรวัดใหม่ก่อนเตรียมดินรอบนี้"));
    }
  }
  root.appendChild(phCard);

  // ══ ตัวเลือกบริบทแปลง ══
  root.appendChild(bund("เลือกให้ตรงกับแปลงของคุณ"));
  var pickCard = plot(null, "ขั้นตอนด้านล่างจะเปลี่ยนตามที่เลือก เพราะการเตรียมดินแต่ละแบบต่างกันจริง");

  function chooser(label, dict, current, onPick) {
    var box = el("div");
    box.style.marginBottom = "14px";
    box.appendChild(el("div", "read-label", label));
    var row = el("div");
    row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap";
    Object.keys(dict).forEach(function (k) {
      var b = el("button", "act act-sm " + (k === current ? "act-go" : "act-line"), dict[k].thai);
      b.onclick = function () { onPick(k); };
      row.appendChild(b);
    });
    box.appendChild(row);
    return box;
  }

  var stepsHost = el("div");

  function repaint() {
    pickCard.innerHTML = "";
    pickCard.appendChild(el("div", "plot-note",
      "ขั้นตอนด้านล่างจะเปลี่ยนตามที่เลือก เพราะการเตรียมดินแต่ละแบบต่างกันจริง"));
    pickCard.appendChild(chooser("วิธีทำนา", G.methods, pick.method, function (k) {
      pick.method = k; remember(); repaint();
    }));
    pickCard.appendChild(chooser("ชนิดดินในแปลง", G.soils, pick.soil, function (k) {
      pick.soil = k; remember(); repaint();
    }));

    var m = G.methods[pick.method], sl = G.soils[pick.soil];

    stepsHost.innerHTML = "";

    // ── ขั้นตอนหลักตามวิธีทำนา ──
    stepsHost.appendChild(bund("ขั้นตอนเตรียมดิน · " + m.thai));
    var intro = plot(null);
    intro.appendChild(el("p", "", m.note));
    intro.querySelector("p").style.cssText = "margin:0;font-size:.89rem;color:var(--ink-soft)";
    stepsHost.appendChild(intro);

    m.steps.forEach(function (st, i) {
      var c = plot(null);
      c.style.marginTop = "13px";

      var top = el("div");
      top.style.cssText = "display:flex;gap:13px;align-items:flex-start;margin-bottom:11px";
      var badge = el("div", "num", String(i + 1));
      badge.style.cssText = "flex:none;width:30px;height:30px;border-radius:50%;display:flex;" +
        "align-items:center;justify-content:center;background:var(--tint-ok);color:var(--deep);font-weight:600;font-size:.9rem";
      top.appendChild(badge);
      var titleWrap = el("div");
      var t = el("div", "", st.title);
      t.style.cssText = "font-family:var(--f-display);font-weight:600;font-size:1.02rem;line-height:1.3";
      titleWrap.appendChild(t);
      titleWrap.appendChild(el("div", "read-foot", "ช่วงเวลา: " + st.when));
      top.appendChild(titleWrap);
      c.appendChild(top);

      var d = el("p", "", st.detail);
      d.style.cssText = "margin:0;font-size:.88rem";
      c.appendChild(d);

      if (st.watch) {
        var wbox = el("div", "flash flash-warn", "จุดที่พลาดบ่อย: " + st.watch);
        c.appendChild(wbox);
      }
      stepsHost.appendChild(c);
    });

    // ── ข้อควรระวังตามชนิดดิน ──
    stepsHost.appendChild(bund("ข้อควรระวังสำหรับ" + sl.thai));
    var sc = plot(null);
    var tr = el("p", "", sl.trait);
    tr.style.cssText = "margin:0 0 11px;font-size:.88rem;color:var(--ink-soft)";
    sc.appendChild(tr);
    var ul = el("ul");
    ul.style.cssText = "margin:0;padding-left:19px;font-size:.88rem";
    sl.tips.forEach(function (x) {
      var li = el("li", "", x);
      li.style.marginBottom = "7px";
      ul.appendChild(li);
    });
    sc.appendChild(ul);
    stepsHost.appendChild(sc);

    var cite = el("p", "",
      "คู่มือนี้อ้างอิงหลักการทั่วไปของการเตรียมดินนาข้าว แต่ละพื้นที่มีเงื่อนไขดินและน้ำต่างกัน " +
      "ก่อนลงมือจริงควรปรึกษาเกษตรอำเภอ หมอดินอาสาประจำตำบล หรือศูนย์วิจัยข้าวในพื้นที่");
    cite.style.cssText = "font-size:.78rem;color:var(--ink-soft);margin:14px 0 0";
    stepsHost.appendChild(cite);
  }

  root.appendChild(pickCard);
  root.appendChild(stepsHost);
  repaint();
};

views.ledger = async function (root) {
  var logs = await Store.list();
  root.appendChild(bund("ทะเบียนบันทึกทั้งหมด"));
  var card = plot(null);

  var tools = el("div");
  tools.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px";
  var dl = el("button", "act act-line act-sm", "ส่งออกเป็นไฟล์ CSV");
  dl.disabled = !logs.length;
  dl.onclick = function () { exportCsv(logs); };
  tools.appendChild(dl);
  var find = el("input");
  find.placeholder = "กรองตามวันที่ ชื่อ หรือโรค";
  find.style.cssText = "padding:7px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:#FFFFFF;width:250px;max-width:100%";
  tools.appendChild(find);
  card.appendChild(tools);

  var body = el("div");
  card.appendChild(body);

  function judgeTag(l) {
    if (!l.verify) return '<span class="tag-wait">ยังไม่ยืนยัน</span>';
    if (l.verify.correct) return '<span class="tag-yes">ถูกต้อง</span>';
    return '<span class="tag-no">ผิด · ที่จริงคือ ' + th(l.verify.actual || "ไม่ระบุ") + '</span>';
  }

  function draw(filter) {
    body.innerHTML = "";
    if (!logs.length) {
      body.appendChild(stateBlock("◇", "ทะเบียนยังว่าง", "บันทึกผลตรวจครั้งแรกเพื่อเริ่มทะเบียน"));
      return;
    }
    var rows = logs.filter(function (l) {
      if (!filter) return true;
      return (l.date + " " + (l.owner||"") + " " + l.disease).toLowerCase().indexOf(filter.toLowerCase()) !== -1;
    });
    if (!rows.length) {
      body.appendChild(stateBlock("◇", "ไม่พบรายการที่ตรงกับคำค้น", "ลองพิมพ์คำอื่น หรือล้างช่องค้นหา"));
      return;
    }

    var wrap = el("div");
    wrap.style.overflowX = "auto";
    var t = el("table");
    t.innerHTML = "<thead><tr><th>ภาพ</th><th>วันที่</th><th>ผลตรวจ AI</th><th>ผู้ใช้ยืนยัน</th><th>pH</th><th>คะแนน</th><th></th></tr></thead>";
    var tb = el("tbody");

    rows.forEach(function (l) {
      var tr = el("tr");

      var tdImg = el("td");
      if (l.hasImage) {
        var img = el("img", "thumb");
        img.alt = "ภาพใบข้าวที่ตรวจเมื่อ " + l.date;
        img.loading = "lazy";
        // โหลดภาพเฉพาะแถวที่มีจริง เพื่อไม่ให้ยิง request ที่ไม่จำเป็น
        Store.imageOf(l.id)
          .then(function (im) { img.src = "data:" + im.mimeType + ";base64," + im.data; })
          .catch(function () { img.replaceWith(el("div", "thumb-blank", "โหลดไม่ได้")); });
        img.onclick = function () { openLens(img.src, l); };
        tdImg.appendChild(img);
      } else {
        tdImg.appendChild(el("div", "thumb-blank", "ไม่มี"));
      }
      tr.appendChild(tdImg);

      var wellClass = l.disease === "ไม่พบโรค" ? " well" : l.disease.indexOf("โรค") === 0 ? " ill" : "";
      var rest = el("td", "n", l.date);
      tr.appendChild(rest);
      var tdDx = el("td", "dx" + wellClass, l.disease);
      tr.appendChild(tdDx);
      var tdJudge = el("td");
      tdJudge.innerHTML = judgeTag(l);
      tr.appendChild(tdJudge);
      tr.appendChild(el("td", "n", l.ph != null ? String(l.ph) : "—"));
      tr.appendChild(el("td", "n", String(l.score)));

      var tdAct = el("td");
      var del = el("button", "act act-line act-sm", "ลบ");
      del.onclick = function () {
        if (!confirm("ลบบันทึกวันที่ " + l.date + " ออกจากทะเบียน ยืนยันหรือไม่")) return;
        del.disabled = true;
        del.textContent = "กำลังลบ";
        Store.remove(l.id)
          .then(function () {
            logs = logs.filter(function (x) { return x.id !== l.id; });
            draw(find.value);
          })
          .catch(function (err) {
            del.disabled = false;
            del.textContent = "ลบไม่ได้";
            alert(err.message);
          });
      };
      tdAct.appendChild(del);
      tr.appendChild(tdAct);

      tb.appendChild(tr);
    });

    t.appendChild(tb);
    wrap.appendChild(t);
    body.appendChild(wrap);
  }

  find.oninput = function () { draw(find.value); };
  draw(document.getElementById("seekInput").value);
  root.appendChild(card);
};

// ขยายดูภาพเต็ม ปิดด้วยปุ่ม คลิกพื้นหลัง หรือกด Escape
function openLens(src, log) {
  if (!src) return;
  var lens = el("div", "lens");
  var img = el("img");
  img.src = src;
  img.alt = "ภาพใบข้าวที่ตรวจเมื่อ " + log.date;
  var shut = el("button", "lens-shut", "ปิด");
  lens.appendChild(img);
  lens.appendChild(shut);

  function close() {
    lens.remove();
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e) { if (e.key === "Escape") close(); }

  shut.onclick = close;
  lens.onclick = function (e) { if (e.target === lens) close(); };
  document.addEventListener("keydown", onKey);
  document.body.appendChild(lens);
  shut.focus();
}


views.weather = async function (root) {
  root.appendChild(bund("สภาพอากาศแปลงนา"));

  var host = el("div");
  host.appendChild(stateBlock("◌", "กำลังหาตำแหน่งแปลง", "กรุณาอนุญาตให้เว็บเข้าถึงตำแหน่ง"));
  root.appendChild(host);

  // ใช้พิกัดที่เคยบันทึกไว้ก่อน ถ้าไม่มีค่อยขอตำแหน่งปัจจุบัน
  // เพราะพิกัดแปลงที่บันทึกไว้ตรงกับที่ต้องการดูมากกว่าตำแหน่งที่ผู้ใช้ยืนอยู่ตอนนี้
  var logs = await Store.list();
  var saved = logs.filter(function (l) { return l.gps && l.gps.indexOf(",") !== -1; })[0];

  var coords = null;
  var source = "";
  if (saved) {
    var parts = saved.gps.split(",").map(Number);
    coords = { lat: parts[0], lon: parts[1] };
    source = "อ้างอิงพิกัดแปลงที่บันทึกไว้เมื่อ " + saved.date;
  } else {
    try {
      var pos = await new Promise(function (resolve, reject) {
        if (!navigator.geolocation) return reject(new Error("อุปกรณ์นี้ไม่รองรับการหาตำแหน่ง"));
        navigator.geolocation.getCurrentPosition(resolve, function () {
          reject(new Error("ไม่ได้รับอนุญาตให้เข้าถึงตำแหน่ง"));
        }, { timeout: 12000 });
      });
      coords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      source = "อ้างอิงตำแหน่งปัจจุบันของอุปกรณ์";
    } catch (err) {
      host.innerHTML = "";
      host.appendChild(stateBlock("!", "ยังดูสภาพอากาศไม่ได้",
        err.message + " — ทางแก้คือไปที่หน้าบันทึกสำรวจ กดดึงพิกัดปัจจุบันแล้วบันทึกไว้ 1 ครั้ง ระบบจะใช้พิกัดนั้นตลอดไป"));
      return;
    }
  }

  host.innerHTML = "";
  host.appendChild(stateBlock("◌", "กำลังดึงข้อมูลอากาศ", null));

  var w;
  try {
    w = await fetchWeather(coords.lat.toFixed(4), coords.lon.toFixed(4));
  } catch (err) {
    host.innerHTML = "";
    host.appendChild(stateBlock("!", "ดึงข้อมูลอากาศไม่สำเร็จ", err.message + " — ลองรีเฟรชหน้าอีกครั้ง"));
    return;
  }

  host.innerHTML = "";

  // ── ฝนและแสงแดด วันนี้กับพรุ่งนี้ ──
  // สองค่านี้คือสิ่งที่เกษตรกรใช้ตัดสินใจจริงในแต่ละวัน
  // (จะพ่นยาไหม จะระบายน้ำไหม) จึงยกขึ้นมาไว้บนสุดแยกจากกราฟย้อนหลัง
  (function () {
    var d = w.days || [];
    var i = w.todayIndex;
    var today = d[i], tomorrow = d[i + 1];
    if (!today) return;

    var card = plot("ฝนและแสงแดด");
    var st = w.station || {};

    // บอกให้ชัดว่าค่านี้มาจากจุดพยากรณ์ใกล้แปลง ไม่ใช่เครื่องวัดที่ตั้งอยู่ในแปลง
    // ถ้าไม่บอก ผู้ใช้จะเข้าใจว่าเป็นค่าที่วัดจากนาตัวเองแล้วไปโทษระบบเมื่อคลาดเคลื่อน
    if (st.lat != null) {
      card.appendChild(el("div", "read-foot",
        "อ่านจากจุดพยากรณ์ใกล้แปลงที่สุด " + st.lat.toFixed(3) + ", " + st.lon.toFixed(3) +
        (st.elevation != null ? " · สูงจากระดับน้ำทะเล " + Math.round(st.elevation) + " ม." : "") +
        " — เป็นค่าจากแบบจำลอง ไม่ใช่เครื่องวัดที่ติดตั้งในแปลง"));
    }

    var grid = el("div", "fx-grid");
    function cell(when, day) {
      var c = el("div", "fx-cell");
      c.appendChild(el("div", "fx-when", when));

      var rain = day.rain == null ? null : day.rain;
      c.appendChild(el("div", "fx-big", rain == null ? "–" : rain.toFixed(1) + " มม."));
      c.appendChild(el("div", "fx-cap", rain == null ? "ไม่มีข้อมูลฝน"
        : rain < 0.5 ? "แทบไม่มีฝน"
        : rain < 10  ? "ฝนเล็กน้อย"
        : rain < 35  ? "ฝนปานกลาง"
        : rain < 90  ? "ฝนหนัก" : "ฝนหนักมาก"));

      var sun = day.sunHours;
      c.appendChild(el("div", "fx-big2", sun == null ? "–" : sun.toFixed(1) + " ชม."));
      c.appendChild(el("div", "fx-cap", sun == null ? "ไม่มีข้อมูลแสง"
        : sun < 3 ? "แดดน้อย ใบแห้งช้า"
        : sun < 6 ? "แดดปานกลาง" : "แดดจัด"));
      return c;
    }
    grid.appendChild(cell("วันนี้", today));
    if (tomorrow) grid.appendChild(cell("พรุ่งนี้", tomorrow));
    card.appendChild(grid);
    host.appendChild(card);
  })();

  // ── ค่าปัจจุบันจาก WeatherAPI (อัปเดตทุก 10-15 นาที) ──
  var liveCard = plot(null);
  var liveBody = el("div");
  liveBody.appendChild(stateBlock("◌", "กำลังอ่านค่าปัจจุบัน", null));
  liveCard.appendChild(liveBody);
  host.appendChild(liveCard);

  async function paintLive() {

      liveBody.innerHTML = "";

      var head = el("div");
      head.style.cssText = "display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px";
      var t = el("div", "plot-title", "ค่าปัจจุบัน" + (live.location ? " · " + live.location : ""));
      head.appendChild(t);
      var stamp = el("span", "read-foot", "อัปเดตล่าสุด " + (live.current.lastUpdated || "-"));
      head.appendChild(stamp);
      liveBody.appendChild(head);

      var grid = el("div", "row-3");
      [
        ["ฝนวันนี้", live.current.precipMm + " มม.", live.current.condition || ""],
        ["อุณหภูมิ", live.current.tempC + "°C", "ความชื้น " + live.current.humidity + "%"],
        ["เมฆปกคลุม", live.current.cloud + "%",
          live.current.cloud >= 80 ? "ครึ้มมาก แดดน้อย" : live.current.cloud <= 30 ? "ท้องฟ้าโปร่ง" : "มีเมฆบางส่วน"],
        ["ดัชนี UV", String(live.current.uv), "ตัวชี้วัดความแรงของแสงแดด"]
      ].forEach(function (c) {
        var b = el("div");
        b.appendChild(readOut(c[0], c[1], c[2]));
        grid.appendChild(b);
      });
      liveBody.appendChild(grid);

      var cite = el("p", "",
        "แหล่งข้อมูล: " + live.source + " · ข้อมูลปัจจุบันอัปเดตทุก 10-15 นาที หน้านี้ดึงค่าใหม่อัตโนมัติทุก 1 ชั่วโมง");
      cite.style.cssText = "font-size:.76rem;color:var(--ink-faint);margin:12px 0 0";
      liveBody.appendChild(cite);
    } catch (err) {

    }
  }
  paintLive();
  // อัปเดตค่าปัจจุบันเองทุก 1 ชั่วโมง ไม่ต้องให้ผู้ใช้กดรีเฟรช
  onPageTimer(paintLive, 60 * 60 * 1000);

  // ── สรุปย้อนหลังจาก Open-Meteo ──
  root.appendChild(bund("สรุปย้อนหลัง 7 วัน"));
  var s = w.summary;
  var stats = el("div", "row-3");
  var cards = [
    ["ฝนสะสม 7 วัน", s.rain7 + " มม.", s.rain7 >= 40 ? "ฝนชุก เสี่ยงเชื้อรา" : s.rain7 <= 5 ? "ฝนทิ้งช่วง" : "ปริมาณปานกลาง"],
    ["แสงแดดเฉลี่ย", s.sunHours + " ชม./วัน", s.sunHours <= 4 ? "แดดน้อย เชื้อราเติบโตดี" : "แดดเพียงพอ"],
    ["ความชื้นเฉลี่ย", s.humidity + "%", s.humidity >= 85 ? "ชื้นจัด ต้องเฝ้าระวัง" : "อยู่ในเกณฑ์ปกติ"],
    ["อุณหภูมิสูงสุด", s.tempMax + "°C", "ต่ำสุด " + s.tempMin + "°C"]
  ];
  cards.forEach(function (c) {
    var p = plot();
    p.appendChild(readOut(c[0], c[1], c[2]));
    stats.appendChild(p);
  });
  root.appendChild(stats);

  var src = el("p", "",
    source + " · แหล่งข้อมูลย้อนหลังและชั่วโมงแสงแดด: Open-Meteo (ค่าเฉลี่ย 3 วันล่าสุด) " +
    "ใช้คนละแหล่งกับค่าปัจจุบันด้านบน เพื่อให้ตรวจสอบไขว้กันได้");
  src.style.cssText = "font-size:.76rem;color:var(--ink-faint);margin:10px 0 0";
  root.appendChild(src);

  // ความเสี่ยงรายโรค

  var riskCard = plot(null);

  var ranked = RISK_RULES.map(function (r) {
    var score = Math.min(100, r.score(s));
    return { rule: r, score: score, band: riskBand(score) };
  }).sort(function (a, b) { return b.score - a.score; });

  ranked.forEach(function (r) {
    var row = el("div");
    row.style.cssText = "padding:14px 0;border-bottom:1px solid var(--rule-soft)";

    var head = el("div");
    head.style.cssText = "display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap";
    var nm = el("div", "", r.rule.thai);
    nm.style.cssText = "font-weight:600;font-size:.95rem";
    head.appendChild(nm);
    var tag = el("span", "rx-flag " + (r.band.key === "bad" ? "hi" : r.band.key === "warn" ? "mid" : "lo"),
      "ความเสี่ยง " + r.band.word);
    head.appendChild(tag);
    row.appendChild(head);

    var track = el("div", "bar-track");
    track.style.margin = "9px 0 7px";
    var fill = el("div", "bar-fill");
    fill.style.width = r.score + "%";
    fill.style.background = r.band.key === "bad" ? "var(--rust)"
      : r.band.key === "warn" ? "var(--grain)" : "var(--blade)";
    track.appendChild(fill);
    row.appendChild(track);

    var why = el("div", "read-foot", r.rule.why);

    // ถ้าเสี่ยงสูงและมีแนวทางในฐานความรู้ ให้ลิงก์ความรู้มาแสดงเลย
    if (r.band.key !== "ok") {
      var g = getGuide(r.rule.label);

        tip.style.marginTop = "5px";

        row.appendChild(tip);
      }
    }
    riskCard.appendChild(row);
  });

  var caveat = el("p", "",
    "ดัชนีนี้ประเมินจากสภาพอากาศเท่านั้น ใช้เพื่อการเฝ้าระวังล่วงหน้า ไม่ใช่การพยากรณ์การระบาด " +
    "ปัจจัยอื่นที่มีผลมากแต่ยังไม่ได้นำมาคำนวณ ได้แก่ พันธุ์ข้าวที่ปลูก ความหนาแน่นของการปลูก " +
    "ปริมาณปุ๋ยไนโตรเจน และประวัติการระบาดในพื้นที่ ควรใช้ประกอบการสำรวจแปลงด้วยตาเสมอ");
  caveat.style.cssText = "font-size:.78rem;color:var(--ink-soft);margin:14px 0 0";

  var chartCard = plot(null);
  var cv = el("canvas");
  cv.height = 230;
  chartCard.appendChild(cv);
  root.appendChild(chartCard);

  var labels = w.days.map(function (d) { return d.date.slice(5).replace("-", "/"); });
  new Chart(cv, {
    data: {
      labels: labels,
      datasets: [
        {
          type: "bar", label: "ฝน (มม.)",
          data: w.days.map(function (d) { return d.rain; }),
          backgroundColor: w.days.map(function (d, i) {
            return i <= w.todayIndex ? "#1B5E3A" : "#6FBF73";
          }),
          borderRadius: 2, yAxisID: "y"
        },
        {
          type: "line", label: "แสงแดด (ชม.)",
          data: w.days.map(function (d) { return d.sunHours; }),
          borderColor: "#B8860B", backgroundColor: "rgba(184,134,11,.10)",
          tension: .3, pointRadius: 3, borderWidth: 2, yAxisID: "y1"
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: "top", align: "start" },
        tooltip: { callbacks: {
          title: function (items) {
            var i = items[0].dataIndex;
            return labels[i] + (i > w.todayIndex ? " (พยากรณ์)" : " (ผ่านมาแล้ว)");

      },
      scales: {

  legend.style.cssText = "font-size:.76rem;color:var(--ink-faint);margin:10px 0 0";

  var aiCard = plot();
  var aiBody = el("div");
  aiBody.appendChild(stateBlock("◌", "กำลังให้ AI ประเมิน", "ใช้เวลาสักครู่"));
  aiCard.appendChild(aiBody);
  root.appendChild(aiCard);

  var forecast = w.days.slice(w.todayIndex + 1);
  var rainAhead = forecast.reduce(function (a, d) { return a + (d.rain || 0); }, 0).toFixed(1);

  Store.askGemini(
    "คุณเป็นผู้เชี่ยวชาญโรคข้าวไทย ประเมินสิ่งที่เกษตรกรควรทำในสัปดาห์นี้จากข้อมูลต่อไปนี้\n\n" +
    "สภาพอากาศแปลง (ค่าเฉลี่ย 3 วันล่าสุด):\n" +
    "- ฝนสะสม 7 วันที่ผ่านมา " + s.rain7 + " มม.\n" +
    "- ฝนพยากรณ์อีก 7 วันข้างหน้า " + rainAhead + " มม.\n" +
    "- แสงแดดเฉลี่ย " + s.sunHours + " ชั่วโมงต่อวัน\n" +
    "- ความชื้นเฉลี่ย " + s.humidity + "%\n" +
    "- อุณหภูมิ " + s.tempMin + " ถึง " + s.tempMax + " องศา\n\n" +
    "ดัชนีความเสี่ยงที่ระบบคำนวณได้: " +
    ranked.map(function (r) { return r.rule.thai + " " + r.band.word; }).join(", ") + "\n\n" +
    buildFarmContext(logs) + "\n\n" +
    "ตอบภาษาไทย 3-4 ประโยค บอกสิ่งที่ควรลงมือทำสัปดาห์นี้อย่างเป็นรูปธรรม ไม่ต้องใส่หัวข้อ " +
    "ห้ามแต่งชื่อสารเคมีหรืออัตราการใช้ขึ้นเอง"
  ).then(function (answer) {
    aiBody.innerHTML = "";
    var p = el("p", "", answer.text);
    p.style.cssText = "margin:0;font-size:.89rem";
    aiBody.appendChild(p);
  }).catch(function (err) {
    aiBody.innerHTML = "";
    aiBody.appendChild(stateBlock("!", "ยังให้ AI ประเมินไม่ได้", friendlyError(err.message)));
  });
};

  fileIn.accept = "image/*";
  var q = el("input");
  q.placeholder = "เช่น ใบข้าวมีจุดสีน้ำตาล ควรทำอย่างไร";
  var sendBtn = el("button", "act act-go", "ถาม");
  bar.appendChild(camBtn); bar.appendChild(fileIn); bar.appendChild(q); bar.appendChild(sendBtn);
  card.appendChild(bar);
  root.appendChild(card);

  var pinned = null;
  camBtn.onclick = function () { fileIn.click(); };
  fileIn.onchange = function (e) {
    var f = e.target.files[0];
    if (!f || f.type.indexOf("image/") !== 0) return;
    var url = URL.createObjectURL(f);
    var im = new Image();
    im.onload = function () {
      pinned = im;
      clipImg.src = url;
      clipText.textContent = "แนบภาพแล้ว ระบบจะตรวจโรคก่อนส่งให้ AI อธิบาย";
      clip.hidden = false;
    };
    im.src = url;
  };
  clipDrop.onclick = function () { pinned = null; fileIn.value = ""; clip.hidden = true; };

  var logs = await Store.list();
  var farmContext = buildFarmContext(logs);

  async function ask() {
    var text = q.value.trim();
    if (!text && !pinned) return;

    var mine = el("div", "say say-me");
    if (pinned) {
      var pv = el("img");
      pv.src = pinned.src;
      mine.appendChild(pv);
    }
    if (text) mine.appendChild(document.createTextNode(text));
    talk.appendChild(mine);

    var shot = pinned;
    q.value = "";
    pinned = null;
    fileIn.value = "";
    clip.hidden = true;
    talk.scrollTop = talk.scrollHeight;

    var reply = el("div", "say say-ai", shot ? "กำลังตรวจภาพด้วยโมเดล" : "กำลังคิด");
    talk.appendChild(reply);
    talk.scrollTop = talk.scrollHeight;

    try {
      var cvNote = "", payload = null;
      if (shot) {
        // ตรวจด้วยโมเดลในเครื่องก่อน แล้วส่งผลไปเป็นบริบท
        // Gemini จะอธิบายต่อยอดจากผลตรวจจริง ไม่ใช่เดาจากภาพอย่างเดียว
        try {
          var res = await runFullAnalysis(shot);
          var thrC = (models.disease.props && models.disease.props.classification_threshold) || 0.6;
          if (!res.isRice) {
            cvNote = "\n\n[ผลตรวจภาพที่แนบมา: ไม่ใช่ใบข้าว หรือภาพไม่ชัดพอให้จำแนกโรค]";
            lastVision = cvNote;
          } else if (res.topDisease && res.topDisease.value >= thrC) {
            // ไม่ส่งตัวเลขความมั่นใจให้ AI แล้ว เพราะ AI มักเอาไปพูดต่อว่า "มั่นใจ 88%"
            // ซึ่งเป็นตัวเลขที่ตีความผิดได้ และเราเอาออกจากหน้าจอไปแล้วด้วย
            cvNote = "\n\n[ผลตรวจภาพที่แนบมาจากโมเดลของระบบ: เป็นใบข้าว โรคที่พบคือ " +
                     th(res.topDisease.label) + "]" + guideForPrompt(res.topDisease.label);
            lastVision = cvNote;
          } else if (res.topDisease) {
            cvNote = "\n\n[ผลตรวจภาพที่แนบมา: เป็นใบข้าว แต่โมเดลยังระบุโรคไม่ชัดเจน " +
                     "ห้ามฟันธงชื่อโรค ให้แนะนำให้ถ่ายภาพใหม่หรือปรึกษาเจ้าหน้าที่เกษตร]";
            lastVision = cvNote;
          }
        } catch (e) {
          cvNote = "\n\n[โมเดลตรวจภาพทำงานไม่สำเร็จ ให้วิเคราะห์จากภาพที่แนบมาโดยตรง]";
        }
        reply.textContent = "กำลังให้ AI อธิบายผล";
        payload = imageToBase64(shot);
      }

      // เมื่อมีภาพแนบมา ต้องระบุให้ชัดว่าภาพคือประเด็นหลัก
      // ไม่งั้น AI มักไปตอบจากบันทึกเก่าในบริบทแทน
      var focus = shot
        ? "ผู้ใช้แนบภาพใบข้าวมาด้วย ให้ตอบโดยยึดภาพที่แนบมาและผลตรวจภาพเป็นหลัก " +
          "ใช้บันทึกแปลงด้านล่างเป็นข้อมูลประกอบเท่านั้น ห้ามตอบจากบันทึกเก่าแทนภาพที่แนบมา\n\n"
        : "";

      // คำถามต่อเนื่องที่ไม่ได้แนบรูปใหม่ ให้ยึดผลตรวจของรูปเดิมไว้
      // ไม่งั้น AI จะลืมว่าเพิ่งดูรูปอะไรไป แล้วตอบกว้างๆ จนไม่มีประโยชน์
      var carry = (!shot && lastVision)
        ? "\n\nผลตรวจภาพล่าสุดในบทสนทนานี้ (ผู้ใช้ยังพูดถึงภาพนี้อยู่):" + lastVision
        : "";

      var convo = history.length
        ? "\n\nบทสนทนาก่อนหน้า:\n" + history.join("\n") + "\n"
        : "";

      var prompt = "คุณเป็นผู้เชี่ยวชาญโรคข้าวและการเกษตรไทย ตอบภาษาไทยแบบเข้าใจง่าย กระชับ\n" +
        "ตอบจากข้อมูลที่ให้มาด้านล่างเท่านั้น ถ้าไม่มีข้อมูลให้บอกตรงๆ ว่าไม่ทราบ " +
        "และห้ามแต่งชื่อสารเคมีหรืออัตราการใช้ขึ้นเองเด็ดขาด\n\n" +
        focus +
        "ข้อมูลแปลงนาของผู้ถาม (จากบันทึกในระบบ):\n" + farmContext + "\n" +
        convo + carry + "\n" +
        "คำถาม: " + (text || "ช่วยดูภาพใบข้าวที่แนบมาว่าเป็นโรคอะไร และควรจัดการอย่างไร") + cvNote;

      // แนบภาพ = ให้ยึดผลจากโมเดลของระบบ ไม่ต้องค้นเว็บ
      // ไม่แนบภาพ = เป็นคำถามความรู้ทั่วไป เปิดค้นเว็บให้ข้อมูลทันสมัยขึ้น
      var answer = await Store.askGemini(prompt, payload, { search: !shot });
      reply.textContent = answer.text;
      remember("ผู้ใช้", (text || "(แนบภาพใบข้าวมาให้ดู)"));
      remember("ผู้เชี่ยวชาญ", answer.text.slice(0, 400));

      // แสดงแหล่งอ้างอิงเมื่อ AI ค้นเว็บมาตอบ
      // จำเป็นมากสำหรับงานนี้ เพราะคำแนะนำเรื่องสารเคมีที่ผิดทำให้เสียหายจริง
      // ผู้ใช้ต้องตามไปตรวจสอบต้นทางได้ ไม่ใช่เชื่อ AI ลอยๆ
      if (answer.searchUsed && answer.sources.length) {
        var srcBox = el("div", "say say-ai src-box");
        srcBox.appendChild(el("div", "src-head", "แหล่งข้อมูลที่ AI ค้นมาประกอบ"));
        answer.sources.slice(0, 4).forEach(function (sx) {
          var a = el("a", "src-link");
          a.href = sx.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = sx.title;
          srcBox.appendChild(a);
        });
        srcBox.appendChild(el("div", "src-foot",
          "AI อาจสรุปคลาดเคลื่อนจากต้นทาง ควรตรวจสอบก่อนนำไปใช้ โดยเฉพาะชื่อสารเคมีและอัตราการใช้"));
        talk.appendChild(srcBox);
      }

      // ถ้าแนบรูปแต่ Worker ไม่ได้ส่งรูปไปถึง Gemini ต้องบอกตรงๆ
      // ไม่ปล่อยให้ผู้ใช้เข้าใจผิดว่า AI ดูรูปแล้ว
      if (shot && !answer.sawImage) {
        var warn = el("div", "flash flash-bad",
          "AI ยังไม่ได้เห็นภาพที่แนบมา — เซิร์ฟเวอร์ที่ใช้อยู่เป็นเวอร์ชันเก่าที่ยังไม่รองรับรูป " +
          "คำตอบด้านบนมาจากผลตรวจของโมเดลและบันทึกแปลงเท่านั้น " +
          "แก้โดยนำโค้ด smartrice-worker.js เวอร์ชันล่าสุดไป Deploy ทับใน Cloudflare");
        warn.style.maxWidth = "87%";
        talk.appendChild(warn);
      }
    } catch (err) {
      reply.textContent = friendlyError(err.message);
    }
    talk.scrollTop = talk.scrollHeight;
  }

  sendBtn.onclick = ask;
  q.onkeydown = function (e) { if (e.key === "Enter") ask(); };
};

views.map = async function (root) {
  var logs = await Store.list();
  var pins = logs.filter(function (l) { return l.gps && l.gps.indexOf(",") !== -1; });

  root.appendChild(bund("ตำแหน่งแปลง"));
  var card = plot(null, null);

  var head = el("div");
  head.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px";
  var info = el("div");
  info.appendChild(el("div", "plot-title", "แผนที่แปลง"));
  info.appendChild(el("div", "plot-note", pins.length
    ? "ปักหมุดจากพิกัดที่บันทึกไว้ " + pins.length + " จุด"
    : "ยังไม่มีพิกัดในระบบ กดดึงพิกัดที่หน้าบันทึกสำรวจเพื่อเริ่มปักหมุด"));
  head.appendChild(info);
  var hereBtn = el("button", "act act-line act-sm", "ไปที่ตำแหน่งของฉัน");
  head.appendChild(hereBtn);
  card.appendChild(head);

  var canvasHost = el("div");
  canvasHost.id = "map";
  card.appendChild(canvasHost);
  root.appendChild(card);

  var center = pins.length ? pins[0].gps.split(",").map(Number) : [15.87, 100.99];
  var map = L.map("map").setView(center, pins.length ? 12 : 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap", maxZoom: 19
  }).addTo(map);

  pins.forEach(function (p) {
    var c = p.gps.split(",").map(Number);
    L.marker(c).addTo(map).bindPopup(
      "<b>" + p.date + "</b><br>" + p.disease + "<br>คะแนน " + p.score);
  });

  hereBtn.onclick = function () {
    hereBtn.textContent = "กำลังหาตำแหน่ง";
    hereBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(function (p) {
      var c = [p.coords.latitude, p.coords.longitude];
      map.setView(c, 14);
      L.circleMarker(c, { radius: 8, color: "#1B5E3A", fillColor: "#6FBF73", fillOpacity: .9, weight: 2 })
        .addTo(map).bindPopup("ตำแหน่งปัจจุบันของคุณ").openPopup();
      hereBtn.textContent = "ไปที่ตำแหน่งของฉัน";
      hereBtn.disabled = false;
    }, function () {
      hereBtn.textContent = "เปิดสิทธิ์ตำแหน่งก่อน";
      hereBtn.disabled = false;
    });
  };
};

views.system = function (root) {
  root.appendChild(bund("สถานะระบบ"));
  var card = plot(null);
  card.style.maxWidth = "640px";

  function line(label, valueId, initial) {

  }
  card.appendChild(line("เซิร์ฟเวอร์ข้อมูล", "sysApi", API_BASE));
  card.appendChild(line("โมเดลจำแนกข้าว", "sysM1", "กำลังโหลด"));
  card.appendChild(line("โมเดลจำแนกโรค", "sysM2", "กำลังโหลด"));
  card.appendChild(line("ฐานความรู้แนวทางแก้ไข", "sysGuide",
    window.DISEASE_GUIDE ? Object.keys(window.DISEASE_GUIDE).length + " โรค" : "ไม่พบไฟล์ disease-guide.js"));

  setTimeout(function () {
    var m1 = document.getElementById("sysM1"), m2 = document.getElementById("sysM2");
    if (m1) m1.textContent = models.rice.project
      ? models.rice.project.name + " v" + models.rice.project.deploy_version : "โหลดไม่สำเร็จ";
    if (m2) m2.textContent = models.disease.project
      ? models.disease.project.name + " v" + models.disease.project.deploy_version : "โหลดไม่สำเร็จ";
  }, 1600);

  var note = el("p", "", "ภาพถ่ายทั้งหมดประมวลผลในเบราว์เซอร์ของคุณเอง ไม่ถูกส่งขึ้นเซิร์ฟเวอร์ ส่วนบันทึกสำรวจ (วันที่ ผลตรวจ ค่า pH พิกัด) เก็บผ่านเซิร์ฟเวอร์เพื่อให้เปิดดูข้ามเครื่องได้");
  note.style.cssText = "font-size:.8rem;color:var(--ink-soft);margin:16px 0 0";
  card.appendChild(note);

  var wipe = el("button", "act act-line act-sm", "ล้างสำเนาข้อมูลในเครื่องนี้");
  wipe.style.marginTop = "14px";
  wipe.onclick = function () {
    if (confirm("ลบสำเนาข้อมูลในเครื่องนี้ทั้งหมด ข้อมูลบนเซิร์ฟเวอร์จะยังอยู่ ยืนยันหรือไม่")) {
      localStorage.removeItem("smartrice-logs");
      Store._cache = null;
      wipe.textContent = "ล้างข้อมูลในเครื่องแล้ว";
    }
  };
  card.appendChild(wipe);
  root.appendChild(card);
};

// ─── ตัวสลับหน้า ────────────────────────────────
var here = "overview";

// เมนูบางหน้าแสดงเฉพาะผู้ดูแลระบบ
// นี่เป็นแค่การซ่อนเมนู ตัวกันจริงอยู่ที่ Worker ซึ่งตรวจสิทธิ์ทุกคำขอ
function visiblePages() {
  var admin = Session.user && Session.user.isAdmin;
  return PAGES.filter(function (p) { return !p.adminOnly || admin; });
}

function paintNav() {
  var nav = document.getElementById("railNav");
  nav.innerHTML = "";
  visiblePages().forEach(function (p) {
    var b = el("button", "rail-item" + (p.id === here ? " on" : ""));
    b.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + p.icon + '"/></svg>';
    b.appendChild(document.createTextNode(p.label));
    b.onclick = function () {
      open(p.id);
      document.getElementById("rail").classList.remove("open");
    };
    nav.appendChild(b);
  });
  paintTabs();
}

// ปลายทางที่ใช้บ่อยที่สุดตอนอยู่หน้างานจริง
// เลือกจากลำดับงานของเกษตรกร: ดูภาพรวม → ถ่ายใบไปตรวจ → จดบันทึก → ดูอากาศ → ถาม AI
// ไม่ใส่หน้าตั้งค่ากับผู้ดูแลระบบ เพราะไม่ได้ใช้ตอนยืนอยู่กลางแปลง
var TAB_IDS = ["overview", "diagnose", "survey", "weather", "consult"];

function paintTabs() {
  var bar = document.getElementById("tabbar");
  if (!bar) return;
  bar.innerHTML = "";
  TAB_IDS.forEach(function (id) {
    var p = PAGES.find(function (x) { return x.id === id; });
    if (!p) return;
    var b = el("button", "tab" + (p.id === here ? " on" : ""));
    b.setAttribute("aria-label", p.label);
    if (p.id === here) b.setAttribute("aria-current", "page");
    b.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="' + p.icon + '"/></svg>';
    b.appendChild(el("span", "", p.label));
    b.onclick = function () { open(p.id); };
    bar.appendChild(b);
  });
}

// ตัวจับเวลาของหน้าปัจจุบัน ต้องล้างทุกครั้งที่เปลี่ยนหน้า
// ไม่งั้นหน้าที่ปิดไปแล้วยังยิงคำขอเบื้องหลังต่อไปเรื่อยๆ
var pageTimers = [];
function onPageTimer(fn, ms) {
  pageTimers.push(setInterval(fn, ms));
}
function clearPageTimers() {
  pageTimers.forEach(clearInterval);
  pageTimers = [];
}

// เริ่มอนิเมชันใหม่ทุกครั้ง ต้องถอดคลาสออกแล้วบังคับให้เบราว์เซอร์คำนวณ layout ก่อน
// ไม่งั้นการใส่คลาสกลับทันทีจะถูกมองว่า "ไม่มีอะไรเปลี่ยน" แล้วอนิเมชันจะไม่เล่นซ้ำ
function replay(node, cls) {
  if (!node) return;
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
}

async function open(id) {
  here = id;
  clearPageTimers();
  var page = PAGES.find(function (p) { return p.id === id; });

  var title = document.getElementById("barTitle");
  var kicker = document.getElementById("barKicker");
  title.textContent = page.label;
  kicker.textContent = page.kicker;
  replay(title, "swap");
  replay(kicker, "swap");
  paintNav();

  var bar = document.getElementById("loadbar");
  if (bar) bar.classList.add("on");

  var root = document.getElementById("field");
  root.classList.remove("enter");
  root.innerHTML = "";
  try {
    await views[id](root);
    replay(root, "enter");
  } catch (err) {
    root.innerHTML = "";
    root.appendChild(stateBlock("!", "เปิดหน้านี้ไม่ได้", err.message + " — ลองรีเฟรชหน้าอีกครั้ง"));
    replay(root, "enter");
  } finally {
    // ปิดแถบเสมอ ไม่ว่าหน้าจะเปิดสำเร็จหรือพัง
    // ถ้าลืมปิดตอน error แถบจะวิ่งค้างตลอดไปจนผู้ใช้คิดว่าระบบแฮงก์
    if (bar) bar.classList.remove("on");
  }
}

// ─── หน้าจอเข้าสู่ระบบ ──────────────────────────
function showAuthScreen(message) {
  var existing = document.querySelector(".gate");
  if (existing) existing.remove();

  // login | register | forgot | reset
  var mode = "login";
  var resetEmail = "";   // จำอีเมลไว้ข้ามจากขั้นขอรหัสไปขั้นตั้งรหัสใหม่

  var gate = el("div", "gate");
  var card = el("div", "gate-card");

  var mark = el("div", "gate-mark");
  mark.innerHTML = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M12 21c0-6 0-9 0-11" stroke="#1B5E3A" stroke-width="1.6" stroke-linecap="round"/>' +
    '<path d="M12 10C12 6 9 3.5 5.5 3c-.4 3.8 2 7 6.5 7z" fill="#2E8B57"/>' +
    '<path d="M12 13c0-3.6 2.8-6 6-6.4.4 3.5-1.9 6.4-6 6.4z" fill="#6FBF73"/></svg>';
  mark.appendChild(document.createTextNode("SmartRice AI"));
  card.appendChild(mark);
  card.appendChild(el("div", "gate-sub", "Field diagnostics"));

  var title = el("h2", "gate-title");
  var note = el("div", "gate-note");
  card.appendChild(title);
  card.appendChild(note);

  var alertHost = el("div");
  card.appendChild(alertHost);
  if (message) alertHost.appendChild(el("div", "flash flash-bad", message));

  function fieldBox(label, id, type, hint, autocomplete, inputMode) {
    var d = el("div", "gate-field");
    d.appendChild(el("label", "", label));
    var i = el("input");
    i.id = id;
    i.type = type || "text";
    if (autocomplete) i.autocomplete = autocomplete;
    if (inputMode) i.inputMode = inputMode;
    d.appendChild(i);
    if (hint) d.appendChild(el("div", "gate-hint", hint));
    return d;
  }

  var nameBox  = fieldBox("ชื่อที่ใช้แสดง", "gaName", "text", "เช่น สมชาย ใจดี", "name");
  var idBox    = fieldBox("ชื่อผู้ใช้ หรืออีเมล", "gaId", "text", "", "username");
  var userBox  = fieldBox("ชื่อผู้ใช้", "gaUser", "text", "อังกฤษพิมพ์เล็ก ตัวเลข หรือขีดล่าง 3-20 ตัว", "username");
  var mailBox  = fieldBox("อีเมล", "gaMail", "email", "ใช้สำหรับกู้คืนรหัสผ่าน ต้องเป็นอีเมลที่เปิดอ่านได้จริง", "email");
  var passBox  = fieldBox("รหัสผ่าน", "gaPass", "password", "อย่างน้อย 8 ตัวอักษร", "current-password");
  var codeBox  = fieldBox("รหัส 6 หลักจากอีเมล", "gaCode", "text", "ตรวจโฟลเดอร์สแปมด้วยถ้าไม่เห็นในกล่องหลัก", "one-time-code", "numeric");
  var newPass  = fieldBox("รหัสผ่านใหม่", "gaNew", "password", "อย่างน้อย 8 ตัวอักษร", "new-password");

  [nameBox, idBox, userBox, mailBox, passBox, codeBox, newPass].forEach(function (b) { card.appendChild(b); });

  var go = el("button", "act act-go act-wide");
  go.style.marginTop = "6px";
  card.appendChild(go);

  var linkRow = el("div", "gate-swap");
  card.appendChild(linkRow);

  card.appendChild(el("div", "gate-foot",
    "ภาพถ่ายทั้งหมดประมวลผลในเบราว์เซอร์ของคุณเอง ไม่ถูกส่งขึ้นเซิร์ฟเวอร์ " +
    "ส่วนบันทึกสำรวจจะเก็บไว้ในบัญชีของคุณเพื่อให้เปิดดูข้ามเครื่องได้"));

  function linkTo(label, target) {
    var b = el("button", "", label);
    b.onclick = function () { mode = target; paint(); };
    return b;
  }

  var LABELS = {
    login:    "เข้าสู่ระบบ",
    register: "สร้างบัญชี",
    forgot:   "ส่งรหัสไปที่อีเมล",
    reset:    "ตั้งรหัสผ่านใหม่"
  };

  function paint() {
    alertHost.innerHTML = "";
    linkRow.innerHTML = "";

    var show = {
      login:    { idBox: 1, passBox: 1 },
      register: { nameBox: 1, userBox: 1, mailBox: 1, passBox: 1 },
      forgot:   { mailBox: 1 },
      reset:    { mailBox: 1, codeBox: 1, newPass: 1 }
    }[mode];

    var boxes = { nameBox: nameBox, idBox: idBox, userBox: userBox,
                  mailBox: mailBox, passBox: passBox, codeBox: codeBox, newPass: newPass };
    Object.keys(boxes).forEach(function (k) { boxes[k].hidden = !show[k]; });

    if (mode === "login") {
      title.textContent = "เข้าสู่ระบบ";
      note.textContent = "กรอกชื่อผู้ใช้หรืออีเมล พร้อมรหัสผ่าน เพื่อเปิดบันทึกแปลงของคุณ";
      document.getElementById("gaPass").autocomplete = "current-password";
      linkRow.appendChild(document.createTextNode("ยังไม่มีบัญชี "));
      linkRow.appendChild(linkTo("สร้างบัญชีใหม่", "register"));
      linkRow.appendChild(el("div", "", ""));
      var fb = linkTo("ลืมรหัสผ่าน", "forgot");
      fb.style.marginTop = "6px";
      linkRow.appendChild(fb);
    } else if (mode === "register") {
      title.textContent = "สร้างบัญชีใหม่";
      note.textContent = "บัญชีนี้ใช้เก็บบันทึกแปลงของคุณโดยเฉพาะ ผู้ใช้คนอื่นจะไม่เห็นข้อมูลของคุณ";
      document.getElementById("gaPass").autocomplete = "new-password";
      linkRow.appendChild(document.createTextNode("มีบัญชีอยู่แล้ว "));
      linkRow.appendChild(linkTo("เข้าสู่ระบบ", "login"));
    } else if (mode === "forgot") {
      title.textContent = "ลืมรหัสผ่าน";
      note.textContent = "กรอกอีเมลที่ใช้สมัคร ระบบจะส่งรหัส 6 หลักไปให้เพื่อตั้งรหัสผ่านใหม่";
      linkRow.appendChild(document.createTextNode("ได้รหัสแล้ว "));
      linkRow.appendChild(linkTo("ไปกรอกรหัส", "reset"));
      linkRow.appendChild(el("div", "", ""));
      var bk = linkTo("กลับไปเข้าสู่ระบบ", "login");
      bk.style.marginTop = "6px";
      linkRow.appendChild(bk);
    } else {
      title.textContent = "ตั้งรหัสผ่านใหม่";
      note.textContent = "กรอกรหัส 6 หลักที่ได้รับทางอีเมล พร้อมรหัสผ่านใหม่ที่ต้องการ";
      if (resetEmail) document.getElementById("gaMail").value = resetEmail;
      linkRow.appendChild(document.createTextNode("ยังไม่ได้รับรหัส "));
      linkRow.appendChild(linkTo("ขอรหัสใหม่", "forgot"));
    }

    go.textContent = LABELS[mode];
    go.disabled = false;
  }

  async function callAuth(path, body) {
    var res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || "ดำเนินการไม่สำเร็จ");
    return data;
  }

  function enterApp(data) {
    Session.save(data.token, data.user);
    Store.reset();
    gate.remove();
    startApp();
  }

  async function submit() {
    var val = function (id) { return (document.getElementById(id).value || "").trim(); };
    alertHost.innerHTML = "";
    go.disabled = true;
    go.textContent = "กำลังดำเนินการ";

    try {
      if (mode === "login") {
        if (!val("gaId") || !document.getElementById("gaPass").value) {
          throw new Error("กรุณากรอกให้ครบทั้งสองช่อง");
        }
        enterApp(await callAuth("/auth/login", {
          username: val("gaId"),
          password: document.getElementById("gaPass").value
        }));

      } else if (mode === "register") {
        enterApp(await callAuth("/auth/register", {
          username: val("gaUser").toLowerCase(),
          email: val("gaMail").toLowerCase(),
          password: document.getElementById("gaPass").value,
          name: val("gaName")
        }));

      } else if (mode === "forgot") {
        if (!val("gaMail")) throw new Error("กรุณากรอกอีเมล");
        var r = await callAuth("/auth/forgot", { email: val("gaMail").toLowerCase() });
        resetEmail = val("gaMail").toLowerCase();
        mode = "reset";
        paint();
        // แยกข้อความชัดเจนระหว่างส่งอีเมลได้กับส่งไม่ได้
        // ถ้าส่งไม่ได้ต้องบอกทางออกทันที ไม่ปล่อยให้นั่งรอรหัสที่ไม่มีวันมา
        alertHost.appendChild(el("div",
          "flash " + (r.emailSent === false ? "flash-bad" : "flash-ok"),
          r.message || "ส่งรหัสไปที่อีเมลแล้ว"));
        document.getElementById("gaCode").focus();

      } else {
        enterApp(await callAuth("/auth/reset", {
          email: val("gaMail").toLowerCase(),
          code: val("gaCode"),
          password: document.getElementById("gaNew").value
        }));
      }
    } catch (err) {
      alertHost.appendChild(el("div", "flash flash-bad", err.message));
      go.disabled = false;
      go.textContent = LABELS[mode];
    }
  }

  go.onclick = submit;
  card.querySelectorAll("input").forEach(function (i) {
    i.onkeydown = function (e) { if (e.key === "Enter") submit(); };
  });

  gate.appendChild(card);
  document.body.appendChild(gate);
  paint();
  document.getElementById("gaId").focus();
}


// ─── เริ่มระบบ ─────────────────────────────────
function paintWho() {
  var p = Store.profile();
  document.getElementById("whoName").textContent = p.name;
  document.getElementById("whoBadge").textContent = (p.name || "ผ").charAt(0);
}

document.getElementById("railToggle").onclick = function () {
  document.getElementById("rail").classList.toggle("open");
};
document.getElementById("seekInput").oninput = function () {
  if (here === "ledger") open("ledger");
};
document.getElementById("signOut").onclick = async function () {
  if (!confirm("ออกจากระบบตอนนี้ ยืนยันหรือไม่")) return;
  try { await api("/auth/logout", { method: "POST" }); } catch (e) { /* ออกจากระบบฝั่งเครื่องได้อยู่ดี */ }
  Session.clear();
  Store.reset();
  showAuthScreen(null);
};

function startApp() {
  paintWho();
  markBrain();
  open("overview");
}

// ตรวจ token ที่เก็บไว้ก่อน ถ้ายังใช้ได้ก็เข้าแอปเลย ไม่ต้องล็อกอินซ้ำ
(async function boot() {
  if (!Session.token) { showAuthScreen(null); return; }
  try {
    var data = await api("/auth/me");
    Session.user = data.user;
    startApp();
  } catch (err) {
    // token หมดอายุหรือใช้ไม่ได้ ฟังก์ชัน api จะเรียกหน้าล็อกอินให้เองแล้ว
    // ที่เหลือคือกรณีเน็ตล่มตั้งแต่เปิดเว็บ ต้องบอกให้ชัดว่าเกิดอะไร
    if (!document.querySelector(".gate")) {
      showAuthScreen("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: " + err.message);
    }
  }
})();

})();
</script>
